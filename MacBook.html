<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>ジャグラー風スロット - モバイル最適化版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;
  user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
html,body{height:100%;overflow:hidden;touch-action:none;}
body{
background:linear-gradient(135deg,#1a0033 0%,#4a0080 100%);
display:flex;justify-content:center;align-items:center;
font-family:"SF Pro Display","SF Pro Text","SF Pro Icons","SF Pro Rounded","SF Compact","SF Compact Text","San Francisco",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
font-weight:400;cursor:auto;
}

/* ========= 起動時のインストラクションオーバーレイ ========= */
#startup-overlay{
position:fixed;inset:0;z-index:3000;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
display:grid;place-items:center;
opacity:1;visibility:visible;
transition:opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease;
}
#startup-overlay.hidden{
opacity:0;visibility:hidden;transform:scale(0.95);
}
#startup-text{
font-size:24px;font-weight:600;color:#fff;
text-align:center;padding:0 30px;line-height:1.5;
letter-spacing:0.02em;
text-shadow:0 4px 12px rgba(0,0,0,0.5);
animation:startup-pulse 1s ease-in-out infinite;
}
@keyframes startup-pulse{
0%,100%{opacity:1;transform:scale(1)}
50%{opacity:0.85;transform:scale(1.02)}
}

/* ========= TU用の画面全体グラデ枠（演出時） ========= */
#tu-frame{
position:fixed; inset:-2vmin;z-index:200;pointer-events:none; opacity:0;
transition:opacity .3s ease, transform .3s ease;
background:conic-gradient(from 0deg at 50% 50%,
#ff00c8, #ff7a00, #fff500, #00ff85, #00e0ff, #4d7cff, #b000ff, #ff00c8);
animation:tu-frame-rot 6s linear infinite;
-webkit-mask:
radial-gradient(closest-side, transparent calc(100% - 12px), #000 calc(100% - 11px)) content-box,
linear-gradient(#000,#000);
-webkit-mask-composite: xor;
mask-composite: exclude;
padding:8px;
box-shadow:0 0 30px rgba(255,255,255,.08) inset, 0 0 30px rgba(255,255,255,.08);
filter:blur(1px) saturate(1.1);
transform:scale(1.01);
}
#tu-frame.active{opacity:.9}
@keyframes tu-frame-rot{to{transform:scale(1.01) rotate(360deg)}}

/* ========= マシン本体（スマホ最適化 + iOS 18 Liquid Glass風質感） ========= */
.machine{
background:linear-gradient(180deg,rgba(255,0,144,0.98) 0%,rgba(204,0,112,0.98) 50%,rgba(153,0,80,0.98) 100%);
border:5px solid #ffd700;border-radius:20px;padding:15px;position:relative;
max-width:420px;width:100%;
box-shadow:0 15px 40px rgba(0,0,0,.8), inset 0 0 30px rgba(255,255,255,.1), 0 8px 32px rgba(255,0,144,0.2);
z-index: 250;
opacity:1;transform:none;
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}

.top-section{text-align:center;margin-bottom:15px}
.title{
font-size:28px;color:#ffff00;letter-spacing:2px;margin-bottom:10px;
text-shadow:0 0 15px #ff0000,0 0 30px #ff0000,3px 3px 0 #cc0000;
animation:titleGlow 2s ease-in-out infinite;
}
@keyframes titleGlow{0%,100%{text-shadow:0 0 15px #ff0000,0 0 30px #ff0000,3px 3px 0 #cc0000}50%{text-shadow:0 0 25px #ff0000,0 0 50px #ff0000,3px 3px 0 #cc0000}}

.gogo-lamp{
width:140px;height:50px;margin:0 auto 12px;
background:linear-gradient(180deg,#330000 0%,#000 100%);
border:4px solid #444;border-radius:12px;display:flex;align-items:center;justify-content:center;
font-size:28px;font-weight:bold;color:#222;text-shadow:0 0 5px rgba(255,255,255,.1);
box-shadow:inset 0 4px 12px rgba(0,0,0,.9);transition:all .3s;
}
.gogo-lamp.active{
background:linear-gradient(180deg,#ff3333 0%,#ff0000 50%,#cc0000 100%);
color:#fff;text-shadow:0 0 15px #fff,0 0 25px #ffff00;
box-shadow:0 0 25px rgba(255,0,0,.8), inset 0 0 15px rgba(255,255,255,.3);
animation:gogoFlash .5s ease-in-out infinite;
}
@keyframes gogoFlash{0%,100%{opacity:1}50%{opacity:.7}}

.display-area{
position:relative;
background:linear-gradient(180deg,rgba(255,255,255,0.98) 0%,rgba(224,224,224,0.98) 100%);
border:8px solid rgba(51,51,51,0.9);border-radius:15px;padding:15px 10px;margin-bottom:15px;
box-shadow:inset 0 8px 20px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,0.1);
overflow:hidden;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

.reels-container{display:flex;justify-content:center;gap:10px;margin-bottom:15px}
.reel{
width:100px;height:110px;background:#fff;border:4px solid #000;border-radius:8px;overflow:hidden;position:relative;
box-shadow:inset 0 4px 12px rgba(0,0,0,.4);
}
.reel-strip{position:absolute;width:100%;transition:transform .1s linear}
.reel.spinning .reel-strip{animation:spin .1s linear infinite}
@keyframes spin{0%{transform:translateY(0)}100%{transform:translateY(-330px)}}
.symbol{height:110px;display:flex;align-items:center;justify-content:center;font-size:70px;background:#fff;border-bottom:2px solid #ddd}
.symbol img{max-height:80px;object-fit:contain}

.info-panel{
display:flex;justify-content:space-around;
background:linear-gradient(180deg,rgba(26,26,26,0.95) 0%,rgba(0,0,0,0.95) 100%);
border:4px solid rgba(51,51,51,0.8);border-radius:12px;padding:12px;color:#00ff00;font-size:14px;font-weight:bold;text-shadow:0 0 8px #00ff00;
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
box-shadow:inset 0 1px 2px rgba(255,255,255,0.05);
}
.info-item{text-align:center}
.info-label{color:#888;font-size:11px;margin-bottom:3px}
.info-value{font-size:22px;font-family:'Courier New',monospace}

.control-panel{
background:linear-gradient(180deg,rgba(42,42,42,0.95) 0%,rgba(26,26,26,0.95) 100%);
border:6px solid rgba(68,68,68,0.8);border-radius:15px;padding:20px 15px;margin-top:15px;
box-shadow:inset 0 4px 15px rgba(0,0,0,.5), 0 8px 32px rgba(0,0,0,0.3);
position:relative;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

.start-row{display:flex;justify-content:flex-start;margin-bottom:15px;position:relative;z-index:1}
.buttons-row{display:flex;justify-content:center;gap:20px;margin-bottom:0;position:relative;z-index:1}

/* ★ CSS Custom Property for button angle animation */
@property --button-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

.button{
width:70px;height:70px;border-radius:50%;
border:6px solid rgba(102,102,102,0.6);
background:linear-gradient(180deg,rgba(255,0,0,0.95) 0%,rgba(204,0,0,0.95) 50%,rgba(153,0,0,0.95) 100%);
cursor:pointer;transition:all .1s;
box-shadow:0 6px 0 #660000,0 10px 15px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,0.1);
position:relative;display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:bold;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.8);
overflow:visible;
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}

/* ★ 押せる状態の時だけアニメーション適用 */
.button:not(:disabled){
--button-angle: 0deg;
animation: rotate-button-angle 2s linear infinite;
}

@keyframes rotate-button-angle{
  to{--button-angle: 360deg;}
}

/* ★ 押せる状態の時だけ虹色グラデーション枠線が回転 */
.button:not(:disabled)::after{
content:'';
position:absolute;
inset:-4px;
border-radius:50%;
background:conic-gradient(
from var(--button-angle),
#00f5ff, #6c5ce7, #ec4899, #f97316, #10b981, #00f5ff
);
-webkit-mask:radial-gradient(circle, transparent 66%, #000 67%);
mask:radial-gradient(circle, transparent 66%, #000 67%);
pointer-events:none;
opacity:0.85;
z-index:-1;
filter:blur(0.5px);
}

.button:active{transform:translateY(3px);box-shadow:0 3px 0 #660000,0 5px 8px rgba(0,0,0,.5)}
.button:disabled{
background:linear-gradient(180deg,rgba(102,102,102,0.6) 0%,rgba(68,68,68,0.6) 50%,rgba(51,51,51,0.6) 100%);
box-shadow:0 6px 0 #222,0 10px 15px rgba(0,0,0,.5);
opacity:0.5;
}
.button::before{content:'';position:absolute;top:8px;left:8px;right:8px;height:30%;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,transparent 100%);border-radius:50%;z-index:1}

/* ★ CSS Custom Property for lever angle animation */
@property --lever-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

.lever-button{
background:linear-gradient(180deg,rgba(255,221,0,0.95) 0%,rgba(255,170,0,0.95) 50%,rgba(255,136,0,0.95) 100%);
box-shadow:0 6px 0 #cc6600,0 10px 15px rgba(0,0,0,.5), inset 0 1px 3px rgba(255,255,255,0.2);
width:90px;height:90px;font-size:15px;
overflow:visible;
border:6px solid rgba(204,102,0,0.4);
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}

/* ★ 押せる状態の時だけアニメーション適用 */
.lever-button:not(:disabled){
--lever-angle: 0deg;
animation: rotate-lever-angle 2.5s linear infinite;
}

@keyframes rotate-lever-angle{
  to{--lever-angle: 360deg;}
}

/* ★ 押せる状態の時だけ虹色グラデーション枠線が回転 */
.lever-button:not(:disabled)::after{
content:'';
position:absolute;
inset:-5px;
border-radius:50%;
background:conic-gradient(
from var(--lever-angle),
#fbbf24, #f97316, #ec4899, #a855f7, #6c5ce7, #00d4ff, #10b981, #fbbf24
);
-webkit-mask:radial-gradient(circle, transparent 68%, #000 69%);
mask:radial-gradient(circle, transparent 68%, #000 69%);
pointer-events:none;
opacity:0.9;
z-index:-1;
filter:blur(0.5px);
}

.lever-button:active{box-shadow:0 3px 0 #cc6600,0 5px 8px rgba(0,0,0,.5)}

.message{
text-align:center;font-size:18px;font-weight:bold;color:#ffff00;
text-shadow:0 0 15px #ff0000,0 0 25px #ff0000;min-height:40px;margin-top:12px;
animation:messageGlow 1s ease-in-out infinite;
position:relative;z-index:1;
}
@keyframes messageGlow{0%,100%{opacity:1}50%{opacity:.7}}

.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000}
.win-overlay.active{display:flex}
.win-message{font-size:60px;color:#ffff00;text-shadow:0 0 30px #ff0000,0 0 60px #ff0000;animation:winPulse .5s ease-in-out infinite}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ★ Spins Left Counter - STOP3の上に配置（リングのみ） */
.spins-counter{
position:absolute;top:20px;right:20px;
width:60px;height:60px;
z-index:2;
}
.spins-ring{position:relative;width:100%;height:100%}
.spins-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.spins-ring .bg{fill:none;stroke-linecap:round;stroke-width:4;stroke:rgba(255,255,255,.15)}
.spins-ring .fg{fill:none;stroke-linecap:round;stroke-width:4;stroke:#00ff00;stroke-dasharray:calc(2*3.14159265*24);stroke-dashoffset:0;filter:drop-shadow(0 0 3px rgba(0,255,0,.4));transition:stroke-dashoffset 0.5s cubic-bezier(.3,1,.3,1)}

/* 勝利時の白点（通常） */
#gogo-dots-overlay{position:fixed;inset:0;z-index:1500;pointer-events:none;overflow:hidden}
.gdot{
position:absolute;border-radius:9999px;background:#fff;opacity:0;
animation:dot-pop-opaque 1.9s cubic-bezier(.25,1,.5,1) forwards
}
@keyframes dot-pop-opaque{
0% {opacity:0;transform:translate(-50%,-50%) scale(.3)}
15% {opacity:1}
100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.05)}
}

/* Final Counter用 */
#fc-dots-overlay{position:fixed;inset:0;z-index:2050;pointer-events:none;overflow:hidden}
#final-counter-overlay{position:fixed;inset:0;z-index:2000;background:transparent;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s ease}
#final-counter-overlay.visible{opacity:1;visibility:visible}
.fc-wrap{display:grid;place-items:center}
.fc-ring{position:relative;width:180px;height:180px}
.fc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fc-ring .bg{fill:none;stroke-linecap:round;stroke-width:5;stroke:rgba(255,255,255,.10)}
.fc-ring .fg{fill:none;stroke-linecap:round;stroke-width:5;stroke:url(#fc-g);stroke-dasharray:calc(2*3.14159265*40);stroke-dashoffset:calc(2*3.14159265*40);filter:drop-shadow(0 0 3px rgba(255,255,255,.15));transition:stroke-dashoffset 1.45s cubic-bezier(.3,1,.3,1)}
.fc-center{position:absolute;inset:0;display:grid;place-items:center;perspective:700px}
.fc-wheel{position:relative;width:80px;height:65px;display:grid;place-items:center;transform-style:preserve-3d;transition:transform 1.45s cubic-bezier(.3,1,.3,1)}
.fc-face{
position:absolute;inset:0;display:grid;place-items:center;width:80px;height:65px;
font-size:52px;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.35),0 0 8px rgba(255,255,255,.35);backface-visibility:hidden;
font-family:"SF Pro Display","SF Pro Text","San Francisco",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
font-weight:400;
}

/* Thanks（→リング拡大）★背景を黒色に変更 */
#gradient-box{position:fixed;inset:0;background:#000000;clip-path:circle(0% at 50% 50%);transition:clip-path .8s cubic-bezier(.8,0,.2,1),opacity .5s ease;opacity:0;pointer-events:none;z-index:2400}
#gradient-box.visible{opacity:1}
#gradient-box.animate{clip-path:circle(75% at 50% 50%)}

#thanks-overlay{position:fixed;inset:0;z-index:2500;background:#000000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s ease}
#thanks-overlay.visible{opacity:1;visibility:visible}

#thanks-circle{width:180px;height:180px;border:3px solid rgba(255,255,255,.9);border-radius:9999px;box-shadow:0 0 20px rgba(255,255,255,.35),0 0 50px rgba(255,255,255,.15) inset;display:grid;place-items:center;animation:circle-pop .7s cubic-bezier(.2,1,.3,1) both;position:relative;overflow:visible}
@keyframes circle-pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

#thanks-arrow{font-weight:400;font-size:72px;line-height:1;color:#fff;font-family:"SF Pro Display","SF Pro Text","San Francisco",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;position:relative; z-index:2;}

#thanks-ring{position:absolute; inset:0; margin:auto; width:180px; height:180px; border-radius:9999px; border:3px solid rgba(255,255,255,.9); box-shadow:0 0 18px rgba(255,255,255,.35); z-index:1; opacity:0; transform:scale(1);}
.ring-anim{animation:ring-expand 1.2s cubic-bezier(.2,1,.3,1) forwards}
@keyframes ring-expand{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3)}}

#thanks-text{font-size:32px;font-weight:700;color:#fff;letter-spacing:.02em;text-shadow:0 5px 18px rgba(0,0,0,.55)}
#thanks-sub{font-size:16px;color:#cfcfcf}

/* ★白色ドットが滑らかに画面全体に広がる */
#thanks-dots{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2550}
.dot{
position:absolute;border-radius:9999px;background:#fff;opacity:0;
animation:dot-pop 1.6s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes dot-pop{
0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
10%{opacity:1}
100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1)}
}

/* TU背景とFinal背景（青/金） */
#tu-bg{position:fixed;inset:-10%;background:conic-gradient(from 0deg,#ff00c8,#ff7a00,#fff500,#00ff85,#00e0ff,#4d7cff,#b000ff,#ff00c8);opacity:0;pointer-events:none;z-index:1800;mix-blend-mode:screen;transition:opacity .35s ease;filter:blur(8px) saturate(1.2)}
#tu-bg.active{opacity:.35;animation:tu-rotate 5s linear infinite}
@keyframes tu-rotate{to{transform:rotate(360deg)}}

#final-bg{position:fixed; inset:0; z-index:1900; pointer-events:none; opacity:0; transition:opacity .6s ease; background:transparent}
#final-bg.visible{opacity:1}
#final-bg.blue{
background:
radial-gradient(120% 130% at 50% 40%, rgba(50,130,255,.55) 0%, rgba(10,24,64,.92) 60%),
conic-gradient(from 0deg at 50% 50%, rgba(120,180,255,.18), rgba(30,60,140,.18), rgba(120,180,255,.18));
filter:saturate(1.2) blur(.2px);
}
#final-bg.gold{
background:
radial-gradient(120% 130% at 50% 40%, rgba(255,210,70,.55) 0%, rgba(58,35,0,.94) 62%),
conic-gradient(from 0deg at 50% 50%, rgba(255,180,70,.18), rgba(160,90,0,.18), rgba(255,220,120,.18));
filter:saturate(1.25) blur(.2px);
}

/* TU内部スピン画像の回転アニメ */
@keyframes tu-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="startup-overlay">
<div id="startup-text">STARTを押して<br>スロットを開始</div>
</div>

<div id="tu-frame" aria-hidden="true"></div>

<div class="machine" role="application" aria-label="Slot Machine UI">
<div class="top-section">
<div class="title">GOOD LUCK!</div>
<div class="gogo-lamp" id="gogoLamp">GOGO!</div>
</div>
<div class="display-area" id="displayArea">
<div class="reels-container">
<div class="reel" id="reel1"><div class="reel-strip" id="strip1"></div></div>
<div class="reel" id="reel2"><div class="reel-strip" id="strip2"></div></div>
<div class="reel" id="reel3"><div class="reel-strip" id="strip3"></div></div>
</div>
<div class="info-panel">
<div class="info-item">
<div class="info-label">CREDIT</div>
<div class="info-value" id="credit">100</div>
</div>
<div class="info-item">
<div class="info-label">BET</div>
<div class="info-value" id="bet">10</div>
</div>
<div class="info-item">
<div class="info-label">PAYOUT</div>
<div class="info-value" id="payout">0</div>
</div>
</div>
</div>
<div class="control-panel">
<div class="spins-counter">
<div class="spins-ring">
<svg viewBox="0 0 60 60" aria-hidden="true">
<circle class="bg" cx="30" cy="30" r="24"></circle>
<circle class="fg" id="spinsRingFg" cx="30" cy="30" r="24"></circle>
</svg>
</div>
</div>
<div class="start-row">
<button class="button lever-button" id="startButton" type="button">START</button>
</div>
<div class="buttons-row">
<button class="button" id="stop1" type="button" disabled>STOP<br>1</button>
<button class="button" id="stop2" type="button" disabled>STOP<br>2</button>
<button class="button" id="stop3" type="button" disabled>STOP<br>3</button>
</div>
<div class="message" id="message" aria-live="polite"></div>
</div>
</div>

<div class="win-overlay" id="winOverlay"><div class="win-message">🎰 BIG WIN! 🎰</div></div>
<div id="tu-bg" aria-hidden="true"></div>
<div id="final-bg" aria-hidden="true"></div>
<div id="gogo-dots-overlay"></div>

<div id="final-counter-overlay" aria-hidden="true">
<div class="fc-wrap">
<div class="fc-ring">
<svg viewBox="0 0 100 100" aria-hidden="true">
<defs>
<linearGradient id="fc-g" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#ff3b30"/>
<stop offset="35%" stop-color="#ffcc00"/>
<stop offset="70%" stop-color="#4cd964"/>
<stop offset="100%" stop-color="#34aadc"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 50 50" to="360 50 50" dur="5s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<circle class="bg" cx="50" cy="50" r="40"></circle>
<circle class="fg" cx="50" cy="50" r="40"></circle>
</svg>
<div class="fc-center">
<div class="fc-wheel" id="fc-wheel">
<div class="fc-face" style="transform:rotateX(0deg) translateZ(45px);">1</div>
<div class="fc-face" style="transform:rotateX(-72deg) translateZ(45px);">2</div>
<div class="fc-face" style="transform:rotateX(-144deg) translateZ(45px);">3</div>
<div class="fc-face" style="transform:rotateX(-216deg) translateZ(45px);">4</div>
<div class="fc-face" style="transform:rotateX(-288deg) translateZ(45px);">5</div>
</div>
</div>
</div>
</div>
</div>

<div id="fc-dots-overlay"></div>
<div id="gradient-box"></div>

<div id="thanks-overlay">
<div id="thanks-circle">
<div id="thanks-ring"></div>
<div id="thanks-arrow">→</div>
</div>
<div id="thanks-text">ありがとう。</div>
<div id="thanks-sub">2秒後にまたプレイできます</div>
<div id="thanks-dots"></div>
</div>

<script type="module">
// ★ iOS Haptics ライブラリのインポート
let haptic = null;
try {
  const { haptic: iosHaptic } = await import('https://esm.sh/ios-haptics');
  haptic = iosHaptic;
} catch (e) {
  console.log('iOS haptics not available, using fallback');
}

// ★ コンテキストメニューとピンチズームを完全にブロック
document.addEventListener('contextmenu', e => e.preventDefault(), {passive: false});
document.addEventListener('gesturestart', e => e.preventDefault(), {passive: false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive: false});
document.addEventListener('gestureend', e => e.preventDefault(), {passive: false});
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, {passive: false});

// ★ ハプティックフィードバック関数
function triggerHaptic() {
  // iOS用
  if (haptic && haptic.error) {
    const delay = 45;
    const sequence = [];
    for (let i = 0; i < 3; i++) {
      const base = i * 3.5;
      sequence.push(base, base + 1, base + 2);
    }
    sequence.forEach(i => {
      setTimeout(() => {
        try {
          haptic.error();
        } catch (e) {
          console.log('Haptic error:', e);
        }
      }, i * delay);
    });
  }
  
  // Android/その他のデバイス用
  if (navigator.vibrate) {
    navigator.vibrate([10, 20, 10, 20, 10, 20, 10, 20, 10, 20, 10, 20, 10, 20, 10, 20, 10]);
  }
}

(function(){
/* ====== 起動インストラクション表示（1秒で確実にフェードアウト&縮小） ====== */
const startupOverlay = document.getElementById('startup-overlay');
let startupHidden = false;
function hideStartupInstruction(){
if(startupHidden) return;
startupHidden = true;
startupOverlay.classList.add('hidden');
}
// ★ 1秒後に自動的に消える
setTimeout(hideStartupInstruction, 1000);

/* ====== Spins Left Counter Update（リングのみ） ====== */
const spinsRingFg = document.getElementById('spinsRingFg');
function updateSpinsCounter(remaining){
const count = Math.max(0, Math.min(5, remaining));
// リングの進捗更新
const r = 24, C = 2 * Math.PI * r;
const progress = count / 5;
if(spinsRingFg){
spinsRingFg.style.strokeDasharray = `${C} ${C}`;
spinsRingFg.style.strokeDashoffset = C * (1 - progress);
}
}

/* ====== 安全ガード：存在しないAudioでもエラーを出さない ====== */
const safeAudio = (src)=>{
try{
const a=new Audio(src);
a.addEventListener?.('error',()=>{});
return a;
}catch(_){
return {play:()=>Promise.resolve(), pause:()=>{}, addEventListener:()=>{}, removeEventListener:()=>{}, currentTime:0};
}
};

/* ====== 効果音を即座に再生（複製方式） ====== */
const playSound = (audio) => {
if(!audio || !audio.src) return;
try{
const clone = audio.cloneNode();
clone.play().catch(()=>{});
}catch(_){}
};

/* ====== 変数・要素 ====== */
const MAX_SPINS = 5;
const EMO_CHERRY='🍒', EMO_LEMON='🍋', EMO_ORANGE='🍊', EMO_GRAPE='🍇', EMO_STAR='⭐', EMO_DIAMOND='💎';
const emojiSymbols = [EMO_CHERRY,EMO_LEMON,EMO_ORANGE,EMO_GRAPE,EMO_STAR,EMO_DIAMOND];
const SPECIAL_7 = '7️⃣';
const SPECIAL_SAFUR = 'safur';
const strips=[document.getElementById('strip1'),document.getElementById('strip2'),document.getElementById('strip3')];
const stopButtons=[document.getElementById('stop1'),document.getElementById('stop2'),document.getElementById('stop3')];
const gogoLamp=document.getElementById('gogoLamp');
const startButton=document.getElementById('startButton');
const tuBg=document.getElementById('tu-bg');
const tuFrame=document.getElementById('tu-frame');
const finalBg=document.getElementById('final-bg');
const sounds={
lever:safeAudio('d.mp3'),
stop:safeAudio('dd.mp3'),
spin:safeAudio('k.mp3'),
gogo:safeAudio('GO.mp3'),
bigwin:safeAudio('777.mp3'),
haptic:safeAudio('WorkoutSaved_Haptic.caf'),
return:safeAudio('return.mp3'),
no:safeAudio('no.mp3'),
tu:safeAudio('tu.mp3')
};
try{ sounds.spin.loop=true; }catch(_){}
let credit=100, betAmount=10, isSpinning=false, stoppedReels=[false,false,false];
let finalSymbols=['','',''], reels=[[],[],[]], spinCount=0, winsCount=0;

/* ====== キー/強押し検出 ====== */
const keyState={ k:false };
window.addEventListener('keydown',e=>{ if(e.key && e.key.toLowerCase()==='k') keyState.k=true; });
window.addEventListener('keyup',e=>{ if(e.key && e.key.toLowerCase()==='k') keyState.k=false; });
let currentForce=0;
const FORCE_THRESHOLD_WEBKIT=2;
const FORCE_THRESHOLD_POINTER=0.5;
function bindForceListeners(el){
if(!el) return;
el.addEventListener('webkitmouseforcechanged', e=>{ currentForce = (e && typeof e.webkitForce==='number')? e.webkitForce : 0; });
el.addEventListener('webkitmouseforcedown', e=>{ currentForce = (e && typeof e.webkitForce==='number')? e.webkitForce : 3; });
el.addEventListener('webkitmouseforceup', ()=>{ currentForce = 0; });
el.addEventListener('pointermove', e=>{ if(e && typeof e.pressure==='number') currentForce = Math.max(currentForce, e.pressure); });
el.addEventListener('pointerup', ()=>{ currentForce = 0; });
el.addEventListener('pointercancel', ()=>{ currentForce = 0; });
el.addEventListener('mouseleave', ()=>{ currentForce = 0; });
}
function isStrongClick(e){
const p = (e && typeof e.pressure === 'number') ? e.pressure : 0;
const wf = (e && typeof e.webkitForce === 'number') ? e.webkitForce : currentForce;
return (wf >= FORCE_THRESHOLD_WEBKIT) || (p >= FORCE_THRESHOLD_POINTER);
}
bindForceListeners(startButton);

/* ====== ★ 画面タップでボタン押下判定 ====== */
let lastTapTime = 0;
document.body.addEventListener('click', (e) => {
const now = Date.now();
if (now - lastTapTime < 200) return;
lastTapTime = now;

if (e.target.closest('button')) return;

if (!isSpinning && !startButton.disabled) {
startButton.click();
return;
}

if (isSpinning) {
for (let i = 0; i < stopButtons.length; i++) {
if (!stoppedReels[i] && !stopButtons[i].disabled) {
stopButtons[i].click();
return;
}
}
}
});

/* ====== リール構築（★揃う率大幅アップ） ====== */
function buildWeightedPool(){
const pool=[];
emojiSymbols.forEach(sym=>{
let w = 1; // デフォルト
if(sym===EMO_ORANGE) w = 5.5; // オレンジ大幅アップ
else if(sym===EMO_DIAMOND) w = 4.0; // ダイヤモンド大幅アップ
else if(sym===EMO_CHERRY) w = 4.0; // さくらんぼ大幅アップ
else if(sym===EMO_GRAPE) w = 4.0; // グレープ大幅アップ
pool.push({type:'emoji',key:sym,val:sym,weight:w});
});
pool.push({type:'image',key:SPECIAL_SAFUR,src:'safur.png',weight:4.0}); // safur大幅アップ
pool.push({type:'emoji',key:SPECIAL_7,val:SPECIAL_7,weight:10}); // 777大幅アップ
return pool;
}
const weightedPool = buildWeightedPool();
function pickRandomSymbol(){
const total = weightedPool.reduce((s,it)=>s+it.weight,0);
let r=Math.random()*total;
for(const it of weightedPool){ r-=it.weight; if(r<=0) return it; }
return weightedPool[0];
}
function renderCell(parent,symObj){
const div=document.createElement('div'); div.className='symbol';
if(symObj.type==='emoji'){ div.textContent=symObj.val; }
else{ const img=document.createElement('img'); img.src=symObj.src; img.alt='safur'; img.draggable=false; div.appendChild(img); }
parent.appendChild(div);
}
function renderReel(i){
const strip=strips[i]; if(!strip) return;
strip.innerHTML='';
for(const s of reels[i]) renderCell(strip,s);
}
function initReels(){
for(let i=0;i<3;i++){
reels[i]=[];
for(let j=0;j<20;j++){ reels[i].push(pickRandomSymbol()); }
renderReel(i);
}
}
function shuffleReel(i){
reels[i].push(pickRandomSymbol());
reels[i].shift();
renderReel(i);
}
function setReelTopSymbol(i, symObj){
reels[i][0]=symObj;
renderReel(i);
}
function updateDisplay(){
const c=document.getElementById('credit');
const b=document.getElementById('bet');
const p=document.getElementById('payout');
if(c) c.textContent=String(credit);
if(b) b.textContent='10';
if(p) p.textContent = p.textContent || '0';
updateSpinsCounter(MAX_SPINS - spinCount);
}

/* ====== 粒子 ====== */
const gogoDots=document.getElementById('gogo-dots-overlay');
const fcDotsOverlay=document.getElementById('fc-dots-overlay');
let lastDotsAt=0;
function spawnDynamicDots(container,count=200,{durationSec=2.0}={}){
if(!container) return;
const now=Date.now(); if(now-lastDotsAt<200) return; lastDotsAt=now;
const W=innerWidth,H=innerHeight; const cx=W/2,cy=H/2;
container.innerHTML='';
const total=Math.max(count, Math.floor((W*H)/4000));
for(let i=0;i<total;i++){
const d=document.createElement('div'); d.className='gdot';
const sizePick=Math.random(), sz = sizePick<.6?(Math.random()*3+2): sizePick<.9?(Math.random()*6+4):(Math.random()*10+8);
const sx=cx+(Math.random()*220-110), sy=cy+(Math.random()*220-110);
const angle=Math.random()*Math.PI*2, dist=(Math.hypot(W,H)*0.45)+(Math.random()*Math.hypot(W,H)*0.65);
const tx=Math.cos(angle)*dist, ty=Math.sin(angle)*dist;
d.style.width=`${sz}px`; d.style.height=`${sz}px`;
d.style.left=`${sx}px`; d.style.top=`${sy}px`;
d.style.setProperty('--tx',`${tx}px`); d.style.setProperty('--ty',`${ty}px`);
d.style.animationDelay=`${Math.random()*0.18}s`;
d.style.animationDuration=durationSec+'s';
container.appendChild(d);
}
setTimeout(()=>{ container.innerHTML=''; }, (durationSec*1000)+600);
}

/* ====== Final Counter ====== */
const finalCounterOverlay=document.getElementById('final-counter-overlay');
const fcRingFg=document.querySelector('#final-counter-overlay .fg');
const fcWheel=document.getElementById('fc-wheel');
function showFinalCounter(count){
const c=Math.max(1,Math.min(5, Number(count)||1));
const r=40, C=2*Math.PI*r;
if(fcRingFg){
fcRingFg.style.strokeDasharray=`${C} ${C}`;
fcRingFg.style.strokeDashoffset=C;
requestAnimationFrame(()=>{ fcRingFg.style.strokeDashoffset=C*(1-(c/5)); });
}
const deg=-(c-1)*72;
if(fcWheel){
fcWheel.style.transition='none'; fcWheel.style.transform='rotateX(0deg)'; void fcWheel.offsetHeight;
fcWheel.style.transition='transform 1.45s cubic-bezier(.3,1,.3,1)';
fcWheel.style.transform=`rotateX(${deg}deg)`;
}
finalBg.classList.remove('blue','gold','visible');
finalBg.classList.add(c<=3?'blue':'gold');
setTimeout(()=>finalBg.classList.add('visible'), 60);
finalCounterOverlay.classList.add('visible');
const dotsCount = Math.max(260, Math.floor((innerWidth*innerHeight)/4200));
spawnDynamicDots(fcDotsOverlay, dotsCount, {durationSec:1.9});
setTimeout(()=>spawnDynamicDots(fcDotsOverlay, Math.floor(dotsCount*0.6), {durationSec:1.6}), 300);
return new Promise(res=>setTimeout(()=>{
finalCounterOverlay.classList.remove('visible');
res();
},2600));
}

/* ====== Thanks & Reload（★矢印が出て2秒後に確実にリロード） ====== */
const gradientBox=document.getElementById('gradient-box');
const thanksOverlay=document.getElementById('thanks-overlay');
const thanksDots=document.getElementById('thanks-dots');
const thanksRing=document.getElementById('thanks-ring');
function spawnThanksDots(n=160){
const W=innerWidth,H=innerHeight; thanksDots.innerHTML='';
for(let i=0;i<n;i++){
const d=document.createElement('div'); d.className='dot';
const size=Math.random()<.8?(Math.random()*3+2):(Math.random()*6+4);
const cx=W/2, cy=H/2;
const sx=cx+(Math.random()*160-80), sy=cy+(Math.random()*160-80);
const a=Math.random()*Math.PI*2, dist=120+Math.random()*280;
const tx=Math.cos(a)*dist, ty=Math.sin(a)*dist;
d.style.width=`${size}px`; d.style.height=`${size}px`;
d.style.left=`${sx}px`; d.style.top=`${sy}px`;
d.style.setProperty('--tx',`${tx}px`); d.style.setProperty('--ty',`${ty}px`);
d.style.animationDelay=`${Math.random()*0.25}s`;
thanksDots.appendChild(d);
}
}
async function showThanksAndReload(){
try{ sounds.return.currentTime=0; await sounds.return.play(); }catch(_){}
gradientBox.classList.add('visible'); await new Promise(r=>setTimeout(r,50));
gradientBox.classList.add('animate'); await new Promise(r=>setTimeout(r,800));
gradientBox.classList.remove('animate'); await new Promise(r=>setTimeout(r,80));
thanksOverlay.classList.add('visible');
spawnThanksDots(160);
await new Promise(r=>setTimeout(r,900));
thanksRing.classList.add('ring-anim');
// ★ 矢印が出て2秒後に確実にリロード
await new Promise(r=>setTimeout(r,2000));
location.reload();
}

/* ====== 無効時 no.mp3 ====== */
function playNo(){
playSound(sounds.no);
}
function isButtonInvalid(btn){
if(!btn) return false;
if(btn.disabled) return true;
if(btn.id==='startButton' && isSpinning) return true;
if(btn.id && btn.id.startsWith('stop') && (!isSpinning || stoppedReels[Number(btn.id.slice(-1))-1])) return true;
return false;
}
document.addEventListener('pointerdown',e=>{
const btn=e.target && e.target.closest ? e.target.closest('button') : null; if(!btn) return;
if(isButtonInvalid(btn)){ playNo(); e.preventDefault(); }
},{passive:false});
document.addEventListener('keydown',e=>{
if(!e || (e.key!=='Enter' && e.key!==' ')) return;
const btn=document.activeElement && document.activeElement.closest ? document.activeElement.closest('button') : null;
if(isButtonInvalid(btn)){ playNo(); e.preventDefault(); }
});

/* ====== シンボル判定 ====== */
function symbolKey(s){return s.key||s;}
function isSeven(k){return k===SPECIAL_7;}
function isSafur(k){return k===SPECIAL_SAFUR;}
function isOrange(k){return k===EMO_ORANGE;}

// 強制演出（K+強押し）
let forceSpecialThisSpin=false;
let forcedSymbolObj=null;
startButton.addEventListener('pointerdown',(e)=>{
if(keyState.k && isStrongClick(e)){
forceSpecialThisSpin=true;
forcedSymbolObj = (Math.random()<0.5)
? {type:'emoji',key:EMO_ORANGE,val:EMO_ORANGE}
: {type:'image',key:SPECIAL_SAFUR,src:'safur.png'};
}else{
forceSpecialThisSpin=false;
forcedSymbolObj=null;
}
});

startButton.addEventListener('click',()=>{
triggerHaptic();
hideStartupInstruction();

if(isSpinning){ playNo(); return; }
if(spinCount>=MAX_SPINS){
const m=document.getElementById('message'); if(m) m.textContent='本日のスピン上限に達しました！';
startButton.disabled=true; playNo(); return;
}
if(credit<betAmount){
const m=document.getElementById('message'); if(m) m.textContent='クレジット不足！';
playNo(); return;
}
playSound(sounds.lever);
credit -= betAmount; updateDisplay();
const msg=document.getElementById('message'); if(msg) msg.textContent='';
const pay=document.getElementById('payout'); if(pay) pay.textContent='0';
isSpinning=true; stoppedReels=[false,false,false]; finalSymbols=['','',''];
if(Math.random()<0.5){
setTimeout(()=>{ gogoLamp.classList.add('active'); playSound(sounds.gogo);} ,500);
}else{ gogoLamp.classList.remove('active'); }
try{ sounds.spin.currentTime=0; sounds.spin.play().catch(()=>{});}catch(_){}
for(let i=0;i<3;i++){
const reelEl=document.getElementById(`reel${i+1}`);
if(reelEl) reelEl.classList.add('spinning');
const interval=setInterval(()=>{
if(!isSpinning||stoppedReels[i]){ clearInterval(interval); return; }
shuffleReel(i);
if(forceSpecialThisSpin && Math.random()<0.35 && forcedSymbolObj){
setReelTopSymbol(i, forcedSymbolObj);
}
},100);
}
stopButtons.forEach(btn=>{ if(btn) btn.disabled=false; });
startButton.disabled=true;
spinCount++; updateDisplay();
});

stopButtons.forEach((button,index)=>{
button.addEventListener('click',()=>{
triggerHaptic();
  
if(stoppedReels[index]){ playNo(); return; }
if(button.disabled){ playNo(); return; }
if(!isSpinning){ playNo(); return; }
playSound(sounds.stop);
stoppedReels[index]=true;
const re=document.getElementById(`reel${index+1}`); if(re) re.classList.remove('spinning');
if(forceSpecialThisSpin && forcedSymbolObj){
setReelTopSymbol(index, forcedSymbolObj);
}
const current=reels[index]; finalSymbols[index]=symbolKey(current[0]);
button.disabled=true;
if(stoppedReels.every(Boolean)){
try{ sounds.spin.pause(); sounds.spin.currentTime=0; }catch(_){}
setTimeout(checkWin,300);
}
});
});

/* ====== TU演出（背景回転 + リール内tu.png/safur.png置き換え + 拡大消滅） ====== */
let tuRunning=false;
async function runTuSequence(imageType='tu'){
if(tuRunning) return;
tuRunning=true;
const imgSrc = imageType === 'safur' ? 'safur.png' : 'tu.png';
const imgKey = imageType === 'safur' ? 'safur_tu' : 'tu';
const originalReels = reels.map(r => [...r]);
try{
tuFrame.classList.add('active');
tuBg.classList.add('active');
for(let i=0;i<3;i++){
reels[i] = reels[i].map(() => ({type:'image',key:imgKey,src:imgSrc}));
renderReel(i);
}
strips.forEach(strip => {
if(!strip) return;
const symbols = strip.querySelectorAll('.symbol img');
symbols.forEach(img => {
img.style.animation = 'tu-spin 1.2s linear infinite';
});
});
try{ sounds.tu.currentTime=0; await sounds.tu.play(); }catch(_){}
await new Promise(resolve=>{
if(!sounds.tu || !sounds.tu.addEventListener){ resolve(); return; }
const done=()=>{ sounds.tu.removeEventListener('ended',done); resolve(); };
sounds.tu.addEventListener('ended',done);
setTimeout(done, 20000);
});
strips.forEach(strip => {
if(!strip) return;
const symbols = strip.querySelectorAll('.symbol');
symbols.forEach(sym => {
sym.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease';
sym.style.transform = 'scale(2.5)';
sym.style.opacity = '0';
});
});
await new Promise(r=>setTimeout(r, 500));
}finally{
for(let i=0;i<3;i++){
reels[i] = originalReels[i];
renderReel(i);
const strip = strips[i];
if(strip){
strip.style.opacity = '0';
requestAnimationFrame(()=>{
strip.style.transition = 'opacity .3s ease';
strip.style.opacity = '1';
});
}
}
tuBg.classList.remove('active');
tuFrame.classList.remove('active');
tuRunning=false;
}
}

/* ====== 判定・カウント（TUボーナスも"揃い"として加算） ====== */
function checkWin(){
isSpinning=false;
if(spinCount<MAX_SPINS) startButton.disabled=false;
const [s1,s2,s3]=finalSymbols;
let payout=0, message='';
const triple=(s1===s2&&s2===s3);
const jackpot = triple&&(s1===SPECIAL_7||s1===SPECIAL_SAFUR);
const hasOrange=[s1,s2,s3].some(k=>k===EMO_ORANGE);
const hasSafur=[s1,s2,s3].some(k=>k===SPECIAL_SAFUR);
const orangeCount=[s1,s2,s3].filter(k=>k===EMO_ORANGE).length;
const grapeCount=[s1,s2,s3].filter(k=>k===EMO_GRAPE).length;
const cherryCount=[s1,s2,s3].filter(k=>k===EMO_CHERRY).length;

const orangeTuTrigger = (hasOrange && hasSafur) || (orangeCount>=2);
const safurTuTrigger = (grapeCount===3) || (cherryCount===3);

let wonThisSpin = false;

if(triple){
spawnDynamicDots(gogoDots, Math.max(260, Math.floor((innerWidth*innerHeight)/4200)), {durationSec:1.9});
}

if(jackpot){
payout=betAmount*100; message='🎰 BIG WIN! 🎰';
const w=document.getElementById('winOverlay'); if(w) { w.classList.add('active'); setTimeout(()=>w.classList.remove('active'), 3000); }
playSound(sounds.bigwin);
credit+=payout;
wonThisSpin = true;
}else if(triple){
payout=betAmount*10; message='🎉 当たり！ 🎉';
playSound(sounds.haptic);
credit+=payout;
wonThisSpin = true;
}else{
message='もう一度！';
}

if(safurTuTrigger){
runTuSequence('safur').catch(()=>{});
spawnDynamicDots(gogoDots, Math.max(200, Math.floor((innerWidth*innerHeight)/5200)), {durationSec:1.7});
payout += Math.floor(betAmount * 3);
credit += Math.floor(betAmount * 3);
message = (message && message !== 'もう一度!') ? message + ' + TU BONUS!' : 'TU BONUS!';
wonThisSpin = true;
}
else if(orangeTuTrigger){
runTuSequence('tu').catch(()=>{});
spawnDynamicDots(gogoDots, Math.max(200, Math.floor((innerWidth*innerHeight)/5200)), {durationSec:1.7});
payout += Math.floor(betAmount * 3);
credit += Math.floor(betAmount * 3);
message = (message && message !== 'もう一度!') ? message + ' + TU BONUS!' : 'TU BONUS!';
wonThisSpin = true;
}

if (wonThisSpin) {
winsCount++;
}

if(winsCount>MAX_SPINS) winsCount=MAX_SPINS;

const p=document.getElementById('payout'); if(p) p.textContent=String(payout);
const m=document.getElementById('message'); if(m) m.textContent=message;
updateDisplay();
setTimeout(()=>{ gogoLamp.classList.remove('active'); },2000);

if(spinCount>=MAX_SPINS){
startButton.disabled=true;
(async ()=>{
const shownCount = Math.max(1, Math.min(5, winsCount || 1));
await showFinalCounter(shownCount);
await showThanksAndReload();
})();
}
}

/* ====== 起動 & 初期化 ====== */
function safeInit(){
try{
initReels();
updateDisplay();
updateSpinsCounter(MAX_SPINS);
}catch(_){}
}
if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded', safeInit, {once:true});
}else{
safeInit();
}
})();
</script>
