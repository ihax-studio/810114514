<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Ultimate Debug Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root { --ios-ease: cubic-bezier(0.2, 1, 0.3, 1); }

        /* iOS標準機能を完全に殺す（拡大縮小・バウンス・選択） */
        * { 
            touch-action: none; 
            -webkit-user-select: none; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            font-weight: 100 !important; 
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, sans-serif; 
            background: #f0f0f2; overflow: hidden; display: flex; flex-direction: column; 
        }

        /* プレビュー */
        #preview-section { 
            flex: 1; background: #fff; position: relative; 
            transition: 0.6s var(--ios-ease); z-index: 10; 
            transform: scale(0.97); border-radius: 12px; 
            margin: 10px 10px 5px 10px; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        #preview-section.fullscreen { position: fixed; inset: 0; transform: scale(1); border-radius: 0; margin: 0; z-index: 3000; }
        #output-frame { width: 100%; height: 100%; border: none; }
        #close-preview-btn { position: absolute; top: 50px; left: 25px; width: 44px; height: 44px; display: none; align-items: center; justify-content: center; font-size: 35px; color: #000; z-index: 3005; }
        #preview-section.fullscreen #close-preview-btn { display: flex; }

        /* エディタ */
        #editor-section { flex: 0.8; display: flex; padding: 5px 15px 15px 15px; }
        #raw-editor { flex: 1; border: none; border-radius: 20px; padding: 20px; outline: none; font-family: monospace; background: #fff; font-weight: 400 !important; -webkit-user-select: text; }

        /* 保存バー - 最前面 */
        #save-input-bar { 
            position: fixed; bottom: 30px; right: 20px; width: 230px; height: 60px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(30px); border-radius: 30px;
            display: none; opacity: 0; transform: scale(0.8); transition: 0.4s var(--ios-ease); z-index: 6000;
            align-items: center; gap: 10px; padding: 0 10px 0 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        #save-input-bar.active { display: flex; opacity: 1; transform: scale(1); }
        .save-arrow-btn { width: 40px; height: 40px; background: #000; color: #fff; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }

        /* Dock - 余白を最小化 */
        #dock-area { position: fixed; bottom: 30px; right: 20px; display: flex; align-items: center; z-index: 4000; }
        #dock-wrapper { 
            display: flex; align-items: center; background: rgba(242, 242, 247, 0.85); 
            backdrop-filter: blur(25px); padding: 5px; border-radius: 30px; 
            transition: 0.5s var(--ios-ease);
        }
        #file-list { display: flex; gap: 5px; width: 0; opacity: 0; overflow: hidden; transition: 0.5s var(--ios-ease); }
        #file-list.open { width: auto; opacity: 1; margin-right: 5px; }
        #media-items { display: flex; gap: 5px; }

        /* ファイルアイテムと削除アニメーション */
        .dock-item { 
            width: 44px; height: 44px; background: #fff; border-radius: 10px; 
            position: relative; flex-shrink: 0; overflow: hidden;
            transition: transform 0.4s var(--ios-ease), opacity 0.4s ease;
        }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; }
        .del-trigger { 
            position: absolute; inset: 0; background: #ff3b30; color: white; 
            display: flex; align-items: center; justify-content: center; 
            transform: translateY(100%); transition: 0.3s var(--ios-ease); font-size: 24px; 
        }
        .swiped .del-trigger { transform: translateY(0); }
        .removing { transform: scale(0); opacity: 0; }

        /* Monaco - Scale Up アニメーション */
        #monaco-container { 
            position: fixed; inset: 0; background: #1e1e1e; z-index: 5000; 
            display: none; opacity: 0; transform: scale(0.9);
            transition: 0.5s var(--ios-ease); flex-direction: column; 
        }
        #monaco-container.active { display: flex; opacity: 1; transform: scale(1); }
        #monaco-body { flex: 1; }

        .icon-btn { width: 55px; height: 55px; background: rgba(242, 242, 247, 0.8); backdrop-filter: blur(20px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<body onclick="globalTap()">

    <div id="preview-section">
        <div id="close-preview-btn" onclick="toggleFullscreen(event)">✕</div>
        <iframe id="output-frame"></iframe>
    </div>

    <div id="editor-section">
        <textarea id="raw-editor" oninput="sync('input')"></textarea>
    </div>

    <div style="position:fixed; bottom:30px; left:20px; display:flex; gap:15px; z-index:3500;">
        <div class="icon-btn" onclick="openSave(event)">💾</div>
        <div class="icon-btn" onclick="toggleUI('monaco-container', true)">📝</div>
    </div>

    <div id="dock-area">
        <div id="dock-wrapper" onclick="event.stopPropagation()">
            <div id="file-list">
                <div class="dock-item" onclick="document.getElementById('file-input').click()" style="background:rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center; font-size:20px;">＋</div>
                <div id="media-items"></div>
            </div>
            <div onclick="toggleDock(event)" id="folder-btn" style="font-size:24px; padding:0 8px;">📁</div>
        </div>
    </div>

    <div id="save-input-bar" onclick="event.stopPropagation()">
        <input type="text" id="fn" value="index.html" style="-webkit-user-select:text; flex:1; border:none; outline:none; font-size:16px; background:transparent;">
        <button class="save-arrow-btn" onclick="downloadHtml(event)">➔</button>
    </div>

    <div id="monaco-container">
        <div style="height:60px; display:flex; justify-content:flex-end; padding:0 25px; align-items:center;">
            <div style="color:#fff; font-size:35px;" onclick="monacoClose()">✕</div>
        </div>
        <div id="monaco-body"></div>
    </div>

    <input type="file" id="file-input" hidden onchange="handleFile(event)">

    <script type="module">
        import { haptic } from "https://esm.sh/ios-haptics";
        window.haptic = haptic;

        let editor, isSyncing = false, isDockOpen = false, initDist = 0;
        let html = `<!DOCTYPE html><html><body style="background:#f0f0f2; height:100vh; display:flex; justify-content:center; align-items:center; margin:0;"><h1>Ready</h1></body></html>`;
        
        const raw = document.getElementById('raw-editor');
        const preview = document.getElementById('preview-section');
        const saveBar = document.getElementById('save-input-bar');

        // 二本指ジェスチャ（ズームブロック・フルスクリーン）
        window.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (initDist === 0) { initDist = d; return; }
                let r = d / initDist;
                if (e.target.closest('#preview-section') && !preview.classList.contains('fullscreen') && r > 1.2) { toggleFullscreen(); initDist = d; }
                if (preview.classList.contains('fullscreen') && r < 0.8) { toggleFullscreen(); initDist = d; }
            } else if (!e.target.closest('#monaco-body') && !e.target.closest('#raw-editor') && !e.target.closest('input')) {
                e.preventDefault();
            }
        }, { passive: false });
        window.addEventListener('touchend', () => initDist = 0);

        window.sync = (src) => {
            if(isSyncing) return; isSyncing = true;
            html = (src === 'input') ? raw.value : editor.getValue();
            raw.value = html;
            if(editor && src !== 'monaco') editor.setValue(html);
            const d = preview.querySelector('iframe').contentDocument;
            d.open(); d.write(html); d.close();
            isSyncing = false;
        };

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-body'), { 
                value: html, language: 'html', theme: 'vs-dark', automaticLayout: true, fontSize: 16, minimap: { enabled: false }
            });
            editor.onDidChangeModelContent(() => sync('monaco'));
            sync('monaco');
        });

        window.globalTap = () => {
            haptic();
            saveBar.classList.remove('active');
            setTimeout(() => { if(!saveBar.classList.contains('active')) saveBar.style.display = 'none'; }, 400);
            if(isDockOpen) toggleDock();
        };

        window.openSave = (e) => { 
            e.stopPropagation(); haptic.confirm(); 
            saveBar.style.display = 'flex';
            setTimeout(() => saveBar.classList.add('active'), 10);
        };

        window.toggleFullscreen = (e) => { if(e) e.stopPropagation(); haptic.confirm(); preview.classList.toggle('fullscreen'); };

        window.toggleDock = (e) => {
            if(e) e.stopPropagation(); haptic.confirm();
            isDockOpen = !isDockOpen;
            const list = document.getElementById('file-list');
            isDockOpen ? list.classList.add('open') : list.classList.remove('open');
            document.getElementById('folder-btn').innerHTML = isDockOpen ? '📂' : '📁';
        };

        window.downloadHtml = (e) => {
            e.stopPropagation(); haptic.confirm();
            const blob = new Blob([html], {type:'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = document.getElementById('fn').value || 'index.html';
            a.click();
            URL.revokeObjectURL(url);
            saveBar.classList.remove('active');
        };

        window.handleFile = (e) => {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const div = document.createElement('div');
                div.className = 'dock-item';
                div.innerHTML = `<img src="${ev.target.result}"><div class="del-trigger">✕</div>`;
                
                let startX, startY;
                div.addEventListener('touchstart', (ts) => { 
                    startX = ts.touches[0].pageX; startY = ts.touches[0].pageY; 
                    ts.stopPropagation(); 
                });
                div.addEventListener('touchend', (te) => {
                    const diffX = Math.abs(startX - te.changedTouches[0].pageX);
                    const diffY = Math.abs(startY - te.changedTouches[0].pageY);
                    // 上下左右スワイプで×を消す（swiped解除）
                    if (div.classList.contains('swiped') && (diffX > 20 || diffY > 20)) {
                        div.classList.remove('swiped');
                        return;
                    }
                    // 上スワイプで×表示
                    if(startY - te.changedTouches[0].pageY > 30) div.classList.add('swiped');
                });

                div.querySelector('.del-trigger').onclick = (ex) => {
                    ex.stopPropagation();
                    haptic.notification('warning');
                    div.classList.add('removing'); // 縮小・フェードアニメ
                    setTimeout(() => div.remove(), 400);
                };

                document.getElementById('media-items').appendChild(div);
            };
            r.readAsDataURL(f);
        };

        window.monacoClose = () => { haptic.error(); toggleUI('monaco-container', false); };
        window.toggleUI = (id, show) => { 
            const t = document.getElementById(id); 
            if(show) { 
                t.style.display = 'flex'; 
                setTimeout(() => t.classList.add('active'), 20); 
            } else { 
                t.classList.remove('active'); 
                setTimeout(() => t.style.display = 'none', 500); 
            } 
        };
    </script>
</body>
</html>
