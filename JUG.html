<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Ultimate Debug</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root { --ios-ease: cubic-bezier(0.2, 1, 0.3, 1); }

        * { 
            touch-action: none; -webkit-user-select: none; overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; font-family: -apple-system, "SF Pro Display", sans-serif; 
            font-weight: 1 !important; box-sizing: border-box;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #f2f2f7; overflow: hidden; display: flex; flex-direction: column; }

        .container-box {
            width: calc(100% - 30px); margin: 10px auto; border-radius: 20px;
            background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; position: relative;
        }

        #preview-section { flex: 1; transition: 0.6s var(--ios-ease); z-index: 10; min-height: 200px; }
        #preview-section.fullscreen { position: fixed; inset: 0; margin: 0; width: 100%; height: 100%; border-radius: 0; z-index: 8000; }
        #output-frame { width: 100%; height: 100%; border: none; }
        
        #expand-toggle-btn { 
            position: absolute; bottom: 20px; width: 44px; height: 44px;
            background: rgba(255,255,255,0.6); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #000; z-index: 8010; cursor: pointer; transition: 0.4s var(--ios-ease);
            right: 20px; left: auto;
        }
        #preview-section.fullscreen #expand-toggle-btn { right: auto; left: 20px; }

        #editor-section { flex: 0.8; display: flex; margin-bottom: 90px; }
        #raw-editor { flex: 1; border: none; padding: 20px; outline: none; font-family: "SF Mono", monospace; background: #fff; -webkit-user-select: text; font-size: 14px; resize: none; }

        /* iOS Loader */
        #ios-loader {
            position: fixed; inset: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
            z-index: 9999; display: none; align-items: center; justify-content: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid #000; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Monaco container & 閉じるボタン (左下に移動) */
        #monaco-container { position: fixed; inset: 0; background: #fff; z-index: 5000; display: none; opacity: 0; transform: scale(0.95); transition: 0.5s var(--ios-ease); flex-direction: column; }
        #monaco-container.active { display: flex; opacity: 1; transform: scale(1); }
        #monaco-close-btn { 
            font-size: 40px; color: #000; cursor: pointer; position: absolute; 
            bottom: 30px; left: 30px; z-index: 5010; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
        }
        #monaco-body { flex: 1; width: 100%; }

        /* Dock & Folder Icon */
        #dock-area { position: fixed; bottom: 30px; right: 20px; display: flex; align-items: center; z-index: 4000; }
        #dock-wrapper { display: flex; align-items: center; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); padding: 5px; border-radius: 30px; }
        #file-list { display: flex; gap: 5px; width: 0; opacity: 0; overflow: hidden; transition: 0.5s var(--ios-ease); }
        #file-list.open { width: auto; opacity: 1; margin-right: 8px; }
        #folder-btn { font-size: 24px; padding: 0 10px; transition: 0.3s var(--ios-ease); cursor: pointer; }

        .dock-item { 
            width: 44px; height: 44px; background: #fff; border-radius: 12px; position: relative; 
            flex-shrink: 0; overflow: hidden; transition: 0.4s var(--ios-ease); 
        }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; }
        .dock-item.removing { transform: scale(0); width: 0; margin: 0; opacity: 0; }
        .del-trigger { position: absolute; inset: 0; background: #ff3b30; color: white; display: flex; align-items: center; justify-content: center; transform: translateY(100%); transition: 0.3s var(--ios-ease); font-size: 30px; }
        .swiped .del-trigger { transform: translateY(0); }

        #media-overlay { position: fixed; inset: 0; backdrop-filter: blur(40px); background: rgba(255,255,255,0.1); z-index: 9000; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.4s; }
        #media-overlay.active { display: flex; opacity: 1; }
        #expanded-media { max-width: 90%; max-height: 70%; transform: scale(0.8); transition: 0.5s var(--ios-ease); border-radius: 4px; }
        .media-ui-btn { position: absolute; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 40px; z-index: 9010; cursor: pointer; }
        #media-close { top: 30px; left: 20px; } 
        #media-download { top: 30px; right: 20px; }
    </style>
</head>
<body onclick="globalTap()">

    <div id="ios-loader" onclick="haptic.error()"><div class="spinner"></div></div>

    <div id="preview-section" class="container-box">
        <div id="expand-toggle-btn" onclick="toggleFullscreen(event)">→</div>
        <iframe id="output-frame"></iframe>
    </div>

    <div id="editor-section" class="container-box">
        <textarea id="raw-editor" oninput="sync('input')" placeholder="Input HTML..."></textarea>
    </div>

    <div style="position:fixed; bottom:30px; left:20px; display:flex; gap:15px; z-index:4000;">
        <div style="width:55px; height:55px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;" onclick="openSave(event)">💾</div>
        <div style="width:55px; height:55px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;" onclick="toggleUI('monaco-container', true)">📝</div>
    </div>

    <div id="dock-area">
        <div id="dock-wrapper" onclick="event.stopPropagation()">
            <div id="file-list">
                <div class="dock-item" onclick="document.getElementById('file-input').click()" style="display:flex; align-items:center; justify-content:center; font-size:20px; background:rgba(0,0,0,0.03);">＋</div>
                <div id="media-items" style="display:flex; gap:5px;"></div>
            </div>
            <div onclick="toggleDock(event)" id="folder-btn">📁</div>
        </div>
    </div>

    <div id="monaco-container">
        <div id="monaco-body"></div>
        <div id="monaco-close-btn" onclick="monacoClose()">←</div>
    </div>

    <div id="media-overlay" onclick="closeMedia()">
        <div id="media-close" class="media-ui-btn" onclick="closeMedia(event)">←</div>
        <div id="media-download" class="media-ui-btn" onclick="downloadMedia(event)">↓</div>
        <img id="expanded-media" onclick="event.stopPropagation(); this.classList.toggle('zoomed')" src="">
    </div>

    <input type="file" id="file-input" hidden onchange="handleFile(event)">

    <script type="module">
        import { haptic } from "https://esm.sh/ios-haptics";
        window.haptic = haptic;

        let editor, isSyncing = false, isDockOpen = false, initDist = 0;
        let html = `<!DOCTYPE html><html><body style="margin:0; background:#fff; height:100vh; display:flex; justify-content:center; align-items:center;"><h1>Ready</h1></body></html>`;
        
        const raw = document.getElementById('raw-editor');
        const preview = document.getElementById('preview-section');
        const loader = document.getElementById('ios-loader');
        const folderBtn = document.getElementById('folder-btn');

        document.addEventListener('gesturestart', e => e.preventDefault(), {passive: false});
        document.addEventListener('touchmove', e => { if(e.scale !== 1) e.preventDefault(); }, {passive: false});

        window.sync = (src) => {
            if(isSyncing) return; isSyncing = true;
            html = (src === 'input') ? raw.value : editor.getValue();
            raw.value = html;
            if(editor && src !== 'monaco') editor.setValue(html);
            const d = preview.querySelector('iframe').contentDocument;
            if(d) { d.open(); d.write(html); d.close(); }
            isSyncing = false;
        };

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-body'), { 
                value: html, language: 'html', theme: 'vs', automaticLayout: true, fontSize: 16, minimap: { enabled: false }
            });
            editor.onDidChangeModelContent(() => sync('monaco'));
            sync('monaco');
        });

        window.toggleDock = (e) => {
            if(e) e.stopPropagation(); haptic.confirm();
            isDockOpen = !isDockOpen;
            const list = document.getElementById('file-list');
            if(isDockOpen) {
                list.classList.add('open');
                folderBtn.innerText = '📂';
            } else {
                list.classList.remove('open');
                folderBtn.innerText = '📁';
            }
        };

        window.handleFile = (e) => {
            const f = e.target.files[0]; if(!f) return;
            loader.style.display = 'flex'; // ローディング開始
            const r = new FileReader();
            r.onload = (ev) => {
                setTimeout(() => { // 読み込み感を出すための微小な遅延
                    const div = document.createElement('div');
                    div.className = 'dock-item';
                    div.innerHTML = `<img src="${ev.target.result}"><div class="del-trigger">－</div>`;
                    let sY;
                    div.ontouchstart = (ts) => { sY = ts.touches[0].pageY; ts.stopPropagation(); };
                    div.ontouchend = (te) => {
                        const diffY = sY - te.changedTouches[0].pageY;
                        if(diffY > 30) div.classList.add('swiped');
                        else if(diffY < -30) div.classList.remove('swiped');
                        else if(!div.classList.contains('swiped')) openMedia(ev.target.result);
                    };
                    div.querySelector('.del-trigger').onclick = (ex) => {
                        ex.stopPropagation(); haptic.notification('warning');
                        div.classList.add('removing');
                        setTimeout(() => div.remove(), 300);
                    };
                    document.getElementById('media-items').appendChild(div);
                    loader.style.display = 'none'; // ローディング終了
                }, 400);
            };
            r.readAsDataURL(f);
        };

        window.openMedia = (src) => {
            const ov = document.getElementById('media-overlay');
            document.getElementById('expanded-media').src = src;
            ov.style.display = 'flex';
            setTimeout(() => ov.classList.add('active'), 10);
            haptic.confirm();
        };

        window.toggleFullscreen = (e) => { 
            if(e) e.stopPropagation(); haptic.confirm(); 
            preview.classList.toggle('fullscreen');
            document.getElementById('expand-toggle-btn').innerText = preview.classList.contains('fullscreen') ? "←" : "→";
        };

        window.monacoClose = () => { haptic.error(); toggleUI('monaco-container', false); };
        window.toggleUI = (id, show) => { 
            const t = document.getElementById(id); 
            if(show) { t.style.display = 'flex'; setTimeout(() => t.classList.add('active'), 20); } 
            else { t.classList.remove('active'); setTimeout(() => t.style.display = 'none', 500); } 
        };
        window.globalTap = () => { haptic(); if(isDockOpen) toggleDock(); };
        window.closeMedia = () => { const ov = document.getElementById('media-overlay'); ov.classList.remove('active'); setTimeout(() => ov.style.display = 'none', 400); };
    </script>
</body>
</html>
