<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Swipe & Sync Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --ios-ease: cubic-bezier(0.25, 1, 0.5, 1);
            --spring: cubic-bezier(0.5, 1.4, 0.5, 1);
        }

        * { touch-action: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
        
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f0f2; overflow: hidden; display: flex; flex-direction: column;
        }

        /* プレビュー */
        #preview-section { 
            flex: 1; background: #fff; position: relative; 
            transition: all 0.5s var(--ios-ease); 
            z-index: 5; transform: scale(0.97); border-radius: 12px; margin: 10px 10px 5px 10px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #preview-section.fullscreen { position: fixed; inset: 0; transform: scale(1); border-radius: 0; margin: 0; z-index: 3000; }
        #output-frame { width: 100%; height: 100%; border: none; pointer-events: auto; }

        /* 拡大ボタン */
        #zoom-btn {
            position: absolute; bottom: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 3001;
        }

        /* 同期Input */
        #editor-section { flex: 0.8; display: flex; padding: 5px 15px 15px 15px; z-index: 2; }
        #raw-editor { 
            flex: 1; border: none; padding: 20px; font-family: 'SF Mono', monospace; 
            font-size: 14px; outline: none; background: #fff; border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); -webkit-user-select: text; user-select: text;
        }

        /* Dock (右下) */
        #dock-wrapper {
            position: fixed; bottom: 95px; right: 20px;
            display: flex; align-items: center; background: rgba(242, 242, 247, 0.9); 
            backdrop-filter: blur(25px); padding: 8px 14px; border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 3400; transition: 0.5s var(--spring);
        }
        #file-list { display: flex; gap: 10px; width: 0; opacity: 0; overflow: hidden; transition: 0.4s var(--ios-ease); align-items: center; }
        #file-list.open { width: auto; opacity: 1; margin-right: 12px; }

        /* 追加したファイルのコンテナ */
        .dock-item {
            width: 50px; height: 50px; background: #fff; border-radius: 12px;
            position: relative; flex-shrink: 0; transition: transform 0.4s var(--ios-ease);
        }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

        /* スワイプ削除ボタン */
        .swipe-del-btn {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff3b30; color: white; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            transform: translateY(100%); transition: 0.3s var(--ios-ease);
            font-size: 24px; font-weight: 200; /* 細いバツ */
        }
        .swiped .swipe-del-btn { transform: translateY(0); }
        .swiped img { opacity: 0.3; }

        /* ビューワー */
        #media-viewer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 9000;
            opacity: 0; transition: 0.4s;
        }
        #media-viewer.active { display: flex; opacity: 1; }
        #viewer-box { position: relative; transform: scale(0.5); transition: 0.4s var(--ios-ease); }
        #media-viewer.active #viewer-box { transform: scale(1); }
        
        /* 細い閉じるボタン */
        .v-close { 
            position: absolute; top: -60px; right: 0; font-size: 40px; 
            color: #fff; font-weight: 100; cursor: pointer; padding: 10px;
        }

        #monaco-container {
            position: fixed; inset: 0; background: #1e1e1e; z-index: 4000;
            display: none; opacity: 0; transition: 0.5s var(--ios-ease); flex-direction: column;
        }
        #monaco-container.active { display: flex; opacity: 1; }

        .floating-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 3500; background: rgba(242, 242, 247, 0.9); padding: 10px 14px;
            border-radius: 40px; display: none; align-items: center; backdrop-filter: blur(20px); transition: 0.4s;
        }
        .floating-bar.active { display: flex; }
        .btn-ui { border: none; background: #000; color: #fff; padding: 10px 24px; border-radius: 30px; font-weight: 600; margin: 0 4px; }
    </style>
</head>
<body onclick="globalTap()">

    <div id="media-viewer" onclick="closeViewer()">
        <div id="viewer-box" onclick="event.stopPropagation()">
            <div class="v-close" onclick="closeViewer()">✕</div>
            <div id="viewer-content"></div>
        </div>
    </div>

    <div id="preview-section">
        <iframe id="output-frame"></iframe>
        <div id="zoom-btn" onclick="toggleFullscreen(event)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </div>
    </div>

    <div id="editor-section">
        <textarea id="raw-editor" oninput="sync('input')"></textarea>
    </div>

    <div id="dock-wrapper" onclick="event.stopPropagation()">
        <div id="file-list">
            <div class="dock-item" onclick="document.getElementById('file-input').click()" style="background:#eee; display:flex; align-items:center; justify-content:center; font-size:24px;">＋</div>
            <div id="media-items" style="display:flex; gap:10px;"></div>
        </div>
        <div id="folder-btn" style="font-size:28px; cursor:pointer; margin-left:10px;" onclick="toggleDock(event)">📁</div>
    </div>

    <div id="main-menu" class="floating-bar active">
        <button class="btn-ui" id="btn-save" onclick="toggleUI('save-bar', true)">保存</button>
        <button class="btn-ui" id="btn-pro" onclick="toggleUI('monaco-container', true)">Editor Pro</button>
    </div>

    <div id="save-bar" class="floating-bar" onclick="event.stopPropagation()">
        <input type="text" id="fn" value="index.html" style="border:none; padding:8px; border-radius:15px; margin-right:8px; outline:none;">
        <button class="btn-ui" onclick="download()">Download</button>
    </div>

    <div id="monaco-container">
        <div style="height:60px; display:flex; justify-content:flex-end; padding:10px 20px;">
            <div style="color:#fff; font-size:40px; font-weight:100; cursor:pointer;" onclick="toggleUI('monaco-container', false)">✕</div>
        </div>
        <div id="monaco-body" style="flex:1"></div>
    </div>

    <input type="file" id="file-input" hidden onchange="handleFile(event)">

    <script type="module">
        import { haptic } from "https://esm.sh/ios-haptics";

        window.haptic = haptic; 
        let editor, isSyncing = false, isDockOpen = false;
        let html = `<!DOCTYPE html><html><body style="background:#f0f0f2; height:100vh; display:flex; justify-content:center; align-items:center; margin:0;"><h1>System Online</h1></body></html>`;
        
        const raw = document.getElementById('raw-editor');
        const preview = document.getElementById('preview-section');

        // 同期処理
        window.sync = (src) => {
            if(isSyncing) return;
            isSyncing = true;
            if(src === 'input') html = raw.value;
            if(src === 'monaco') html = editor.getValue();
            raw.value = html;
            if(editor && src !== 'monaco') editor.setValue(html);
            const d = document.getElementById('output-frame').contentDocument;
            d.open(); d.write(html); d.close();
            isSyncing = false;
        };

        // Monaco 初期化
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-body'), {
                value: html, language: 'html', theme: 'vs-dark', automaticLayout: true, fontSize: 16
            });
            editor.onDidChangeModelContent(() => sync('monaco'));
            sync('monaco');
        });

        // グローバルタップ処理
        window.globalTap = () => {
            haptic(); // Single haptic
            document.querySelectorAll('.dock-item').forEach(el => el.classList.remove('swiped'));
            if(isDockOpen) toggleDock();
            if(document.getElementById('save-bar').classList.contains('active')) toggleUI('save-bar', false);
        };

        // UI切り替え
        window.toggleUI = (id, show) => {
            haptic.confirm();
            const t = document.getElementById(id);
            if(show) {
                t.style.display = 'flex';
                setTimeout(() => t.classList.add('active'), 10);
            } else {
                t.classList.remove('active');
                setTimeout(() => t.style.display = 'none', 400);
            }
        };

        // プレビュー拡大
        window.toggleFullscreen = (e) => {
            if(e) e.stopPropagation();
            haptic.confirm();
            preview.classList.toggle('fullscreen');
        };

        // Dock制御
        window.toggleDock = (e) => {
            if(e) e.stopPropagation();
            haptic.confirm();
            isDockOpen = !isDockOpen;
            document.getElementById('file-list').classList.toggle('open', isDockOpen);
            document.getElementById('folder-btn').innerHTML = isDockOpen ? '📂' : '📁';
        };

        // ファイル処理 & スワイプ削除
        window.handleFile = (e) => {
            const f = e.target.files[0];
            if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const items = document.getElementById('media-items');
                const div = document.createElement('div');
                div.className = 'dock-item';
                div.innerHTML = `<img src="${ev.target.result}"><div class="swipe-del-btn">✕</div>`;
                
                let startY = 0;
                div.ontouchstart = (ts) => { startY = ts.touches[0].pageY; ts.stopPropagation(); };
                div.ontouchend = (te) => {
                    const diff = startY - te.changedTouches[0].pageY;
                    if(diff > 30) { // Up swipe
                        div.classList.add('swiped');
                        haptic.confirm();
                    } else if(Math.abs(diff) < 5) { // Tap
                        div.classList.contains('swiped') ? null : openViewer(ev.target.result);
                    }
                };

                div.querySelector('.swipe-del-btn').onclick = (ex) => {
                    ex.stopPropagation();
                    haptic.error(); // Three rapid haptics for delete
                    div.remove();
                };

                items.appendChild(div);
                haptic.confirm();
            };
            r.readAsDataURL(f);
        };

        // 拡大表示
        function openViewer(data) {
            haptic.confirm();
            const v = document.getElementById('media-viewer');
            document.getElementById('viewer-content').innerHTML = `<img src="${data}" style="max-width:90vw; max-height:80vh; border-radius:10px;">`;
            v.style.display = 'flex';
            setTimeout(() => v.classList.add('active'), 10);
        }

        window.closeViewer = () => {
            haptic();
            const v = document.getElementById('media-viewer');
            v.classList.remove('active');
            setTimeout(() => v.style.display = 'none', 400);
        };

        // ピンチ拡大
        let initDist = 0;
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (initDist === 0) { initDist = d; return; }
                let r = d / initDist;
                if (e.target.closest('#preview-section') && r > 1.3) preview.classList.add('fullscreen');
                if (e.target.closest('#editor-section') && r > 1.4) toggleUI('monaco-container', true);
                if (e.target.closest('#monaco-container') && r < 0.7) toggleUI('monaco-container', false);
            }
        }, { passive: false });
        window.addEventListener('touchend', () => initDist = 0);

        window.download = () => {
            haptic.confirm();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
            a.download = document.getElementById('fn').value;
            a.click();
            toggleUI('save-bar', false);
        };
    </script>
</body>
</html>
