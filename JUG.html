<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Media Editor - Classic Restore</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f0f2;
            --accent-color: #000;
            --bar-bg: rgba(242, 242, 247, 0.9);
            --shadow: 0 15px 50px rgba(0,0,0,0.15);
            --ios-ease: cubic-bezier(0.2, 1, 0.3, 1);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* プレビュー・エディタ */
        #preview-section { 
            flex: 1; background: #fff; position: relative; 
            transition: all 0.5s var(--ios-ease); 
            z-index: 5; transform: scale(0.98); border-radius: 12px; margin: 10px 10px 5px 10px;
        }
        #preview-section.fullscreen { position: fixed; inset: 0; z-index: 3000; transform: scale(1); border-radius: 0; margin: 0; }
        #output-frame { width: 100%; height: 100%; border: none; display: block; border-radius: inherit; }

        #editor-section { flex: 0.8; display: flex; padding: 5px 15px 15px 15px; z-index: 2; transition: 0.5s var(--ios-ease); }
        #raw-editor { flex: 1; border: none; padding: 20px; font-family: 'SF Mono', monospace; font-size: 14px; outline: none; background: #fff; border-radius: 20px; resize: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* Dock */
        #dock-container {
            position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%);
            background: var(--bar-bg); backdrop-filter: blur(25px);
            padding: 8px 12px; border-radius: 24px; display: flex; align-items: center;
            box-shadow: var(--shadow); z-index: 3400; transition: 0.5s var(--ios-ease);
        }
        #file-list { display: flex; gap: 8px; }
        .dock-item {
            width: 50px; height: 50px; background: #fff; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s var(--ios-ease); overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex-shrink: 0; font-size: 20px;
        }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .dock-item.dragging { opacity: 0.4; transform: scale(0.8); }

        #trash-bin { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-left: 10px; transition: 0.3s; border-radius: 12px; }
        #trash-bin.drag-over { background: rgba(255,59,48,0.2); transform: scale(1.2); }

        /* フローティングバー (home.html仕様) */
        .floating-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) scale(0.8);
            opacity: 0; z-index: 3500; background: var(--bar-bg); padding: 10px 14px;
            border-radius: 40px; display: none; align-items: center; box-shadow: var(--shadow);
            backdrop-filter: blur(25px); transition: all 0.5s var(--ios-ease);
        }
        .floating-bar.active { display: flex; opacity: 1; transform: translateX(-50%) scale(1); }
        .btn-ui { border: none; background: var(--accent-color); color: white; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-weight: 600; margin: 0 4px; }

        /* バツアイコン */
        .ios-close-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: 10px; position: relative; }
        .ios-close-icon::before, .ios-close-icon::after { content: ''; position: absolute; width: 18px; height: 1px; background: #000; }
        .ios-close-icon::before { transform: rotate(45deg); }
        .ios-close-icon::after { transform: rotate(-45deg); }
        .ios-close-icon.white::before, .ios-close-icon.white::after { background: #fff; }

        /* メディアビューワー */
        #media-viewer {
            position: fixed; inset: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(30px);
            display: none; align-items: center; justify-content: center; z-index: 5000; opacity: 0; transition: 0.5s var(--ios-ease);
        }
        #media-viewer.active { display: flex; opacity: 1; }
        #media-viewer img, #media-viewer video { max-width: 85%; max-height: 80%; border-radius: 15px; transform: scale(0.8); transition: 0.5s var(--ios-ease); box-shadow: var(--shadow); }
        #media-viewer.active img, #media-viewer.active video { transform: scale(1); }

        #toast-notification { position: fixed; top: 10%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(255,255,255,0.8); padding: 12px 28px; border-radius: 50px; backdrop-filter: blur(20px); z-index: 9999; opacity: 0; transition: 0.5s var(--ios-ease); box-shadow: var(--shadow); pointer-events: none; }
        #toast-notification.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        #monaco-container { position: fixed; inset: 0; background: #1e1e1e; z-index: 4000; display: none; transform: scale(0.9); opacity: 0; transition: 0.5s var(--ios-ease); flex-direction: column; }
        #monaco-container.active { display: flex; transform: scale(1); opacity: 1; }
        #filename-input { border: none; padding: 10px 18px; border-radius: 20px; outline: none; background: #fff; font-size: 14px; width: 140px; margin-right: 8px; }
    </style>
</head>
<body ondragover="event.preventDefault()">

    <div id="toast-notification">Notification</div>

    <div id="media-viewer" onclick="closeViewer()">
        <div id="viewer-content" onclick="event.stopPropagation()"></div>
    </div>

    <div id="preview-section">
        <iframe id="output-frame"></iframe>
        <div style="position: absolute; bottom: 20px; right: 20px; width: 44px; height: 44px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); z-index: 3001;" onclick="toggleFullscreen()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </div>
    </div>

    <div id="editor-section">
        <textarea id="raw-editor" spellcheck="false"></textarea>
    </div>

    <div id="dock-container">
        <div class="dock-item" onclick="document.getElementById('file-input').click()" style="background: #eee;">＋</div>
        <div id="file-list"></div>
        <div id="trash-bin" ondragover="this.classList.add('drag-over'); event.preventDefault();" ondragleave="this.classList.remove('drag-over')" ondrop="handleTrashDrop(event)">🗑️</div>
    </div>

    <div id="main-menu" class="floating-bar active">
        <button class="btn-ui" onclick="toggleUI('save-bar', true)">保存</button>
        <button class="btn-ui" onclick="toggleUI('monaco-container', true)">Editor Pro</button>
    </div>

    <div id="save-bar" class="floating-bar">
        <div class="ios-close-icon" onclick="toggleUI('save-bar', false)"></div>
        <input type="text" id="filename-input" value="index.html">
        <button class="btn-ui" onclick="downloadFile()">💾 実行</button>
    </div>

    <div id="monaco-container">
        <div style="height: 60px; display: flex; align-items: center; justify-content: flex-end; padding: 0 20px;">
            <div class="ios-close-icon white" onclick="toggleUI('monaco-container', false)"></div>
        </div>
        <div id="monaco-body" style="flex:1"></div>
    </div>

    <input type="file" id="file-input" hidden onchange="handleFileSelect(event)" accept="image/*,video/*,audio/*">

    <script>
        const haptic = (err = false) => { if(navigator.vibrate) navigator.vibrate(err ? [10, 30, 10] : 10); };
        
        let editor;
        let files = { 'index.html': `<!DOCTYPE html>\n<html>\n<body style="display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f0f0f2;font-family:sans-serif;">\n<h1>Media Gallery</h1>\n</body>\n</html>` };
        let mediaOrder = [];
        let audioElements = {};
        let draggedName = null;

        const rawTextArea = document.getElementById('raw-editor');
        const frame = document.getElementById('output-frame');

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('monaco-body'), {
                value: files['index.html'], language: 'html', theme: 'vs-dark', fontSize: 16, automaticLayout: true, minimap: { enabled: false }
            });
            editor.onDidChangeModelContent(() => {
                const val = editor.getValue();
                files['index.html'] = val;
                rawTextArea.value = val;
                updatePreview(val);
            });
            rawTextArea.value = files['index.html'];
            updatePreview(files['index.html']);
        });

        function updatePreview(code) {
            const d = frame.contentDocument;
            d.open(); d.write(code); d.close();
        }

        rawTextArea.oninput = () => {
            files['index.html'] = rawTextArea.value;
            editor.setValue(rawTextArea.value);
            updatePreview(rawTextArea.value);
        };

        // --- メディア処理 ---
        function handleFileSelect(e) {
            const f = e.target.files[0];
            if(!f) return;
            const name = f.name;
            const isMedia = /\.(jpg|jpeg|png|gif|webp|mp3|wav|mp4|mov|aiff)$/i.test(name);
            if(!isMedia) { showToast("Media Only"); return; }

            const r = new FileReader();
            r.onload = (ev) => {
                files[name] = ev.target.result;
                if(!mediaOrder.includes(name)) mediaOrder.unshift(name);
                renderDock();
                haptic();
                showToast("Added: " + name);
            };
            r.readAsDataURL(f);
        }

        function renderDock() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            mediaOrder.forEach(name => {
                const div = document.createElement('div');
                div.className = 'dock-item';
                div.draggable = true;
                
                const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(name);
                const isAudio = /\.(mp3|wav|aiff)$/i.test(name);

                if(isImg) {
                    div.innerHTML = `<img src="${files[name]}">`;
                } else if(isAudio) {
                    const isPlaying = audioElements[name] && !audioElements[name].paused;
                    div.innerHTML = isPlaying ? '||' : '🎵';
                } else {
                    div.innerHTML = '🎬';
                }

                div.onclick = () => isAudio ? toggleAudio(name) : openViewer(name);
                
                div.ondragstart = (e) => { draggedName = name; div.classList.add('dragging'); e.dataTransfer.setData('text', name); };
                div.ondragend = () => div.classList.remove('dragging');
                div.ondragover = (e) => {
                    e.preventDefault();
                    if(name !== draggedName) {
                        const from = mediaOrder.indexOf(draggedName);
                        const to = mediaOrder.indexOf(name);
                        mediaOrder.splice(from, 1);
                        mediaOrder.splice(to, 0, draggedName);
                        renderDock();
                    }
                };
                list.appendChild(div);
            });
        }

        function toggleAudio(name) {
            if(!audioElements[name]) {
                audioElements[name] = new Audio(files[name]);
                audioElements[name].onended = () => renderDock();
            }
            const a = audioElements[name];
            if(a.paused) {
                Object.values(audioElements).forEach(el => el.pause()); // 他を止める
                a.play();
            } else {
                a.pause();
            }
            renderDock();
            haptic();
        }

        function openViewer(name) {
            const v = document.getElementById('media-viewer');
            const content = document.getElementById('viewer-content');
            content.innerHTML = '';
            if(/\.(mp4|mov)$/i.test(name)) {
                const vid = document.createElement('video');
                vid.src = files[name]; vid.controls = true; vid.autoplay = true;
                content.appendChild(vid);
            } else {
                const img = document.createElement('img');
                img.src = files[name];
                content.appendChild(img);
            }
            v.style.display = 'flex';
            setTimeout(() => v.classList.add('active'), 10);
            haptic();
        }

        function closeViewer() {
            const v = document.getElementById('media-viewer');
            v.classList.remove('active');
            setTimeout(() => { v.style.display = 'none'; document.getElementById('viewer-content').innerHTML = ''; }, 500);
        }

        function handleTrashDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const name = e.dataTransfer.getData('text');
            mediaOrder = mediaOrder.filter(n => n !== name);
            if(audioElements[name]) { audioElements[name].pause(); delete audioElements[name]; }
            delete files[name];
            renderDock();
            haptic(true);
            showToast("Deleted");
        }

        // --- UI 操作 ---
        function toggleUI(id, show) {
            const target = document.getElementById(id);
            const others = ['main-menu', 'save-bar', 'monaco-container'].filter(x => x !== id);
            if(show) {
                others.forEach(oid => document.getElementById(oid).classList.remove('active'));
                target.style.display = 'flex';
                requestAnimationFrame(() => requestAnimationFrame(() => target.classList.add('active')));
            } else {
                target.classList.remove('active');
                setTimeout(() => { target.style.display = 'none'; if(id !== 'main-menu') toggleUI('main-menu', true); }, 500);
            }
            haptic();
        }

        function toggleFullscreen() {
            const isFull = document.getElementById('preview-section').classList.toggle('fullscreen');
            showToast(isFull ? "Full Screen" : "Window");
            toggleUI('main-menu', !isFull);
            haptic();
        }

        function showToast(m) { const t = document.getElementById('toast-notification'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
        
        function downloadFile() {
            const blob = new Blob([rawTextArea.value], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = document.getElementById('filename-input').value;
            a.click();
            showToast("Saved!");
            toggleUI('save-bar', false);
        }
    </script>
</body>
</html>
