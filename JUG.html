<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Ultimate Debug</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root { --ios-ease: cubic-bezier(0.2, 1, 0.3, 1); }

        /* 全要素のフォントウェイトを1に強制 */
        * { 
            touch-action: none; 
            -webkit-user-select: none; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, "SF Pro Display", sans-serif; 
            font-weight: 1 !important; 
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #f2f2f7; overflow: hidden; display: flex; flex-direction: column; }

        /* プレビューとエディタの共通マージン設定 */
        .container-box {
            margin: 10px 15px; /* 左右のマージンを15pxで統一 */
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* プレビューエリア */
        #preview-section { 
            flex: 1; position: relative; transition: 0.6s var(--ios-ease); z-index: 10; 
        }
        #preview-section.fullscreen { position: fixed; inset: 0; margin: 0; border-radius: 0; z-index: 8000; }
        #output-frame { width: 100%; height: 100%; border: none; }
        
        /* 拡大切替ボタン：右下に配置 */
        #expand-toggle-btn { 
            position: absolute; right: 20px; bottom: 20px; width: 44px; height: 44px;
            background: rgba(255,255,255,0.6); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #000; z-index: 8010; cursor: pointer;
        }

        /* エディタエリア：プレビューと同じ幅に設定 */
        #editor-section { flex: 0.8; display: flex; margin-bottom: 20px; }
        #raw-editor { 
            flex: 1; border: none; padding: 20px; outline: none; 
            font-family: "SF Mono", monospace; background: #fff;
            -webkit-user-select: text; 
        }

        /* 保存バー */
        #save-input-bar { 
            position: fixed; bottom: 30px; left: 20px; width: 240px; height: 55px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(30px); border-radius: 28px;
            display: none; opacity: 0; transform: scale(0.8); transition: 0.4s var(--ios-ease); z-index: 4500;
            align-items: center; padding: 0 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        #save-input-bar.active { display: flex; opacity: 1; transform: scale(1); }
        #save-input-bar input { flex: 1; border: none; outline: none; font-size: 17px; background: transparent; -webkit-user-select: text; }
        .save-arrow { font-size: 28px; color: #007aff; cursor: pointer; }

        /* 画像拡大オーバーレイ */
        #media-overlay { position: fixed; inset: 0; backdrop-filter: blur(40px); background: rgba(255,255,255,0.1); z-index: 9000; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.4s; }
        #media-overlay.active { display: flex; opacity: 1; }
        #expanded-media { max-width: 90%; max-height: 70%; transform: scale(0.8); transition: 0.5s var(--ios-ease); border-radius: 4px; }
        #media-overlay.active #expanded-media { transform: scale(1); }
        #expanded-media.zoomed { transform: scale(1.8) !important; }

        /* 画像オーバーレイUI */
        .media-ui-btn { position: absolute; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 40px; z-index: 9010; cursor: pointer; }
        #media-close { top: 30px; left: 20px; } /* ← を左側に配置 */
        #media-download { top: 30px; right: 20px; } /* ↓ を右側に配置 */
        #media-filename { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: #000; font-size: 16px; border-bottom: 0.5px solid #000; padding: 2px 10px; z-index: 9010; }

        /* Monaco */
        #monaco-container { position: fixed; inset: 0; background: #fff; z-index: 5000; display: none; opacity: 0; transform: scale(0.95); transition: 0.5s var(--ios-ease); flex-direction: column; }
        #monaco-container.active { display: flex; opacity: 1; transform: scale(1); }
        #monaco-close-btn { font-size: 40px; color: #000; cursor: pointer; padding: 20px 30px; align-self: flex-start; } /* ← を左側に配置 */

        /* Dock */
        #dock-area { position: fixed; bottom: 30px; right: 20px; display: flex; align-items: center; z-index: 4000; }
        #dock-wrapper { display: flex; align-items: center; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); padding: 5px; border-radius: 30px; }
        #file-list { display: flex; gap: 5px; width: 0; opacity: 0; overflow: hidden; transition: 0.5s var(--ios-ease); }
        #file-list.open { width: auto; opacity: 1; margin-right: 8px; }

        .icon-btn { width: 55px; height: 55px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .dock-item { width: 44px; height: 44px; background: #fff; border-radius: 12px; position: relative; flex-shrink: 0; overflow: hidden; transition: 0.4s var(--ios-ease); }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 削除ボタン「－」 */
        .del-trigger { 
            position: absolute; inset: 0; background: #ff3b30; color: white; 
            display: flex; align-items: center; justify-content: center; 
            transform: translateY(100%); transition: 0.3s var(--ios-ease); font-size: 30px; 
        }
        .swiped .del-trigger { transform: translateY(0); }
        .removing { transform: scale(0); opacity: 0; }
    </style>
</head>
<body onclick="globalTap()">

    <div id="preview-section" class="container-box">
        <div id="expand-toggle-btn" onclick="toggleFullscreen(event)">→</div>
        <iframe id="output-frame"></iframe>
    </div>

    <div id="editor-section" class="container-box">
        <textarea id="raw-editor" oninput="sync('input')" placeholder="Input HTML..."></textarea>
    </div>

    <div style="position:fixed; bottom:30px; left:20px; display:flex; gap:15px; z-index:4000;">
        <div class="icon-btn" onclick="openSave(event)">💾</div>
        <div class="icon-btn" onclick="toggleUI('monaco-container', true)">📝</div>
    </div>

    <div id="dock-area">
        <div id="dock-wrapper" onclick="event.stopPropagation()">
            <div id="file-list">
                <div class="dock-item" onclick="document.getElementById('file-input').click()" style="display:flex; align-items:center; justify-content:center; font-size:20px; background:rgba(0,0,0,0.03);">＋</div>
                <div id="media-items" style="display:flex; gap:5px;"></div>
            </div>
            <div onclick="toggleDock(event)" id="folder-btn" style="font-size:24px; padding:0 10px;">📁</div>
        </div>
    </div>

    <div id="save-input-bar" onclick="event.stopPropagation()">
        <input type="text" id="fn" value="index.html" spellcheck="false">
        <div class="save-arrow" onclick="downloadHtml(event)">→</div>
    </div>

    <div id="monaco-container">
        <div id="monaco-close-btn" onclick="monacoClose()">←</div>
        <div id="monaco-body" style="flex:1;"></div>
    </div>

    <div id="media-overlay" onclick="closeMedia()">
        <div id="media-close" class="media-ui-btn" onclick="closeMedia(event)">←</div>
        <div id="media-download" class="media-ui-btn" onclick="downloadMedia(event)">↓</div>
        <img id="expanded-media" onclick="event.stopPropagation(); toggleZoom(this)" src="">
        <div id="media-filename" onclick="event.stopPropagation(); editMediaName(event)">image.png</div>
    </div>

    <input type="file" id="file-input" hidden onchange="handleFile(event)">

    <script type="module">
        import { haptic } from "https://esm.sh/ios-haptics";
        window.haptic = haptic;

        let editor, isSyncing = false, isDockOpen = false, initDist = 0;
        let html = `<!DOCTYPE html><html><body style="margin:0; background:#fff; height:100vh; display:flex; justify-content:center; align-items:center;"><h1>Ready</h1></body></html>`;
        let currentMediaSrc = "";

        const raw = document.getElementById('raw-editor');
        const preview = document.getElementById('preview-section');
        const saveBar = document.getElementById('save-input-bar');
        const expandBtn = document.getElementById('expand-toggle-btn');

        window.addEventListener('gesturestart', e => e.preventDefault(), {passive: false});

        window.addEventListener('keydown', e => {
            if(e.key === "Escape") {
                if(preview.classList.contains('fullscreen')) toggleFullscreen();
                if(document.getElementById('monaco-container').classList.contains('active')) monacoClose();
                if(document.getElementById('media-overlay').classList.contains('active')) closeMedia();
            }
        });

        let touchStartTime = 0;
        preview.addEventListener('touchstart', e => { if(e.touches.length === 2) touchStartTime = Date.now(); }, {passive: false});
        preview.addEventListener('touchend', e => {
            if(touchStartTime && (Date.now() - touchStartTime < 300)) {
                toggleFullscreen();
                touchStartTime = 0;
            }
        });

        window.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (initDist === 0) { initDist = d; return; }
                let r = d / initDist;
                if (e.target.closest('#raw-editor') && r > 1.3) { toggleUI('monaco-container', true); initDist = d; }
                if (document.getElementById('monaco-container').classList.contains('active') && r < 0.7) { monacoClose(); initDist = d; }
            }
        }, { passive: false });
        window.addEventListener('touchend', () => initDist = 0);

        window.sync = (src) => {
            if(isSyncing) return; isSyncing = true;
            html = (src === 'input') ? raw.value : editor.getValue();
            raw.value = html;
            if(editor && src !== 'monaco') editor.setValue(html);
            const d = preview.querySelector('iframe').contentDocument;
            if(d) { d.open(); d.write(html); d.close(); }
            isSyncing = false;
        };

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-body'), { 
                value: html, language: 'html', theme: 'vs', automaticLayout: true, fontSize: 16, minimap: { enabled: false }
            });
            editor.onDidChangeModelContent(() => sync('monaco'));
            sync('monaco');
        });

        window.globalTap = () => {
            haptic();
            saveBar.classList.remove('active');
            setTimeout(() => { if(!saveBar.classList.contains('active')) saveBar.style.display = 'none'; }, 400);
            if(isDockOpen) toggleDock();
        };

        window.openSave = (e) => { e.stopPropagation(); haptic.confirm(); saveBar.style.display = 'flex'; setTimeout(() => saveBar.classList.add('active'), 10); };
        
        window.toggleFullscreen = (e) => { 
            if(e) e.stopPropagation(); 
            haptic.confirm(); 
            preview.classList.toggle('fullscreen');
            expandBtn.innerText = preview.classList.contains('fullscreen') ? "←" : "→";
        };

        window.toggleDock = (e) => {
            if(e) e.stopPropagation(); haptic.confirm();
            isDockOpen = !isDockOpen;
            const list = document.getElementById('file-list');
            isDockOpen ? list.classList.add('open') : list.classList.remove('open');
        };

        window.downloadHtml = (e) => {
            e.stopPropagation(); haptic.confirm();
            const blob = new Blob([html], {type:'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = document.getElementById('fn').value || 'index.html';
            a.click(); saveBar.classList.remove('active');
        };

        window.handleFile = (e) => {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const div = document.createElement('div');
                div.className = 'dock-item';
                div.dataset.name = f.name;
                div.innerHTML = `<img src="${ev.target.result}"><div class="del-trigger">－</div>`;
                let sY;
                div.ontouchstart = (ts) => { sY = ts.touches[0].pageY; ts.stopPropagation(); };
                div.ontouchend = (te) => {
                    const diffY = sY - te.changedTouches[0].pageY;
                    if(diffY > 30) div.classList.add('swiped');
                    else if(diffY < -30) div.classList.remove('swiped');
                    else if(!div.classList.contains('swiped')) openMedia(ev.target.result, div.dataset.name);
                };
                div.querySelector('.del-trigger').onclick = (ex) => {
                    ex.stopPropagation(); haptic.notification('warning');
                    div.classList.add('removing');
                    setTimeout(() => div.remove(), 400);
                };
                document.getElementById('media-items').appendChild(div);
            };
            r.readAsDataURL(f);
        };

        window.openMedia = (src, name) => {
            const ov = document.getElementById('media-overlay');
            currentMediaSrc = src;
            document.getElementById('expanded-media').src = src;
            document.getElementById('media-filename').innerText = name || "image.png";
            ov.style.display = 'flex';
            setTimeout(() => ov.classList.add('active'), 10);
            haptic.confirm();
        };

        window.editMediaName = (e) => {
            e.stopPropagation(); haptic.confirm();
            let n = prompt("名前変更", e.target.innerText.split('.')[0]);
            if(n) e.target.innerText = n.replace(/\./g, '') + ".png";
        };

        window.downloadMedia = (e) => {
            e.stopPropagation(); haptic.confirm();
            const a = document.createElement('a');
            a.href = currentMediaSrc; a.download = document.getElementById('media-filename').innerText;
            a.click();
        };

        window.toggleZoom = (el) => { haptic.confirm(); el.classList.toggle('zoomed'); };
        window.closeMedia = (e) => { if(e) e.stopPropagation(); const ov = document.getElementById('media-overlay'); ov.classList.remove('active'); setTimeout(() => ov.style.display = 'none', 400); };
        window.monacoClose = () => { haptic.error(); toggleUI('monaco-container', false); };
        window.toggleUI = (id, show) => { 
            const t = document.getElementById(id); 
            if(show) { t.style.display = 'flex'; setTimeout(() => t.classList.add('active'), 20); } 
            else { t.classList.remove('active'); setTimeout(() => t.style.display = 'none', 500); } 
        };
    </script>
</body>
</html>
