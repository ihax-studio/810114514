<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Ultimate Debug Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --ios-ease: cubic-bezier(0.2, 1, 0.3, 1);
            --liquid: cubic-bezier(0.6, 0.1, 0.3, 1.4);
        }

        /* iOS標準挙動の完全ブロック */
        * { 
            touch-action: none; 
            -webkit-user-select: none; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f0f0f2; overflow: hidden; display: flex; flex-direction: column; 
        }

        /* プレビューセクション */
        #preview-section { 
            flex: 1; background: #fff; position: relative; 
            transition: 0.6s var(--ios-ease); z-index: 5; 
            transform: scale(0.97); border-radius: 12px; 
            margin: 10px 10px 5px 10px; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        
        #preview-section.fullscreen { 
            position: fixed; inset: 0; transform: scale(1); 
            border-radius: 0; margin: 0; z-index: 3000; 
        }
        
        #output-frame { width: 100%; height: 100%; border: none; pointer-events: none; }
        #preview-section.fullscreen #output-frame { pointer-events: auto; }

        /* プレビュー内の閉じるボタン(左上) */
        #close-preview-btn {
            position: absolute; top: 50px; left: 20px; 
            width: 44px; height: 44px; display: none;
            align-items: center; justify-content: center;
            font-size: 32px; font-weight: 100; color: #000;
            z-index: 3002; transition: 0.3s;
        }
        #preview-section.fullscreen #close-preview-btn { display: flex; }

        #zoom-btn { 
            position: absolute; bottom: 20px; right: 20px; 
            width: 44px; height: 44px; background: rgba(255,255,255,0.7); 
            backdrop-filter: blur(15px); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; z-index: 3001; 
        }

        /* 左下ボタン */
        #left-controls { position: fixed; bottom: 30px; left: 20px; display: flex; gap: 15px; z-index: 3500; }
        .icon-btn { 
            width: 55px; height: 55px; background: rgba(242, 242, 247, 0.85); 
            backdrop-filter: blur(20px); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
        }

        /* 保存バー (Liquid Glass) */
        #save-input-bar { 
            position: fixed; background: rgba(255,255,255,0.8); 
            backdrop-filter: blur(40px) saturate(1.5); 
            padding: 10px 15px; border-radius: 30px; 
            display: flex; visibility: hidden; opacity: 0; 
            transform: scale(0.6) translateY(20px); 
            transition: 0.5s var(--liquid); z-index: 3600; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            align-items: center; gap: 10px;
            border: 0.5px solid rgba(255,255,255,0.4);
        }
        #save-input-bar.active { visibility: visible; opacity: 1; transform: scale(1) translateY(0); }
        
        @media (max-width: 767px) { 
            #save-input-bar { bottom: 110px; left: 20px; right: 20px; justify-content: space-between; } 
        }
        @media (min-width: 768px) { 
            #save-input-bar { bottom: 30px; left: 160px; } 
        }

        .save-arrow-btn {
            width: 40px; height: 40px; background: #007aff; 
            color: #fff; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: 0.3s;
        }

        /* Dock (iOS-like movement) */
        #dock-wrapper { 
            position: fixed; bottom: 30px; right: 20px; 
            display: flex; align-items: center; 
            background: rgba(242, 242, 247, 0.85); 
            backdrop-filter: blur(25px); padding: 8px; 
            border-radius: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            z-index: 3400; transition: 0.5s var(--ios-ease);
        }
        #file-list { 
            display: flex; gap: 8px; width: 0; opacity: 0; 
            overflow: hidden; transition: 0.5s var(--ios-ease); 
        }
        .dock-item { 
            width: 50px; height: 50px; background: #fff; 
            border-radius: 13px; position: relative; flex-shrink: 0; 
            transition: 0.4s var(--ios-ease); overflow: hidden;
        }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; }

        /* スワイプ削除 */
        .del-trigger { 
            position: absolute; inset: 0; background: #ff3b30; 
            color: white; border-radius: 12px; display: flex; 
            align-items: center; justify-content: center; 
            transform: translateY(100%); transition: 0.3s var(--ios-ease); 
            font-size: 26px; font-weight: 100; z-index: 10; 
        }
        .swiped .del-trigger { transform: translateY(0); }

        /* Monaco */
        #monaco-container { 
            position: fixed; inset: 0; background: #1e1e1e; 
            z-index: 4000; display: none; transform: scale(0.9); 
            opacity: 0; transition: 0.5s var(--ios-ease); 
            flex-direction: column; 
        }
        #monaco-container.active { display: flex; transform: scale(1); opacity: 1; }

        /* メディアビューワー */
        #media-viewer { 
            position: fixed; inset: 0; backdrop-filter: blur(50px); 
            display: none; z-index: 9000; opacity: 0; transition: 0.4s; 
        }
        #media-viewer.active { display: flex; opacity: 1; }
        #viewer-box { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #main-image { max-width: 85%; max-height: 70%; border-radius: 10px; transition: transform 0.3s var(--ios-ease); }
        .v-ui { position: absolute; color: #000; font-weight: 100; }
        .v-close { top: 50px; right: 30px; font-size: 40px; }
        .v-dl { top: 50px; left: 30px; font-size: 40px; }
        .v-name { bottom: 60px; font-size: 18px; border-bottom: 1px solid #000; padding: 5px 15px; }

        input[type="text"] {
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body onclick="globalTap()">

    <div id="media-viewer" onclick="closeViewer()">
        <div id="viewer-box">
            <div class="v-ui v-close" onclick="closeViewer()">✕</div>
            <div class="v-ui v-dl" onclick="downloadImage(event)">↓</div>
            <img id="main-image" src="" onclick="event.stopPropagation()" ondblclick="zoomImage(event)">
            <div class="v-ui v-name" id="current-file-name" onclick="renameFile(event)">filename</div>
        </div>
    </div>

    <div id="preview-section">
        <div id="close-preview-btn" onclick="toggleFullscreen(event)">✕</div>
        <iframe id="output-frame"></iframe>
        <div id="zoom-btn" onclick="toggleFullscreen(event)">
            <div id="zoom-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div>
        </div>
    </div>

    <div id="editor-section" style="flex:0.8; display:flex; padding:5px 15px 15px 15px;">
        <textarea id="raw-editor" style="flex:1; border:none; border-radius:20px; padding:20px; outline:none; font-family:monospace; background:#fff;" oninput="sync('input')"></textarea>
    </div>

    <div id="left-controls">
        <div class="icon-btn" onclick="openSave(event)">💾</div>
        <div class="icon-btn" onclick="toggleUI('monaco-container', true)">📝</div>
    </div>

    <div id="save-input-bar" onclick="event.stopPropagation()">
        <input type="text" id="fn" value="index.html" style="flex:1; border:none; padding:12px; border-radius:18px; outline:none; font-size:16px; background:rgba(0,0,0,0.05);">
        <button class="save-arrow-btn" onclick="downloadHtml()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
    </div>

    <div id="dock-wrapper" onclick="event.stopPropagation()">
        <div id="file-list">
            <div class="dock-item" onclick="document.getElementById('file-input').click()" style="background:rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center; font-size:24px; color:#8e8e93;">＋</div>
            <div id="media-items" style="display:flex; gap:8px;"></div>
        </div>
        <div onclick="toggleDock(event)" id="folder-btn" style="font-size:28px; cursor:pointer; padding:0 5px;">📁</div>
    </div>

    <div id="monaco-container">
        <div style="height:60px; display:flex; justify-content:flex-end; padding:10px 20px; align-items:center;">
            <div style="color:#fff; font-size:35px; font-weight:100; cursor:pointer;" onclick="monacoClose()">✕</div>
        </div>
        <div id="monaco-body" style="flex:1"></div>
    </div>

    <input type="file" id="file-input" hidden onchange="handleFile(event)">

    <script type="module">
        import { haptic } from "https://esm.sh/ios-haptics";
        window.haptic = haptic;

        let editor, isSyncing = false, isDockOpen = false, currentMedia = { name: '', data: '' };
        let html = `<!DOCTYPE html><html><body style="background:#f0f0f2; height:100vh; display:flex; justify-content:center; align-items:center; margin:0; font-family:sans-serif;"><h1>System Online</h1></body></html>`;
        
        const raw = document.getElementById('raw-editor');
        const preview = document.getElementById('preview-section');
        const saveBar = document.getElementById('save-input-bar');

        // 標準ズーム/スクロールの完全無効化
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!e.target.closest('#monaco-body') && !e.target.closest('#raw-editor')) {
                e.preventDefault();
            }
        }, { passive: false });

        window.sync = (src) => {
            if(isSyncing) return; isSyncing = true;
            html = (src === 'input') ? raw.value : editor.getValue();
            raw.value = html;
            if(editor && src !== 'monaco') editor.setValue(html);
            const d = document.getElementById('output-frame').contentDocument;
            d.open(); d.write(html); d.close();
            isSyncing = false;
        };

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-body'), { 
                value: html, language: 'html', theme: 'vs-dark', 
                automaticLayout: true, fontSize: 16, minimap: { enabled: false },
                lineNumbersMinChars: 3
            });
            editor.onDidChangeModelContent(() => sync('monaco'));
            sync('monaco');
        });

        window.globalTap = () => {
            haptic();
            // 保存バーを閉じる
            if(saveBar.classList.contains('active')) {
                saveBar.classList.remove('active');
            }
            // ドックを閉じる
            if(isDockOpen) toggleDock();
            
            document.querySelectorAll('.dock-item').forEach(el => el.classList.remove('swiped'));
        };

        window.toggleUI = (id, show) => {
            haptic.confirm();
            const t = document.getElementById(id);
            if(show) { t.style.display = 'flex'; setTimeout(() => t.classList.add('active'), 20); }
            else { t.classList.remove('active'); setTimeout(() => t.style.display = 'none', 500); }
        };

        window.monacoClose = () => { haptic.error(); toggleUI('monaco-container', false); };
        
        window.openSave = (e) => { 
            e.stopPropagation(); 
            haptic.confirm(); 
            saveBar.classList.add('active'); 
        };

        window.toggleFullscreen = (e) => {
            if(e) e.stopPropagation(); haptic.confirm();
            const isFull = preview.classList.toggle('fullscreen');
            document.getElementById('zoom-icon').style.display = isFull ? 'none' : 'block';
        };

        window.toggleDock = (e) => {
            if(e) e.stopPropagation(); haptic.confirm();
            isDockOpen = !isDockOpen;
            const list = document.getElementById('file-list');
            list.style.width = isDockOpen ? '260px' : '0';
            list.style.opacity = isDockOpen ? '1' : '0';
            list.style.marginRight = isDockOpen ? '10px' : '0';
            document.getElementById('folder-btn').innerHTML = isDockOpen ? '📂' : '📁';
        };

        window.handleFile = (e) => {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const div = document.createElement('div');
                div.className = 'dock-item';
                div.innerHTML = `<img src="${ev.target.result}"><div class="del-trigger" onclick="deleteFile(event, this)">✕</div>`;
                
                let sX, sY;
                div.addEventListener('touchstart', (ts) => { sX = ts.touches[0].pageX; sY = ts.touches[0].pageY; ts.stopPropagation(); });
                div.addEventListener('touchend', (te) => {
                    const dX = te.changedTouches[0].pageX - sX;
                    const dY = sY - te.changedTouches[0].pageY;
                    if(dY > 30) { div.classList.add('swiped'); haptic.confirm(); }
                    else if(Math.abs(dX) > 20 || Math.abs(dY) > 20) { div.classList.remove('swiped'); haptic(); }
                    else { if(!div.classList.contains('swiped')) openViewer(f.name, ev.target.result); }
                });
                document.getElementById('media-items').appendChild(div);
                haptic.confirm();
            };
            r.readAsDataURL(f);
        };

        window.deleteFile = (e, el) => {
            e.stopPropagation(); haptic.error();
            const p = el.parentElement;
            p.style.transform = "scale(0)"; p.style.opacity = "0";
            setTimeout(() => p.remove(), 400);
        };

        function openViewer(name, data) {
            haptic.confirm(); currentMedia = { name, data };
            document.getElementById('main-image').src = data;
            document.getElementById('current-file-name').innerText = name;
            const v = document.getElementById('media-viewer'); v.style.display = 'flex';
            setTimeout(() => v.classList.add('active'), 20);
        }

        window.closeViewer = () => { haptic(); document.getElementById('media-viewer').classList.remove('active'); setTimeout(() => document.getElementById('media-viewer').style.display = 'none', 400); };
        window.downloadImage = (e) => { e.stopPropagation(); haptic.confirm(); const a = document.createElement('a'); a.href = currentMedia.data; a.download = currentMedia.name; a.click(); };
        window.renameFile = (e) => { e.stopPropagation(); const n = prompt("名前変更", currentMedia.name.split('.')[0]); if(n) { currentMedia.name = n + "." + currentMedia.name.split('.').pop(); document.getElementById('current-file-name').innerText = currentMedia.name; } };
        
        let imgZoom = false; 
        window.zoomImage = (e) => { 
            haptic.confirm(); 
            imgZoom = !imgZoom; 
            document.getElementById('main-image').style.transform = imgZoom ? 'scale(2.2)' : 'scale(1)'; 
        };

        let initDist = 0;
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (initDist === 0) { initDist = d; return; }
                let r = d / initDist;
                // ピンチアウトで拡大
                if (e.target.closest('#preview-section') && !preview.classList.contains('fullscreen') && r > 1.3) { toggleFullscreen(); initDist = d; }
                // ピンチインで縮小（閉じる）
                if (preview.classList.contains('fullscreen') && r < 0.7) { toggleFullscreen(); initDist = d; }
                
                if (e.target.closest('#editor-section') && r > 1.4) toggleUI('monaco-container', true);
                if (e.target.closest('#monaco-container') && r < 0.7) monacoClose();
            }
        }, { passive: false });
        window.addEventListener('touchend', () => initDist = 0);

        window.downloadHtml = () => { 
            haptic.confirm(); 
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(new Blob([html], {type:'text/html'})); 
            a.download = document.getElementById('fn').value; 
            a.click(); 
            saveBar.classList.remove('active'); 
        };
        
        // 最後の防衛線: Gesture無効化
        document.addEventListener('gesturestart', (e) => e.preventDefault());
    </script>
</body>
</html>
