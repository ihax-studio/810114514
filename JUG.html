<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Ultimate Debug Pro - Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root { --ios-ease: cubic-bezier(0.23, 1, 0.32, 1); }
        * { touch-action: none; -webkit-user-select: none; box-sizing: border-box; font-family: -apple-system, "SF Pro Display", sans-serif; font-weight: 1 !important; }
        
        body, html { 
            margin: 0; padding: 0; height: 100dvh; width: 100vw; 
            background: #f2f2f7; overflow: hidden; display: flex; flex-direction: column;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .container-box { width: calc(100% - 20px); margin: 8px auto; border-radius: 18px; overflow: hidden; position: relative; transition: 0.5s var(--ios-ease); }
        #preview-section { flex: 1.2; z-index: 10; }
        #preview-section.fullscreen { position: fixed; inset: 0; margin: 0; width: 100%; height: 100%; border-radius: 0; z-index: 8000; }
        #output-frame { width: 100%; height: 100%; border: none; background: #fff; pointer-events: auto; }
        
        #editor-section { flex: 0.8; display: flex; margin-bottom: 85px; }
        #raw-editor { flex: 1; border: none; padding: 15px; outline: none; font-family: "SF Mono", monospace; background: transparent; -webkit-user-select: text; font-size: 13px; resize: none; touch-action: pan-y; }

        #save-input-bar { 
            position: fixed; bottom: 25px; left: 15px; width: min(300px, 70vw); height: 50px; 
            border-radius: 25px; z-index: 9999; display: flex; align-items: center; padding: 0 15px; 
            opacity: 0; pointer-events: none; transform: translateY(20px) scale(0.9); transition: 0.4s var(--ios-ease); 
        }
        #save-input-bar.active { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        #dock-area { position: fixed; bottom: 25px; right: 15px; display: flex; align-items: center; z-index: 4000; }
        #dock-wrapper { display: flex; align-items: center; padding: 6px; border-radius: 30px; }
        #file-list { display: flex; gap: 10px; width: 0; opacity: 0; overflow: hidden; transition: 0.4s var(--ios-ease); }
        #file-list.open { width: auto; opacity: 1; margin-right: 10px; padding: 5px; }
        
        #folder-btn-container { width: 40px; height: 30px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .folder-icon { position: absolute; transition: 0.5s var(--ios-ease); font-size: 24px; }
        .folder-icon.hide { transform: translateY(-40px); opacity: 0; }
        .folder-icon.show { transform: translateY(0); opacity: 1; }
        .folder-icon.wait { transform: translateY(40px); opacity: 0; }

        #error-log-overlay { 
            position: fixed; bottom: 85px; right: 20px; width: 260px; border-radius: 18px; display: none; padding: 15px; z-index: 4001; 
            transform-origin: bottom right; animation: slideUpConsole 0.4s var(--ios-ease) forwards;
        }
        @keyframes slideUpConsole { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        #line-indicator { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.6); 
            font-size: 100px; font-weight: 200; color: #007aff; pointer-events: none; opacity: 0; z-index: 10000; 
            transition: opacity 0.5s ease, transform 0.5s var(--ios-ease); 
        }
        #line-indicator.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        #media-overlay { 
            position: fixed; inset: 0; backdrop-filter: blur(40px); background: rgba(255,255,255,0.1); 
            z-index: 9000; display: none; align-items: center; justify-content: center; 
            opacity: 0; transition: transform 0.5s var(--ios-ease), opacity 0.5s ease; 
        }
        #media-overlay.active { display: flex; opacity: 1; transform: translateY(0); }
        #media-overlay.closing { transform: translateY(100%); opacity: 0; }

        #expanded-media { width: auto; height: auto; max-width: 85vw; max-height: 65vh; object-fit: contain; border-radius: 14px; box-shadow: 0 30px 60px rgba(0,0,0,0.2); background: #fff; transition: transform 0.4s var(--ios-ease); }
        #expanded-media.zoomed { transform: scale(2.2); }

        .circle-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
        
        #monaco-container { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9500; display: none; opacity: 0; transform: scale(1.02); transition: 0.4s var(--ios-ease); flex-direction: column; }
        #monaco-container.active { display: flex; opacity: 1; transform: scale(1); }
    </style>
</head>
<body onclick="globalTap()">

    <div id="line-indicator"></div>
    <div id="error-log-overlay" class="glass-panel"></div>

    <div id="preview-section" class="container-box glass-panel">
        <div id="expand-toggle-btn" class="glass-panel circle-btn" style="position:absolute; bottom:15px; right:15px; width:44px; height:44px; z-index:8010;" onclick="toggleFullscreen(event)">→</div>
        <iframe id="output-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
    </div>

    <div id="editor-section" class="container-box glass-panel">
        <textarea id="raw-editor" oninput="sync('input')" placeholder="Pinch out to expand..."></textarea>
    </div>

    <div style="position:fixed; bottom:25px; left:15px; display:flex; gap:12px; z-index:4000;">
        <div id="save-btn" class="glass-panel circle-btn">💾</div>
        <div class="glass-panel circle-btn" onclick="toggleUI('monaco-container', true)">📝</div>
    </div>

    <div id="save-input-bar" class="glass-panel" onclick="event.stopPropagation()">
        <input type="text" id="fn" value="index.html" style="border:none; outline:none; flex:1; background:transparent; font-size:16px;">
        <div style="font-size:26px; color:#007aff;" onclick="downloadHtml(event)">→</div>
    </div>

    <div id="dock-area">
        <div id="dock-wrapper" class="glass-panel" onclick="event.stopPropagation()">
            <div id="file-list">
                <div class="dock-item" onclick="document.getElementById('file-input').click()" style="width:50px;height:50px;background:rgba(255,255,255,0.4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;">＋</div>
                <div id="media-items" style="display:flex; gap:10px;"></div>
            </div>
            <div onclick="toggleDock(event)" id="folder-btn-container">
                <span id="icon-close" class="folder-icon show">📁</span>
                <span id="icon-open" class="folder-icon wait">📂</span>
            </div>
            <div id="console-status" onclick="handleConsoleClick(event)">
                <img src="NFC_Error@2x.png" id="error-icon" alt="Error" style="width:18px; display:none;">
                <span id="console-text">Source</span>
            </div>
        </div>
    </div>

    <div id="media-overlay" onclick="closeMedia()">
        <div style="position:absolute; top:60px; left:30px; font-size:32px; z-index:9010;" onclick="closeMedia(event)">←</div>
        <img id="expanded-media">
        <textarea id="expanded-text" class="glass-panel" onclick="event.stopPropagation()" style="width:90%; height:70%; border-radius:18px; display:none; padding:20px; outline:none; border:none; font-family:monospace;"></textarea>
        <div style="position:absolute; bottom:60px; left:50%; transform:translateX(-50%); display:flex; gap:15px; align-items:center;">
            <div class="glass-panel circle-btn" onclick="deleteCurrentMedia(event)">✕</div>
            <div id="media-filename" class="glass-panel" onclick="renameMedia(event)" style="padding:12px 24px; border-radius:25px; font-weight:500;"></div>
        </div>
    </div>

    <div id="monaco-container">
        <div id="monaco-body" style="flex:1;"></div>
        <div class="glass-panel circle-btn" style="position:absolute; bottom:35px; left:25px;" onclick="toggleUI('monaco-container', false)">←</div>
    </div>

    <input type="file" id="file-input" hidden onchange="handleFile(event)">
    <button id="hapticConfirm" style="display:none;"></button>
    <button id="hapticError" style="display:none;"></button>

    <script type="module">
        import { haptic } from "https://esm.sh/ios-haptics";
        window.haptic = haptic;
        document.getElementById("hapticConfirm").onclick = haptic.confirm;
        document.getElementById("hapticError").onclick = () => {
            const d = 220; [0,1,2,4,5,6].forEach(i => setTimeout(() => haptic.error(), i*d));
        };

        let editor, isSyncing = false, isDockOpen = false, currentTargetItem = null, runtimeErrors = [];
        let isSourceMode = false, lastTap = 0, saveTimer, longPressActive = false;
        const raw = document.getElementById('raw-editor');
        const saveBar = document.getElementById('save-input-bar');
        const saveBtn = document.getElementById('save-btn');

        const handleSaveStart = (e) => {
            e.stopPropagation(); longPressActive = false;
            saveBtn.style.transform = 'scale(1.2)';
            saveTimer = setTimeout(() => {
                longPressActive = true; haptic.error();
                if(confirm("全て削除しますか？")) {
                    raw.value = ""; if(editor) editor.setValue(""); sync('input');
                    document.getElementById('media-items').innerHTML = "";
                }
                saveBtn.style.transform = 'scale(1)';
            }, 500);
        };
        const handleSaveEnd = (e) => {
            clearTimeout(saveTimer); saveBtn.style.transform = 'scale(1)';
            if(!longPressActive && (e.type === 'touchend' || e.type === 'mouseup')) {
                saveBar.classList.add('active'); haptic.confirm();
            }
        };
        saveBtn.addEventListener('touchstart', handleSaveStart); saveBtn.addEventListener('touchend', handleSaveEnd);
        saveBtn.addEventListener('mousedown', handleSaveStart); saveBtn.addEventListener('mouseup', handleSaveEnd);

        window.sync = (src) => {
            if(isSyncing) return; isSyncing = true;
            const val = (src === 'input') ? raw.value : editor.getValue();
            raw.value = val; if(editor && src !== 'monaco') editor.setValue(val);
            runtimeErrors = [];
            const script = `<script>
                window.onerror=(m,u,l)=>window.parent.postMessage({t:'e',m:m+'(L'+l+')'},'*');
                document.addEventListener('click', e => window.parent.postMessage({t:'click',tag:e.target.tagName.toLowerCase(),id:e.target.id,cls:e.target.className}, '*'), true);
            <\/script>`;
            document.getElementById('output-frame').srcdoc = script + val;
            isSyncing = false; setTimeout(updateConsoleUI, 500);
        };

        window.addEventListener('message', e => {
            if(e.data.t === 'e') { runtimeErrors.push(e.data.m); updateConsoleUI(); }
            if(e.data.t === 'click' && isSourceMode) jumpToCode(e.data);
        });

        function jumpToCode(data) {
            if(!editor) return;
            let s = data.id ? "#"+data.id : (data.cls ? "."+data.cls.split(' ')[0] : data.tag);
            const m = editor.getModel().findMatches(s, false, false, false, null, true);
            if(m.length > 0) {
                const l = m[0].range.startLineNumber;
                editor.revealLineInCenter(l); editor.setPosition({lineNumber: l, column: 1});
                toggleUI('monaco-container', true);
                const ind = document.getElementById('line-indicator');
                ind.innerText = l; ind.classList.add('active');
                setTimeout(() => ind.classList.remove('active'), 1200);
                haptic.confirm();
            }
        }

        window.handleConsoleClick = (e) => {
            e.stopPropagation();
            const total = getErrorCount();
            if (total > 0) {
                haptic.confirm();
                const log = document.getElementById('error-log-overlay');
                log.style.display = log.style.display === 'block' ? 'none' : 'block';
            } else {
                isSourceMode = !isSourceMode; updateConsoleUI();
                if (isSourceMode) document.getElementById("hapticError").click(); else haptic();
            }
        };
        function getErrorCount() { return (editor ? monaco.editor.getModelMarkers({ owner: 'html' }).length : 0) + runtimeErrors.length; }
        function updateConsoleUI() {
            const total = getErrorCount();
            const text = document.getElementById('console-text');
            const icon = document.getElementById('error-icon');
            if (total > 0) { icon.style.display = 'block'; text.innerText = `Console (${total})`; text.style.color = '#ff3b30'; }
            else { icon.style.display = 'none'; text.innerText = 'Source'; text.style.color = isSourceMode ? '#007aff' : '#333'; }
        }

        window.toggleDock = (e) => {
            e.stopPropagation(); isDockOpen = !isDockOpen;
            document.getElementById('file-list').classList.toggle('open', isDockOpen);
            document.getElementById('icon-close').className = isDockOpen ? 'folder-icon hide' : 'folder-icon show';
            document.getElementById('icon-open').className = isDockOpen ? 'folder-icon show' : 'folder-icon wait';
            haptic();
        };

        window.handleFile = (e) => {
            const f = e.target.files[0]; if(!f) return;
            
            // --- Restored & Added: File Validation ---
            const isImage = f.type.startsWith('image/');
            const isText = f.type.startsWith('text/') || /\.(js|css|json|jsx|html)$/i.test(f.name);
            
            if (!isImage && !isText) {
                alert("非対応のファイル形式です。");
                haptic.error();
                e.target.value = '';
                return;
            }

            const r = new FileReader();
            r.onload = (ev) => {
                const div = document.createElement('div');
                div.style = "width:50px; height:50px; background:rgba(255,255,255,0.4); border-radius:12px; overflow:hidden; flex-shrink:0; position:relative;";
                const type = isImage ? 'image' : 'text';
                const el = isImage ? document.createElement('img') : document.createElement('div');
                if(isImage) el.src = ev.target.result; else el.innerText = '📄';
                el.dataset.name = f.name; el.dataset.type = type; el.dataset.content = isText ? ev.target.result : "";
                el.style = "width:100%; height:100%; object-fit:cover; display:flex; align-items:center; justify-content:center; font-size:24px;";
                div.onclick = () => openMedia(el, div);
                div.appendChild(el); document.getElementById('media-items').appendChild(div);
            };
            if(isImage) r.readAsDataURL(f); else r.readAsText(f);
        };

        window.openMedia = (el, div) => {
            currentTargetItem = { el, div };
            haptic();
            const o = document.getElementById('media-overlay');
            const img = document.getElementById('expanded-media');
            const txt = document.getElementById('expanded-text');
            document.getElementById('media-filename').innerText = el.dataset.name;
            if(el.dataset.type === 'image') { 
                img.src = el.src; img.style.display='block'; txt.style.display='none'; 
                img.onclick = (e) => { e.stopPropagation(); const now = Date.now(); if(now-lastTap<300){ img.classList.toggle('zoomed'); haptic(); } lastTap=now; };
            } else { txt.value = el.dataset.content; img.style.display='none'; txt.style.display='block'; }
            o.style.display='flex'; setTimeout(() => o.classList.add('active'), 10);
        };

        window.closeMedia = () => {
            const o = document.getElementById('media-overlay');
            o.classList.add('closing'); haptic();
            setTimeout(() => { o.style.display='none'; o.classList.remove('active','closing'); }, 500);
        };

        window.deleteCurrentMedia = (e) => { e.stopPropagation(); if(confirm("Delete?")) { currentTargetItem.div.remove(); closeMedia(); } };
        window.renameMedia = (e) => { e.stopPropagation(); const n=prompt("Rename:", currentTargetItem.el.dataset.name); if(n){ currentTargetItem.el.dataset.name=n; document.getElementById('media-filename').innerText=n; } };

        let startDist = 0;
        raw.addEventListener('touchstart', e => { if(e.touches.length === 2) startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); });
        raw.addEventListener('touchmove', e => {
            if(e.touches.length === 2 && startDist > 0) {
                let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if(d > startDist + 80) { toggleUI('monaco-container', true); startDist = 0; }
            }
        });

        window.toggleFullscreen = (e) => {
            e.stopPropagation(); const ps = document.getElementById('preview-section');
            ps.classList.toggle('fullscreen');
            document.getElementById('expand-toggle-btn').innerText = ps.classList.contains('fullscreen') ? '←' : '→';
            haptic.confirm(); sync('input');
        };

        window.toggleUI = (id, show) => {
            const t = document.getElementById(id);
            if(show){ haptic.error(); t.style.display='flex'; setTimeout(()=>t.classList.add('active'),10); }
            else { haptic(); t.classList.remove('active'); setTimeout(()=>t.style.display='none',400); }
        };

        window.globalTap = () => { saveBar.classList.remove('active'); document.getElementById('error-log-overlay').style.display='none'; };
        window.downloadHtml = (e) => { e.stopPropagation(); const b=new Blob([raw.value],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=document.getElementById('fn').value||'index.html'; a.click(); haptic.error(); };

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-body'), { value: raw.value, language: 'html', theme: 'vs', automaticLayout: true, fontSize: 16, minimap: { enabled: false }});
            editor.onDidChangeModelContent(() => sync('monaco'));
        });
    </script>
</body>
</html>
