<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Media Live Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f0f2;
            --accent-color: #007aff;
            --bar-bg: rgba(242, 242, 247, 0.85);
            --shadow: 0 15px 50px rgba(0,0,0,0.12);
            --ios-ease: cubic-bezier(0.2, 1, 0.3, 1);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* プレビュー・エディタ配置 */
        #preview-section { 
            flex: 1; background: #fff; position: relative; 
            transition: all 0.6s var(--ios-ease); 
            z-index: 5; transform: scale(0.97); border-radius: 20px; margin: 10px 10px 5px 10px;
            box-shadow: var(--shadow); overflow: hidden;
        }
        #preview-section.fullscreen { position: fixed; inset: 0; z-index: 3000; transform: scale(1); border-radius: 0; margin: 0; }
        #output-frame { width: 100%; height: 100%; border: none; }

        #editor-section { flex: 0.8; display: flex; padding: 5px 15px 15px 15px; transition: all 0.6s var(--ios-ease); z-index: 10; }
        #raw-editor { 
            flex: 1; border: none; padding: 20px; font-family: 'SF Mono', monospace; font-size: 14px; 
            outline: none; background: #fff; border-radius: 20px; resize: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); font-weight: 300;
        }

        /* 1行スリムDock (並び替え対応) */
        #dock-container {
            position: fixed; bottom: 85px; left: 50%;
            transform: translateX(-50%);
            background: var(--bar-bg); backdrop-filter: blur(30px) saturate(180%);
            padding: 10px; border-radius: 26px; display: flex; align-items: center;
            box-shadow: var(--shadow); z-index: 3400; transition: all 0.5s var(--ios-ease);
            max-width: 90vw;
        }

        #file-list { display: flex; gap: 8px; align-items: center; }

        .dock-item {
            min-width: 56px; height: 56px; background: #fff; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; cursor: pointer; transition: transform 0.3s var(--ios-ease), opacity 0.3s; 
            overflow: hidden; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .dock-item.dragging { opacity: 0.4; transform: scale(0.8); }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .dock-item .file-ext { position: absolute; bottom: 2px; font-size: 8px; background: rgba(255,255,255,0.7); width: 100%; text-align: center; }

        /* ゴミ箱 */
        #trash-bin {
            min-width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; transition: 0.3s; border-radius: 14px; margin-left: 10px; background: rgba(0,0,0,0.03);
        }
        #trash-bin.drag-over { background: rgba(255,59,48,0.2); transform: scale(1.2); }

        /* フローティングナビ */
        .floating-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 3500; background: var(--bar-bg); padding: 8px 16px;
            border-radius: 40px; display: flex; align-items: center; box-shadow: var(--shadow);
            backdrop-filter: blur(25px); transition: all 0.5s var(--ios-ease);
        }
        .btn-ui { border: none; background: #000; color: white; padding: 10px 22px; border-radius: 30px; cursor: pointer; font-size: 14px; margin: 0 4px; }

        /* UIコンポーネント */
        #image-viewer {
            position: fixed; inset: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(30px);
            display: none; align-items: center; justify-content: center; z-index: 5000; opacity: 0; transition: 0.5s var(--ios-ease);
        }
        #image-viewer.active { display: flex; opacity: 1; }
        #image-viewer img, #image-viewer video { max-width: 85%; max-height: 80%; border-radius: 15px; transform: scale(0.8); transition: 0.5s var(--ios-ease); box-shadow: var(--shadow); }
        #image-viewer.active img, #image-viewer.active video { transform: scale(1); }

        #error-alert {
            position: fixed; inset: 0; background: rgba(0,0,0,0.1); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 6000;
        }
        .alert-box { background: #fff; padding: 25px; border-radius: 22px; width: 260px; text-align: center; box-shadow: var(--shadow); transform: scale(0.9); transition: 0.4s var(--ios-ease); }
        #error-alert.active { display: flex; }
        #error-alert.active .alert-box { transform: scale(1); }
        
        #toast { position: fixed; top: 8%; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 10px 25px; border-radius: 30px; font-size: 14px; opacity: 0; transition: 0.4s; box-shadow: var(--shadow); z-index: 9999; }
    </style>
</head>
<body ondragover="event.preventDefault()">

    <div id="toast">Message</div>

    <div id="error-alert">
        <div class="alert-box">
            <div style="font-weight:600; font-size:17px; margin-bottom:10px;">ファイルエラー</div>
            <div style="font-size:13px; color:#666; margin-bottom:20px;">このファイルは使用できません。<br>画像・音声・動画のみ追加可能です。</div>
            <div style="color:var(--accent-color); font-weight:600; cursor:pointer; border-top:0.5px solid #eee; padding-top:15px;" onclick="closeAlert()">了解</div>
        </div>
    </div>

    <div id="image-viewer" onclick="closeViewer()">
        <div id="viewer-content" onclick="event.stopPropagation()"></div>
    </div>

    <div id="preview-section">
        <iframe id="output-frame"></iframe>
    </div>

    <div id="editor-section">
        <textarea id="raw-editor" spellcheck="false" placeholder="Edit index.html here..."></textarea>
    </div>

    <div id="dock-container">
        <div class="dock-item" onclick="triggerFileInput()" style="background: #eee;"><span>＋</span></div>
        <div id="file-list"></div>
        <div id="trash-bin" ondragover="this.classList.add('drag-over'); event.preventDefault();" ondragleave="this.classList.remove('drag-over')" ondrop="handleTrashDrop(event)">🗑️</div>
    </div>

    <div id="main-nav" class="floating-bar">
        <button class="btn-ui" onclick="downloadCurrent()">Download HTML</button>
    </div>

    <input type="file" id="file-input" hidden onchange="handleFileSelect(event)" accept="image/*,video/*,audio/*">

    <script>
        const haptic = (err = false) => { if(navigator.vibrate) navigator.vibrate(err ? [10, 30, 10] : 15); };
        
        let files = { 'index.html': `<!DOCTYPE html>\n<html>\n<body style="display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f0f0f2;font-family:sans-serif;">\n<h1>Media Gallery</h1>\n</body>\n</html>` };
        let fileOrder = []; // メディアファイルの表示順序
        let currentFile = 'index.html';
        let draggedItemName = null;

        const rawTextArea = document.getElementById('raw-editor');
        const frame = document.getElementById('output-frame');

        // 初期表示
        window.onload = () => {
            rawTextArea.value = files['index.html'];
            updatePreview(files['index.html']);
            renderDock();
        };

        function updatePreview(code) {
            const d = frame.contentDocument;
            d.open(); d.write(code); d.close();
        }

        rawTextArea.oninput = () => {
            files['index.html'] = rawTextArea.value;
            updatePreview(rawTextArea.value);
        };

        // --- ファイルバリデーション ---
        function processFile(f) {
            if(!f) return;
            const name = f.name.toLowerCase();
            const isImg = /\.(jpg|jpeg|png|gif|svg|webp)$/i.test(name);
            const isAudio = /\.(mp3|wav|aiff)$/i.test(name);
            const isVideo = /\.(mp4|mov)$/i.test(name);

            // HTMLやその他のファイルは拒否
            if(!isImg && !isAudio && !isVideo) return showAlert();

            const r = new FileReader();
            r.onload = (e) => {
                files[f.name] = e.target.result;
                // 新しいファイルを最前列（配列の最初）に追加
                if(!fileOrder.includes(f.name)) {
                    fileOrder.unshift(f.name);
                }
                renderDock();
                haptic();
                showToast("Added to Dock: " + f.name);
            };
            r.onerror = () => showAlert();
            r.readAsDataURL(f);
        }

        // --- Dockレンダリング & ドラッグ＆ドロップ ---
        function renderDock() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            fileOrder.forEach((name) => {
                const div = document.createElement('div');
                div.className = 'dock-item';
                div.draggable = true;
                div.dataset.name = name;

                const isImg = /\.(jpg|jpeg|png|gif|svg|webp)$/i.test(name);
                const isVideo = /\.(mp4|mov)$/i.test(name);
                const isAudio = /\.(mp3|wav|aiff)$/i.test(name);

                if(isImg) {
                    div.innerHTML = `<img src="${files[name]}">`;
                } else if(isVideo) {
                    div.innerHTML = `<span>🎬</span><div class="file-ext">VIDEO</div>`;
                } else {
                    div.innerHTML = `<span>🎵</span><div class="file-ext">AUDIO</div>`;
                }

                div.onclick = () => openMedia(name);

                // 並び替えロジック
                div.ondragstart = (e) => {
                    draggedItemName = name;
                    div.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', name);
                    haptic();
                };
                div.ondragend = () => div.classList.remove('dragging');
                
                div.ondragover = (e) => {
                    e.preventDefault();
                    const targetName = div.dataset.name;
                    if(targetName !== draggedItemName) {
                        const fromIdx = fileOrder.indexOf(draggedItemName);
                        const toIdx = fileOrder.indexOf(targetName);
                        fileOrder.splice(fromIdx, 1);
                        fileOrder.splice(toIdx, 0, draggedItemName);
                        renderDock();
                    }
                };

                list.appendChild(div);
            });
        }

        // --- メディア表示 (Scale Up) ---
        function openMedia(name) {
            const viewer = document.getElementById('image-viewer');
            const content = document.getElementById('viewer-content');
            content.innerHTML = '';

            const isImg = /\.(jpg|jpeg|png|gif|svg|webp)$/i.test(name);
            const isVideo = /\.(mp4|mov)$/i.test(name);

            if(isImg) {
                const img = document.createElement('img');
                img.src = files[name];
                content.appendChild(img);
            } else if(isVideo) {
                const vid = document.createElement('video');
                vid.src = files[name];
                vid.controls = true;
                vid.autoplay = true;
                content.appendChild(vid);
            } else {
                const aud = document.createElement('audio');
                aud.src = files[name];
                aud.controls = true;
                aud.autoplay = true;
                content.innerHTML = `<div style="background:white; padding:40px; border-radius:20px; text-align:center;">
                    <div style="font-size:50px; margin-bottom:20px;">🎵</div>
                    <div style="font-size:14px; color:#666;">${name}</div><br>
                </div>`;
                content.firstChild.appendChild(aud);
            }

            viewer.style.display = 'flex';
            setTimeout(() => viewer.classList.add('active'), 10);
            haptic();
        }

        function closeViewer() {
            const v = document.getElementById('image-viewer');
            v.classList.remove('active');
            setTimeout(() => {
                v.style.display = 'none';
                document.getElementById('viewer-content').innerHTML = '';
            }, 500);
        }

        // --- 削除ロジック ---
        function handleTrashDrop(e) {
            e.preventDefault();
            document.getElementById('trash-bin').classList.remove('drag-over');
            const name = e.dataTransfer.getData('text/plain');
            
            fileOrder = fileOrder.filter(n => n !== name);
            delete files[name];
            renderDock();
            haptic(true);
            showToast("Removed media");
        }

        // --- 各種UI操作 ---
        function triggerFileInput() { document.getElementById('file-input').click(); }
        function handleFileSelect(e) { processFile(e.target.files[0]); }
        function showAlert() { document.getElementById('error-alert').style.display='flex'; setTimeout(()=>document.getElementById('error-alert').classList.add('active'),10); haptic(true); }
        function closeAlert() { document.getElementById('error-alert').classList.remove('active'); setTimeout(()=>document.getElementById('error-alert').style.display='none',500); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText=m; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2000); }
        function downloadCurrent() {
            const blob = new Blob([files['index.html']], {type:'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "index.html";
            a.click();
        }
    </script>
</body>
</html>
