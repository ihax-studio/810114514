<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚗️ 酸化還元マスター</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111f;--s0:rgba(255,255,255,.03);--s1:rgba(255,255,255,.07);--b:rgba(255,255,255,.09);--b2:rgba(255,255,255,.16);--red:#ff4d6d;--blue:#38bdf8;--green:#4ade80;--amber:#fbbf24;--purple:#a78bfa;--cyan:#22d3ee;--text:#f0f4ff;--dim:rgba(240,244,255,.55);--dim2:rgba(240,244,255,.32);--r:18px;--r2:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overscroll-behavior:none;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 55% 40% at 10% 10%,rgba(56,189,248,.08),transparent),radial-gradient(ellipse 50% 45% at 90% 90%,rgba(255,77,109,.06),transparent);}
#ld{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s;}
#ld.out{opacity:0;pointer-events:none;}
#sdld{position:fixed;inset:0;z-index:998;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#sdld.on{display:flex;}
.mac-svg{width:110px;height:110px;filter:drop-shadow(0 0 16px rgba(56,189,248,.3));}
.ld-txt{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);letter-spacing:.08em;animation:pulse 1.4s infinite;}
.ld-bar{width:160px;height:3px;background:var(--s1);border-radius:2px;overflow:hidden;}
.ld-fill{width:0%;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:2px;transition:width .25s;}
.hdr{position:sticky;top:0;z-index:50;background:rgba(7,17,31,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--b);padding:14px 18px 0;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.logo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;background:linear-gradient(110deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.pill{background:var(--s1);border:1px solid var(--b2);border-radius:50px;padding:3px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 13px;font-size:12px;font-weight:500;color:var(--dim);cursor:pointer;border:none;background:transparent;border-radius:10px 10px 0 0;transition:color .15s,background .15s;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;-webkit-appearance:none;}
.tab.on{color:var(--text);background:var(--s1);}
.main{position:relative;z-index:1;padding:18px 15px 60px;max-width:600px;margin:0 auto;}
.pgb{height:3px;background:var(--s1);border-radius:2px;margin-bottom:14px;overflow:hidden;}
.pgf{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .35s;}
.cnt{text-align:center;font-size:11px;color:var(--dim2);margin-bottom:11px;font-family:'JetBrains Mono',monospace;}
.flip-s{perspective:900px;height:200px;margin-bottom:14px;cursor:pointer;}
.flip-c{width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);position:relative;}
.flip-c.flipped{transform:rotateY(180deg);}
.flip-f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border:1px solid var(--b2);gap:9px;}
.ff{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(74,222,128,.07));}
.fb{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(167,139,250,.07));transform:rotateY(180deg);}
.fhnt{font-size:10px;color:var(--dim2);position:absolute;bottom:10px;right:12px;}
.bdg{font-size:10px;font-weight:700;padding:3px 10px;border-radius:50px;letter-spacing:.04em;}
.bdg.ox{background:rgba(255,77,109,.18);color:var(--red);border:1px solid rgba(255,77,109,.28);}
.bdg.re{background:rgba(56,189,248,.18);color:var(--blue);border:1px solid rgba(56,189,248,.28);}
.fq{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;text-align:center;line-height:1.4;}
.fqs{font-size:12px;color:var(--dim);text-align:center;}
.fa{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;text-align:center;color:var(--amber);line-height:1.4;}
.fhi{font-size:11px;color:var(--dim);text-align:center;line-height:1.6;}
.nbts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.sb{background:var(--s0);border:1px solid var(--b);border-radius:var(--r2);padding:11px 6px;text-align:center;}
.sn{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
.sl{font-size:10px;color:var(--dim);margin-top:2px;}
.btn{padding:13px;border-radius:14px;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:transform .1s;text-align:center;-webkit-appearance:none;display:block;}
.btn:active{transform:scale(.96);}
.bg{background:var(--s1);border:1px solid var(--b2);color:var(--text);}
.bb{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#000;}
.bw{width:100%;}
.qcard{background:var(--s0);border:1px solid var(--b2);border-radius:var(--r);padding:20px 18px;margin-bottom:14px;}
.qprog{font-size:11px;color:var(--dim2);margin-bottom:11px;font-family:'JetBrains Mono',monospace;}
.qq{font-size:14px;line-height:1.8;margin-bottom:10px;}
.chs{display:flex;flex-direction:column;gap:8px;}
.ch{padding:13px 15px;background:var(--s1);border:1px solid var(--b2);border-radius:13px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;transition:all .12s;text-align:left;color:var(--text);-webkit-appearance:none;display:block;width:100%;}
.ch:active{transform:scale(.98);}
.ch.ok{background:rgba(74,222,128,.15);border-color:var(--green);color:var(--green);}
.ch.ng{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.4);color:rgba(255,110,130,.9);}
.ch.dis{pointer-events:none;}
.exp{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);border-radius:13px;padding:13px 15px;margin-top:11px;font-size:13px;line-height:1.75;color:var(--amber);display:none;}
.exp.on{display:block;}
.hcat{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);margin:18px 0 9px;padding-left:3px;}
.hrow{background:var(--s0);border:1px solid var(--b);border-radius:13px;padding:13px 44px 13px 15px;margin-bottom:8px;position:relative;}
.hrow.hox{border-left:3px solid var(--red);}
.hrow.hre{border-left:3px solid var(--blue);}
.hrow.mkd{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.28);}
.heq{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;overflow-x:auto;white-space:nowrap;}
.hcnd{font-size:10px;color:var(--dim2);margin-top:3px;}
.mkb{position:absolute;top:50%;right:11px;transform:translateY(-50%);width:28px;height:28px;background:transparent;border:none;cursor:pointer;font-size:17px;opacity:.35;transition:all .2s;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;}
.mkb.mkd{opacity:1;}
.sec-t{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--dim2);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-t::after{content:'';flex:1;height:1px;background:var(--b);}
.card{background:var(--s0);border:1px solid var(--b);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;}
.scard{background:var(--s0);border:1px solid var(--b);border-radius:var(--r);overflow:hidden;margin-bottom:9px;}
.shdr{display:flex;align-items:center;gap:11px;padding:15px 17px;cursor:pointer;}
.snum2{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0;}
.sttl{font-size:14px;font-weight:700;flex:1;line-height:1.4;}
.sarr{color:var(--dim);font-size:11px;transition:transform .2s;}
.scard.open .sarr{transform:rotate(90deg);}
.sbdy{padding:0 17px;max-height:0;overflow:hidden;transition:max-height .32s ease,padding .28s;}
.scard.open .sbdy{max-height:1200px;padding-bottom:17px;}
.sdesc{font-size:13px;line-height:1.85;color:var(--dim);margin-bottom:10px;}
.seq{font-family:'JetBrains Mono',monospace;font-size:12px;background:rgba(255,255,255,.04);border:1px solid var(--b);border-radius:9px;padding:10px 12px;overflow-x:auto;white-space:nowrap;margin:6px 0;line-height:1.8;}
.selbl{font-size:10px;color:var(--dim2);margin-bottom:3px;margin-top:10px;}
.tip{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);border-radius:11px;padding:11px 13px;margin-top:9px;font-size:12px;color:#c4b5fd;line-height:1.75;}
.acard{background:var(--s0);border:1px solid var(--b2);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.ahdr{padding:15px 17px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;}
.lv{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:2px;letter-spacing:.04em;}
.lv.b{background:rgba(74,222,128,.14);color:var(--green);border:1px solid rgba(74,222,128,.24);}
.lv.m{background:rgba(167,139,250,.18);color:var(--purple);border:1px solid rgba(167,139,250,.28);}
.lv.s{background:rgba(251,191,36,.18);color:var(--amber);border:1px solid rgba(251,191,36,.28);}
.attl{font-size:13px;font-weight:700;flex:1;line-height:1.5;}
.abdy{padding:0 17px;max-height:0;overflow:hidden;transition:max-height .38s ease,padding .28s;}
.acard.open .abdy{max-height:2000px;padding-bottom:17px;}
.aprob{font-size:13px;line-height:1.85;color:var(--dim);border-left:3px solid var(--b2);padding-left:12px;margin-bottom:13px;}
.astep{background:rgba(255,255,255,.03);border-radius:11px;padding:11px 13px;margin-bottom:7px;}
.aslbl{font-size:10px;font-weight:700;color:var(--dim2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;}
.aseq{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.75;overflow-x:auto;white-space:nowrap;}
.aseq.hl{color:var(--green);}
.anote{font-size:11px;color:var(--dim2);margin-top:4px;}
.rvl{width:100%;padding:11px;background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.22);border-radius:11px;color:var(--blue);font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;margin-bottom:11px;-webkit-appearance:none;}
.rvl:active{transform:scale(.98);}
.asec{display:none;}
.asec.on{display:block;}
.warn{background:rgba(255,77,109,.05);border:1px solid rgba(255,77,109,.2);border-radius:var(--r);padding:15px 17px;margin-top:12px;}
.warn p{font-size:12px;line-height:1.85;color:#fca5a5;}
.end{text-align:center;padding:36px 16px;}
.epct{font-family:'Syne',sans-serif;font-size:56px;font-weight:800;line-height:1;background:linear-gradient(120deg,var(--amber),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.escore{font-size:18px;font-weight:700;margin:10px 0 4px;}
.emsg{color:var(--dim);margin-bottom:26px;font-size:14px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes popIn{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.main>div{animation:popIn .18s ease;}
</style>
</head>
<body>
<div class="glow"></div>

<!-- Loading -->
<div id="ld">
<svg class="mac-svg" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ddeeff"/><stop offset="100%" stop-color="#aaccee"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5588aa"/><stop offset="100%" stop-color="#336688"/></linearGradient></defs>
<rect x="15" y="8" width="80" height="68" rx="8" fill="url(#g1)" stroke="#7aaccc" stroke-width="1.5"/>
<rect x="23" y="16" width="64" height="44" rx="4" fill="#0d1b2a" stroke="#2a4a6a"/>
<rect x="25" y="18" width="60" height="40" rx="3" fill="#0a1520"/>
<rect x="25" y="18" width="60" height="8" rx="3" fill="#102030"/>
<text x="38" y="25" font-size="5" fill="#38bdf8" font-family="monospace">⚗ LOADING...</text>
<ellipse cx="43" cy="34" rx="4" ry="4" fill="#38bdf8"/>
<ellipse cx="67" cy="34" rx="4" ry="4" fill="#38bdf8"/>
<path d="M38 46 Q55 56 72 46" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<rect x="32" y="80" width="46" height="5" rx="2" fill="#7aaccc" stroke="#5a8cac"/>
<rect x="27" y="85" width="56" height="14" rx="4" fill="url(#g2)"/>
<rect x="44" y="89" width="22" height="5" rx="2.5" fill="#224466"/>
<rect x="38" y="99" width="34" height="7" rx="3.5" fill="url(#g2)"/>
<rect x="24" y="103" width="62" height="5" rx="2.5" fill="#224466"/>
</svg>
<div class="ld-txt" id="ldtxt">読み込み中...</div>
<div class="ld-bar"><div class="ld-fill" id="ldfill"></div></div>
</div>

<!-- Sad Mac -->
<div id="sdld">
<svg width="110" height="110" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="sg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3a2222"/><stop offset="100%" stop-color="#221414"/></linearGradient></defs>
<rect x="15" y="8" width="80" height="68" rx="8" fill="url(#sg1)" stroke="#5a2222" stroke-width="1.5"/>
<rect x="23" y="16" width="64" height="44" rx="4" fill="#180808"/>
<rect x="25" y="18" width="60" height="40" rx="3" fill="#100505"/>
<rect x="25" y="18" width="60" height="8" rx="3" fill="#220808"/>
<text x="32" y="25" font-size="5" fill="#ff4d6d" font-family="monospace">SAD MAC - ERROR</text>
<rect x="39" y="31" rx="1" width="8" height="8" fill="#ff4d6d"/>
<rect x="63" y="31" rx="1" width="8" height="8" fill="#ff4d6d"/>
<path d="M38 50 Q55 43 72 50" stroke="#ff4d6d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<rect x="32" y="80" width="46" height="5" rx="2" fill="#5a2222"/>
<rect x="27" y="85" width="56" height="14" rx="4" fill="#3a1414"/>
<rect x="44" y="89" width="22" height="5" rx="2.5" fill="#220808"/>
<rect x="38" y="99" width="34" height="7" rx="3.5" fill="#3a1414"/>
<rect x="24" y="103" width="62" height="5" rx="2.5" fill="#220808"/>
</svg>
<div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--red)">SAD MAC — フォントエラー</div>
<div style="font-size:12px;color:var(--dim);text-align:center;max-width:240px;line-height:1.7">フォント読み込みに失敗しましたが<br>アプリは動作します</div>
<button onclick="dismissSad()" style="padding:12px 28px;background:linear-gradient(135deg,#38bdf8,#22d3ee);border:none;border-radius:13px;color:#000;font-family:sans-serif;font-size:14px;font-weight:700;cursor:pointer;">続ける →</button>
</div>

<!-- App -->
<div class="hdr">
<div class="hdr-top">
<div class="logo">⚗️ 酸化還元マスター</div>
<div class="pill" id="pill" style="display:none">0/0</div>
</div>
<div class="tabs">
<button class="tab on" id="t0" onclick="gTab('flash',0)">📝 暗記</button>
<button class="tab" id="t1" onclick="gTab('quiz',1)">⚡ クイズ</button>
<button class="tab" id="t2" onclick="gTab('half',2)">🔬 半反応式</button>
<button class="tab" id="t3" onclick="gTab('guide',3)">📖 解き方</button>
<button class="tab" id="t4" onclick="gTab('adv',4)">🎓 応用</button>
</div>
</div>
<div class="main" id="main"></div>

<script>
/* ═══ HAPTIC — safe wrapper, never throws ═══ */
(function(){
  try{
    var s=document.createElement('script');
    s.type='module';
    s.innerHTML="try{import('https://cdn.skypack.dev/ios-haptics').then(function(m){window._hap=m.haptic;}).catch(function(){});}catch(e){}";
    document.head.appendChild(s);
  }catch(e){}
})();
function h(){try{if(window._hap)window._hap();}catch(e){}}
function hC(){try{if(window._hap)window._hap.confirm();}catch(e){}}
function hE(){try{if(window._hap)window._hap.error();}catch(e){}}
function hBurst(){try{for(var i=0;i<5;i++){(function(i){setTimeout(function(){hE();},i*30);})(i);}}catch(e){}}
function hSeq(){try{[0,1,2,4,5,6].forEach(function(i){setTimeout(function(){hE();},i*220);});}catch(e){}}
document.addEventListener('click',function(e){try{var t=e.target;if(t&&t.closest&&t.closest('button,.ch,.flip-s,.rvl,.shdr,.ahdr,.mkb'))return;h();}catch(e2){}});

/* ═══ MARKS ═══ */
var marks={};
try{marks=JSON.parse(localStorage.getItem('ox-mk')||'{}');}catch(e){}
function saveMk(){try{localStorage.setItem('ox-mk',JSON.stringify(marks));}catch(e){}}
function toggleMk(id){hC();marks[id]=!marks[id];saveMk();applyMk();}
function applyMk(){
  try{
    Object.keys(marks).forEach(function(id){
      var row=document.getElementById('r-'+id);var btn=document.getElementById('mb-'+id);
      if(row)row.classList.toggle('mkd',!!marks[id]);
      if(btn){btn.textContent=marks[id]?'★':'☆';btn.classList.toggle('mkd',!!marks[id]);}
    });
  }catch(e){}
}

/* ═══ DATA ═══ */
var FL=[
  {id:'f1',r:'ox',q:'MnO₄⁻（酸性）',a:'Mn²⁺',h:'過マンガン酸イオン→マンガン(II)イオン 酸化数+7→+2'},
  {id:'f2',r:'ox',q:'MnO₄⁻（中性・塩基性）',a:'MnO₂',h:'過マンガン酸イオン→酸化マンガン(IV) 黒色沈殿！ +7→+4'},
  {id:'f3',r:'ox',q:'Cr₂O₇²⁻（酸性）',a:'2Cr³⁺',h:'ニクロム酸イオン（橙赤）→クロム(III)(緑) +6→+3'},
  {id:'f4',r:'ox',q:'Cl₂',a:'2Cl⁻',h:'塩素→塩化物イオン 0→−1'},
  {id:'f5',r:'ox',q:'H₂SO₄（熱濃硫酸）',a:'SO₂',h:'熱濃硫酸→二酸化硫黄 S: +6→+4'},
  {id:'f6',r:'ox',q:'HNO₃（濃硝酸）',a:'NO₂',h:'濃硝酸→二酸化窒素（赤褐色）N: +5→+4'},
  {id:'f7',r:'ox',q:'HNO₃（希硝酸）',a:'NO',h:'希硝酸→一酸化窒素（無色）N: +5→+2'},
  {id:'f8',r:'ox',q:'SO₂（酸化剤）',a:'S',h:'二酸化硫黄→硫黄 S: +4→0'},
  {id:'f9',r:'ox',q:'H₂O₂（中性・塩基性）',a:'2OH⁻',h:'過酸化水素→水酸化物イオン O: −1→−2'},
  {id:'f10',r:'ox',q:'H₂O₂（酸性）',a:'2H₂O',h:'過酸化水素→水 O: −1→−2'},
  {id:'f11',r:'re',q:'H₂',a:'2H⁺',h:'水素→水素イオン H: 0→+1'},
  {id:'f12',r:'re',q:'Na',a:'Na⁺',h:'ナトリウム→ナトリウムイオン Na: 0→+1'},

  var c=FL[fi],pct=((fi+1)/FL.length*100).toFixed(0),isox=c.r==='ox';
  return '<div><div class="pgb"><div class="pgf" style="width:'+pct+'%"></div></div>'+
  '<div class="cnt">'+(fi+1)+'/'+FL.length+'</div>'+
  '<div class="flip-s" id="fsc" onclick="doFlip()">'+
  '<div class="flip-c" id="fc">'+
  '<div class="flip-f ff"><div class="bdg '+(isox?'ox':'re')+'">'+(isox?'酸化剤':'還元剤')+'</div>'+
  '<div class="fq">'+c.q+'</div><div class="fqs">→ 変化後の物質は？</div><div class="fhnt">タップで答え ▼</div></div>'+
  '<div class="flip-f fb"><div class="bdg '+(isox?'ox':'re')+'">'+(isox?'酸化剤':'還元剤')+'</div>'+
  '<div class="fa">'+c.a+'</div><div class="fhi">'+c.h+'</div><div class="fhnt">タップで戻る ▲</div></div>'+
  '</div></div>'+
  '<div class="nbts"><button class="btn bg" onclick="prevF()">← 前へ</button>'+
  '<button class="btn bb" onclick="nextF()">次へ →</button></div>'+
  '<div class="sr">'+
  '<div class="sb"><div class="sn" style="color:var(--red)">'+FL.filter(function(x){return x.r==='ox';}).length+'</div><div class="sl">酸化剤</div></div>'+
  '<div class="sb"><div class="sn" style="color:var(--blue)">'+FL.filter(function(x){return x.r==='re';}).length+'</div><div class="sl">還元剤</div></div>'+
  '<div class="sb"><div class="sn" style="color:var(--green)">'+FL.length+'</div><div class="sl">合計</div></div>'+
  '</div>'+
  '<div class="warn"><p><b>⚠️ 必須暗記ポイント</b><br>'+
  '• <b>SO₂・H₂O₂</b> は相手によって酸化剤にも還元剤にもなれる<br>'+
  '• <b>MnO₄⁻</b>：酸性→Mn²⁺、中性塩基性→MnO₂（条件で生成物が違う！）<br>'+
  '• <b>濃HNO₃→NO₂</b>、<b>希HNO₃→NO</b><br>'+
  '• 酸化数<b>増加→還元剤</b>（e⁻を失う）、<b>減少→酸化剤</b>（e⁻を得る）</p></div></div>';
}
function doFlip(){hC();ff=!ff;var el=document.getElementById('fc');if(el)el.classList.toggle('flipped');}
function nextF(){hC();fi=(fi+1)%FL.length;ff=false;render();}
function prevF(){hC();fi=(fi-1+FL.length)%FL.length;ff=false;render();}

function rQuiz(){
  if(!qsh.length)initQ();
  if(qi>=qsh.length)return rEnd();
  var q=qsh[qi],pct=(qi/qsh.length*100).toFixed(0);
  var pl=document.getElementById('pill');if(pl){pl.style.display='block';pl.textContent=qs+'/'+qi;}
  return '<div><div class="pgb"><div class="pgf" style="width:'+pct+'%"></div></div>'+
  '<div class="qcard"><div class="qprog">'+(qi+1)+'/'+qsh.length+'問目</div>'+
  '<div class="qq">'+q.q+'</div>'+
  '<div class="chs" id="chs">'+q.o.map(function(o,i){return '<button class="ch" onclick="ansQ('+i+')">'+o+'</button>';}).join('')+'</div>'+
  '<div class="exp" id="exp">'+q.e+'</div>'+
  '<div id="nw" style="display:none;margin-top:12px"><button class="btn bb bw" onclick="nextQ()">次の問題 →</button></div>'+
  '</div></div>';
}
function ansQ(idx){
  if(qd)return;qd=true;
  var q=qsh[qi],btns=document.querySelectorAll('.ch');
  btns.forEach(function(b){b.classList.add('dis');});
  if(idx===q.a){btns[idx].classList.add('ok');hBurst();qs++;}
  else{btns[idx].classList.add('ng');if(btns[q.a])btns[q.a].classList.add('ok');hSeq();}
  var ex=document.getElementById('exp');if(ex)ex.classList.add('on');
  var nw=document.getElementById('nw');if(nw)nw.style.display='block';
  var pl=document.getElementById('pill');if(pl)pl.textContent=qs+'/'+(qi+1);
}
function nextQ(){hC();qi++;qd=false;render();}
function rEnd(){
  var pct=Math.round(qs/qsh.length*100);
  var msg=pct>=90?'🏆 完璧！芝浦・MARCH合格圏！':pct>=70?'🎯 よくできた！もう一周！':pct>=50?'📚 惜しい！あと少し！':'💪 基礎から復習しよう';
  return '<div class="end"><div class="epct">'+pct+'%</div>'+
  '<div class="escore">'+qs+'/'+qsh.length+'問正解</div>'+
  '<div class="emsg">'+msg+'</div>'+
  '<button class="btn bb bw" onclick="restartQ()" style="margin-bottom:10px">もう一度！</button>'+
  '<button class="btn bg bw" onclick="gTab(\'half\',2)">半反応式一覧を見る</button></div>';
}
function restartQ(){hC();initQ();render();}

function rHalf(){
  function row(it){
    var mk=!!marks[it.id];
    return '<div class="hrow h'+it.r+(mk?' mkd':'')+'" id="r-'+it.id+'">'+
    '<button class="mkb'+(mk?' mkd':'')+'" id="mb-'+it.id+'" onclick="toggleMk(\''+it.id+'\')">'+(mk?'★':'☆')+'</button>'+
    '<div class="heq">'+it.eq+'</div>'+(it.cd?'<div class="hcnd">📍 '+it.cd+'</div>':'')+
    '<div class="hcnd">'+it.d+'</div></div>';
  }
  var ox=HL.filter(function(x){return x.r==='ox';}),re=HL.filter(function(x){return x.r==='re';});
  return '<div>'+
  '<div class="hcat">🔴 酸化剤の半反応式 ('+ox.length+'個)</div>'+ox.map(row).join('')+
  '<div class="hcat" style="margin-top:20px">🔵 還元剤の半反応式 ('+re.length+'個)</div>'+re.map(row).join('')+
  '<div style="text-align:center;margin-top:16px;font-size:11px;color:var(--dim2)">☆ タップでマーク → 自動保存</div></div>';
}

function rGuide(){
  return '<div>'+
  GD.map(function(g,i){
    return '<div class="scard" id="sg'+i+'">'+
    '<div class="shdr" onclick="togS('+i+')">'+
    '<div class="snum2" style="background:'+g.col+'22;color:'+g.col+'">'+g.n+'</div>'+
    '<div class="sttl">'+g.t+'</div><div class="sarr">▶</div></div>'+
    '<div class="sbdy"><p class="sdesc">'+g.d+'</p>'+
    g.ex.map(function(e){return '<div class="selbl">'+e[0]+'</div><div class="seq">'+e[1]+'</div>';}).join('')+
    '<div class="tip">'+g.tip+'</div></div></div>';
  }).join('')+'</div>';
}
function togS(i){hC();var el=document.getElementById('sg'+i);if(el)el.classList.toggle('open');}

function rAdv(){
  var lm={b:'基礎',m:'MARCH',s:'芝浦'};
  return '<div><div class="sec-t">🎓 応用問題</div>'+
  AV.map(function(p,i){
    return '<div class="acard" id="ac'+i+'">'+
    '<div class="ahdr" onclick="togA('+i+')"><div class="lv '+p.lv+'">'+lm[p.lv]+'</div>'+
    '<div class="attl">'+p.t+'</div></div>'+
    '<div class="abdy"><div class="aprob">'+p.p+'</div>'+
    '<button class="rvl" onclick="revA('+i+',this)">👁 解答ステップを見る</button>'+
    '<div class="asec" id="as'+i+'">'+
    p.s.map(function(s){
      return '<div class="astep"><div class="aslbl">'+s.l+'</div>'+
      '<div class="aseq'+(s.hl?' hl':'')+'" style="white-space:pre-wrap">'+s.e+'</div>'+
      (s.n?'<div class="anote">💬 '+s.n+'</div>':'')+
      '</div>';
    }).join('')+'</div></div></div>';
  }).join('')+
  '<div class="card" style="background:rgba(167,139,250,.05);border-color:rgba(167,139,250,.2);margin-top:4px">'+
  '<p style="font-size:12px;line-height:1.9;color:#c4b5fd">'+
  '<b>🧠 芝浦・法政・MARCH理系 出題傾向</b><br>'+
  '✓ 半反応式→イオン反応式→化学反応式の変換<br>✓ 酸化数変化から酸化剤・還元剤の特定<br>'+
  '✓ MnO₄⁻、Cr₂O₇²⁻の条件別反応<br>✓ SO₂・H₂O₂の両性（頻出！）<br>'+
  '✓ Cu+硝酸（濃・希）の反応式<br>✓ e⁻のLCM計算</p></div></div>';
}
function togA(i){hC();var el=document.getElementById('ac'+i);if(el)el.classList.toggle('open');}
function revA(i,btn){hC();btn.style.display='none';var el=document.getElementById('as'+i);if(el)el.classList.add('on');}

/* ═══ TAB / RENDER ═══ */
function render(){
  try{
    var m=document.getElementById('main');if(!m)return;
    if(ct==='flash')m.innerHTML=rFlash();
    else if(ct==='quiz')m.innerHTML=rQuiz();
    else if(ct==='half')m.innerHTML=rHalf();
    else if(ct==='guide')m.innerHTML=rGuide();
    else if(ct==='adv')m.innerHTML=rAdv();
    var pl=document.getElementById('pill');if(pl&&ct!=='quiz')pl.style.display='none';
  }catch(e){}
}
function gTab(name,idx){
  try{
    hC();ct=name;
    for(var i=0;i<5;i++){var t=document.getElementById('t'+i);if(t)t.classList.remove('on');}
    var a=document.getElementById('t'+idx);if(a)a.classList.add('on');
    render();
  }catch(e){}
}

/* SWIPE */
var sx=0,sy=0;
document.addEventListener('touchstart',function(e){try{sx=e.touches[0].clientX;sy=e.touches[0].clientY;}catch(e2){}},{passive:true});
document.addEventListener('touchend',function(e){
  try{if(ct!=='flash')return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>55){if(dx<0)nextF();else prevF();}}catch(e2){}
},{passive:true});

function dismissSad(){try{hC();var el=document.getElementById('sdld');if(el){el.classList.remove('on');el.style.display='none';}}catch(e){}}

/* ═══ LOADING ═══ */
(function(){
  try{
    initQ();
    var fill=document.getElementById('ldfill'),txt=document.getElementById('ldtxt'),p=0;
    var msgs=['読み込み中...','データ準備中...','もうすぐ完了...'];
    var t=setInterval(function(){
      try{
        p+=Math.random()*18+10;if(p>100)p=100;
        if(fill)fill.style.width=p+'%';
        if(txt)txt.textContent=msgs[Math.min(Math.floor(p/35),2)];
        if(p>=100){
          clearInterval(t);
          setTimeout(function(){
            try{
              var ld=document.getElementById('ld');
              if(ld){ld.classList.add('out');setTimeout(function(){try{ld.style.display='none';}catch(e){}},500);}
              render();
            }catch(e){}
          },200);
        }
      }catch(e){clearInterval(t);}
    },70);
    /* Font timeout → show sad mac */
    setTimeout(function(){
      try{
        var test=document.createElement('span');
        test.style.fontFamily='Syne';test.textContent='A';
        document.body.appendChild(test);
        var w=test.offsetWidth;document.body.removeChild(test);
      }catch(e){}
    },4000);
  }catch(e){try{render();}catch(e2){}}
})();
</script>
