<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚗️ 酸化還元マスター</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111f;--s0:rgba(255,255,255,0.03);--s1:rgba(255,255,255,0.07);
  --s2:rgba(255,255,255,0.13);--border:rgba(255,255,255,0.09);
  --border2:rgba(255,255,255,0.16);--red:#ff4d6d;--blue:#38bdf8;
  --green:#4ade80;--amber:#fbbf24;--purple:#a78bfa;--cyan:#22d3ee;
  --text:#f0f4ff;--dim:rgba(240,244,255,0.55);--dim2:rgba(240,244,255,0.32);
  --r:18px;--r2:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}

/* AMBIENT */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 40% at 10% 10%,rgba(56,189,248,.08),transparent),
             radial-gradient(ellipse 50% 45% at 90% 90%,rgba(255,77,109,.06),transparent),
             radial-gradient(ellipse 60% 50% at 50% 50%,rgba(74,222,128,.03),transparent);}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:rgba(7,17,31,.88);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);padding:14px 18px 0;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.logo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;
  background:linear-gradient(110deg,var(--blue) 0%,var(--green) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.spill{background:var(--s1);border:1px solid var(--border2);border-radius:50px;
  padding:3px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--amber);display:none;}
.spill.on{display:block;}

/* TABS */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 13px;font-size:12px;font-weight:500;color:var(--dim);
  cursor:pointer;border:none;background:transparent;border-radius:10px 10px 0 0;
  transition:all .18s;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;}
.tab.on{color:var(--text);background:var(--s1);}

/* MAIN */
.main{position:relative;z-index:1;padding:18px 15px 50px;max-width:600px;margin:0 auto;}
.main>div{animation:popIn .18s ease;}

/* UTILITIES */
.sec-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--dim2);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

.card{background:var(--s0);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;}

/* PROGRESS */
.prog-bar{height:3px;background:var(--s1);border-radius:2px;margin-bottom:14px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .35s ease;}
.counter{text-align:center;font-size:11px;color:var(--dim2);margin-bottom:11px;
  font-family:'JetBrains Mono',monospace;}

/* FLASHCARD */
.flip-scene{perspective:900px;height:210px;margin-bottom:14px;cursor:pointer;}
.flip-card{width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .48s cubic-bezier(.4,0,.2,1);position:relative;}
.flip-card.flipped{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px;border:1px solid var(--border2);gap:10px;}
.flip-front{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(74,222,128,.07));}
.flip-back{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(167,139,250,.07));transform:rotateY(180deg);}
.flip-hint{font-size:10px;color:var(--dim2);position:absolute;bottom:11px;right:13px;}

.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:50px;letter-spacing:.04em;}
.badge.ox{background:rgba(255,77,109,.18);color:var(--red);border:1px solid rgba(255,77,109,.28);}
.badge.re{background:rgba(56,189,248,.18);color:var(--blue);border:1px solid rgba(56,189,248,.28);}

.fq{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;text-align:center;line-height:1.45;}
.fq-sub{font-size:12px;color:var(--dim);text-align:center;}
.fa{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;text-align:center;color:var(--amber);line-height:1.45;}
.fhint{font-size:12px;color:var(--dim);text-align:center;}

.nav-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}

/* BUTTONS */
.btn{padding:13px;border-radius:14px;font-family:'Noto Sans JP',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .13s;text-align:center;}
.btn:active{transform:scale(.96);}
.btn-ghost{background:var(--s1);border:1px solid var(--border2);color:var(--text);}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#000;}
.btn-green{background:linear-gradient(135deg,var(--green),#22c55e);color:#000;}
.btn-red{background:linear-gradient(135deg,var(--red),#fb7185);color:#fff;}
.btn-amber{background:linear-gradient(135deg,var(--amber),#f59e0b);color:#000;}
.btn-full{width:100%;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-box{background:var(--s0);border:1px solid var(--border);border-radius:var(--r2);padding:11px 6px;text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;}
.stat-lbl{font-size:10px;color:var(--dim);margin-top:2px;}

/* QUIZ */
.quiz-card{background:var(--s0);border:1px solid var(--border2);border-radius:var(--r);padding:20px 18px;margin-bottom:14px;}
.quiz-prog{font-size:11px;color:var(--dim2);margin-bottom:11px;font-family:'JetBrains Mono',monospace;}
.quiz-q{font-size:14px;line-height:1.8;margin-bottom:10px;}
.quiz-eq{font-family:'JetBrains Mono',monospace;font-size:13px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;margin:10px 0;line-height:1.9;overflow-x:auto;white-space:nowrap;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice{padding:13px 15px;background:var(--s1);border:1px solid var(--border2);
  border-radius:13px;cursor:pointer;font-family:'JetBrains Mono',monospace;
  font-size:12.5px;line-height:1.6;transition:all .13s;text-align:left;color:var(--text);}
.choice:active{transform:scale(.98);}
.choice.correct{background:rgba(74,222,128,.15);border-color:var(--green);color:var(--green);}
.choice.wrong{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.4);color:rgba(255,110,130,.9);}
.choice.disabled{pointer-events:none;}
.explain{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);
  border-radius:13px;padding:13px 15px;margin-top:11px;font-size:13px;
  line-height:1.75;color:var(--amber);display:none;}
.explain.on{display:block;}
.next-wrap{margin-top:12px;display:none;}

/* HALF REACTIONS */
.half-cat{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);margin:18px 0 9px;padding-left:3px;}
.half-row{background:var(--s0);border:1px solid var(--border);border-radius:13px;
  padding:13px 44px 13px 15px;margin-bottom:8px;position:relative;
  transition:background .2s,border-color .2s;}
.half-row.ox{border-left:3px solid var(--red);}
.half-row.re{border-left:3px solid var(--blue);}
.half-row.mkd{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.28);}
.half-eq{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;overflow-x:auto;white-space:nowrap;}
.half-cond{font-size:10px;color:var(--dim2);margin-top:3px;}
.mark-btn{position:absolute;top:50%;right:11px;transform:translateY(-50%);
  width:28px;height:28px;background:transparent;border:none;cursor:pointer;
  font-size:17px;opacity:.35;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.mark-btn.mkd{opacity:1;}

/* GUIDE */
.step-card{background:var(--s0);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:9px;}
.step-hdr{display:flex;align-items:center;gap:11px;padding:15px 17px;cursor:pointer;}
.step-num{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0;}
.step-ttl{font-size:14px;font-weight:700;flex:1;line-height:1.4;}
.step-arr{color:var(--dim);font-size:11px;transition:transform .2s;}
.step-card.open .step-arr{transform:rotate(90deg);}
.step-body{padding:0 17px;max-height:0;overflow:hidden;transition:max-height .32s ease,padding .28s;}
.step-card.open .step-body{max-height:900px;padding-bottom:17px;}
.step-desc{font-size:13px;line-height:1.85;color:var(--dim);margin-bottom:10px;}
.step-eq{font-family:'JetBrains Mono',monospace;font-size:12.5px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;overflow-x:auto;white-space:nowrap;margin:6px 0;line-height:1.8;}
.step-ex-lbl{font-size:10px;color:var(--dim2);margin-bottom:3px;margin-top:10px;}
.tip{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);
  border-radius:11px;padding:11px 13px;margin-top:9px;font-size:12.5px;color:#c4b5fd;line-height:1.75;}
.tip::before{content:'💡 ';}

/* ADVANCED */
.adv-card{background:var(--s0);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.adv-hdr{padding:15px 17px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;}
.lv{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:2px;letter-spacing:.04em;}
.lv.basic{background:rgba(74,222,128,.14);color:var(--green);border:1px solid rgba(74,222,128,.24);}
.lv.march{background:rgba(167,139,250,.18);color:var(--purple);border:1px solid rgba(167,139,250,.28);}
.lv.shibaura{background:rgba(251,191,36,.18);color:var(--amber);border:1px solid rgba(251,191,36,.28);}
.adv-ttl{font-size:13.5px;font-weight:700;flex:1;line-height:1.5;}
.adv-body{padding:0 17px;max-height:0;overflow:hidden;transition:max-height .38s ease,padding .28s;}
.adv-card.open .adv-body{max-height:1400px;padding-bottom:17px;}
.adv-prob{font-size:13px;line-height:1.85;color:var(--dim);border-left:3px solid var(--border2);padding-left:12px;margin-bottom:13px;}
.adv-steps{display:flex;flex-direction:column;gap:7px;}
.adv-step{background:rgba(255,255,255,0.03);border-radius:11px;padding:11px 13px;}
.adv-slbl{font-size:10px;font-weight:700;color:var(--dim2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;}
.adv-seq{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--text);overflow-x:auto;white-space:nowrap;}
.adv-seq.hl{color:var(--green);}
.adv-note{font-size:11px;color:var(--dim2);margin-top:4px;}
.reveal{width:100%;padding:11px;background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.22);
  border-radius:11px;color:var(--blue);font-family:'Noto Sans JP',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;margin-bottom:11px;}
.reveal:active{transform:scale(.98);}
.ans-sec{display:none;}
.ans-sec.on{display:block;}

/* WARN BOX */
.warn-box{background:rgba(255,77,109,.05);border:1px solid rgba(255,77,109,.2);
  border-radius:var(--r);padding:15px 17px;margin-top:12px;}
.warn-box p{font-size:12.5px;line-height:1.85;color:#fca5a5;}

/* END SCREEN */
.end-wrap{text-align:center;padding:36px 16px;}
.end-pct{font-family:'Syne',sans-serif;font-size:56px;font-weight:800;line-height:1;
  background:linear-gradient(120deg,var(--amber),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.end-score{font-size:18px;font-weight:700;margin:10px 0 4px;}
.end-msg{color:var(--dim);margin-bottom:26px;font-size:14px;}

/* ANIMATIONS */
@keyframes popIn{from{transform:scale(.88);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
@keyframes glowG{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}50%{box-shadow:0 0 18px 4px rgba(74,222,128,.28);}}
.pop{animation:popIn .28s cubic-bezier(.34,1.56,.64,1);}
.shake{animation:shake .38s ease;}
</style>
</head>
<body>
<div class="glow"></div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div class="logo">⚗️ 酸化還元マスター</div>
    <div class="spill" id="spill">0/0</div>
  </div>
  <div class="tabs" id="tabBar">
    <button class="tab on" onclick="gTab('flash',this)">📝 暗記</button>
    <button class="tab" onclick="gTab('quiz',this)">⚡ クイズ</button>
    <button class="tab" onclick="gTab('half',this)">🔬 半反応式</button>
    <button class="tab" onclick="gTab('guide',this)">📖 解き方</button>
    <button class="tab" onclick="gTab('adv',this)">🎓 応用</button>
  </div>
</div>

<div class="main" id="main"></div>

<!-- Haptic import -->
<script type="module">
import{haptic}from'https://cdn.skypack.dev/ios-haptics';
window._hap=haptic;
</script>

<script>
/* ── HAPTIC ── */
function h(){try{window._hap?.()}catch(e){}}
function hC(){try{window._hap?.confirm()}catch(e){}}
function hE(){try{window._hap?.error()}catch(e){}}
function hBurst(){for(let i=0;i<5;i++)setTimeout(hE,i*30);}
function hSeq(){[0,1,2,4,5,6].forEach(i=>setTimeout(hE,i*220));}

// Body tap → light haptic
document.addEventListener('click',e=>{
  if(e.target.closest('button,.choice,.flip-scene,.reveal,.step-hdr,.adv-hdr,.mark-btn'))return;
  h();
});

/* ── MARKER / localStorage ── */
let markSet=new Set(JSON.parse(localStorage.getItem('ox-marks')||'[]'));
function toggleMark(id,btn){
  hC();
  if(markSet.has(id)){markSet.delete(id);}else{markSet.add(id);}
  localStorage.setItem('ox-marks',JSON.stringify([...markSet]));
  applyMarks();
}
function applyMarks(){
  markSet.forEach(id=>{
    const row=document.getElementById('row-'+id);
    const btn=row?.querySelector('.mark-btn');
    if(row)row.classList.add('mkd');
    if(btn){btn.classList.add('mkd');btn.textContent='★';}
  });
  document.querySelectorAll('.half-row:not(.mkd)').forEach(row=>{
    const btn=row.querySelector('.mark-btn');
    if(btn&&!markSet.has(row.id.replace('row-',''))){btn.textContent='☆';}
  });
}

/* ════ DATA ════ */

/* フラッシュカード — 物質変化 */
const FLASH=[
  // 酸化剤
  {id:'f1',role:'酸化剤',q:'MnO<sub>4</sub><sup>−</sup>（酸性）',a:'Mn<sup>2+</sup>',hint:'過マンガン酸イオン → マンガン(II)イオン'},
  {id:'f2',role:'酸化剤',q:'MnO<sub>4</sub><sup>−</sup>（中性・塩基性）',a:'MnO<sub>2</sub>',hint:'過マンガン酸イオン → 酸化マンガン(IV)　黒色沈殿！'},
  {id:'f3',role:'酸化剤',q:'Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup>（酸性）',a:'2Cr<sup>3+</sup>',hint:'ニクロム酸イオン → クロム(III)イオン'},
  {id:'f4',role:'酸化剤',q:'Cl<sub>2</sub>',a:'2Cl<sup>−</sup>',hint:'塩素 → 塩化物イオン'},
  {id:'f5',role:'酸化剤',q:'H<sub>2</sub>SO<sub>4</sub>（熱濃硫酸）',a:'SO<sub>2</sub>',hint:'熱濃硫酸 → 二酸化硫黄'},
  {id:'f6',role:'酸化剤',q:'HNO<sub>3</sub>（濃硝酸）',a:'NO<sub>2</sub>',hint:'濃硝酸 → 二酸化窒素（窒素2つ！）'},
  {id:'f7',role:'酸化剤',q:'HNO<sub>3</sub>（希硝酸）',a:'NO',hint:'希硝酸 → 一酸化窒素（窒素1つ！）'},
  {id:'f8',role:'酸化剤',q:'SO<sub>2</sub>（酸化剤として）',a:'S',hint:'二酸化硫黄 → 硫黄'},
  {id:'f9',role:'酸化剤',q:'H<sub>2</sub>O<sub>2</sub>（中性・塩基性）',a:'2OH<sup>−</sup>',hint:'過酸化水素 → 水酸化物イオン'},
  {id:'f10',role:'酸化剤',q:'H<sub>2</sub>O<sub>2</sub>（酸性）',a:'2H<sub>2</sub>O',hint:'過酸化水素 → 水'},
  // 還元剤
  {id:'f11',role:'還元剤',q:'H<sub>2</sub>',a:'2H<sup>+</sup>',hint:'水素 → 水素イオン'},
  {id:'f12',role:'還元剤',q:'Na',a:'Na<sup>+</sup>',hint:'ナトリウム → ナトリウムイオン'},
  {id:'f13',role:'還元剤',q:'Cu',a:'Cu<sup>2+</sup>',hint:'銅 → 銅(II)イオン'},
  {id:'f14',role:'還元剤',q:'2I<sup>−</sup>',a:'I<sub>2</sub>',hint:'ヨウ化物イオン → ヨウ素（2個→1分子！）'},
  {id:'f15',role:'還元剤',q:'Fe<sup>2+</sup>',a:'Fe<sup>3+</sup>',hint:'鉄(II)イオン → 鉄(III)イオン'},
  {id:'f16',role:'還元剤',q:'Sn<sup>2+</sup>',a:'Sn<sup>4+</sup>',hint:'スズ(II) → スズ(IV)イオン'},
  {id:'f17',role:'還元剤',q:'H<sub>2</sub>S',a:'S',hint:'硫化水素 → 硫黄'},
  {id:'f18',role:'還元剤',q:'(COOH)<sub>2</sub>（シュウ酸）',a:'2CO<sub>2</sub>',hint:'シュウ酸 → 二酸化炭素'},
  {id:'f19',role:'還元剤',q:'SO<sub>2</sub>（還元剤として）',a:'SO<sub>4</sub><sup>2−</sup>',hint:'二酸化硫黄 → 硫酸イオン'},
  {id:'f20',role:'還元剤',q:'H<sub>2</sub>O<sub>2</sub>（還元剤として）',a:'O<sub>2</sub>',hint:'過酸化水素 → 酸素'},
];

/* 半反応式 全リスト */
const HALF=[
  {id:'h1',role:'酸化剤',cond:'酸性',
   eq:'MnO<sub>4</sub><sup>−</sup> + 8H<sup>+</sup> + 5e<sup>−</sup> → Mn<sup>2+</sup> + 4H<sub>2</sub>O',
   desc:'過マンガン酸イオン（酸性）'},
  {id:'h2',role:'酸化剤',cond:'中性・塩基性',
   eq:'MnO<sub>4</sub><sup>−</sup> + 2H<sub>2</sub>O + 3e<sup>−</sup> → MnO<sub>2</sub> + 4OH<sup>−</sup>',
   desc:'過マンガン酸イオン（中性・塩基性）'},
  {id:'h3',role:'酸化剤',cond:'酸性',
   eq:'Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup> + 14H<sup>+</sup> + 6e<sup>−</sup> → 2Cr<sup>3+</sup> + 7H<sub>2</sub>O',
   desc:'ニクロム酸イオン（酸性）'},
  {id:'h4',role:'酸化剤',cond:'',
   eq:'Cl<sub>2</sub> + 2e<sup>−</sup> → 2Cl<sup>−</sup>',
   desc:'塩素'},
  {id:'h5',role:'酸化剤',cond:'',
   eq:'H<sub>2</sub>SO<sub>4</sub> + 2H<sup>+</sup> + 2e<sup>−</sup> → SO<sub>2</sub> + 2H<sub>2</sub>O',

     {l:'② Sn²⁺の半反応式（還元剤）',e:'Sn²⁺ → Sn⁴⁺ + 2e⁻　…(II)',n:''},
     {l:'③ e⁻をそろえる',e:'(I)×2　　(II)×1　　→ e⁻を2個に統一',n:''},
     {l:'④ イオン反応式（完成）',e:'Sn²⁺ + 2Fe³⁺ → Sn⁴⁺ + 2Fe²⁺',n:'',hl:true},
   ]},
  {id:'a5',lv:'march',title:'Cu + 濃硝酸 → 化学反応式',
   prob:'銅Cuに濃硝酸を加えた。化学反応式を完成させよ。',
   steps:[
     {l:'① HNO₃（濃硝酸・酸化剤）の半反応式',e:'HNO₃ + H⁺ + e⁻ → NO₂ + H₂O　…(I)',n:'濃硝酸→NO₂'},
     {l:'② Cu（還元剤）の半反応式',e:'Cu → Cu²⁺ + 2e⁻　…(II)',n:''},
     {l:'③ e⁻をそろえる',e:'(I)×2　　(II)×1　　→ e⁻を2個に統一',n:''},
     {l:'④ イオン反応式',e:'Cu + 2HNO₃ + 2H⁺ → Cu²⁺ + 2NO₂ + 2H₂O',n:'左辺のH⁺をHNO₃に統合'},
     {l:'⑤ 化学反応式（完成）',e:'Cu + 4HNO₃(濃) → Cu(NO₃)₂ + 2NO₂↑ + 2H₂O',n:'Cu²⁺+2NO₃⁻→Cu(NO₃)₂',hl:true},
   ]},
  {id:'a6',lv:'shibaura',title:'Cu + 希硝酸 → 化学反応式 ★★',
   prob:'銅Cuに希硝酸を加えた。化学反応式を完成させよ。（芝浦大2019年類題）',
   steps:[
     {l:'① HNO₃（希硝酸・酸化剤）の半反応式',e:'HNO₃ + 3H⁺ + 3e⁻ → NO + 2H₂O　…(I)',n:'希硝酸→NO'},
     {l:'② Cu（還元剤）の半反応式',e:'Cu → Cu²⁺ + 2e⁻　…(II)',n:''},
     {l:'③ e⁻をそろえる',e:'(I)×2　　(II)×3　　→ e⁻を6個に統一',n:'LCM(3,2) = 6'},
     {l:'④ イオン反応式',e:'3Cu + 2HNO₃ + 6H⁺ → 3Cu²⁺ + 2NO + 4H₂O',n:'H⁺を含む項をHNO₃に統合'},
     {l:'⑤ 化学反応式（完成）',e:'3Cu + 8HNO₃(希) → 3Cu(NO₃)₂ + 2NO↑ + 4H₂O',n:'H⁺6個+HNO₃2個=HNO₃計8個',hl:true},
   ]},
];

/* ════ STATE ════ */
let curTab='flash',flashIdx=0,flashFlipped=false;
let quizIdx=0,quizScore=0,quizAnswered=false,shuffledQ=[];

/* ════ RENDERS ════ */

/* ── FLASH ── */
function rFlash(){
  const c=FLASH[flashIdx];
  const isOx=c.role==='酸化剤';
  const pct=((flashIdx+1)/FLASH.length*100).toFixed(0);
  return`<div>
<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
<div class="counter">${flashIdx+1} / ${FLASH.length}</div>
<div class="flip-scene" onclick="doFlip()">
  <div class="flip-card" id="fc">
    <div class="flip-face flip-front">
      <div class="badge ${isOx?'ox':'re'}">${c.role}</div>
      <div class="fq">${c.q}</div>
      <div class="fq-sub">→ 変化後の物質は？</div>
      <div class="flip-hint">タップで答え ▼</div>
    </div>
    <div class="flip-face flip-back">
      <div class="badge ${isOx?'ox':'re'}">${c.role}</div>
      <div class="fa">${c.a}</div>
      <div class="fhint">${c.hint}</div>
      <div class="flip-hint">タップで戻る ▲</div>
    </div>
  </div>
</div>
<div class="nav-btns">
  <button class="btn btn-ghost" onclick="prevCard()">← 前へ</button>
  <button class="btn btn-blue" onclick="nextCard()">次へ →</button>
</div>
<div class="stats-row">
  <div class="stat-box"><div class="stat-num" style="color:var(--red)">${FLASH.filter(x=>x.role==='酸化剤').length}</div><div class="stat-lbl">酸化剤</div></div>
  <div class="stat-box"><div class="stat-num" style="color:var(--blue)">${FLASH.filter(x=>x.role==='還元剤').length}</div><div class="stat-lbl">還元剤</div></div>
  <div class="stat-box"><div class="stat-num" style="color:var(--green)">${FLASH.length}</div><div class="stat-lbl">合計</div></div>
</div>
<div class="warn-box">
  <p><b>⚠️ 要注意！</b><br>
  • SO₂ と H₂O₂ は相手次第で<b>酸化剤にも還元剤にもなる</b><br>
  • MnO₄⁻ は酸性→Mn²⁺、中性塩基性→MnO₂ と<b>条件で生成物が違う</b><br>
  • 濃硝酸→NO₂、希硝酸→NO（←間違えやすい！）</p>
</div>
</div>`;
}

function doFlip(){hC();flashFlipped=!flashFlipped;document.getElementById('fc')?.classList.toggle('flipped');}
function nextCard(){hC();flashIdx=(flashIdx+1)%FLASH.length;flashFlipped=false;render();}
function prevCard(){hC();flashIdx=(flashIdx-1+FLASH.length)%FLASH.length;flashFlipped=false;render();}

/* ── QUIZ ── */
function initQ(){shuffledQ=[...QUIZ].sort(()=>Math.random()-.5);quizIdx=0;quizScore=0;quizAnswered=false;}

function rQuiz(){
  if(!shuffledQ.length)initQ();
  if(quizIdx>=shuffledQ.length)return rEnd();
  const q=shuffledQ[quizIdx];
  const pct=(quizIdx/shuffledQ.length*100).toFixed(0);
  const sp=document.getElementById('spill');
  if(sp){sp.className='spill on';sp.textContent=`${quizScore}/${quizIdx}`;}
  return`<div>
<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
<div class="quiz-card">
  <div class="quiz-prog">${quizIdx+1} / ${shuffledQ.length}問目</div>
  <div class="quiz-q">${q.q}</div>
  <div class="choices" id="ch">
    ${q.opts.map((o,i)=>`<button class="choice" onclick="ansQ(${i})">${o}</button>`).join('')}
  </div>
  <div class="explain" id="exp">${q.exp}</div>
  <div class="next-wrap" id="nw"><button class="btn btn-blue btn-full" onclick="nextQ()">次の問題 →</button></div>
</div>
</div>`;
}

function ansQ(idx){
  if(quizAnswered)return;quizAnswered=true;
  const q=shuffledQ[quizIdx];
  const btns=document.querySelectorAll('.choice');
  btns.forEach(b=>{b.classList.add('disabled');b.style.pointerEvents='none';});
  if(idx===q.ans){btns[idx].classList.add('correct');hBurst();quizScore++;}
  else{btns[idx].classList.add('wrong');btns[q.ans].classList.add('correct');hSeq();}
  document.getElementById('exp').classList.add('on');
  document.getElementById('nw').style.display='block';
  const sp=document.getElementById('spill');if(sp)sp.textContent=`${quizScore}/${quizIdx+1}`;
}

function nextQ(){hC();quizIdx++;quizAnswered=false;render();}

function rEnd(){
  const pct=Math.round(quizScore/shuffledQ.length*100);
  const msg=pct>=90?'🏆 完璧！芝浦・MARCH合格圏！':pct>=70?'🎯 よくできた！もう一周しよう':pct>=50?'📚 惜しい！もう少し！':'💪 基礎から復習しよう';
  return`<div class="end-wrap">
  <div class="end-pct">${pct}%</div>
  <div class="end-score">${quizScore} / ${shuffledQ.length}問正解</div>
  <div class="end-msg">${msg}</div>
  <button class="btn btn-blue btn-full" onclick="restartQ()" style="margin-bottom:10px">もう一度チャレンジ！</button>
  <button class="btn btn-ghost btn-full" onclick="gTab('half',document.querySelectorAll('.tab')[2])">半反応式一覧を見る</button>
</div>`;
}
function restartQ(){hC();initQ();render();}

/* ── HALF ── */
function rHalf(){
  const ox=HALF.filter(x=>x.role==='酸化剤');
  const re=HALF.filter(x=>x.role==='還元剤');
  const row=it=>{
    const mk=markSet.has(it.id);
    return`<div class="half-row ${it.role==='酸化剤'?'ox':'re'}${mk?' mkd':''}" id="row-${it.id}">
  <button class="mark-btn${mk?' mkd':''}" onclick="toggleMark('${it.id}',this)">${mk?'★':'☆'}</button>
  <div class="half-eq">${it.eq}</div>
  ${it.cond?`<div class="half-cond">📍 ${it.cond}</div>`:''}
  <div class="half-cond">${it.desc}</div>
</div>`;
  };
  return`<div>
<div class="half-cat">🔴 酸化剤の半反応式 (${ox.length}個)</div>
${ox.map(row).join('')}
<div class="half-cat" style="margin-top:20px">🔵 還元剤の半反応式 (${re.length}個)</div>
${re.map(row).join('')}
<div style="text-align:center;margin-top:18px;font-size:11px;color:var(--dim2)">☆ をタップしてマーク → 自動保存（localStorage）</div>
</div>`;
}

/* ── GUIDE ── */
function rGuide(){
  const sc=(g,i)=>`<div class="step-card" id="sg-${i}">
  <div class="step-hdr" onclick="togStep(${i})">
    <div class="step-num" style="background:${g.color}22;color:${g.color}">${g.n}</div>
    <div class="step-ttl">${g.title}</div>
    <div class="step-arr">▶</div>
  </div>
  <div class="step-body">
    <p class="step-desc">${g.desc}</p>
    ${g.exs.map(ex=>`<div class="step-ex-lbl">${ex.l}</div><div class="step-eq">${ex.e}</div>`).join('')}
    <div class="tip">${g.tip}</div>
  </div>
</div>`;
  return`<div>
<div class="sec-title">📐 半反応式の作り方（4ステップ）</div>
${GUIDE.slice(0,4).map((g,i)=>sc(g,i)).join('')}
<div class="sec-title" style="margin-top:20px">🔗 イオン→化学反応式（2ステップ）</div>
${GUIDE.slice(4).map((g,i)=>sc(g,i+4)).join('')}
</div>`;
}
function togStep(i){hC();document.getElementById('sg-'+i)?.classList.toggle('open');}

/* ── ADVANCED ── */
function rAdv(){
  const lmap={basic:'基礎',march:'MARCH',shibaura:'芝浦'};
  const ac=(p,i)=>`<div class="adv-card" id="ac-${i}">
  <div class="adv-hdr" onclick="togAdv(${i})">
    <div class="lv ${p.lv}">${lmap[p.lv]}</div>
    <div class="adv-ttl">${p.title}</div>
  </div>
  <div class="adv-body">
    <div class="adv-prob">${p.prob}</div>
    <button class="reveal" onclick="revAdv(${i},this)">👁 解答ステップを見る</button>
    <div class="ans-sec" id="as-${i}">
      <div class="adv-steps">
        ${p.steps.map(s=>`<div class="adv-step">
          <div class="adv-slbl">${s.l}</div>
          <div class="adv-seq${s.hl?' hl':''}">${s.e}</div>
          ${s.n?`<div class="adv-note">💬 ${s.n}</div>`:''}
        </div>`).join('')}
      </div>
    </div>
  </div>
</div>`;
  return`<div>
<div class="sec-title">🎓 応用問題 MARCH / 芝浦 / 法政 レベル</div>
${ADV.map((p,i)=>ac(p,i)).join('')}
<div class="card" style="background:rgba(167,139,250,.05);border-color:rgba(167,139,250,.2);margin-top:4px">
  <p style="font-size:12.5px;line-height:1.9;color:#c4b5fd">
    <b>🧠 芝浦・法政・MARCH理系 出題傾向</b><br>
    ✓ 半反応式→イオン反応式→化学反応式の変換<br>
    ✓ 酸化数変化から酸化剤・還元剤の特定<br>
    ✓ MnO₄⁻、Cr₂O₇²⁻の条件別反応<br>
    ✓ SO₂・H₂O₂の両性（頻出！）<br>
    ✓ Cu+硝酸（濃・希）の反応式<br>
    ✓ 電子数の最小公倍数計算（LCM）<br>
    ✓ 化学量論的計算（何mol反応するか）
  </p>
</div>
</div>`;
}
function togAdv(i){hC();document.getElementById('ac-'+i)?.classList.toggle('open');}
function revAdv(i,btn){hC();btn.style.display='none';document.getElementById('as-'+i)?.classList.add('on');}

/* ════ TAB / RENDER ════ */
function render(){
  const m=document.getElementById('main');
  if(curTab==='flash')m.innerHTML=rFlash();
  else if(curTab==='quiz')m.innerHTML=rQuiz();
  else if(curTab==='half'){m.innerHTML=rHalf();applyMarks();}
  else if(curTab==='guide')m.innerHTML=rGuide();
  else if(curTab==='adv')m.innerHTML=rAdv();
  // hide score pill on non-quiz tabs
  const sp=document.getElementById('spill');
  if(sp)sp.className=curTab==='quiz'?'spill on':'spill';
}

function gTab(name,btn){
  hC();curTab=name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  if(btn)btn.classList.add('on');
  render();
}

/* SWIPE for flashcard */
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(curTab!=='flash')return;
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>55){
    if(dx<0)nextCard();else prevCard();
  }
},{passive:true});

/* INIT */
initQ();
render();
</script>
</body>
</html>
