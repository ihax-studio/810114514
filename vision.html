<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Gate High-Speed System</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body {
            margin: 0; background-color: #000; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; font-family: 'Consolas', monospace; overflow: hidden;
        }
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 90vw; height: 90vw; max-width: 500px; max-height: 500px;
        }
        .node {
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 10px; transition: background 0.05s;
        }
        /* 認証成功：赤 */
        .node.active {
            background-color: #ff0000 !important;
            box-shadow: 0 0 40px #ff0000;
            color: white; border-color: #fff;
        }
        /* 出しっぱなし警告：黄 */
        .node.warning {
            background-color: #ffcc00 !important;
            box-shadow: 0 0 20px #ffcc00;
            color: #000;
        }
        #video-preview {
            position: fixed; bottom: 10px; right: 10px;
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid #444; object-fit: cover;
        }
        .status-text { margin-bottom: 15px; font-size: 1.1rem; font-weight: bold; height: 1.2em; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="log" class="status-text">SYSTEM READY</div>
    
    <div id="grid-container" class="grid">
        </div>

    <video id="video-preview" autoplay playsinline></video>
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const log = document.getElementById('log');
        const gridContainer = document.getElementById('grid-container');

        // 各ノードの状態管理
        const nodeStates = {};
        const NODE_COUNT = 9;

        // 1. ノードの生成と初期化
        for (let i = 1; i <= NODE_COUNT; i++) {
            const id = `UNLOCK-GATE-0${i}`;
            const div = document.createElement('div');
            div.id = id;
            div.className = 'node';
            div.innerHTML = `<span>GATE</span><strong>0${i}</strong>`;
            gridContainer.appendChild(div);

            nodeStates[id] = {
                element: div,
                hasTriggered: false,
                triggerTime: 0,
                isPresent: false
            };
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: 480, height: 480 } 
                });
                video.srcObject = stream;
                requestAnimationFrame(tick);
            } catch (e) {
                log.innerText = "CAMERA ERROR";
            }
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 解析解像度を300pxに絞って速度を稼ぐ
                canvas.width = 300; canvas.height = 300;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imgData.data, imgData.width, imgData.height);

                const now = Date.now();
                let foundThisFrame = null;

                if (code && nodeStates[code.data]) {
                    foundThisFrame = code.data;
                    const state = nodeStates[foundThisFrame];

                    if (!state.hasTriggered) {
                        // 【超高速反応】マッチした瞬間に赤点灯
                        resetAllVisuals(); // 他の警告などを一旦クリア
                        state.element.classList.add('active');
                        log.innerText = `MATCHED: ${foundThisFrame}`;
                        log.style.color = "#ff0000";
                        state.hasTriggered = true;
                        state.triggerTime = now;
                    } else if (now - state.triggerTime > 3000) {
                        // 【居座り防止】3秒出しっぱなしなら黄色
                        state.element.classList.remove('active');
                        state.element.classList.add('warning');
                        log.innerText = "MOVE AWAY / RE-SCAN";
                        log.style.color = "#ffcc00";
                    }
                    state.isPresent = true;
                }

                // すべてのノードに対して、画面から消えたかチェック
                for (const id in nodeStates) {
                    const state = nodeStates[id];
                    // 画面に映っていない場合、または別のQRが映った場合
                    if (foundThisFrame !== id && state.isPresent) {
                        // 消えた瞬間にリセットして再スキャンを可能にする
                        state.element.classList.remove('active', 'warning');
                        state.hasTriggered = false;
                        state.isPresent = false;
                        log.innerText = "SYSTEM READY";
                        log.style.color = "#fff";
                    }
                }
            }
            requestAnimationFrame(tick);
        }

        function resetAllVisuals() {
            for (const id in nodeStates) {
                nodeStates[id].element.classList.remove('active', 'warning');
            }
        }

        init();
    </script>
</body>
</html>
