<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vision Translate & Solve v2</title>
    <meta name="description" content="A redesigned and debugged WebXR tool for Vision Pro.">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .overlay-ui {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px;
            border-radius: 24px;
            background-color: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: white;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-sizing: border-box;
        }
        #main-controls {
            display: none; /* Initially hidden */
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        #ar-starter {
            display: block; /* Initially visible */
        }
        .primary-button {
            padding: 14px 30px;
            font-size: 17px;
            font-weight: 600;
            color: #333;
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .primary-button:active {
            transform: scale(0.95);
        }
        .primary-button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
        }
        #language-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 15px;
        }
        #status {
            min-height: 24px;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="ui-container" class="overlay-ui">
        <div id="status">Ready to start AR session</div>
        <div id="ar-starter">
            <button id="enter-ar-button" class="primary-button">Start AR</button>
        </div>
        <div id="main-controls">
            <button id="scan-button" class="primary-button">Scan</button>
            <select id="language-select">
                <option value="jpn">to Japanese (日本語)</option>
                <option value="eng">to English</option>
                <option value="spa">to Spanish</option>
                <option value="fra">to French</option>
                <option value="deu">to German</option>
                <option value="chi_sim">to Chinese (Simp)</option>
            </select>
        </div>
    </div>

    <a-scene vr-mode-ui="enabled: false">
        <a-camera>
            <a-cursor></a-cursor>
        </a-camera>
        <a-entity id="result-text" text="align: center; color: white; width: 3;" position="0 0 -2" visible="false"></a-entity>
        <a-entity id="graph-entity" position="0 0.2 -2.5" visible="false"></a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');
            const statusEl = document.getElementById('status');
            
            const arStarterEl = document.getElementById('ar-starter');
            const enterArButton = document.getElementById('enter-ar-button');
            
            const mainControlsEl = document.getElementById('main-controls');
            const scanButton = document.getElementById('scan-button');
            const languageSelect = document.getElementById('language-select');
            
            const resultTextEl = document.getElementById('result-text');
            const graphEntityEl = document.getElementById('graph-entity');

            let tesseractWorker;
            let isScanning = false;

            // --- AR Session Management ---
            enterArButton.addEventListener('click', async () => {
                statusEl.textContent = 'Requesting AR session...';
                try {
                    // A-Frame's enterVR() will trigger the WebXR session request
                    await sceneEl.enterVR();
                } catch (err) {
                    statusEl.textContent = 'AR session failed to start.';
                    console.error(err);
                }
            });

            sceneEl.addEventListener('enter-vr', () => {
                statusEl.textContent = 'AR Session Started. Initializing models...';
                arStarterEl.style.display = 'none';
                mainControlsEl.style.display = 'flex';
                scanButton.disabled = true;
                initializeTesseract();
            });

            sceneEl.addEventListener('exit-vr', () => {
                statusEl.textContent = 'Ready to start AR session';
                arStarterEl.style.display = 'block';
                mainControlsEl.style.display = 'none';
            });

            // --- Core Logic ---
            async function initializeTesseract() {
                const langs = 'eng+jpn+spa+fra+deu+chi_sim';
                tesseractWorker = await Tesseract.createWorker(langs, 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            statusEl.textContent = `Recognizing... ${Math.round(m.progress * 100)}%`;
                        } else if (m.status.startsWith('loading language')) {
                            statusEl.textContent = `Loading model: ${m.status.split(' ')[2]}...`;
                        }
                    }
                });
                statusEl.textContent = 'Ready to scan.';
                scanButton.disabled = false;
            }

            scanButton.addEventListener('click', async () => {
                if (isScanning || !tesseractWorker) return;

                isScanning = true;
                scanButton.disabled = true;
                statusEl.textContent = 'Scanning...';
                
                resultTextEl.setAttribute('visible', 'false');
                graphEntityEl.setAttribute('visible', 'false');
                while (graphEntityEl.firstChild) {
                    graphEntityEl.removeChild(graphEntityEl.firstChild);
                }

                try {
                    const screenshot = sceneEl.components.screenshot.getCanvas('perspective');
                    const selectedLang = languageSelect.value;
                    const { data: { text } } = await tesseractWorker.recognize(screenshot, { lang: selectedLang });
                    
                    if (text.trim()) {
                        statusEl.textContent = `Found: "${text.trim()}"`;
                        await processOcrResult(text.trim());
                    } else {
                        statusEl.textContent = 'No text found. Try again.';
                    }

                } catch (error) {
                    console.error('Scan failed:', error);
                    statusEl.textContent = 'Error: Could not recognize text.';
                } finally {
                    isScanning = false;
                    scanButton.disabled = false;
                }
            });

            async function processOcrResult(text) {
                if (/^y\s*=/i.test(text)) {
                    drawGraph(text);
                } else if (/[0-9]/.test(text) && /[\+\-\*\/\(\)\^!Clog]/.test(text)) {
                    try {
                        let mathText = text.replace(/(\d+)\s*C\s*(\d+)/g, 'combinations($1, $2)');
                        mathText = mathText.replace(/(\d+)!/g, '($1)!');
                        const result = math.evaluate(mathText);
                        displayResult(`${text} = ${result}`);
                    } catch (e) {
                        await translateText(text);
                    }
                }
                else {
                    await translateText(text);
                }
            }

            function displayResult(displayText) {
                resultTextEl.setAttribute('text', { value: displayText });
                resultTextEl.setAttribute('visible', 'true');
            }

            async function translateText(text) {
                statusEl.textContent = 'Translating...';
                const langMap = {'jpn': 'ja', 'eng': 'en', 'spa': 'es', 'fra': 'fr', 'deu': 'de', 'chi_sim': 'zh'};
                const targetLangCode = langMap[languageSelect.value] || 'ja';

                try {
                    const res = await fetch("https://libretranslate.de/translate", {
                        method: "POST",
                        body: JSON.stringify({ q: text, source: "auto", target: targetLangCode }),
                        headers: { "Content-Type": "application/json" }
                    });
                    if (!res.ok) throw new Error(`API error: ${res.statusText}`);
                    const { translatedText } = await res.json();
                    statusEl.textContent = 'Translation complete.';
                    displayResult(`${text}\n\n${translatedText}`);
                } catch (error) {
                    console.error('Translation failed:', error);
                    statusEl.textContent = 'Error: Translation failed.';
                    displayResult(`Could not translate:\n${text}`);
                }
            }

            function drawGraph(expression) {
                statusEl.textContent = 'Drawing graph...';
                try {
                    const expr = expression.replace(/^y\s*=\s*/i, '');
                    const code = math.parse(expr).compile();
                    const range = 10, segments = 50;
                    const geometry = new THREE.PlaneGeometry(range, range, segments, segments);
                    
                    for (let i = 0; i < geometry.attributes.position.array.length; i += 3) {
                        const x = geometry.attributes.position.array[i];
                        let y = 0;
                        try { y = code.evaluate({ x: x }); } catch (e) {}
                        geometry.attributes.position.array[i+1] = (isFinite(y) && Math.abs(y) < range * 2) ? y : 0;
                    }
                    geometry.attributes.position.needsUpdate = true;
                    geometry.computeVertexNormals();

                    const material = new THREE.MeshStandardMaterial({ color: 0x007AFF, side: THREE.DoubleSide, wireframe: true });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2;

                    graphEntityEl.setObject3D('mesh', mesh);
                    graphEntityEl.setAttribute('visible', 'true');
                    statusEl.textContent = 'Graph drawn successfully.';
                } catch (error) {
                    console.error('Graph drawing failed:', error);
                    statusEl.textContent = 'Error: Could not draw graph.';
                    displayResult(`Invalid function:\n${expression}`);
                }
            }
        });
    </script>
</body>
</html>
