<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactless System Prototype</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --container-width: 85vmin; }
        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; background-color: #121212; color: white; font-family: sans-serif;
        }

        /* 3x3 グリッド設定 */
        .container {
            width: var(--container-width);
            height: var(--container-width);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            background: #222;
            border-radius: 15px;
        }

        .icon-box {
            background-color: #4a90e2; /* デフォルト：青 */
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.8rem; font-weight: bold; transition: all 0.4s ease;
        }

        /* 1番目のブロック（左上）の「赤」状態 */
        #gate-01.status-red {
            background-color: #ff4757 !important;
            box-shadow: 0 0 20px #ff4757;
        }

        /* カメラのプレビュー（右下に配置） */
        #video-preview {
            position: fixed; bottom: 10px; right: 10px;
            width: 120px; height: 120px; object-fit: cover;
            border: 2px solid #444; border-radius: 50%; z-index: 100;
        }

        .log-area { margin-top: 15px; color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div style="margin-bottom:10px;">SYSTEM MONITOR</div>
    
    <div id="grid-container" class="container">
        </div>

    <div class="log-area" id="status-log">スキャン待機中...</div>

    <video id="video-preview" autoplay playsinline></video>
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const container = document.getElementById('grid-container');
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('hidden-canvas');
        const context = canvas.getContext('2d');
        const logArea = document.getElementById('status-log');
        
        let lastReadTime = 0;
        const TARGET_KEY = "UNLOCK-GATE-01"; // 反応させる鍵の文字列

        // 1. 3x3グリッド生成
        for (let i = 0; i < 9; i++) {
            const div = document.createElement('div');
            div.classList.add('icon-box');
            if (i === 0) {
                div.id = 'gate-01'; // 1番目のブロック
                div.innerText = "GATE 1";
            } else {
                div.innerText = "NODE " + (i + 1);
            }
            container.appendChild(div);
        }

        const gateBlock = document.getElementById('gate-01');

        // 2. カメラ起動
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                requestAnimationFrame(tick);
            } catch (err) {
                logArea.innerText = "カメラエラー: " + err.message;
            }
        }

        // 3. ループ処理
        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    const currentTime = Date.now();
                    // 2秒間のインターバルを置いて判定
                    if (currentTime - lastReadTime > 2000) {
                        if (code.data === TARGET_KEY) {
                            toggleColor();
                            logArea.innerText = "認証成功: " + code.data;
                            lastReadTime = currentTime;
                        } else {
                            logArea.innerText = "不明なコード: " + code.data;
                        }
                    }
                }
            }
            requestAnimationFrame(tick);
        }

        // 4. 色の切り替え（青 ↔ 赤）
        function toggleColor() {
            gateBlock.classList.toggle('status-red');
        }

        startCamera();
    </script>
</body>
</html>
