<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Glass Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --ios-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @-webkit-keyframes pageIn {
            from { -webkit-transform: scale(0.1); transform: scale(0.1); opacity: 0; }
            to   { -webkit-transform: scale(1);   transform: scale(1);   opacity: 1; }
        }
        @keyframes pageIn {
            from { -webkit-transform: scale(0.1); transform: scale(0.1); opacity: 0; }
            to   { -webkit-transform: scale(1);   transform: scale(1);   opacity: 1; }
        }

        @-webkit-keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(135deg, #ff4e00, #ea38ff, #5ca7ff);
            background-size: 400% 400%;
            -webkit-animation: gradientBG 15s ease infinite, pageIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation: gradientBG 15s ease infinite, pageIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            height: 100vh;
            margin: 0;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
        }

        .glass-panel {
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            background: var(--glass-bg);
            border-radius: 40px;
            padding: 40px 30px;
            padding-left: 4px;
            width: 320px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow:
                inset 1px -1px 11px rgba(255,255,255,.12),
                inset 1px -1px 55px rgba(255,255,255,.11),
                1px -1px 1px rgba(255,255,255,.62),
                -1px 1px 1px rgba(255,255,255,.62),
                0 10px 30px rgba(0,0,0,0.2);
        }

        .qr-wrapper {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 15px;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
        }

        #qrcode {
            -webkit-transition: -webkit-transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
            -webkit-transform: scale(0);
            transform: scale(0);
            opacity: 0;
        }
        #qrcode.active {
            -webkit-transform: scale(1);
            transform: scale(1);
            opacity: 1;
        }

        .text-clip {
            height: 1.5em;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #gate-label {
            color: white;
            font-weight: bold;
            font-family: monospace;
            -webkit-transform: translateY(100%);
            transform: translateY(100%);
            -webkit-transition: -webkit-transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #gate-label.show {
            -webkit-transform: translateY(0);
            transform: translateY(0);
        }

        .controls {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        select {
            background: black;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            -webkit-transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 1;
            -webkit-transform: translateY(0);
            transform: translateY(0);
            -webkit-appearance: none;
            appearance: none;
            font-size: 14px;
            outline: none;
        }

        input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
            color: white;
            outline: none;
            -webkit-transition: -webkit-transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            font-size: 14px;
            -webkit-appearance: none;
            appearance: none;
        }
        input::-webkit-input-placeholder { color: rgba(255,255,255,0.5); }
        input::placeholder { color: rgba(255,255,255,0.5); }

        .is-typing select {
            opacity: 0;
            -webkit-transform: translateY(20px);
            transform: translateY(20px);
            pointer-events: none;
        }
        .is-typing input {
            -webkit-transform: translateY(-45px);
            transform: translateY(-45px);
        }

        .reload-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-top: 15px;
            cursor: pointer;
            color: white;
            font-size: 20px;
            -webkit-transition: -webkit-transform 0.3s;
            transition: transform 0.3s;
            -webkit-appearance: none;
            outline: none;
        }
        .reload-btn:active {
            -webkit-transform: rotate(180deg) scale(0.9);
            transform: rotate(180deg) scale(0.9);
        }
    </style>
</head>
<body>

<div class="glass-panel" id="panel">
    <div class="qr-wrapper">
        <div id="qrcode"></div>
    </div>

    <div class="text-clip">
        <div id="gate-label">UNLOCK-GATE-01</div>
    </div>

    <div class="controls" id="controls-area">
        <select id="gate-selector"></select>
        <input type="text" id="custom-input" placeholder="Custom Text...">
        <button class="reload-btn" id="reload-btn">↻</button>
    </div>
</div>

<script>
    var qrcodeElement = document.getElementById("qrcode");
    var gateLabel     = document.getElementById("gate-label");
    var gateSelector  = document.getElementById("gate-selector");
    var controlsArea  = document.getElementById("controls-area");
    var customInput   = document.getElementById("custom-input");
    var reloadBtn     = document.getElementById("reload-btn");

    var qr = new QRCode(qrcodeElement, {
        width: 160,
        height: 160,
        colorDark:  "#ffffff",
        colorLight: "rgba(0,0,0,0)",
        correctLevel: QRCode.CorrectLevel.H
    });

    // Gate options
    for (var i = 1; i <= 9; i++) {
        var val = "UNLOCK-GATE-0" + i;
        var opt = document.createElement("option");
        opt.value     = val;
        opt.innerText = val;
        gateSelector.appendChild(opt);
    }

    function updateContent(text) {
        if (!text) return;

        qrcodeElement.classList.remove('active');
        gateLabel.classList.remove('show');

        setTimeout(function() {
            qr.makeCode(text);
            gateLabel.innerText = text;
            qrcodeElement.classList.add('active');
            gateLabel.classList.add('show');
        }, 200);
    }

    function handleInput(val) {
        if (val.length > 0) {
            controlsArea.classList.add('is-typing');
            updateContent(val);
        } else {
            controlsArea.classList.remove('is-typing');
            updateContent(gateSelector.value);
        }
    }

    function triggerReload() {
        document.body.style.animation = 'none';
        void document.body.offsetWidth; // reflow
        document.body.style.webkitAnimation = 'pageIn 0.5s cubic-bezier(0.2,0.8,0.2,1) forwards';
        document.body.style.animation        = 'pageIn 0.5s cubic-bezier(0.2,0.8,0.2,1) forwards';

        var currentVal = customInput.value || gateSelector.value;
        updateContent(currentVal);
    }

    // event listeners (iOS12 compatible)
    gateSelector.onchange = function() { updateContent(this.value); };
    customInput.oninput   = function() { handleInput(this.value); };
    reloadBtn.onclick     = function() { triggerReload(); };

    window.onload = function() { updateContent("UNLOCK-GATE-01"); };
</script>

</body>
</html>
