<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High-Speed Multi Gate iOS12</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --red: #ff0000; --yellow: #ffcc00; }
        body {
            margin: 0; background-color: #000; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            overflow: hidden; touch-action: none;
        }
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 90vw; height: 90vw; max-width: 450px; max-height: 450px;
        }
        .node {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 11px; font-weight: bold;
            transition: all 0.5s ease;
            -webkit-transition: all 0.5s ease; /* iOS12対策 */
        }
        /* 反応時：赤 + 拡大 */
        .node.active {
            background-color: var(--red) !important;
            box-shadow: 0 0 40px var(--red);
            border-color: #fff;
            transform: scale(1.15);
            -webkit-transform: scale(1.15);
            z-index: 10;
        }
        /* 出しっぱなし警告：黄 */
        .node.warning {
            background-color: var(--yellow) !important;
            box-shadow: 0 0 20px var(--yellow);
            color: #000;
            transform: scale(1.0);
            -webkit-transform: scale(1.0);
        }
        #video-preview {
            position: fixed; bottom: 15px; right: 15px;
            width: 85px; height: 85px; border-radius: 50%; 
            border: 2px solid #555; object-fit: cover;
            background: #000;
        }
        .status-text { margin-bottom: 20px; font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="log" class="status-text">SYSTEM READY</div>
    
    <div id="grid-container" class="grid"></div>

    <video id="video-preview" autoplay playsinline webkit-playsinline muted></video>
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        var video = document.getElementById('video-preview');
        var canvas = document.getElementById('hidden-canvas');
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        var log = document.getElementById('log');
        var gridContainer = document.getElementById('grid-container');

        var nodeStates = {};
        var NODE_COUNT = 9;

        // 初期化：ノード生成
        for (var i = 1; i <= NODE_COUNT; i++) {
            var id = "UNLOCK-GATE-0" + i;
            var div = document.createElement('div');
            div.id = id;
            div.className = 'node';
            div.innerHTML = '<span>GATE</span>' + i;
            gridContainer.appendChild(div);

            nodeStates[id] = {
                el: div,
                triggered: false,
                time: 0,
                present: false
            };
        }

        function start() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 480, height: 480 } 
            }).then(function(stream) {
                video.srcObject = stream;
                // iOS12対策: 再生が確実に開始されるように
                video.play();
                requestAnimationFrame(tick);
            }).catch(function(err) {
                log.innerText = "CAMERA ERROR";
            });
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 320; canvas.height = 320;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                var code = jsQR(imgData.data, imgData.width, imgData.height);

                var now = Date.now();
                var foundId = null;

                if (code && nodeStates[code.data]) {
                    foundId = code.data;
                    var state = nodeStates[foundId];

                    if (!state.triggered) {
                        // 瞬時に赤・拡大
                        state.el.classList.add('active');
                        log.innerText = "ACCESS: GATE " + foundId.slice(-2);
                        log.style.color = "#ff4444";
                        state.triggered = true;
                        state.time = now;
                    } else if (now - state.time > 3000) {
                        // 3秒経過で警告
                        state.el.classList.remove('active');
                        state.el.classList.add('warning');
                        log.innerText = "RE-SCAN REQUIRED";
                        log.style.color = "#ffcc00";
                    }
                    state.present = true;
                }

                // 全ノードのスキャン状態チェック
                for (var key in nodeStates) {
                    var s = nodeStates[key];
                    if (foundId !== key && s.present) {
                        // 画面から消えたらリセット
                        s.el.classList.remove('active', 'warning');
                        s.triggered = false;
                        s.present = false;
                        log.innerText = "SYSTEM READY";
                        log.style.color = "#fff";
                    }
                }
            }
            requestAnimationFrame(tick);
        }

        start();
    </script>
</body>
</html>
