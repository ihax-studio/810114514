<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed Gate System</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body {
            margin: 0; background-color: #000; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; font-family: 'Consolas', monospace; overflow: hidden;
        }
        /* 3x3グリッド */
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 90vw; height: 90vw; max-width: 500px; max-height: 500px;
        }
        .node {
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
        }
        /* 反応した瞬間の赤（最優先） */
        #gate-01.active {
            background-color: #ff0000 !important;
            box-shadow: 0 0 50px #ff0000;
            border-color: #ff4444;
            color: white;
        }
        /* 居座り警告の黄色 */
        #gate-01.warning {
            background-color: #ffcc00 !important;
            box-shadow: 0 0 30px #ffcc00;
            color: #000;
        }
        #video-preview {
            position: fixed; bottom: 10px; right: 10px;
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid #333;
        }
        .status-text {
            margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; height: 1.2em;
        }
    </style>
</head>
<body>

    <div id="log" class="status-text">SYSTEM READY</div>
    
    <div class="grid">
        <div id="gate-01" class="node">GATE 1</div>
        <div class="node">NODE 2</div> <div class="node">NODE 3</div>
        <div class="node">NODE 4</div> <div class="node">NODE 5</div> <div class="node">NODE 6</div>
        <div class="node">NODE 7</div> <div class="node">NODE 8</div> <div class="node">NODE 9</div>
    </div>

    <video id="video-preview" autoplay playsinline></video>
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const gate = document.getElementById('gate-01');
        const log = document.getElementById('log');

        const KEY = "UNLOCK-GATE-01";
        
        let hasTriggered = false; // 一度反応したか
        let triggerTime = 0;      // 反応した時刻
        let isCodePresent = false; // 今画面にあるか

        async function init() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 400, height: 400 } 
            });
            video.srcObject = stream;
            requestAnimationFrame(tick);
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 300; canvas.height = 300;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imgData.data, imgData.width, imgData.height);

                if (code && code.data === KEY) {
                    const now = Date.now();
                    
                    if (!hasTriggered) {
                        // 【0秒反応】瞬時に赤にする
                        gate.classList.add('active');
                        log.innerText = "ACCESS GRANTED";
                        log.style.color = "#ff0000";
                        hasTriggered = true;
                        triggerTime = now;
                    } else if (now - triggerTime > 3000) {
                        // 【3秒経過】出しっぱなしなら警告
                        gate.classList.remove('active');
                        gate.classList.add('warning');
                        log.innerText = "REMOVE QR CODE";
                        log.style.color = "#ffcc00";
                    }
                    isCodePresent = true;
                } else {
                    // 【リセット】画面からQRが消えたら全リセット
                    if (isCodePresent) {
                        gate.classList.remove('active', 'warning');
                        log.innerText = "SYSTEM READY";
                        log.style.color = "#fff";
                        hasTriggered = false;
                        isCodePresent = false;
                    }
                }
            }
            requestAnimationFrame(tick);
        }

        init();
    </script>
</body>
</html>
