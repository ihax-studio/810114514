<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Ultimate Debug Pro Plus</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root { --ios-ease: cubic-bezier(0.23, 1, 0.32, 1); }
        * { touch-action: manipulation; box-sizing: border-box; font-family: -apple-system, "SF Pro Display", sans-serif; -webkit-user-select: none; }
        
        body, html { 
            margin: 0; padding: 0; height: 100dvh; width: 100vw; 
            background: #f2f2f7; overflow: hidden; display: flex; flex-direction: column;
        }

        /* Hover Scale 1.3 for Apple Pencil/Mouse */
        .interactive-btn { 
            cursor: pointer; 
            transition: transform 0.5s var(--ios-ease), background 0.3s, opacity 0.3s; 
        }
        @media (hover: hover) {
            .interactive-btn:hover { transform: scale(1.3) !important; z-index: 9999; }
        }

        .container-box { width: calc(100% - 20px); margin: 8px auto; border-radius: 20px; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.05); overflow: hidden; position: relative; transition: 0.5s var(--ios-ease); }
        #preview-section { flex: 1.2; z-index: 10; }
        #preview-section.fullscreen { position: fixed; inset: 0; margin: 0; width: 100%; height: 100%; border-radius: 0; z-index: 8000; }
        #output-frame { width: 100%; height: 100%; border: none; background: #fff; }

        /* Scrollable Raw Input */
        #editor-section { flex: 0.8; display: flex; margin-bottom: 90px; z-index: 20; }
        #raw-editor { 
            flex: 1; border: none; padding: 20px; outline: none; 
            font-family: "SF Mono", monospace; background: #fff; 
            -webkit-user-select: text; font-size: 14px; resize: none;
            overflow-y: auto !important; touch-action: pan-y !important; /* スクロール可能に */
        }

        /* Pressure Menu (Scale Up) */
        #pressure-menu {
            position: fixed; background: rgba(255,255,255,0.85); backdrop-filter: blur(25px);
            border-radius: 24px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; z-index: 10000;
            transform: scale(0.1); transition: transform 0.3s var(--ios-ease);
        }
        #pressure-menu.active { display: grid; transform: scale(1.2); }
        .menu-item {
            padding: 16px; background: #fff; border-radius: 16px; font-size: 20px;
            text-align: center; font-weight: 600; color: #000;
        }

        /* Color Picker Z-index Max */
        #native-picker { position: fixed; top: -100px; left: -100px; z-index: 2147483647; visibility: hidden; }
        
        #save-input-bar { 
            position: fixed; bottom: 25px; left: 15px; width: 280px; height: 50px; 
            background: white; border-radius: 25px; z-index: 4500; display: flex; 
            align-items: center; padding: 0 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            opacity: 0; pointer-events: none; transform: translateY(20px) scale(0.8); 
            transition: 0.4s var(--ios-ease); 
        }
        #save-input-bar.active { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        #monaco-container { position: fixed; inset: 0; background: #fff; z-index: 5000; display: none; opacity: 0; transition: 0.5s var(--ios-ease); flex-direction: column; }
        #monaco-container.active { display: flex; opacity: 1; }

        #color-trigger-btn {
            width: 50px; height: 50px; background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transform: scale(0); opacity: 0; transition: 0.3s;
        }
        #color-trigger-btn.visible { transform: scale(1); opacity: 1; }
        #color-preview-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #eee; }
    </style>
</head>
<body onclick="globalTap()">

    <div id="pressure-menu">
        <div class="menu-item interactive-btn" onclick="execCmd('undo')">←</div>
        <div class="menu-item interactive-btn" onclick="execCmd('redo')">→</div>
        <div class="menu-item interactive-btn" onclick="execCmd('all')">すべて選択</div>
        <div class="menu-item interactive-btn" onclick="execCmd('replace')">置き換え</div>
    </div>

    <div id="preview-section" class="container-box">
        <div id="expand-toggle-btn" class="interactive-btn" onclick="toggleFullscreen(event)" style="position:absolute; bottom:15px; right:15px; width:44px; height:44px; background:rgba(255,255,255,0.8); backdrop-filter:blur(10px); border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:8010; font-size:20px;">→</div>
        <div id="inspect-btn" class="interactive-btn" onclick="toggleInspect(event)" style="position:absolute; bottom:15px; left:15px; width:44px; height:44px; background:rgba(255,255,255,0.8); backdrop-filter:blur(10px); border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:8010; font-size:20px;">✒︎</div>
        <iframe id="output-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
    </div>

    <div id="editor-section" class="container-box">
        <textarea id="raw-editor" oninput="sync('input')" placeholder="Pinch out to open Monaco editor..."></textarea>
    </div>

    <div style="position:fixed; bottom:25px; left:15px; display:flex; gap:12px; z-index:4000;">
        <div id="btn-save" class="interactive-btn" style="width:50px; height:50px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">💾</div>
        <div class="interactive-btn" style="width:50px; height:50px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" onclick="toggleUI('monaco-container', true)">📝</div>
        <div id="color-trigger-btn" class="interactive-btn" onclick="openNativeColorPicker(event)">
            <div id="color-preview-dot"></div>
        </div>
    </div>

    <div id="save-input-bar">
        <input type="text" id="fn" value="index.html" style="border:none; outline:none; flex:1; background:transparent; font-size:16px; padding-left:10px;">
        <div class="interactive-btn" style="font-size:26px; color:#007aff; margin-right:10px;" onclick="downloadHtml(event)">→</div>
    </div>

    <input type="color" id="native-picker">

    <div id="monaco-container">
        <div id="monaco-body" style="flex:1;"></div>
        <div class="interactive-btn" style="position:absolute; bottom:30px; left:25px; width:60px; height:60px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1);" onclick="toggleUI('monaco-container', false)">←</div>
    </div>

    <script type="module">
        import { haptic } from "https://esm.sh/ios-haptics";
        window.haptic = haptic;

        let editor, isSyncing = false, isInspectMode = false;
        const raw = document.getElementById('raw-editor');
        const frame = document.getElementById('output-frame');
        const picker = document.getElementById('native-picker');
        const colorBtn = document.getElementById('color-trigger-btn');
        const saveBar = document.getElementById('save-input-bar');

        // --- Pressure & Command Logic ---
        const menu = document.getElementById('pressure-menu');
        window.addEventListener('pointermove', (e) => {
            const force = e.webkitForce || e.pressure * 2;
            if (force >= 1.8) {
                menu.style.left = `${e.clientX - 60}px`;
                menu.style.top = `${e.clientY - 60}px`;
                menu.classList.add('active');
                haptic.confirm();
            }
        });

        window.execCmd = async (type) => {
            raw.focus();
            if (type === 'undo') document.execCommand('undo');
            if (type === 'redo') document.execCommand('redo');
            if (type === 'all') raw.select();
            if (type === 'replace') {
                const clipText = await navigator.clipboard.readText();
                raw.value = ""; // 前のを消して
                document.execCommand('insertText', false, clipText); // ペースト
                sync('input');
            }
            menu.classList.remove('active');
            haptic();
        };

        // --- Save Logic (Tap vs Long Press) ---
        let saveStart = 0;
        const btnSave = document.getElementById('btn-save');
        btnSave.addEventListener('touchstart', (e) => {
            saveStart = Date.now();
        });
        btnSave.addEventListener('touchend', (e) => {
            const duration = Date.now() - saveStart;
            if (duration < 700) {
                saveBar.classList.add('active');
                haptic.confirm();
            } else {
                haptic.error();
                if(confirm("Reset Code?")) location.reload();
            }
        });

        // --- Pinch to Monaco ---
        let lastDist = 0;
        raw.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (lastDist > 0 && dist > lastDist + 50) {
                    toggleUI('monaco-container', true);
                    lastDist = 0;
                } else if (lastDist === 0) lastDist = dist;
            }
        });

        // --- Inspector (style search & jump) ---
        window.toggleInspect = (e) => {
            isInspectMode = !isInspectMode;
            document.getElementById('inspect-btn').style.background = isInspectMode ? '#007aff' : 'rgba(255,255,255,0.8)';
            haptic();
        };

        window.addEventListener('message', (e) => {
            if (e.data.type === 'inspect-result') {
                const code = raw.value;
                const searchStr = e.data.style; // 取得したstyle文字列
                const index = code.indexOf(searchStr);
                if (index !== -1) {
                    raw.focus();
                    raw.setSelectionRange(index, index + searchStr.length);
                    // スクロール位置調整
                    const lineHeight = 20; 
                    const lineNum = code.substr(0, index).split("\n").length;
                    raw.scrollTop = (lineNum - 5) * lineHeight;
                    haptic.confirm();
                }
            }
        });

        // --- Sync & Color Detect ---
        window.sync = (src) => {
            if (isSyncing) return; isSyncing = true;
            const val = (src === 'input') ? raw.value : editor.getValue();
            if (editor && src !== 'monaco') editor.setValue(val);
            
            const inject = `
                <script>
                    document.addEventListener('click', (e) => {
                        window.parent.postMessage({
                            type: 'inspect-result',
                            style: e.target.getAttribute('style') || e.target.tagName.toLowerCase()
                        }, '*');
                    });
                <\/script>
            `;
            frame.srcdoc = val + inject;
            detectColor();
            isSyncing = false;
        };

        let colorRange = null;
        function detectColor() {
            const text = raw.value;
            const pos = raw.selectionStart;
            const match = text.match(/#[0-9A-Fa-f]{6}/);
            if (match) {
                colorRange = { start: match.index, end: match.index + 7 };
                colorBtn.classList.add('visible');
                colorPreview-dot.style.background = match[0];
            } else { colorBtn.classList.remove('visible'); }
        }

        window.openNativeColorPicker = (e) => {
            e.stopPropagation();
            picker.click();
        };

        picker.oninput = (e) => {
            if (colorRange) {
                const text = raw.value;
                raw.value = text.substring(0, colorRange.start) + e.target.value + text.substring(colorRange.end);
                sync('input');
            }
        };

        // --- Monaco Setup ---
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-body'), { 
                value: raw.value, language: 'html', theme: 'vs', automaticLayout: true, fontSize: 16
            });
            editor.onDidChangeModelContent(() => sync('monaco'));
        });

        window.toggleUI = (id, show) => {
            const t = document.getElementById(id);
            if(show) { t.style.display='flex'; setTimeout(()=>t.classList.add('active'),10); haptic.confirm(); }
            else { t.classList.remove('active'); setTimeout(()=>t.style.display='none',400); haptic(); }
        };

        window.globalTap = () => { 
            menu.classList.remove('active'); 
            saveBar.classList.remove('active');
        };

        window.downloadHtml = (e) => {
            const blob = new Blob([raw.value], {type:'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = document.getElementById('fn').value;
            a.click();
            haptic.confirm();
        };
    </script>
</body>
</html>
