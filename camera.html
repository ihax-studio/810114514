<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BEAST TAKE</title>
  <link rel="icon" type="image/png" href="beasst.png">
  <link rel="apple-touch-icon" href="beasst.png">
  <link rel="manifest" href="manifestcamera.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      touch-action: pan-x pan-y;
      overscroll-behavior: none;
    }

    #camera-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #video-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.2s ease;
    }

    .dual-video {
      position: absolute;
      object-fit: cover;
      background: #000;
    }

    .dual-video::-webkit-media-controls {
      display: none !important;
    }
    .dual-video::-webkit-media-controls-enclosure {
      display: none !important;
    }
    .dual-video::-webkit-media-controls-panel {
      display: none !important;
    }

    #camera-select {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      z-index: 10;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }

    #lux-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.2);
      z-index: 10;
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }

    #lux-btn::before {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      border-radius: 50%;
    }

    #lux-btn:active {
      transform: scale(0.9);
    }

    #dual-btn {
      position: absolute;
      top: 20px;
      right: 80px;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.2);
      z-index: 10;
      transition: transform 0.1s ease, opacity 0.2s ease;
      touch-action: manipulation;
    }

    #dual-btn::before {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
    }

    #dual-btn:active {
      transform: scale(0.9);
    }

    #dual-btn.active {
      background: rgba(255, 215, 0, 0.9);
    }

    #dual-btn.disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Mobile optimization for dual capture */
    @media (max-width: 768px) {
      #dual-btn {
        width: 50px;
        height: 50px;
        font-size: 26px;
        right: 85px;
      }

      #lux-btn {
        width: 50px;
        height: 50px;
        font-size: 26px;
      }

      #camera-select {
        font-size: 14px;
        padding: 6px 12px;
        max-width: 150px;
      }

      #video-container {
        width: 100vw;
        height: 100vh;
      }

      .dual-video {
        width: 100% !important;
        height: auto !important;
      }
    }

    /* Ensure no overflow */
    @media (max-width: 480px) {
      #dual-btn {
        right: 75px;
      }

      #camera-select {
        font-size: 12px;
        padding: 4px 8px;
        max-width: 120px;
      }
    }

    #controls {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      padding: 0 20px;
      z-index: 10;
    }

    .btn {
      position: relative; /* for ::before pseudo-element */
      width: 70px;
      height: 70px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }

    /* Tappable area expansion */
    .btn::before {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      border-radius: 50%;
    }

    .btn:active {
      transform: scale(0.8);
    }

    #photo-btn {
      background-image: url('cam.png');
      width: 90px;
      height: 90px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3); /* Emphasized protective frame */
    }

    /* Larger tappable area for the main button */
    #photo-btn::before {
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -20px;
    }

    #video-btn {
      background-image: url('video.png');
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2); /* Protective frame */
    }

    #timer-btn {
      background-image: url('clock.png');
    }

    #focus-indicator {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid #FFD700;
      border-radius: 50%;
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      animation: focusAnimation 0.3s ease;
      z-index: 5;
    }

    @keyframes focusAnimation {
      0% {
        transform: scale(1.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .recording {
      background-image: url('video.png');
      border: 3px solid #ff0000;
      border-radius: 50%;
      animation: recordingPulse 1s infinite;
    }

    @keyframes recordingPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .timer-active {
      background-image: url('timer.png') !important;
    }

    /* Lux slider styles */
    .swipe-outer {
      width: 95vw;
      height: 77px;
      max-width: 600px;
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      overflow: hidden;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 1px -1px 11px rgba(85, 85, 85, 0.33),
                  inset 1px -1px 55px rgba(110, 110, 110, 0.38),
                  1px -1px 1px #e9e9e9,
                  -1px 1px 1px rgba(214, 214, 214, 0.91),
                  0 2px 25px rgba(111, 111, 111, 0.733);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.4, 2, 0.5, 1),
                  opacity 0.33s cubic-bezier(0.4, 2, 0.5, 1);
      pointer-events: none;
      z-index: 20;
    }

    .swipe-outer.active {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }

    .swipe-list {
      display: flex;
      gap: 15px;
      border-radius: 50px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      overflow-x: scroll;
      scroll-behavior: smooth;
      background: transparent;
    }

    .swipe-list::-webkit-scrollbar {
      display: none;
    }

    .swipe-item {
      font-size: 18px;
      color: #ffffff;
      opacity: 0.8;
      font-weight: 300;
      text-align: center;
      min-width: 55px;
      line-height: 1px;
      pointer-events: auto;
      letter-spacing: 1.7px;
      position: relative;
      transition: transform 0.7s cubic-bezier(0.5, 1.7, 0.5, 1),
                  color 0.4s ease-out,
                  opacity 0.4s ease-out;
      transform: translateY(-12px) scale(1);
    }

    .swipe-item.selected {
      color: #ffc63e;
      opacity: 1;
      font-weight: 330;
      transform: translateY(-14px) scale(1.1);
    }

    .gray-bar {
      position: absolute;
      bottom: -42px;
      left: 50%;
      width: 3px;
      height: 23px;
      border-radius: 2px;
      background: #cbcbcb;
      transform: translateX(-50%);
      transition: opacity 0.2s ease;
      opacity: 1;
    }

    .swipe-item.selected .gray-bar {
      opacity: 0;
    }

    .center-bar {
      pointer-events: none;
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      z-index: 10;
      width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .center-bar-dot {
      position: absolute;
      top: 38px;
      left: -2.5px;
      width: 4px;
      height: 13px;
      border-radius: 2.5px;
      background: #ffcd00;
      box-shadow: 0 2px 15px rgba(255, 209, 51, 0.47);
      z-index: 20;
      transition: transform 0.5s cubic-bezier(0.4, 2, 0.5, 1);
    }

    .tap-hint {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
    }

    /* Background overlay */
    #bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      display: none;
      z-index: 15;
      opacity: 0;
      transform: scale(0.8);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #bg-overlay.active {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    /* Hide video controls on iOS */
    #video::-webkit-media-controls {
      display: none !important;
    }
    #video::-webkit-media-controls-enclosure {
      display: none !important;
    }
    #video::-webkit-media-controls-panel {
      display: none !important;
    }

    /* Flash effect */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes flashEffect {
      0% {
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
      }
    }

    #flash-overlay.active {
      animation: flashEffect 0.4s ease-out;
    }

    /* Reload overlay */
    #reload-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 18px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    #reload-overlay.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="camera-container">
    <div id="video-container">
      <video id="video" autoplay playsinline></video>
    </div>

    <div id="bg-overlay"></div>
    <div id="flash-overlay"></div>
    <div id="reload-overlay">タップして再読み込み</div>

    <select id="camera-select"></select>

    <button id="lux-btn">☀️</button>
    <button id="dual-btn">⬜</button>

    <div id="focus-indicator"></div>

    <div class="swipe-outer" id="swipeOuter">
      <div class="swipe-list" id="swipe-list">
        <div class="swipe-item">0.3<div class="gray-bar"></div></div>
        <div class="swipe-item">0.7<div class="gray-bar"></div></div>
        <div class="swipe-item">1<div class="gray-bar"></div></div>
        <div class="swipe-item">1.3<div class="gray-bar"></div></div>
        <div class="swipe-item">1.7<div class="gray-bar"></div></div>
        <div class="swipe-item">2<div class="gray-bar"></div></div>
      </div>
      <div class="center-bar">
        <div class="center-bar-dot" id="center-bar-dot"></div>
      </div>
      <div class="tap-hint">タップして決定</div>
    </div>

    <div id="controls">
      <div id="video-btn" class="btn"></div>
      <div id="photo-btn" class="btn"></div>
      <div id="timer-btn" class="btn"></div>
    </div>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script type="module">
    import { haptic } from "https://esm.sh/ios-haptics";

    // Prevent default gestures
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    });

    // Audio elements
    const audioFiles = {
      shutter: new Audio('tock.mp3'),
      videoStart: new Audio('action.mp3'),
      videoStop: new Audio('tock.mp3'),
      timer: new Audio('long.mp3'),
      cancel: new Audio('mac.wav'),
      error: new Audio('wrong.mp3'),
      luxSound: new Audio('mac.wav')
    };

    // Elements
    const video = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');
    const photoBtn = document.getElementById('photo-btn');
    const videoBtn = document.getElementById('video-btn');
    const timerBtn = document.getElementById('timer-btn');
    const cameraSelect = document.getElementById('camera-select');
    const focusIndicator = document.getElementById('focus-indicator');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const luxBtn = document.getElementById('lux-btn');
    const dualBtn = document.getElementById('dual-btn');
    const swipeOuter = document.getElementById('swipeOuter');
    const swipeList = document.getElementById('swipe-list');
    const centerDot = document.getElementById('center-bar-dot');
    const bgOverlay = document.getElementById('bg-overlay');
    const flashOverlay = document.getElementById('flash-overlay');
    const reloadOverlay = document.getElementById('reload-overlay');

    // State
    let currentStream = null;
    let mediaRecorder = null;
    let isRecording = false;
    let timerTimeout = null;
    let isTimerActive = false;
    let currentDeviceId = null;
    let cameras = [];
    let currentTrack = null;
    let luxValue = 1;
    let bgState = 0;
    let lastTapTime = 0;
    let isDualMode = false;
    let dualStreams = [];
    let zoomLevel = 1;
    let isBlackout = false;
    let blackoutCheckInterval = null;

    // Pinch zoom state
    let initialDistance = 0;
    let initialZoom = 1;

    // Lux slider state
    const luxItems = Array.from(swipeList.querySelectorAll('.swipe-item'));
    let isDragging = false;
    let startX = 0;
    let scrollStart = 0;
    let snapDebounce = null;
    let ticking = false;
    let prevSelectedIndex = 2;

    // Haptic feedback functions
    const hapticRapidBurst = () => {
      const delay = 45;
      const sequence = [];
      for (let i = 0; i < 3; i++) {
        const base = i * 3.5;
        sequence.push(base, base + 1, base + 2);
      }
      sequence.forEach(i => {
        setTimeout(() => haptic.error(), i * delay);
      });
    };

    const hapticError = () => {
      const delay = 100;
      const sequence = [0, 1, 2, 4, 5, 6];
      sequence.forEach(i => {
        setTimeout(() => haptic.error(), i * delay);
      });
    };

    // Apply zoom
    function applyZoom(zoom) {
      if (!currentTrack) return;
      const capabilities = currentTrack.getCapabilities();
      if (capabilities.zoom) {
        const constraints = {
          advanced: [{ zoom: Math.min(Math.max(zoom, capabilities.zoom.min), capabilities.zoom.max) }]
        };
        currentTrack.applyConstraints(constraints).catch(err => {
          console.error('Zoom error:', err);
        });
      }
      zoomLevel = zoom;
    }

    // Flash effect
    function triggerFlash() {
      flashOverlay.classList.remove('active');
      void flashOverlay.offsetWidth; // Force reflow
      flashOverlay.classList.add('active');
      setTimeout(() => {
        flashOverlay.classList.remove('active');
      }, 400);
    }

    // Check if video is playing
    function isVideoPlaying(vid) {
      return !!(vid.currentTime > 0 && !vid.paused && !vid.ended && vid.readyState > 2);
    }

    // Check for blackout
    function checkBlackout() {
      if (isDualMode) {
        const videos = videoContainer.querySelectorAll('video');
        let anyPlaying = false;
        videos.forEach(vid => {
          if (isVideoPlaying(vid)) {
            anyPlaying = true;
          }
        });
        if (!anyPlaying && videos.length > 0) {
          isBlackout = true;
          reloadOverlay.classList.add('visible');
        } else {
          isBlackout = false;
          reloadOverlay.classList.remove('visible');
        }
      } else {
        if (!isVideoPlaying(video) && currentStream) {
          isBlackout = true;
          reloadOverlay.classList.add('visible');
        } else {
          isBlackout = false;
          reloadOverlay.classList.remove('visible');
        }
      }
    }

    // Start blackout check
    function startBlackoutCheck() {
      if (blackoutCheckInterval) {
        clearInterval(blackoutCheckInterval);
      }
      blackoutCheckInterval = setInterval(checkBlackout, 1000);
    }

    // Stop blackout check
    function stopBlackoutCheck() {
      if (blackoutCheckInterval) {
        clearInterval(blackoutCheckInterval);
        blackoutCheckInterval = null;
      }
      isBlackout = false;
      reloadOverlay.classList.remove('visible');
    }

    // Initialize camera
    async function initCamera(deviceId = null) {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 60 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        currentTrack = currentStream.getVideoTracks()[0];

        // Stop error sound if playing
        audioFiles.error.pause();
        audioFiles.error.currentTime = 0;

        await loadCameras();

        // Apply current zoom
        applyZoom(zoomLevel);

        // Start blackout check
        startBlackoutCheck();
      } catch (error) {
        console.error('Camera error:', error);
        audioFiles.error.loop = true;
        audioFiles.error.play();
      }
    }

    // Load available cameras
    async function loadCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cameras = devices.filter(device => device.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        cameras.forEach(camera => {
          const option = document.createElement('option');
          option.value = camera.deviceId;
          option.text = camera.label || `Camera ${cameras.indexOf(camera) + 1}`;
          cameraSelect.appendChild(option);
        });

        if (currentTrack) {
          const settings = currentTrack.getSettings();
          cameraSelect.value = settings.deviceId;
        }
      } catch (error) {
        console.error('Failed to load cameras:', error);
      }
    }

    // Camera select change
    cameraSelect.addEventListener('change', (e) => {
      hapticRapidBurst();
      audioFiles.luxSound.currentTime = 0;
      audioFiles.luxSound.play();
      initCamera(e.target.value);
    });

    // Apply lux filter
    function applyLuxFilter() {
      const brightness = 50 + (luxValue - 1) * 50;
      const contrast = 100 + (luxValue - 1) * 30;
      video.style.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
    }

    // Take photo
    async function takePhoto() {
      if (isDualMode) {
        takeDualPhoto();
        return;
      }

      // Trigger flash effect
      triggerFlash();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.filter = video.style.filter;
      ctx.drawImage(video, 0, 0);

      audioFiles.shutter.currentTime = 0;
      audioFiles.shutter.play();

      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `photo-${Date.now()}.jpg`;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.95);
    }

    // Take dual photo
    async function takeDualPhoto() {
      // Trigger flash effect
      triggerFlash();

      const videos = videoContainer.querySelectorAll('video');
      const totalWidth = video.videoWidth;
      const totalHeight = video.videoHeight;

      canvas.width = totalWidth;
      canvas.height = totalHeight;
      ctx.filter = video.style.filter;

      const numCameras = videos.length;

      if (numCameras === 2) {
        // 2 cameras: split vertically 50-50
        const halfHeight = totalHeight / 2;
        videos.forEach((vid, idx) => {
          ctx.drawImage(vid, 0, idx * halfHeight, totalWidth, halfHeight);
        });
      } else if (numCameras === 3) {
        // 3 cameras: split vertically 33.33-33.33-33.33
        const thirdHeight = totalHeight / 3;
        videos.forEach((vid, idx) => {
          ctx.drawImage(vid, 0, idx * thirdHeight, totalWidth, thirdHeight);
        });
      } else if (numCameras >= 4) {
        // 4+ cameras: 2x2 grid (max 4 cameras)
        const halfWidth = totalWidth / 2;
        const halfHeight = totalHeight / 2;
        for (let i = 0; i < Math.min(4, numCameras); i++) {
          const x = (i % 2) * halfWidth;
          const y = Math.floor(i / 2) * halfHeight;
          ctx.drawImage(videos[i], x, y, halfWidth, halfHeight);
        }
      }

      audioFiles.shutter.currentTime = 0;
      audioFiles.shutter.play();

      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dual-photo-${Date.now()}.jpg`;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.95);
    }

    // Start/stop video recording
    function toggleVideoRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      const options = {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 10000000
      };

      try {
        mediaRecorder = new MediaRecorder(currentStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(currentStream);
      }

      const chunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          chunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `video-${Date.now()}.webm`;
        a.click();
        URL.revokeObjectURL(url);

        // Play stop sound
        audioFiles.videoStop.currentTime = 0;
        audioFiles.videoStop.play();
      };

      mediaRecorder.start();
      isRecording = true;
      videoBtn.classList.add('recording');
      updateDualButtonState();

      // Play video start sound
      audioFiles.videoStart.currentTime = 0;
      audioFiles.videoStart.play();
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        videoBtn.classList.remove('recording');
        updateDualButtonState();
      }
    }

    // Update dual button state when recording changes
    function updateDualButtonState() {
      if (isRecording) {
        dualBtn.classList.add('disabled');
      } else {
        dualBtn.classList.remove('disabled');
      }
    }

    // Timer photo
    function startTimer() {
      if (isTimerActive) {
        // Cancel timer
        clearTimeout(timerTimeout);
        isTimerActive = false;
        photoBtn.classList.remove('timer-active');
        videoBtn.classList.remove('timer-active');
        timerBtn.classList.remove('timer-active');
        audioFiles.timer.pause();
        audioFiles.timer.currentTime = 0;
        return;
      }

      isTimerActive = true;
      photoBtn.classList.add('timer-active');
      videoBtn.classList.add('timer-active');
      timerBtn.classList.add('timer-active');

      // Play timer sound
      audioFiles.timer.currentTime = 0;
      audioFiles.timer.play();

      // Wait for timer sound to finish
      audioFiles.timer.onended = () => {
        if (isTimerActive) {
          takePhoto();
          isTimerActive = false;
          photoBtn.classList.remove('timer-active');
          videoBtn.classList.remove('timer-active');
          timerBtn.classList.remove('timer-active');
        }
      };
    }

    // Unified button action handlers for both touch and mouse
    const setupButtonEvents = (btn, action) => {
      let isPressed = false;

      const onPress = (e) => {
        e.preventDefault();
        if (isPressed) return; // Prevent re-triggering
        isPressed = true;
        btn.style.transform = 'scale(0.8)';
        action();
      };

      const onRelease = (e) => {
        e.preventDefault();
        if (!isPressed) return;
        isPressed = false;
        btn.style.transform = 'scale(1)';
      };

      btn.addEventListener('touchstart', onPress, { passive: false });
      btn.addEventListener('mousedown', onPress, { passive: false });

      btn.addEventListener('touchend', onRelease);
      btn.addEventListener('mouseup', onRelease);
      btn.addEventListener('mouseleave', onRelease); // Handle cursor leaving the button
    };

    // Define actions
    const photoAction = () => {
      hapticRapidBurst();
      if (isTimerActive) {
        haptic.confirm();
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
      } else {
        takePhoto();
      }
    };

    const videoAction = () => {
      hapticRapidBurst();
      if (isTimerActive) {
        haptic.confirm();
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
      } else {
        toggleVideoRecording();
      }
    };

    const timerAction = () => {
      hapticRapidBurst();
      startTimer();
    };

    // Assign actions to buttons
    setupButtonEvents(photoBtn, photoAction);
    setupButtonEvents(videoBtn, videoAction);
    setupButtonEvents(timerBtn, timerAction);

    // Dual camera mode
    async function toggleDualMode() {
      if (isRecording) {
        // Cannot switch while recording
        return;
      }

      // Play sound
      audioFiles.luxSound.currentTime = 0;
      audioFiles.luxSound.play();

      if (!isDualMode) {
        isDualMode = true;
        dualBtn.classList.add('active');

        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        videoContainer.innerHTML = '';

        const numCameras = Math.min(cameras.length, 4); // Max 4 cameras
        dualStreams = [];

        for (let i = 0; i < numCameras; i++) {
          const constraints = {
            video: {
              deviceId: { exact: cameras[i].deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            },
            audio: false
          };

          try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            dualStreams.push(stream);

            const vid = document.createElement('video');
            vid.autoplay = true;
            vid.playsInline = true;
            vid.srcObject = stream;
            vid.style.objectFit = 'cover';
            vid.classList.add('dual-video');

            // Ensure video fits within viewport
            vid.style.maxWidth = '100vw';
            vid.style.maxHeight = '100vh';

            if (numCameras === 2) {
              // 2 cameras: split vertically 50-50
              vid.style.width = '100%';
              vid.style.height = '50%';
              vid.style.top = (i * 50) + '%';
              vid.style.left = '0';
            } else if (numCameras === 3) {
              // 3 cameras: split vertically 33.33-33.33-33.33
              vid.style.width = '100%';
              vid.style.height = (100 / 3) + '%';
              vid.style.top = (i * (100 / 3)) + '%';
              vid.style.left = '0';
            } else if (numCameras === 4) {
              // 4 cameras: 2x2 grid
              vid.style.width = '50%';
              vid.style.height = '50%';
              vid.style.top = (Math.floor(i / 2) * 50) + '%';
              vid.style.left = ((i % 2) * 50) + '%';
            }

            videoContainer.appendChild(vid);
          } catch (err) {
            console.error('Failed to start camera', i, err);
          }
        }

        // Start blackout check for dual mode
        startBlackoutCheck();
      } else {
        // Exit dual mode and reload page
        location.reload();
      }
    }

    // Dual button handler with touch support
    const setupDualButtonEvents = () => {
      let isPressed = false;

      const onPress = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isPressed) return;
        if (isRecording) return; // Don't allow during recording

        isPressed = true;
        dualBtn.style.transform = 'scale(0.9)';

        // Trigger haptic immediately on press
        hapticRapidBurst();

        toggleDualMode();
      };

      const onRelease = (e) => {
        e.preventDefault();
        if (!isPressed) return;
        isPressed = false;
        dualBtn.style.transform = 'scale(1)';
      };

      dualBtn.addEventListener('touchstart', onPress, { passive: false });
      dualBtn.addEventListener('mousedown', onPress, { passive: false });
      dualBtn.addEventListener('touchend', onRelease, { passive: false });
      dualBtn.addEventListener('mouseup', onRelease, { passive: false });
      dualBtn.addEventListener('mouseleave', onRelease, { passive: false });
    };

    setupDualButtonEvents();

    // Pinch zoom
    videoContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const touch1 = e.touches[0];
        const touch2 = e.touches[1];
        initialDistance = Math.hypot(
          touch2.clientX - touch1.clientX,
          touch2.clientY - touch1.clientY
        );
        initialZoom = zoomLevel;
      }
    }, { passive: false });

    videoContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const touch1 = e.touches[0];
        const touch2 = e.touches[1];
        const currentDistance = Math.hypot(
          touch2.clientX - touch1.clientX,
          touch2.clientY - touch1.clientY
        );
        const scale = currentDistance / initialDistance;
        const newZoom = Math.max(1, Math.min(10, initialZoom * scale));
        applyZoom(newZoom);
      }
    }, { passive: false });

    // Lux button handler with touch support
    const setupLuxButtonEvents = () => {
      let isPressed = false;

      const onPress = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isPressed) return;

        isPressed = true;
        luxBtn.style.transform = 'scale(0.9)';

        // Trigger haptic immediately on press
        hapticRapidBurst();

        audioFiles.luxSound.currentTime = 0;
        audioFiles.luxSound.play();
        swipeOuter.classList.add('active');
        setupPadding();
        scrollToItem(prevSelectedIndex, 'auto');
        setTimeout(() => {
          updateSelected();
        }, 120);
      };

      const onRelease = (e) => {
        e.preventDefault();
        if (!isPressed) return;
        isPressed = false;
        luxBtn.style.transform = 'scale(1)';
      };

      luxBtn.addEventListener('touchstart', onPress, { passive: false });
      luxBtn.addEventListener('mousedown', onPress, { passive: false });
      luxBtn.addEventListener('touchend', onRelease, { passive: false });
      luxBtn.addEventListener('mouseup', onRelease, { passive: false });
      luxBtn.addEventListener('mouseleave', onRelease, { passive: false });
    };

    setupLuxButtonEvents();

    // Lux slider functions
    function getClosestItemIndex() {
      const o = swipeOuter.getBoundingClientRect().left + swipeOuter.offsetWidth / 2;
      let i = 0;
      let m = Infinity;
      luxItems.forEach((e, n) => {
        const r = e.getBoundingClientRect();
        const c = r.left + r.width / 2;
        const d = Math.abs(o - c);
        if (d < m) {
          i = n;
          m = d;
        }
      });
      return i;
    }

    function updateSelected() {
      const i = getClosestItemIndex();
      luxItems.forEach((e, n) => {
        e.classList.toggle('selected', n === i);
      });
      moveCenterBarToItem(i);
      if (i !== prevSelectedIndex) {
        haptic.confirm();
        prevSelectedIndex = i;
      }
    }

    function scrollToItem(i, b = 'smooth') {
      const e = luxItems[i];
      const o = swipeOuter.offsetWidth / 2;
      const t = e.offsetLeft + e.offsetWidth / 2 - o;
      swipeList.scrollTo({ left: t, behavior: b });
    }

    function moveCenterBarToItem(i) {
      const e = luxItems[i];
      const ir = e.getBoundingClientRect();
      const or = swipeOuter.getBoundingClientRect();
      const off = (ir.left + ir.width / 2) - (or.left + or.width / 2);
      centerDot.style.transform = `translateX(${off}px)`;
    }

    function debounceSnap() {
      clearTimeout(snapDebounce);
      snapDebounce = setTimeout(() => {
        const i = getClosestItemIndex();
        scrollToItem(i);
      }, 150);
    }

    function setupPadding() {
      const f = luxItems[0];
      const l = luxItems[luxItems.length - 1];
      const w = swipeOuter.offsetWidth;
      const pL = (w - f.offsetWidth) / 2;
      const pR = (w - l.offsetWidth) / 2;
      swipeList.style.padding = `38px ${pR}px 50px ${pL}px`;
    }

    function handleDragStart(e) {
      isDragging = true;
      swipeList.style.cursor = 'grabbing';
      swipeList.style.scrollBehavior = 'auto';
      if (e.touches) {
        startX = e.touches[0].pageX - swipeList.offsetLeft;
      } else {
        startX = e.pageX - swipeList.offsetLeft;
      }
      scrollStart = swipeList.scrollLeft;
      clearTimeout(snapDebounce);
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      let x;
      if (e.touches) {
        x = e.touches[0].pageX - swipeList.offsetLeft;
      } else {
        x = e.pageX - swipeList.offsetLeft;
      }
      const walk = x - startX;
      swipeList.scrollLeft = scrollStart - walk;
    }

    function handleDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      swipeList.style.cursor = 'grab';
      swipeList.style.scrollBehavior = 'smooth';
      debounceSnap();
    }

    function handleScroll() {
      if (!ticking) {
        requestAnimationFrame(() => {
          updateSelected();
          ticking = false;
        });
        ticking = true;
      }
      if (!isDragging) {
        debounceSnap();
      }
    }

    swipeList.addEventListener('mousedown', handleDragStart);
    swipeList.addEventListener('mousemove', handleDragMove);
    document.addEventListener('mouseup', handleDragEnd);
    swipeList.addEventListener('mouseleave', handleDragEnd);
    swipeList.addEventListener('touchstart', handleDragStart, { passive: true });
    swipeList.addEventListener('touchmove', handleDragMove, { passive: false });
    swipeList.addEventListener('touchend', handleDragEnd);
    swipeList.addEventListener('scroll', handleScroll);

    // Click on slider to confirm
    swipeOuter.addEventListener('click', (e) => {
      if (!swipeOuter.classList.contains('active')) return;
      haptic.confirm();
      const i = getClosestItemIndex();
      const value = parseFloat(luxItems[i].textContent);
      luxValue = value;
      applyLuxFilter();
      swipeOuter.classList.remove('active');
    });

    // Focus control - tap on video
    videoContainer.addEventListener('click', (e) => {
      // Ignore if slider is active
      if (swipeOuter.classList.contains('active')) return;

      // If blackout, reload page
      if (isBlackout) {
        location.reload();
        return;
      }

      const rect = videoContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Show focus indicator
      focusIndicator.style.left = `${x - 40}px`;
      focusIndicator.style.top = `${y - 40}px`;
      focusIndicator.style.display = 'block';

      // Haptic feedback
      hapticError();

      setTimeout(() => {
        focusIndicator.style.display = 'none';
      }, 2000);
    });

    // Double tap for background overlay (only when recording)
    video.addEventListener('dblclick', (e) => {
      if (!isRecording) return;

      hapticRapidBurst();

      if (bgState === 0) {
        // Show bg1.jpg
        bgOverlay.style.backgroundImage = 'url(bg1.jpg)';
        bgOverlay.classList.add('active');
        bgState = 1;
      } else if (bgState === 1) {
        // Switch to bg2.png
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
        bgOverlay.style.backgroundImage = 'url(bg2.png)';
        bgState = 2;
      } else if (bgState === 2) {
        // Close
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
        bgOverlay.classList.remove('active');
        bgState = 0;
      }
    });

    // Background overlay tap for switching
    bgOverlay.addEventListener('click', (e) => {
      e.stopPropagation();

      if (bgState === 1) {
        // Switch to bg2.png
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
        bgOverlay.style.backgroundImage = 'url(bg2.png)';
        bgState = 2;
      } else if (bgState === 2) {
        // Close
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
        bgOverlay.classList.remove('active');
        bgState = 0;
      }
    });

    // Reload page when coming back from background
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        // Reload when page becomes visible again
        location.reload();
      }
    });

    // Reload overlay click handler
    reloadOverlay.addEventListener('click', () => {
      location.reload();
    });

    // Initialize
    initCamera();
    applyLuxFilter();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
