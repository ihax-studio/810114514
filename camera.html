<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BEAST TAKE</title>
  <link rel="icon" type="image/png" href="beasst.png">
  <link rel="apple-touch-icon" href="beasst.png">
  <link rel="manifest" href="manifestcamera.json">
  <style>
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      touch-action: pan-x pan-y;
      overscroll-behavior: none;
    }

    #camera-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #video-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.2s ease;
    }


    #camera-select {
      position: absolute;
      bottom: 155px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      font-size: 16px;
       backdrop-filter: blur(5px) saturate(55%);
      -webkit-backdrop-filter: blur(5px) saturate(0%);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgb(0 0 0 / 5%);
      color: white;
      z-index: 10;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }

    #lux-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
            border: .1px solid rgb(255 255 255 / 30%);
         backdrop-filter: blur(5px) saturate(55%);
      -webkit-backdrop-filter: blur(5px) saturate(0%);
      border-radius: 50%;
      background: rgb(255 255 255 / 2%);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
        box-shadow: 0 2px 19px rgba(0, 0, 0, 0.2);
      z-index: 10;
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }

    #lux-btn::before {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      border-radius: 50%;
    }

    #lux-btn:active {
      transform: scale(0.9);
    }

    /* Mobile optimization */
    @media (max-width: 768px) {
      #lux-btn {
        width: 50px;
        height: 50px;
        font-size: 26px;
      }

      #camera-select {
        font-size: 14px;
        padding: 6px 12px;
        max-width: 150px;
      }

      #video-container {
        width: 100vw;
        height: 100vh;
      }
    }

    /* Ensure no overflow */
    @media (max-width: 480px) {
      #camera-select {
        font-size: 12px;
        padding: 4px 8px;
        max-width: 120px;
      }
    }

    #controls {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      padding: 0 20px;
      z-index: 10;
    }

    .btn {
      position: relative; /* for ::before pseudo-element */
      width: 70px;
      height: 70px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }

    /* Tappable area expansion */
    .btn::before {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      border-radius: 50%;
    }

    .btn:active {
      transform: scale(0.8);
    }

    #photo-btn {
      background-image: url('cam.png');
      width: 90px;
      height: 90px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3); /* Emphasized protective frame */
    }

    /* Larger tappable area for the main button */
    #photo-btn::before {
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -20px;
    }

    #video-btn {
      background-image: url('video.png');
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2); /* Protective frame */
    }

    #timer-btn {
      background-image: url('clock.png');
    }

    #focus-indicator {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid #FFD700;
      border-radius: 50%;
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      animation: focusAnimation 0.3s ease;
      z-index: 5;
    }

    @keyframes focusAnimation {
      0% {
        transform: scale(1.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .recording {
      background-image: url('video.png');
      border: 3px solid #ff0000;
      border-radius: 50%;
      animation: recordingPulse 1s infinite;
    }

    @keyframes recordingPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .timer-active {
      background-image: url('timer.png') !important;
    }

    /* Lux slider styles */
    .swipe-outer {
       backdrop-filter: blur(5px) saturate(280%);
      -webkit-backdrop-filter: blur(5px) saturate(200%);
      width: 95vw;
      height: 77px;
      max-width: 600px;
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      overflow: hidden;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 1px -1px 11px rgb(255 255 255 / 33%),
                  inset 1px -1px 55px rgba(110, 110, 110, 0.38),
                  1px -1px 1px #e9e9e9,
                  -1px 1px 1px rgba(214, 214, 214, 0.91),
                  0 2px 25px rgb(168 168 168 / 73%);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.4, 2, 0.5, 1),
                  opacity 0.33s cubic-bezier(0.4, 2, 0.5, 1);
      pointer-events: none;
      z-index: 20;
    }

    .swipe-outer.active {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }

    .swipe-list {
      display: flex;
      gap: 15px;
      border-radius: 50px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      overflow-x: scroll;
      scroll-behavior: smooth;
      background: transparent;
    }

    .swipe-list::-webkit-scrollbar {
      display: none;
    }

    .swipe-item {
      font-size: 18px;
      color: #ffffff;
      opacity: 0.8;
      font-weight: 300;
      text-align: center;
      min-width: 55px;
      line-height: 1px;
      pointer-events: auto;
      letter-spacing: 1.7px;
      position: relative;
      transition: transform 0.7s cubic-bezier(0.5, 1.7, 0.5, 1),
                  color 0.4s ease-out,
                  opacity 0.4s ease-out;
      transform: translateY(-12px) scale(1);
    }

    .swipe-item.selected {
      color: #ffc63e;
      opacity: 1;
      font-weight: 330;
      transform: translateY(-14px) scale(1.1);
    }

    .gray-bar {
      position: absolute;
      bottom: -42px;
      left: 50%;
      width: 3px;
      height: 23px;
      border-radius: 2px;
      background: #cbcbcb;
      transform: translateX(-50%);
      transition: opacity 0.2s ease;
      opacity: 1;
    }

    .swipe-item.selected .gray-bar {
      opacity: 0;
    }

    .center-bar {
      pointer-events: none;
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      z-index: 10;
      width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .center-bar-dot {
      position: absolute;
      top: 38px;
      left: -2.5px;
      width: 4px;
      height: 13px;
      border-radius: 2.5px;
      background: #ffcd00;
      box-shadow: 0 2px 15px rgba(255, 209, 51, 0.47);
      z-index: 20;
      transition: transform 0.5s cubic-bezier(0.4, 2, 0.5, 1);
    }

    .tap-hint {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
    }

    /* Background overlay */
    #bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      display: none;
      z-index: 15;
      opacity: 0;
      transform: scale(0.8);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #bg-overlay.active {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    /* Hide video controls on iOS */
    #video::-webkit-media-controls {
      display: none !important;
    }
    #video::-webkit-media-controls-enclosure {
      display: none !important;
    }
    #video::-webkit-media-controls-panel {
      display: none !important;
    }

    /* Flash effect */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes flashEffect {
      0% {
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
      }
    }

    #flash-overlay.active {
      animation: flashEffect 0.4s ease-out;
    }

    /* Reload overlay */
    #reload-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 18px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    #reload-overlay.visible {
      opacity: 1;
    }

    /* Recording timer - SF font with Liquid Glass style */
    #recording-timer {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 25px;
      backdrop-filter: blur(2px) saturate(100%);
      -webkit-backdrop-filter: blur(2px) saturate(100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      background:#ff006c69;
      border-radius: 33px;
      box-shadow:
        inset 0 1px 1px rgb(255 255 255 / 40%),
        inset 0 -1px 1px rgb(255 255 255 / 10%),
        0 8px 32px rgb(255 0 0 / 10%),
        0 2px 28px rgba(255, 0, 0, 0.2);
      color: #ffffff;
      font-size: 22px;
      font-weight: 200;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      letter-spacing: 1px;
      text-shadow:
        0 1px 22px rgb(255 0 205 / 30%),
        0 0 10px rgba(255, 0, 0, 0.3);
    }

    #recording-timer.visible {
      opacity: 1;
    }

    /* Permission overlay */
    #permission-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
    }

    #permission-overlay.visible {
      display: flex;
    }

    #permission-message {
      text-align: center;
      color: white;
      padding: 40px;
    }

    #permission-message h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #ff6b6b;
    }

    #permission-message p {
      font-size: 18px;
      line-height: 1.6;
    }

    /* ZIP download button */
    #zip-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 20px;
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.2) 0%,
        rgba(255, 255, 255, 0.1) 100%);
      backdrop-filter: blur(5px) saturate(280%);
      -webkit-backdrop-filter: blur(5px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 55px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.1s ease, opacity 0.3s ease;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        0 4px 33px rgba(0, 0, 0, 0.11);
      opacity: 0;
      pointer-events: none;
    }

    #zip-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    #zip-btn:active {
      transform: scale(0.95);
    }

    #zip-btn::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <div id="camera-container">
    <div id="video-container">
      <video id="video" autoplay playsinline></video>
    </div>

    <div id="bg-overlay"></div>
    <div id="flash-overlay"></div>
    <div id="reload-overlay">タップして再読み込み</div>
    <div id="recording-timer">00:00:00</div>

    <div id="permission-overlay">
      <div id="permission-message">
        <h2>カメラの許可が必要です</h2>
        <p>許可を押してください</p>
        <p style="margin-top: 20px; font-size: 16px; color: #aaa;">タップで再読み込み</p>
      </div>
    </div>

    <select id="camera-select"></select>

    <button id="lux-btn">☀️</button>
    <button id="zip-btn">📦 ZIP保存 (<span id="zip-count">0</span>)</button>

    <div id="focus-indicator"></div>

    <div class="swipe-outer" id="swipeOuter">
      <div class="swipe-list" id="swipe-list">
        <div class="swipe-item">0.3<div class="gray-bar"></div></div>
        <div class="swipe-item">0.7<div class="gray-bar"></div></div>
        <div class="swipe-item">1<div class="gray-bar"></div></div>
        <div class="swipe-item">1.3<div class="gray-bar"></div></div>
        <div class="swipe-item">1.7<div class="gray-bar"></div></div>
        <div class="swipe-item">2<div class="gray-bar"></div></div>
      </div>
      <div class="center-bar">
        <div class="center-bar-dot" id="center-bar-dot"></div>
      </div>
      <div class="tap-hint">タップして決定</div>
    </div>

    <div id="controls">
      <div id="video-btn" class="btn"></div>
      <div id="photo-btn" class="btn"></div>
      <div id="timer-btn" class="btn"></div>
    </div>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script type="module">
    import { haptic } from "https://esm.sh/ios-haptics";
    import JSZip from "https://esm.sh/jszip@3.10.1";

    // Prevent default gestures
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    });

    // Audio elements
    const audioFiles = {
      shutter: new Audio('tock.mp3'),
      videoStart: new Audio('action.mp3'),
      videoStop: new Audio('tock.mp3'),
      timer: new Audio('long.mp3'),
      cancel: new Audio('mac.wav'),
      error: new Audio('wrong.mp3'),
      luxSound: new Audio('mac.wav')
    };

    // Elements
    const video = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');
    const photoBtn = document.getElementById('photo-btn');
    const videoBtn = document.getElementById('video-btn');
    const timerBtn = document.getElementById('timer-btn');
    const cameraSelect = document.getElementById('camera-select');
    const focusIndicator = document.getElementById('focus-indicator');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const luxBtn = document.getElementById('lux-btn');
    const swipeOuter = document.getElementById('swipeOuter');
    const swipeList = document.getElementById('swipe-list');
    const centerDot = document.getElementById('center-bar-dot');
    const bgOverlay = document.getElementById('bg-overlay');
    const flashOverlay = document.getElementById('flash-overlay');
    const reloadOverlay = document.getElementById('reload-overlay');
    const recordingTimer = document.getElementById('recording-timer');
    const permissionOverlay = document.getElementById('permission-overlay');
    const zipBtn = document.getElementById('zip-btn');
    const zipCount = document.getElementById('zip-count');

    // State
    let currentStream = null;
    let mediaRecorder = null;
    let isRecording = false;
    let timerTimeout = null;
    let isTimerActive = false;
    let currentDeviceId = null;
    let cameras = [];
    let currentTrack = null;
    let luxValue = 1;
    let bgState = 0;
    let lastTapTime = 0;
    let zoomLevel = 1;
    let isBlackout = false;
    let blackoutCheckInterval = null;
    let recordingStartTime = 0;
    let recordingTimerInterval = null;
    let blackoutStartTime = null;

    // ZIP保存用の配列
    let capturedFiles = [];

    // Update ZIP button display
    function updateZipButton() {
      zipCount.textContent = capturedFiles.length;
      if (capturedFiles.length > 0) {
        zipBtn.classList.add('active');
      } else {
        zipBtn.classList.remove('active');
      }
    }

    // Download all files as ZIP
    async function downloadZip() {
      if (capturedFiles.length === 0) {
        return;
      }

      hapticConfirm();
      audioFiles.luxSound.currentTime = 0;
      audioFiles.luxSound.play();

      const zip = new JSZip();

      // Add all captured files to ZIP
      for (const file of capturedFiles) {
        zip.file(file.filename, file.blob);
      }

      // Generate ZIP file
      try {
        const zipBlob = await zip.generateAsync({
          type: 'blob',
          compression: 'DEFLATE',
          compressionOptions: { level: 6 }
        });

        // Download ZIP
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `capture-${Date.now()}.zip`;
        a.click();
        URL.revokeObjectURL(url);

        // Clear captured files
        capturedFiles = [];
        updateZipButton();

        hapticRapidBurst();
      } catch (error) {
        console.error('ZIP generation error:', error);
        audioFiles.error.currentTime = 0;
        audioFiles.error.play();
      }
    }

    // Pinch zoom state
    let initialDistance = 0;
    let initialZoom = 1;

    // Haptic initialization flag
    let hapticInitialized = false;

    // Lux slider state
    const luxItems = Array.from(swipeList.querySelectorAll('.swipe-item'));
    let isDragging = false;
    let startX = 0;
    let scrollStart = 0;
    let snapDebounce = null;
    let ticking = false;
    let prevSelectedIndex = 2;

    // Initialize haptic - call this on first user interaction
    const initializeHaptic = () => {
      if (!hapticInitialized) {
        try {
          haptic.confirm();
          hapticInitialized = true;
        } catch (e) {
          console.log('Haptic initialization:', e);
        }
      }
    };

    // Haptic feedback functions
    const hapticRapidBurst = () => {
      initializeHaptic();
      const delay = 45;
      const sequence = [];
      for (let i = 0; i < 3; i++) {
        const base = i * 3.5;
        sequence.push(base, base + 1, base + 2);
      }
      sequence.forEach(i => {
        setTimeout(() => haptic.error(), i * delay);
      });
    };

    const hapticError = () => {
      initializeHaptic();
      const delay = 100;
      const sequence = [0, 1, 2, 4, 5, 6];
      sequence.forEach(i => {
        setTimeout(() => haptic.error(), i * delay);
      });
    };

    const hapticConfirm = () => {
      initializeHaptic();
      try {
        haptic.confirm();
      } catch (e) {
        console.log('Haptic confirm error:', e);
      }
    };

    // Recording timer functions
    function updateRecordingTimer() {
      const elapsed = Date.now() - recordingStartTime;
      const hours = Math.floor(elapsed / 3600000);
      const minutes = Math.floor((elapsed % 3600000) / 60000);
      const seconds = Math.floor((elapsed % 60000) / 1000);

      const timeString =
        String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');

      recordingTimer.textContent = timeString;
    }

    function startRecordingTimer() {
      recordingStartTime = Date.now();
      recordingTimer.textContent = '00:00:00';
      recordingTimer.classList.add('visible');

      if (recordingTimerInterval) {
        clearInterval(recordingTimerInterval);
      }

      recordingTimerInterval = setInterval(updateRecordingTimer, 100);
    }

    function stopRecordingTimer() {
      if (recordingTimerInterval) {
        clearInterval(recordingTimerInterval);
        recordingTimerInterval = null;
      }
      recordingTimer.classList.remove('visible');
    }

    // Apply zoom
    function applyZoom(zoom) {
      if (!currentTrack) return;
      const capabilities = currentTrack.getCapabilities();
      if (capabilities.zoom) {
        const constraints = {
          advanced: [{ zoom: Math.min(Math.max(zoom, capabilities.zoom.min), capabilities.zoom.max) }]
        };
        currentTrack.applyConstraints(constraints).catch(err => {
          console.error('Zoom error:', err);
        });
      }
      zoomLevel = zoom;
    }

    // Flash effect
    function triggerFlash() {
      flashOverlay.classList.remove('active');
      void flashOverlay.offsetWidth; // Force reflow
      flashOverlay.classList.add('active');
      setTimeout(() => {
        flashOverlay.classList.remove('active');
      }, 400);
    }

    // Check if video is playing
    function isVideoPlaying(vid) {
      return !!(vid.currentTime > 0 && !vid.paused && !vid.ended && vid.readyState > 2);
    }

    // Check for blackout
    function checkBlackout() {
      if (!isVideoPlaying(video) && currentStream) {
        // ブラックアウト開始時刻を記録
        if (blackoutStartTime === null) {
          blackoutStartTime = Date.now();
        }

        // 1.5秒経過したら再読み込みオーバーレイを表示
        const elapsed = Date.now() - blackoutStartTime;
        if (elapsed >= 1500) {
          isBlackout = true;
          reloadOverlay.classList.add('visible');
        }
      } else {
        // 正常に戻ったらリセット
        isBlackout = false;
        blackoutStartTime = null;
        reloadOverlay.classList.remove('visible');
      }
    }

    // Start blackout check
    function startBlackoutCheck() {
      if (blackoutCheckInterval) {
        clearInterval(blackoutCheckInterval);
      }
      blackoutStartTime = null;
      blackoutCheckInterval = setInterval(checkBlackout, 100);
    }

    // Stop blackout check
    function stopBlackoutCheck() {
      if (blackoutCheckInterval) {
        clearInterval(blackoutCheckInterval);
        blackoutCheckInterval = null;
      }
      isBlackout = false;
      reloadOverlay.classList.remove('visible');
    }

    // Initialize camera
    async function initCamera(deviceId = null) {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 60 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        currentTrack = currentStream.getVideoTracks()[0];

        // Stop error sound if playing
        audioFiles.error.pause();
        audioFiles.error.currentTime = 0;

        // Hide permission overlay if visible
        permissionOverlay.classList.remove('visible');

        await loadCameras();

        // Apply current zoom
        applyZoom(zoomLevel);

        // Start blackout check
        startBlackoutCheck();
      } catch (error) {
        console.error('Camera error:', error);

        // Check if error is permission denied
        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
          // Show permission overlay
          permissionOverlay.classList.add('visible');

          // Stop error sound
          audioFiles.error.pause();
          audioFiles.error.currentTime = 0;
        } else {
          // For other errors, play error sound
          audioFiles.error.loop = true;
          audioFiles.error.play();
        }
      }
    }

    // Load available cameras
    async function loadCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cameras = devices.filter(device => device.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        cameras.forEach(camera => {
          const option = document.createElement('option');
          option.value = camera.deviceId;
          option.text = camera.label || `Camera ${cameras.indexOf(camera) + 1}`;
          cameraSelect.appendChild(option);
        });

        if (currentTrack) {
          const settings = currentTrack.getSettings();
          cameraSelect.value = settings.deviceId;
        }
      } catch (error) {
        console.error('Failed to load cameras:', error);
      }
    }

    // Camera select change
    cameraSelect.addEventListener('change', (e) => {
      // 確実にhapticを発生させる
      hapticConfirm();
      hapticRapidBurst();
      audioFiles.luxSound.currentTime = 0;
      audioFiles.luxSound.play();
      initCamera(e.target.value);
    });

    // Apply lux filter
    function applyLuxFilter() {
      // 1の時に2倍の明るさ（200%）、2の時に4倍の明るさ（400%）
      const brightness = 100 * Math.pow(1.3, luxValue - 0.3);
      const contrast = 100 + (luxValue - 0.3) * 20;
      video.style.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
    }

    // Take photo
    async function takePhoto() {
      // Trigger flash effect
      triggerFlash();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.filter = video.style.filter;
      ctx.drawImage(video, 0, 0);

      audioFiles.shutter.currentTime = 0;
      audioFiles.shutter.play();

      canvas.toBlob(blob => {
        const timestamp = Date.now();
        const filename = `photo-${timestamp}.jpg`;

        // ZIP用に保存
        capturedFiles.push({
          type: 'photo',
          blob: blob,
          filename: filename,
          timestamp: timestamp
        });

        // ZIP保存ボタンを更新
        updateZipButton();
      }, 'image/jpeg', 0.95);
    }

    // Start/stop video recording
    function toggleVideoRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      // iOS用の高画質MP4対応設定
      const options = {
        mimeType: 'video/mp4;codecs=h264',
        videoBitsPerSecond: 20000000  // 20Mbps - 高画質長時間録画対応
      };

      try {
        mediaRecorder = new MediaRecorder(currentStream, options);
      } catch (e) {
        // MP4が使えない場合、webmで試す（高ビットレート維持）
        try {
          const webmOptions = {
            mimeType: 'video/webm;codecs=h264',
            videoBitsPerSecond: 20000000
          };
          mediaRecorder = new MediaRecorder(currentStream, webmOptions);
        } catch (e2) {
          // どちらも使えない場合、デフォルトで（高ビットレート維持）
          mediaRecorder = new MediaRecorder(currentStream, { videoBitsPerSecond: 20000000 });
        }
      }

      const chunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          chunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        // MP4フォーマットで保存
        const mimeType = mediaRecorder.mimeType || 'video/mp4';
        const blob = new Blob(chunks, { type: mimeType });
        const timestamp = Date.now();

        // 拡張子をMP4に設定
        const extension = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const filename = `video-${timestamp}.${extension}`;

        // ZIP用に保存
        capturedFiles.push({
          type: 'video',
          blob: blob,
          filename: filename,
          timestamp: timestamp
        });

        // ZIP保存ボタンを更新
        updateZipButton();

        // Play stop sound
        audioFiles.videoStop.currentTime = 0;
        audioFiles.videoStop.play();
      };

      // 長時間録画対応：1秒ごとにデータを取得（メモリ効率化）
      mediaRecorder.start(1000);
      isRecording = true;
      videoBtn.classList.add('recording');

      // Start recording timer
      startRecordingTimer();

      // Play video start sound
      audioFiles.videoStart.currentTime = 0;
      audioFiles.videoStart.play();
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        videoBtn.classList.remove('recording');

        // Stop recording timer
        stopRecordingTimer();
      }
    }

    // Timer photo
    function startTimer() {
      if (isTimerActive) {
        // Cancel timer
        clearTimeout(timerTimeout);
        isTimerActive = false;
        photoBtn.classList.remove('timer-active');
        videoBtn.classList.remove('timer-active');
        timerBtn.classList.remove('timer-active');
        audioFiles.timer.pause();
        audioFiles.timer.currentTime = 0;
        return;
      }

      isTimerActive = true;
      photoBtn.classList.add('timer-active');
      videoBtn.classList.add('timer-active');
      timerBtn.classList.add('timer-active');

      // Play timer sound
      audioFiles.timer.currentTime = 0;
      audioFiles.timer.play();

      // Wait for timer sound to finish
      audioFiles.timer.onended = () => {
        if (isTimerActive) {
          takePhoto();
          isTimerActive = false;
          photoBtn.classList.remove('timer-active');
          videoBtn.classList.remove('timer-active');
          timerBtn.classList.remove('timer-active');
        }
      };
    }

    // Unified button action handlers for both touch and mouse
    const setupButtonEvents = (btn, action) => {
      let isPressed = false;

      const onPress = (e) => {
        e.preventDefault();
        if (isPressed) return; // Prevent re-triggering
        isPressed = true;
        btn.style.transform = 'scale(0.8)';
        action();
      };

      const onRelease = (e) => {
        e.preventDefault();
        if (!isPressed) return;
        isPressed = false;
        btn.style.transform = 'scale(1)';
      };

      btn.addEventListener('touchstart', onPress, { passive: false });
      btn.addEventListener('mousedown', onPress, { passive: false });

      btn.addEventListener('touchend', onRelease);
      btn.addEventListener('mouseup', onRelease);
      btn.addEventListener('mouseleave', onRelease); // Handle cursor leaving the button
    };

    // Define actions
    const photoAction = () => {
      // 画像自体にhapticを確実に発生させる
      initializeHaptic();
      hapticConfirm();
      hapticRapidBurst();

      // さらに確実にするため追加のhaptic
      try {
        haptic.confirm();
        haptic.error();
      } catch (e) {
        console.log('Additional haptic:', e);
      }

      if (isTimerActive) {
        hapticConfirm();
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
      } else {
        takePhoto();
      }
    };

    const videoAction = () => {
      // 確実にhapticを発生させる（複数回）
      hapticConfirm();
      hapticError(); // 6回のhaptic
      hapticRapidBurst(); // 追加のhaptic

      // さらに確実にするため
      haptic.error();
      setTimeout(() => haptic.error(), 50);
      setTimeout(() => haptic.error(), 100);

      if (isTimerActive) {
        hapticConfirm();
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
      } else {
        toggleVideoRecording();
      }
    };

    const timerAction = () => {
      // 確実にhapticを発生させる
      hapticConfirm();
      hapticRapidBurst();
      startTimer();
    };

    // Assign actions to buttons
    setupButtonEvents(photoBtn, photoAction);
    setupButtonEvents(videoBtn, videoAction);
    setupButtonEvents(timerBtn, timerAction);

    // Pinch zoom
    videoContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const touch1 = e.touches[0];
        const touch2 = e.touches[1];
        initialDistance = Math.hypot(
          touch2.clientX - touch1.clientX,
          touch2.clientY - touch1.clientY
        );
        initialZoom = zoomLevel;
      }
    }, { passive: false });

    videoContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const touch1 = e.touches[0];
        const touch2 = e.touches[1];
        const currentDistance = Math.hypot(
          touch2.clientX - touch1.clientX,
          touch2.clientY - touch1.clientY
        );
        const scale = currentDistance / initialDistance;
        const newZoom = Math.max(1, Math.min(10, initialZoom * scale));
        applyZoom(newZoom);
      }
    }, { passive: false });

    // Lux button handler with touch support
    const setupLuxButtonEvents = () => {
      let isPressed = false;

      const onPress = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isPressed) return;

        isPressed = true;
        luxBtn.style.transform = 'scale(0.9)';

        // 確実にhapticを発生させる
        hapticConfirm();
        hapticRapidBurst();

        audioFiles.luxSound.currentTime = 0;
        audioFiles.luxSound.play();
        swipeOuter.classList.add('active');
        setupPadding();
        scrollToItem(prevSelectedIndex, 'auto');
        setTimeout(() => {
          updateSelected();
        }, 120);
      };

      const onRelease = (e) => {
        e.preventDefault();
        if (!isPressed) return;
        isPressed = false;
        luxBtn.style.transform = 'scale(1)';
      };

      luxBtn.addEventListener('touchstart', onPress, { passive: false });
      luxBtn.addEventListener('mousedown', onPress, { passive: false });
      luxBtn.addEventListener('touchend', onRelease, { passive: false });
      luxBtn.addEventListener('mouseup', onRelease, { passive: false });
      luxBtn.addEventListener('mouseleave', onRelease, { passive: false });
    };

    setupLuxButtonEvents();

    // ZIP button event handler
    const setupZipButtonEvents = () => {
      let isPressed = false;

      const onPress = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isPressed || capturedFiles.length === 0) return;

        isPressed = true;
        zipBtn.style.transform = 'scale(0.95)';
        downloadZip();
      };

      const onRelease = (e) => {
        e.preventDefault();
        if (!isPressed) return;
        isPressed = false;
        zipBtn.style.transform = 'scale(1)';
      };

      zipBtn.addEventListener('touchstart', onPress, { passive: false });
      zipBtn.addEventListener('mousedown', onPress, { passive: false });
      zipBtn.addEventListener('touchend', onRelease, { passive: false });
      zipBtn.addEventListener('mouseup', onRelease, { passive: false });
      zipBtn.addEventListener('mouseleave', onRelease, { passive: false });
    };

    setupZipButtonEvents();

    // Lux slider functions
    function getClosestItemIndex() {
      const o = swipeOuter.getBoundingClientRect().left + swipeOuter.offsetWidth / 2;
      let i = 0;
      let m = Infinity;
      luxItems.forEach((e, n) => {
        const r = e.getBoundingClientRect();
        const c = r.left + r.width / 2;
        const d = Math.abs(o - c);
        if (d < m) {
          i = n;
          m = d;
        }
      });
      return i;
    }

    function updateSelected() {
      const i = getClosestItemIndex();
      luxItems.forEach((e, n) => {
        e.classList.toggle('selected', n === i);
      });
      moveCenterBarToItem(i);
      if (i !== prevSelectedIndex) {
        hapticConfirm();
        prevSelectedIndex = i;
      }
    }

    function scrollToItem(i, b = 'smooth') {
      const e = luxItems[i];
      const o = swipeOuter.offsetWidth / 2;
      const t = e.offsetLeft + e.offsetWidth / 2 - o;
      swipeList.scrollTo({ left: t, behavior: b });
    }

    function moveCenterBarToItem(i) {
      const e = luxItems[i];
      const ir = e.getBoundingClientRect();
      const or = swipeOuter.getBoundingClientRect();
      const off = (ir.left + ir.width / 2) - (or.left + or.width / 2);
      centerDot.style.transform = `translateX(${off}px)`;
    }

    function debounceSnap() {
      clearTimeout(snapDebounce);
      snapDebounce = setTimeout(() => {
        const i = getClosestItemIndex();
        scrollToItem(i);
      }, 150);
    }

    function setupPadding() {
      const f = luxItems[0];
      const l = luxItems[luxItems.length - 1];
      const w = swipeOuter.offsetWidth;
      const pL = (w - f.offsetWidth) / 2;
      const pR = (w - l.offsetWidth) / 2;
      swipeList.style.padding = `38px ${pR}px 50px ${pL}px`;
    }

    function handleDragStart(e) {
      isDragging = true;
      swipeList.style.cursor = 'grabbing';
      swipeList.style.scrollBehavior = 'auto';
      if (e.touches) {
        startX = e.touches[0].pageX - swipeList.offsetLeft;
      } else {
        startX = e.pageX - swipeList.offsetLeft;
      }
      scrollStart = swipeList.scrollLeft;
      clearTimeout(snapDebounce);
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      let x;
      if (e.touches) {
        x = e.touches[0].pageX - swipeList.offsetLeft;
      } else {
        x = e.pageX - swipeList.offsetLeft;
      }
      const walk = x - startX;
      swipeList.scrollLeft = scrollStart - walk;
    }

    function handleDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      swipeList.style.cursor = 'grab';
      swipeList.style.scrollBehavior = 'smooth';
      debounceSnap();
    }

    function handleScroll() {
      if (!ticking) {
        requestAnimationFrame(() => {
          updateSelected();
          ticking = false;
        });
        ticking = true;
      }
      if (!isDragging) {
        debounceSnap();
      }
    }

    swipeList.addEventListener('mousedown', handleDragStart);
    swipeList.addEventListener('mousemove', handleDragMove);
    document.addEventListener('mouseup', handleDragEnd);
    swipeList.addEventListener('mouseleave', handleDragEnd);
    swipeList.addEventListener('touchstart', handleDragStart, { passive: true });
    swipeList.addEventListener('touchmove', handleDragMove, { passive: false });
    swipeList.addEventListener('touchend', handleDragEnd);
    swipeList.addEventListener('scroll', handleScroll);

    // Click on slider to confirm
    swipeOuter.addEventListener('click', (e) => {
      if (!swipeOuter.classList.contains('active')) return;
      // 確実にhapticを発生させる
      hapticConfirm();
      const i = getClosestItemIndex();
      const value = parseFloat(luxItems[i].textContent);
      luxValue = value;
      applyLuxFilter();
      swipeOuter.classList.remove('active');
    });

    // Focus control - tap on video / Show bg when recording
    videoContainer.addEventListener('click', (e) => {
      // Ignore if slider is active
      if (swipeOuter.classList.contains('active')) return;

      // If blackout, reload page
      if (isBlackout) {
        location.reload();
        return;
      }

      // If recording, show bg1.jpg immediately
      if (isRecording) {
        // 確実にhapticを発生させる
        hapticConfirm();
        hapticRapidBurst();

        if (bgState === 0) {
          // Show bg1.jpg
          bgOverlay.style.backgroundImage = 'url(bg1.jpg)';
          bgOverlay.classList.add('active');
          bgState = 1;
        }
        return;
      }

      const rect = videoContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Show focus indicator
      focusIndicator.style.left = `${x - 40}px`;
      focusIndicator.style.top = `${y - 40}px`;
      focusIndicator.style.display = 'block';

      // Haptic feedback
      hapticError();

      setTimeout(() => {
        focusIndicator.style.display = 'none';
      }, 2000);
    });

    // Background overlay tap for switching
    bgOverlay.addEventListener('click', (e) => {
      e.stopPropagation();

      // 確実にhapticを発生させる
      hapticConfirm();
      hapticRapidBurst();

      if (bgState === 1) {
        // Switch to bg2.png
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
        bgOverlay.style.backgroundImage = 'url(bg2.png)';
        bgState = 2;
      } else if (bgState === 2) {
        // Close
        audioFiles.cancel.currentTime = 0;
        audioFiles.cancel.play();
        bgOverlay.classList.remove('active');
        bgState = 0;
      }
    });

    // Reload page when coming back from background
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        // Reload when page becomes visible again
        location.reload();
      }
    });

    // Reload overlay click handler
    reloadOverlay.addEventListener('click', () => {
      hapticConfirm();
      location.reload();
    });

    // Permission overlay click handler
    permissionOverlay.addEventListener('click', () => {
      hapticConfirm();
      location.reload();
    });

    // Initialize
    initCamera();
    applyLuxFilter();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
