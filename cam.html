<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>カメラ</title>
<script type="module">
import{haptic}from"https://esm.sh/ios-haptics";
const n=()=>{};window.H=haptic||{};
['error','success','warning','impact','selection','notification','confirm'].forEach(m=>{if(typeof window.H[m]!=='function')window.H[m]=n;});
window.hap=()=>{try{window.H();}catch(e){}};
window.hap.confirm=()=>{try{window.H.confirm();}catch(e){}};
window.hap.error=()=>{try{window.H.error();}catch(e){}};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}
body{background:#000;color:#fff;font-family:'SF Pro Display','SF Pro Text',system-ui,sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#vf{flex:1;position:relative;overflow:hidden;background:#111}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#ctrls{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+20px);background:#000;flex-shrink:0;position:relative}
.cb{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s,transform .15s}
.cb:active{transform:scale(.88)}
.cb.dim{opacity:.3;pointer-events:none}
#sh{width:72px;height:72px;border-radius:50%;background:transparent;border:4px solid rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
#sh:active{transform:scale(.88)}
#sh .inn{width:58px;height:58px;border-radius:50%;background:#fff}
#top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px)+28px) 16px 8px}
.tb{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .2s,transform .15s}
.tb:active{transform:scale(.85)}
.tb.on{background:rgba(255,204,0,.7);color:#000}
#photo-count{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:#fff;opacity:0;transition:opacity .3s;pointer-events:none}
#photo-count.show{opacity:1}
#pvb-float{position:absolute;bottom:16px;left:50%;z-index:8;transform:translateX(-50%) translateY(80px);opacity:0;transition:transform .5s cubic-bezier(.34,1.05,.64,1),opacity .4s ease;pointer-events:none}
#pvb-float.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
#pvb-float button{background:rgba(255,255,255,.25);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);border-radius:55px;padding:10px 20px;color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}
#pvb-float button:active{transform:scale(.9)}
.pvb-thumb{width:28px;height:28px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,.5)}
/* Gallery */
#gal{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#gal.show{display:flex}
#gal-hdr{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px)+8px) 12px 8px 72px;background:rgba(0,0,0,.8);z-index:2;gap:4px;flex-shrink:0;position:relative}
#gal-hdr button{background:none;border:none;color:#fff;font-size:14px;cursor:pointer;font-family:inherit;padding:8px 10px;border-radius:10px}
#gal-hdr button:active{background:rgba(255,255,255,.1)}
#gal-hdr .del{color:#ff3b30}
#gal-hdr .edit{color:#007aff}
#gal-title{flex:1;text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.6)}
#gal-track{flex:1;display:flex;overflow:hidden;position:relative}
#gal-slider{display:flex;height:100%;transition:transform .3s ease}
.gal-slide{flex-shrink:0;width:100vw;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal-slide img{max-width:100%;max-height:100%;object-fit:contain;transition:filter .2s}
#gal-dots{display:flex;justify-content:center;gap:5px;padding:8px;flex-shrink:0}
.gd{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .2s}
.gd.on{background:#fff;width:14px;border-radius:3px}
#gal-bar{display:flex;align-items:center;justify-content:center;padding:12px 16px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+12px);background:rgba(0,0,0,.8);gap:12px;flex-shrink:0}
#gal-bar button{background:none;border:none;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;padding:10px 20px;border-radius:55px}
#gal-bar .sv{background:rgba(0,122,255,.9);font-weight:600}
/* Editor */
#editor{display:none;padding:16px 20px 8px;background:rgba(0,0,0,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0}
#editor.show{display:block}
.ed-row{margin-bottom:14px}
.ed-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.ed-slider{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:14px;outline:none;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.ed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}
#sl-sat{background:linear-gradient(90deg,#888,#ff6b6b,#ffd93d,#6bcf7f,#4ecdc4,#a78bfa)}
#sl-bri{background:linear-gradient(90deg,#000,#fff)}
#sl-bp{background:linear-gradient(90deg,#000,#333)}
/* Camera select */
#cs{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px)+20px);background:rgba(0,0,0,0);visibility:hidden;pointer-events:none;transition:background .3s ease}
#cs.show{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.5)}
#cl{width:300px;background:rgba(30,30,32,.95);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border-radius:20px;overflow:hidden;text-align:center;translate:0 140px;scale:.85;opacity:0;transition:translate .3s cubic-bezier(.34,1.05,.64,1),scale .3s ease,opacity .25s ease}
#cs.show #cl{translate:0 0;scale:1;opacity:1}
.co{padding:16px;font-size:17px;color:#007aff;border:none;background:none;width:100%;cursor:pointer;font-family:inherit;border-bottom:1px solid rgba(255,255,255,.08);transition:background .15s}
.co:active{background:rgba(255,255,255,.08)}
.co:last-child{border:none}
.co.x{color:rgba(255,255,255,.4)}
/* Close confirm */
#cd{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;visibility:hidden;pointer-events:none;transition:background .3s}
#cd.show{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.5)}
#cc{width:280px;background:rgba(245,245,247,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:16px;overflow:hidden;text-align:center;transform:scale(1.3);opacity:0;transition:transform .3s ease,opacity .3s ease}
#cd.show #cc{transform:scale(1);opacity:1}
#err{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#err.show{display:flex}
#sec-note{position:absolute;top:-28px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.5);padding:0 20px;pointer-events:none;line-height:1.4}
</style>
</head>
<body>
<div id="vf">
  <video id="cam" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="top">
    <div id="photo-count"></div>
    <button class="tb" id="wb" onclick="toggleWB()">☀︎</button>
  </div>
  <div id="pvb-float"><button onclick="openGallery()"><img class="pvb-thumb" id="pvb-thumb" src="">撮影した写真を表示</button></div>
</div>
<div id="ctrls">
  <button class="cb" id="sp" onclick="splitCapture()">⬜⬛</button>
  <div id="sh" onclick="capture()"><div class="inn"></div></div>
  <button class="cb" id="sw" onclick="openCS()">↔︎</button>
  <div id="sec-note"></div>
</div>
<div id="gal">
  <div id="gal-hdr">
    <button onclick="closeGallery()" style="position:absolute;left:12px">閉じる</button>
    <div id="gal-title"></div>
    <button class="edit" onclick="toggleEditor()">編集</button>
    <button class="del" onclick="deletePhoto()">削除</button>
  </div>
  <div id="gal-track"><div id="gal-slider"></div></div>
  <div id="gal-dots"></div>
  <div id="editor">
    <div class="ed-row"><div class="ed-label">彩度</div><input type="range" class="ed-slider" id="sl-sat" min="0" max="200" value="100"></div>
    <div class="ed-row"><div class="ed-label">明るさ</div><input type="range" class="ed-slider" id="sl-bri" min="50" max="150" value="100"></div>
    <div class="ed-row"><div class="ed-label">ブラックポイント</div><input type="range" class="ed-slider" id="sl-bp" min="80" max="150" value="100"></div>
  </div>
  <div id="gal-bar">
    <button onclick="tryCloseGallery()">キャンセル</button>
    <button class="sv" onclick="commitEdit()">編集完了</button>
  </div>
</div>
<div id="cs"><div id="cl"></div></div>
<!-- Discard edits confirm -->
<div id="dc" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;visibility:hidden;pointer-events:none;transition:background .3s">
  <div id="dcc" style="width:280px;background:rgba(245,245,247,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:16px;overflow:hidden;text-align:center;transform:scale(1.3);opacity:0;transition:transform .3s ease,opacity .3s ease">
    <div style="padding:22px 20px 10px">
      <div style="font-size:17px;font-weight:700;color:#000;margin-bottom:6px">保存しなくてもよろしいですか？</div>
      <div style="font-size:13px;color:rgba(0,0,0,.5);line-height:1.5">編集内容は破棄されます</div>
    </div>
    <div style="border-top:1px solid rgba(0,0,0,.1);display:flex">
      <button onclick="dcCancel()" style="flex:1;padding:14px;font-size:16px;color:#007aff;background:none;border:none;border-right:1px solid rgba(0,0,0,.1);cursor:pointer;font-family:inherit;font-weight:500">編集に戻る</button>
      <button onclick="dcDiscard()" style="flex:1;padding:14px;font-size:16px;color:#ff3b30;background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600">破棄</button>
    </div>
  </div>
</div>
<div id="cd">
  <div id="cc">
    <div style="padding:22px 20px 10px">
      <div style="font-size:17px;font-weight:700;color:#000;margin-bottom:6px">撮影した写真をまとめて保存</div>
      <div id="cd-txt" style="font-size:13px;color:rgba(0,0,0,.5);line-height:1.5"></div>
    </div>
    <div style="border-top:1px solid rgba(0,0,0,.1);display:flex">
      <button onclick="cdSkip()" style="flex:1;padding:14px;font-size:16px;color:rgba(0,0,0,.4);background:none;border:none;border-right:1px solid rgba(0,0,0,.1);cursor:pointer;font-family:inherit">しない</button>
      <button onclick="cdSave()" style="flex:1;padding:14px;font-size:16px;color:#007aff;background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600">保存</button>
    </div>
  </div>
</div>
<div id="err">
  <div style="font-size:48px">📷</div>
  <div style="font-size:16px;text-align:center;padding:0 40px;opacity:.7">カメラへのアクセスが<br>拒否されました</div>
  <button onclick="goBack()" style="margin-top:12px;padding:12px 28px;border-radius:55px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;font-family:inherit">ホームに戻る</button>
</div>
<script>
let photos=[],stream=null,curDev=null,devs=[],wbOn=false;
const MAX=12,cam=document.getElementById('cam');

async function startCam(devId){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    const c=devId?{video:{deviceId:{exact:devId}},audio:false}:{video:{facingMode:'environment',width:{ideal:1920}},audio:false};
    stream=await navigator.mediaDevices.getUserMedia(c);
    cam.srcObject=stream;
    curDev=stream.getVideoTracks()[0]?.getSettings()?.deviceId||null;
    devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    document.getElementById('sw').classList.toggle('dim',devs.length<2);
  }catch(e){document.getElementById('err').classList.add('show');}
}
function goBack(){try{window.parent.document.getElementById('iframe-back').click();}catch(e){}}
function flash(){const f=document.getElementById('flash');f.style.transition='none';f.style.opacity='.6';requestAnimationFrame(()=>{f.style.transition='opacity .3s';f.style.opacity='0';});}
function grab(){
  const c=document.createElement('canvas');c.width=cam.videoWidth;c.height=cam.videoHeight;
  const ctx=c.getContext('2d');ctx.drawImage(cam,0,0);
  ctx.globalCompositeOperation='overlay';ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(0,0,c.width,c.height);
  if(wbOn){ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(0,0,c.width,c.height);}
  return c.toDataURL('image/jpeg',.85);
}
function updateCount(){
  const el=document.getElementById('photo-count');
  if(photos.length>0){el.textContent=photos.length+'/'+MAX;el.classList.add('show');}
  else el.classList.remove('show');
}

/* ═══ CAPTURE ═══ */
window.capture=()=>{
  hap.confirm();flash();
  if(photos.length>=MAX)photos.shift();
  photos.push(grab());
  updateCount();showBubble();
};
window.splitCapture=async()=>{
  hap.confirm();flash();const d1=grab();
  await new Promise(r=>setTimeout(r,500));flash();const d2=grab();
  const i1=new Image(),i2=new Image();i1.src=d1;i2.src=d2;
  await Promise.all([new Promise(r=>{i1.onload=r;}),new Promise(r=>{i2.onload=r;})]);
  const c=document.createElement('canvas');c.width=Math.max(i1.width,i2.width);c.height=i1.height+i2.height;
  const ctx=c.getContext('2d');ctx.drawImage(i1,0,0,c.width,c.height/2);ctx.drawImage(i2,0,c.height/2,c.width,c.height/2);
  if(photos.length>=MAX)photos.shift();
  photos.push(c.toDataURL('image/jpeg',.85));
  updateCount();showBubble();
};

/* ═══ BUBBLE ═══ */
let _bt=null;
function showBubble(){
  const el=document.getElementById('pvb-float'),th=document.getElementById('pvb-thumb');
  th.src=photos[photos.length-1];
  if(photos.length>=MAX){
    // 12枚到達: 大きいプレビュー + スライドアップ
    th.style.width='48px';th.style.height='48px';th.style.borderRadius='10px';
    el.style.transition='transform .5s cubic-bezier(.34,1.05,.64,1),opacity .4s ease';
    el.style.transform='translateX(-50%) translateY(80px)';el.style.opacity='0';el.style.pointerEvents='auto';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform='translateX(-50%) translateY(0)';el.style.opacity='1';}));
  }else{
    th.style.width='28px';th.style.height='28px';th.style.borderRadius='6px';
    el.style.transition='';el.classList.remove('show');
    el.style.transform='translateX(-50%) translateY(80px)';el.style.opacity='0';
    void el.offsetWidth;el.classList.add('show');
  }
  clearTimeout(_bt);_bt=setTimeout(()=>{
    el.classList.remove('show');
    el.style.transform='translateX(-50%) translateY(80px)';el.style.opacity='0';el.style.pointerEvents='';
    th.style.width='';th.style.height='';th.style.borderRadius='';
  },3500);
}

/* ═══ SUN ═══ */
window.toggleWB=()=>{hap();wbOn=!wbOn;document.getElementById('wb').classList.toggle('on',wbOn);cam.style.filter=wbOn?'contrast(1.22) brightness(1.15) saturate(1.1)':'contrast(1.06) brightness(1.03)';};

/* ═══ CAMERA SELECT ═══ */
window.openCS=()=>{
  hap();if(devs.length<2)return;
  const cl=document.getElementById('cl');cl.innerHTML='';
  devs.forEach((d,i)=>{const b=document.createElement('button');b.className='co';b.textContent=d.label||'カメラ '+(i+1);b.onclick=()=>{hap.confirm();closeCS();startCam(d.deviceId);};cl.appendChild(b);});
  const x=document.createElement('button');x.className='co x';x.textContent='キャンセル';x.onclick=()=>{hap();closeCS();};cl.appendChild(x);
  document.getElementById('cs').classList.add('show');
};
function closeCS(){document.getElementById('cs').classList.remove('show');}
document.getElementById('cs').addEventListener('click',e=>{if(e.target.id==='cs')closeCS();});

/* ═══ GALLERY ═══ */
let gIdx=0,editing=false;
window.openGallery=function(idx){
  if(!photos.length)return;
  gIdx=typeof idx==='number'?idx:photos.length-1;
  editing=false;document.getElementById('editor').classList.remove('show');
  resetSl();buildGal();
  document.getElementById('gal').classList.add('show');
};
window.closeGallery=function(){document.getElementById('gal').classList.remove('show');editing=false;};
function buildGal(){
  const s=document.getElementById('gal-slider');s.innerHTML='';
  photos.forEach(p=>{const d=document.createElement('div');d.className='gal-slide';const img=document.createElement('img');img.src=p;img.draggable=false;d.appendChild(img);s.appendChild(d);});
  s.style.width=(photos.length*100)+'vw';
  galPos(false);buildDots();galTitle();
}
function galPos(anim){
  const s=document.getElementById('gal-slider');
  s.style.transition=anim?'transform .3s ease':'none';
  s.style.transform='translateX(-'+(gIdx*100)+'vw)';
}
function buildDots(){
  const d=document.getElementById('gal-dots');d.innerHTML='';
  if(photos.length<=1){d.style.display='none';return;}
  d.style.display='flex';
  photos.forEach((_,i)=>{const dot=document.createElement('div');dot.className='gd'+(i===gIdx?' on':'');d.appendChild(dot);});
}
function galTitle(){document.getElementById('gal-title').textContent=(gIdx+1)+' / '+photos.length;}
function goSlide(i){gIdx=Math.max(0,Math.min(photos.length-1,i));galPos(true);buildDots();galTitle();resetSl();applyFilt();}

// Swipe
(()=>{
  const tr=document.getElementById('gal-track');let sx=0,dx=0,sw=false;
  tr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;sw=true;},{passive:true});
  tr.addEventListener('touchmove',e=>{if(!sw)return;dx=e.touches[0].clientX-sx;const s=document.getElementById('gal-slider');const base=gIdx*100;const off=(dx/window.innerWidth)*100;s.style.transition='none';s.style.transform='translateX(-'+(base-off)+'vw)';},{passive:true});
  tr.addEventListener('touchend',()=>{if(!sw)return;sw=false;if(Math.abs(dx)>50){if(dx<0&&gIdx<photos.length-1)goSlide(gIdx+1);else if(dx>0&&gIdx>0)goSlide(gIdx-1);else galPos(true);}else galPos(true);hap();},{passive:true});
})();

window.deletePhoto=()=>{if(!photos.length)return;hap.error();photos.splice(gIdx,1);updateCount();if(!photos.length){closeGallery();return;}if(gIdx>=photos.length)gIdx=photos.length-1;_dirty=false;buildGal();};

/* Apply edit permanently to in-memory photo */
window.commitEdit=()=>{
  if(!photos[gIdx]||!editing){closeGallery();return;}
  hap.confirm();
  const src=new Image();src.src=photos[gIdx];
  src.onload=()=>{
    const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
    const ctx=c.getContext('2d');ctx.filter=getFilt();ctx.drawImage(src,0,0);
    photos[gIdx]=c.toDataURL('image/jpeg',.9);
    _dirty=false;editing=false;
    document.getElementById('editor').classList.remove('show');
    resetSl();buildGal();
  };
};

/* Cancel with discard confirm */
let _dirty=false;
window.tryCloseGallery=()=>{
  if(editing&&_dirty){
    hap.error();
    const d=document.getElementById('dc');d.style.visibility='visible';d.style.pointerEvents='auto';
    requestAnimationFrame(()=>{d.style.background='rgba(0,0,0,.5)';document.getElementById('dcc').style.transform='scale(1)';document.getElementById('dcc').style.opacity='1';});
  }else{closeGallery();}
};
window.dcCancel=()=>{
  hap();const d=document.getElementById('dc');d.style.background='rgba(0,0,0,0)';
  document.getElementById('dcc').style.transform='scale(1.3)';document.getElementById('dcc').style.opacity='0';
  setTimeout(()=>{d.style.visibility='hidden';d.style.pointerEvents='none';},300);
};
window.dcDiscard=()=>{
  hap.error();_dirty=false;editing=false;
  document.getElementById('editor').classList.remove('show');resetSl();applyFilt();
  const d=document.getElementById('dc');d.style.background='rgba(0,0,0,0)';
  document.getElementById('dcc').style.transform='scale(1.3)';document.getElementById('dcc').style.opacity='0';
  setTimeout(()=>{d.style.visibility='hidden';d.style.pointerEvents='none';closeGallery();},250);
};

/* ═══ EDITOR ═══ */
window.toggleEditor=()=>{hap();editing=!editing;_dirty=false;document.getElementById('editor').classList.toggle('show',editing);if(!editing)resetSl();applyFilt();};
function resetSl(){document.getElementById('sl-sat').value=100;document.getElementById('sl-bri').value=100;document.getElementById('sl-bp').value=100;}
function getFilt(){const s=document.getElementById('sl-sat').value/100,b=document.getElementById('sl-bri').value/100,p=document.getElementById('sl-bp').value/100;return'saturate('+s+') brightness('+b+') contrast('+p+')';}
function applyFilt(){const imgs=document.querySelectorAll('.gal-slide img');if(imgs[gIdx])imgs[gIdx].style.filter=editing?getFilt():'';}
['sl-sat','sl-bri','sl-bp'].forEach(id=>{document.getElementById(id).addEventListener('input',()=>{_dirty=true;applyFilt();});});

/* ═══ CLOSE CONFIRM ═══ */
let _cb=false;
window.beforeClose=function(){if(_cb||!photos.length)return true;document.getElementById('cd-txt').textContent=photos.length+'枚の写真があります';document.getElementById('cd').classList.add('show');return false;};
window.cdSave=function(){hap.confirm();photos.forEach((p,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=p;a.download='photo_'+Date.now()+'_'+(i+1)+'.jpg';a.click();},i*200));_cb=true;setTimeout(()=>{try{window.parent.closeIframeNow();}catch(e){goBack();}},photos.length*200+100);};
window.cdSkip=function(){hap();_cb=true;try{window.parent.closeIframeNow();}catch(e){goBack();}};

// Security note
document.getElementById('sec-note').textContent='写真は保存し忘れても復元できません\u{1F630}';

startCam();
cam.style.filter='contrast(1.06) brightness(1.03)';
</script>
