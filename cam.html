<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>カメラ</title>
<script type="module">
import{haptic}from"https://esm.sh/ios-haptics";
const n=()=>{};window.H=haptic||{};
['error','success','warning','impact','selection','notification','confirm'].forEach(m=>{if(typeof window.H[m]!=='function')window.H[m]=n;});
window.hap=()=>{try{window.H();}catch(e){}};
window.hap.confirm=()=>{try{window.H.confirm();}catch(e){}};
window.hap.error=()=>{try{window.H.error();}catch(e){}};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}
body{background:#000;color:#fff;font-family:'SF Pro Display','SF Pro Text',system-ui,sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;animation:camReveal .5s cubic-bezier(.34,1.05,.64,1) both}
@keyframes camReveal{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#vf{flex:1;position:relative;overflow:hidden;background:#111}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.34,1.05,.64,1)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .3s cubic-bezier(.77,0,.18,1)}
#ctrls{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+20px);background:#000;flex-shrink:0;position:relative}
.cb{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s cubic-bezier(.77,0,.18,1),transform .2s cubic-bezier(.34,1.05,.64,1)}
.cb:active{transform:scale(.88)}
.cb.dim{opacity:.3;pointer-events:none}
#sh{width:72px;height:72px;border-radius:50%;background:transparent;border:4px solid rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.34,1.05,.64,1),border-color .3s}
#sh:active{transform:scale(.88)}
#sh .inn{width:58px;height:58px;border-radius:50%;background:#fff;transition:border-radius .3s cubic-bezier(.77,0,.18,1),width .3s cubic-bezier(.77,0,.18,1),height .3s cubic-bezier(.77,0,.18,1),background .3s}
#sh.rec .inn{width:28px;height:28px;border-radius:8px;background:#ff3b30}
#sh.rec{border-color:#ff3b30}
/* Recording UI */
#rec-bar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:center;gap:8px;padding:calc(env(safe-area-inset-top,0px)+12px) 16px 8px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(.77,0,.18,1)}
#rec-bar.show{opacity:1;pointer-events:auto}
#rec-dot{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:recPulse 1s ease infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.3}}
#rec-time{font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.5px}
#rec-hint{font-size:11px;color:rgba(255,255,255,.5);margin-left:8px}
#top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px)+28px) 16px 8px}
.tb{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .3s cubic-bezier(.77,0,.18,1),transform .2s cubic-bezier(.34,1.05,.64,1)}
.tb:active{transform:scale(.85)}
.tb.on{background:rgba(255,204,0,.7);color:#000}
#photo-count{background:rgba(255,255,255,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:#fff;opacity:0;transition:opacity .4s cubic-bezier(.77,0,.18,1);pointer-events:none}
#photo-count.show{opacity:1}
/* Bubble - slide up */
#pvb-float{position:absolute;bottom:16px;left:50%;z-index:8;transform:translateX(-50%) translateY(60px);opacity:0;transition:transform .5s cubic-bezier(.34,1.05,.64,1),opacity .35s cubic-bezier(.77,0,.18,1);pointer-events:none}
#pvb-float.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
#pvb-float button{background:rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.3);border-radius:55px;padding:10px 20px;color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;transition:transform .2s cubic-bezier(.34,1.05,.64,1)}
#pvb-float button:active{transform:scale(.92)}
.pvb-thumb{width:28px;height:28px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,.4);transition:width .3s,height .3s,border-radius .3s}
.pvb-thumb.lg{width:48px;height:48px;border-radius:10px}
/* Gallery */
#gal{position:fixed;inset:0;z-index:100;background:#000;transform:translateY(100%);transition:transform .45s cubic-bezier(.34,1.05,.64,1);display:flex;flex-direction:column}
#gal.show{transform:translateY(0)}
#gal-hdr{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px)+8px) 12px 8px 12px;background:rgba(0,0,0,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:2;gap:4px;flex-shrink:0;position:relative}
#gal-hdr button{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;font-family:inherit;padding:10px 14px;border-radius:12px;transition:background .2s;font-weight:500}
#gal-hdr button:active{background:rgba(255,255,255,.1)}
#gal-hdr .del{color:#ff3b30}
#gal-hdr .edit{color:#007aff}
#gal-title{flex:1;text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.6)}
#gal-track{flex:1;display:flex;overflow:hidden;position:relative}
#gal-slider{display:flex;height:100%;transition:transform .35s cubic-bezier(.34,1.05,.64,1)}
.gal-slide{flex-shrink:0;width:100vw;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal-slide img{max-width:100%;max-height:100%;object-fit:contain;transition:filter .3s cubic-bezier(.77,0,.18,1)}
#gal-dots{display:flex;justify-content:center;gap:5px;padding:8px;flex-shrink:0}
.gd{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s cubic-bezier(.34,1.05,.64,1)}
.gd.on{background:#fff;width:14px;border-radius:3px}
#gal-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+12px);background:rgba(0,0,0,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0}
#gal-bar button{background:none;border:none;color:#fff;font-size:15px;font-family:inherit;cursor:pointer;padding:10px 16px;border-radius:55px;transition:background .2s,transform .15s cubic-bezier(.34,1.05,.64,1)}
#gal-bar button:active{transform:scale(.92)}
#gal-bar .sv{background:rgba(0,122,255,.9);font-weight:600}
/* Editor */
#editor{max-height:0;overflow:hidden;padding:0 20px;background:rgba(0,0,0,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0;transition:max-height .4s cubic-bezier(.34,1.05,.64,1),padding .4s cubic-bezier(.34,1.05,.64,1)}
#editor.show{max-height:250px;padding:16px 20px 8px}
.ed-row{margin-bottom:14px}
.ed-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.ed-slider{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:14px;outline:none;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.ed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}
#sl-sat{background:linear-gradient(90deg,#888,#ff6b6b,#ffd93d,#6bcf7f,#4ecdc4,#a78bfa)}
#sl-bri{background:linear-gradient(90deg,#000,#fff)}
#sl-bp{background:linear-gradient(90deg,#000,#333)}
/* Camera select */
#cs{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px)+20px);background:rgba(0,0,0,0);visibility:hidden;pointer-events:none;transition:background .3s cubic-bezier(.77,0,.18,1)}
#cs.show{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.5)}
#cl{width:300px;background:rgba(30,30,32,.9);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border-radius:20px;overflow:hidden;text-align:center;translate:0 140px;scale:.85;opacity:0;transition:translate .3s cubic-bezier(.34,1.05,.64,1),scale .3s cubic-bezier(.34,1.05,.64,1),opacity .25s}
#cs.show #cl{translate:0 0;scale:1;opacity:1}
.co{padding:16px;font-size:17px;color:#007aff;border:none;background:none;width:100%;cursor:pointer;font-family:inherit;border-bottom:1px solid rgba(255,255,255,.08);transition:background .15s}
.co:active{background:rgba(255,255,255,.08)}
.co:last-child{border:none}
.co.x{color:rgba(255,255,255,.4)}
/* Dialogs */
.dlg-ov{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;visibility:hidden;pointer-events:none;transition:background .3s cubic-bezier(.77,0,.18,1)}
.dlg-ov.show{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.5)}
.dlg-card{width:280px;background:rgba(245,245,247,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:16px;overflow:hidden;text-align:center;transform:scale(1.3);opacity:0;transition:transform .35s cubic-bezier(.34,1.05,.64,1),opacity .3s cubic-bezier(.77,0,.18,1)}
.dlg-ov.show .dlg-card{transform:scale(1);opacity:1}
.dlg-body{padding:22px 20px 10px}
.dlg-title{font-size:17px;font-weight:700;color:#000;margin-bottom:6px}
.dlg-sub{font-size:13px;color:rgba(0,0,0,.5);line-height:1.5}
.dlg-btns{border-top:1px solid rgba(0,0,0,.1);display:flex}
.dlg-btn{flex:1;padding:14px;font-size:16px;background:none;border:none;cursor:pointer;font-family:inherit}
.dlg-btn+.dlg-btn{border-left:1px solid rgba(0,0,0,.1)}
.dlg-btn.blue{color:#007aff;font-weight:600}
.dlg-btn.red{color:#ff3b30;font-weight:600}
.dlg-btn.dim{color:rgba(0,0,0,.4)}
#err{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#err.show{display:flex}
/* Lux slider */
#lux-bar{position:absolute;top:calc(env(safe-area-inset-top,0px)+80px);left:50%;transform:translateX(-50%) scale(.85);width:88vw;max-width:400px;height:48px;background:rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.2);border-radius:55px;z-index:11;opacity:0;pointer-events:none;transition:opacity .35s cubic-bezier(.77,0,.18,1),transform .4s cubic-bezier(.34,1.05,.64,1);overflow:hidden;display:flex;align-items:center}
#lux-bar.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#lux-list{display:flex;gap:0;overflow-x:scroll;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;width:100%;height:100%;align-items:center;padding:0 calc(50% - 22px)}
#lux-list::-webkit-scrollbar{display:none}
.lux-item{flex-shrink:0;width:44px;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:rgba(255,255,255,.5);scroll-snap-align:center;cursor:pointer;transition:color .3s,transform .3s cubic-bezier(.34,1.05,.64,1)}
.lux-item.on{color:#ffc63e;transform:scale(1.15)}
#lux-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:3px;border-radius:50%;background:#ffc63e;pointer-events:none;opacity:.7}
#sec-note{position:absolute;top:-28px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.5);padding:0 20px;pointer-events:none;line-height:1.4}
</style>
</head>
<body>
<div id="vf">
  <video id="cam" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="top">
    <div id="photo-count"></div>
    <button class="tb" id="wb" onclick="toggleWB()">☀︎</button>
  </div>
  <div id="rec-bar"><div id="rec-dot"></div><div id="rec-time">00:00</div><div id="rec-hint">指を離して停止</div></div>
  <div id="lux-bar">
    <div id="lux-list"></div>
    <div id="lux-dot"></div>
  </div>
  <div id="pvb-float"><button onclick="openGallery()"><img class="pvb-thumb" id="pvb-thumb" src=""><span id="pvb-label">撮影した写真を表示</span></button></div>
</div>
<div id="ctrls">
  <button class="cb" id="sp">⬜⬛</button>
  <div id="sh"><div class="inn"></div></div>
  <button class="cb" id="sw" onclick="openCS()">↔︎</button>
  <div id="sec-note"></div>
</div>
<div id="gal">
  <div id="gal-hdr">
    <div id="gal-title"></div>
    <button class="edit" onclick="toggleEditor()">編集</button>
    <button class="del" onclick="deletePhoto()">削除</button>
  </div>
  <div id="gal-track"><div id="gal-slider"></div></div>
  <div id="gal-dots"></div>
  <div id="editor">
    <div class="ed-row"><div class="ed-label">彩度</div><input type="range" class="ed-slider" id="sl-sat" min="0" max="200" value="100"></div>
    <div class="ed-row"><div class="ed-label">明るさ</div><input type="range" class="ed-slider" id="sl-bri" min="50" max="150" value="100"></div>
    <div class="ed-row"><div class="ed-label">ブラックポイント</div><input type="range" class="ed-slider" id="sl-bp" min="80" max="150" value="100"></div>
  </div>
  <div id="gal-bar">
    <button onclick="tryCloseGallery()">カメラに戻る</button>
    <button class="sv" onclick="saveAllPhotos()">保存</button>
  </div>
</div>
<div id="cs"><div id="cl"></div></div>
<!-- Discard edits confirm -->
<div id="dc" class="dlg-ov" style="z-index:200">
  <div class="dlg-card" id="dcc">
    <div class="dlg-body">
      <div class="dlg-title">保存しなくてもよろしいですか？</div>
      <div class="dlg-sub">編集内容は破棄されます</div>
    </div>
    <div class="dlg-btns">
      <button class="dlg-btn blue" onclick="dcCancel()">編集に戻る</button>
      <button class="dlg-btn red" onclick="dcDiscard()">破棄</button>
    </div>
  </div>
</div>
<!-- Close confirm -->
<div id="cd" class="dlg-ov" style="z-index:250">
  <div class="dlg-card" id="dcc2">
    <div class="dlg-body">
      <div class="dlg-title">撮影した写真をまとめて保存</div>
      <div class="dlg-sub" id="cd-txt"></div>
    </div>
    <div class="dlg-btns">
      <button class="dlg-btn dim" onclick="cdSkip()">しない</button>
      <button class="dlg-btn blue" onclick="cdSave()">保存</button>
    </div>
  </div>
</div>
<div id="err">
  <div style="font-size:48px">📷</div>
  <div style="font-size:16px;text-align:center;padding:0 40px;opacity:.7">カメラへのアクセスが<br>拒否されました</div>
  <button onclick="goBack()" style="margin-top:12px;padding:12px 28px;border-radius:55px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;font-family:inherit">ホームに戻る</button>
</div>
<script>
let photos=[],stream=null,curDev=null,devs=[];
const MAX=24,cam=document.getElementById('cam');

let _switching=false;
async function startCam(devId){
  if(_switching)return;
  _switching=true;
  // Stop old stream
  if(stream){
    try{
      cam.style.transition='transform .3s cubic-bezier(.77,0,.18,1),opacity .2s';
      cam.style.transform='scale(.92)';cam.style.opacity='0';
      await new Promise(r=>setTimeout(r,250));
    }catch(_){}
    try{stream.getTracks().forEach(t=>t.stop());}catch(_){}
    stream=null;cam.srcObject=null;
  }
  // Get new stream - simple constraints only
  try{
    const c=devId?{video:{deviceId:{exact:devId}}}:{video:{facingMode:'environment'}};
    stream=await navigator.mediaDevices.getUserMedia(c);
  }catch(e){
    // Fallback without exact
    try{stream=await navigator.mediaDevices.getUserMedia(devId?{video:{deviceId:devId}}:{video:true});}
    catch(_){stream=null;}
  }
  if(!stream){
    _switching=false;
    cam.style.transition='transform .3s,opacity .25s';cam.style.transform='scale(1)';cam.style.opacity='1';
    return;
  }
  cam.srcObject=stream;
  cam.style.transition='none';cam.style.transform='scale(.8)';cam.style.opacity='0';
  requestAnimationFrame(()=>{
    cam.style.transition='transform .88s cubic-bezier(.34,1.05,.64,1),opacity .5s';
    cam.style.transform='scale(1)';cam.style.opacity='1';
  });
  curDev=stream.getVideoTracks()[0]?.getSettings()?.deviceId||null;
  try{devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');}catch(_){}
  document.getElementById('sw').classList.toggle('dim',devs.length<2);
  setTimeout(()=>{_switching=false;},500);
}
function goBack(){try{window.parent.document.getElementById('iframe-back').click();}catch(e){}}
function flash(){const f=document.getElementById('flash');f.style.transition='none';f.style.opacity='.6';requestAnimationFrame(()=>{f.style.transition='opacity .3s cubic-bezier(.77,0,.18,1)';f.style.opacity='0';});}
function grab(){
  const c=document.createElement('canvas');c.width=cam.videoWidth;c.height=cam.videoHeight;
  const ctx=c.getContext('2d');ctx.drawImage(cam,0,0);
  ctx.globalCompositeOperation='overlay';ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.97);
}
function updateCount(){
  const el=document.getElementById('photo-count');
  if(photos.length>0){el.textContent=photos.length+'/'+MAX;el.classList.add('show');}
  else el.classList.remove('show');
}

/* ═══ CAPTURE ═══ */
function checkOverflow(){
  if(photos.length>=MAX){
    hap.error();
    document.getElementById('cd-txt').textContent='全ての写真を保存しますか？（'+photos.length+'枚）';
    showDlg('cd');
    return true;
  }
  return false;
}
window.capture=()=>{
  hap.confirm();flash();
  photos.push(grab());
  updateCount();
  if(!checkOverflow())showBubble('撮影した写真を表示',false);
};
window.splitCapture=async()=>{
  hap.confirm();flash();const d1=grab();
  await new Promise(r=>setTimeout(r,500));flash();const d2=grab();
  const i1=new Image(),i2=new Image();i1.src=d1;i2.src=d2;
  await Promise.all([new Promise(r=>{i1.onload=r;}),new Promise(r=>{i2.onload=r;})]);
  const c=document.createElement('canvas');c.width=Math.max(i1.width,i2.width);c.height=i1.height+i2.height;
  const ctx=c.getContext('2d');ctx.drawImage(i1,0,0,c.width,c.height/2);ctx.drawImage(i2,0,c.height/2,c.width,c.height/2);
  photos.push(c.toDataURL('image/jpeg',.97));
  updateCount();
  if(!checkOverflow())showBubble('撮影した写真を表示',false);
};

/* ═══ BUBBLE (slide-up) ═══ */
let _bt=null,_bubbleVideoUrl=null;
function showBubble(label,isVideo){
  const el=document.getElementById('pvb-float');
  const th=document.getElementById('pvb-thumb');
  const lb=document.getElementById('pvb-label');
  lb.textContent=label;
  // Reset onclick for photos (video sets custom handler)
  if(!isVideo){
    el.querySelector('button').onclick=function(){openGallery();};
    if(photos.length){th.src=photos[photos.length-1];th.style.display='';}
    th.classList.toggle('lg',photos.length>=MAX);
  }else{
    th.style.display='none';
  }
  el.classList.remove('show');
  void el.offsetHeight;
  el.classList.add('show');
  clearTimeout(_bt);_bt=setTimeout(()=>el.classList.remove('show'),4000);
}

/* ═══ SHUTTER: TAP=PHOTO, LONG PRESS=RECORD ═══ */
let _recording=false,_recorder=null,_recChunks=[],_recTimer=null,_recStart=0,_recMax=30;
let _recCanvas=null,_recCtx=null,_recRaf=null;
let _shDown=0,_shLong=null;
const sh=document.getElementById('sh');

sh.addEventListener('touchstart',e=>{
  e.preventDefault();
  _shDown=Date.now();
  _shLong=setTimeout(()=>{_shLong=null;startRec();},400);
},{passive:false});
sh.addEventListener('touchend',e=>{
  e.preventDefault();
  if(_shLong){clearTimeout(_shLong);_shLong=null;capture();}
  else if(_recording){stopRec();}
});
sh.addEventListener('touchcancel',()=>{if(_shLong){clearTimeout(_shLong);_shLong=null;}});

function startRec(){
  if(_recording)return;
  _recording=true;_recChunks=[];
  hap.confirm();
  sh.classList.add('rec');
  document.getElementById('rec-bar').classList.add('show');
  _recStart=Date.now();
  updateRecTime();
  _recTimer=setInterval(()=>{
    updateRecTime();
    if((Date.now()-_recStart)/1000>=_recMax)stopRec();
  },200);
  // Canvas capture: draws video element (including CSS transforms/transitions)
  _recCanvas=document.createElement('canvas');
  _recCanvas.width=cam.videoWidth||1280;
  _recCanvas.height=cam.videoHeight||720;
  _recCtx=_recCanvas.getContext('2d');
  function drawFrame(){
    if(!_recording)return;
    // Update canvas size if video resolution changes (lens switch)
    if(cam.videoWidth&&cam.videoHeight&&(_recCanvas.width!==cam.videoWidth||_recCanvas.height!==cam.videoHeight)){
      _recCanvas.width=cam.videoWidth;_recCanvas.height=cam.videoHeight;
    }
    try{_recCtx.drawImage(cam,0,0,_recCanvas.width,_recCanvas.height);}catch(_){}
    _recRaf=requestAnimationFrame(drawFrame);
  }
  drawFrame();
  try{
    const canvasStream=_recCanvas.captureStream(30);
    // Add audio if available
    if(stream){
      const audioTracks=stream.getAudioTracks();
      audioTracks.forEach(t=>canvasStream.addTrack(t));
    }
    const mimeTypes=['video/mp4','video/webm;codecs=h264','video/webm'];
    let mime=mimeTypes.find(m=>MediaRecorder.isTypeSupported(m))||'';
    _recorder=new MediaRecorder(canvasStream,mime?{mimeType:mime}:{});
    _recorder.ondataavailable=e=>{if(e.data.size>0)_recChunks.push(e.data);};
    _recorder.onstop=()=>{
      const blob=new Blob(_recChunks,{type:_recorder.mimeType||'video/webm'});
      if(_bubbleVideoUrl)URL.revokeObjectURL(_bubbleVideoUrl);
      _bubbleVideoUrl=URL.createObjectURL(blob);
      const ext=(_recorder?.mimeType||'').includes('mp4')?'mp4':'webm';
      hap.confirm();
      const btn=document.getElementById('pvb-float').querySelector('button');
      btn.onclick=function(){
        const a=document.createElement('a');a.href=_bubbleVideoUrl;
        a.download='video_'+Date.now()+'.'+ext;a.click();hap.confirm();
      };
      showBubble('録画したものを保存',true);
    };
    _recorder.start(100);
  }catch(e){_recording=false;sh.classList.remove('rec');document.getElementById('rec-bar').classList.remove('show');clearInterval(_recTimer);if(_recRaf)cancelAnimationFrame(_recRaf);}
}
function stopRec(){
  if(!_recording)return;
  _recording=false;
  sh.classList.remove('rec');
  document.getElementById('rec-bar').classList.remove('show');
  clearInterval(_recTimer);
  if(_recRaf)cancelAnimationFrame(_recRaf);
  hap.error();
  if(_recorder&&_recorder.state!=='inactive')_recorder.stop();
}
function updateRecTime(){
  const s=Math.floor((Date.now()-_recStart)/1000);
  document.getElementById('rec-time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

/* ═══ LUX SLIDER ═══ */
const LUX_VALS=[0.3,0.5,0.7,1,1.3,1.7,2];
let luxIdx=3,luxOpen=false; // default=1
(()=>{
  const list=document.getElementById('lux-list');
  LUX_VALS.forEach((v,i)=>{
    const d=document.createElement('div');d.className='lux-item'+(i===luxIdx?' on':'');
    d.textContent=v;d.dataset.idx=i;list.appendChild(d);
  });
  // Scroll snap to detect selection
  list.addEventListener('scroll',()=>{
    const cw=44,sl=list.scrollLeft,ci=Math.round(sl/cw);
    if(ci>=0&&ci<LUX_VALS.length&&ci!==luxIdx){
      luxIdx=ci;applyLux();hap();
      list.querySelectorAll('.lux-item').forEach((el,i)=>el.classList.toggle('on',i===luxIdx));
    }
  },{passive:true});
  // Tap to select
  list.addEventListener('click',e=>{
    const item=e.target.closest('.lux-item');if(!item)return;
    const i=+item.dataset.idx;luxIdx=i;applyLux();hap.confirm();
    list.querySelectorAll('.lux-item').forEach((el,j)=>el.classList.toggle('on',j===luxIdx));
    list.scrollTo({left:i*44,behavior:'smooth'});
  });
  // Initial scroll
  requestAnimationFrame(()=>list.scrollLeft=luxIdx*44);
})();
function applyLux(){
  const v=LUX_VALS[luxIdx];
  const b=100*Math.pow(1.3,v-0.3);
  const c=100+(v-0.3)*20;
  cam.style.filter='brightness('+b+'%) contrast('+c+'%) saturate(1.04)';
  document.getElementById('wb').classList.toggle('on',luxIdx!==3);
}
window.toggleWB=()=>{
  hap();luxOpen=!luxOpen;
  document.getElementById('lux-bar').classList.toggle('show',luxOpen);
  if(!luxOpen&&luxIdx===3)document.getElementById('wb').classList.remove('on');
};

/* ═══ CAMERA SELECT ═══ */
const CAM_ORDER=[
  ['背面超広角','back ultra wide','ultra wide back','back ultrawide','ultra wide angle camera','ultrawide','0.5x'],
  ['背面トリプル','back triple','triple camera'],
  ['背面デュアル広角','back dual wide','dual wide'],
  ['背面デュアル','back dual','dual camera','dual back'],
  ['背面カメラ','back camera','rear camera','rear facing','1x'],
  ['背面望遠','back telephoto','telephoto','tele','2x','3x'],
  ['前面超広角','front ultra wide','front ultrawide','front wide'],
  ['前面カメラ','front camera','front facing','facetime','selfie','truedepth']
];
function camPriority(label){
  const l=(label||'').toLowerCase();
  for(let i=0;i<CAM_ORDER.length;i++){
    if(CAM_ORDER[i].some(k=>l.includes(k)))return i;
  }
  // Fallback: check facing mode from label
  if(l.includes('front')||l.includes('前面'))return 7;
  if(l.includes('back')||l.includes('rear')||l.includes('背面'))return 4;
  return CAM_ORDER.length;
}
function getSortedDevs(){return [...devs].sort((a,b)=>camPriority(a.label)-camPriority(b.label));}
window.openCS=()=>{
  hap();if(devs.length<2)return;
  const cl=document.getElementById('cl');cl.innerHTML='';
  const sorted=getSortedDevs();
  sorted.forEach((d,i)=>{
    const b=document.createElement('button');b.className='co'+(d.deviceId===curDev?' x':'');
    b.textContent=d.label||'カメラ '+(i+1);
    b.onclick=()=>{hap.confirm();closeCS();startCam(d.deviceId);};
    cl.appendChild(b);
  });
  const x=document.createElement('button');x.className='co x';x.textContent='キャンセル';x.onclick=()=>{hap();closeCS();};cl.appendChild(x);
  document.getElementById('cs').classList.add('show');
};
function closeCS(){document.getElementById('cs').classList.remove('show');}
document.getElementById('cs').addEventListener('click',e=>{if(e.target.id==='cs')closeCS();});

/* ═══ ⬜⬛ BUTTON: tap=split(同カメラ2枚), 0.2s長押し=前後切替撮影 ═══ */
function isBackCam(){const l=(devs.find(d=>d.deviceId===curDev)?.label||'').toLowerCase();return l.includes('back')||l.includes('rear')||l.includes('背面');}
function isFrontCam(){const l=(devs.find(d=>d.deviceId===curDev)?.label||'').toLowerCase();return l.includes('front')||l.includes('前面');}
function findOppositeCam(){
  const wantFront=isBackCam();
  const wantBack=isFrontCam();
  if(!wantFront&&!wantBack)return null;
  return devs.find(d=>{
    const l=(d.label||'').toLowerCase();
    if(wantFront)return l.includes('front')||l.includes('前面');
    if(wantBack)return l.includes('back')||l.includes('rear')||l.includes('背面');
    return false;
  });
}

let _spT=null;
const spBtn=document.getElementById('sp');
spBtn.addEventListener('touchstart',e=>{
  e.preventDefault();
  const opp=findOppositeCam();
  _spT=setTimeout(()=>{
    _spT=null;
    if(!opp)return;
    // Long press: take current + switch + take opposite
    dualCapture(opp.deviceId);
  },200);
},{passive:false});
spBtn.addEventListener('touchend',e=>{
  e.preventDefault();
  if(_spT){clearTimeout(_spT);_spT=null;splitCapture();}
});
spBtn.addEventListener('touchcancel',()=>{if(_spT){clearTimeout(_spT);_spT=null;}});

async function dualCapture(oppDevId){
  hap.confirm();flash();
  const img1=grab();photos.push(img1);updateCount();
  // Switch to opposite camera, take photo, switch back
  const origDev=curDev;
  await startCam(oppDevId);
  await new Promise(r=>setTimeout(r,600)); // Wait for camera to stabilize
  hap.confirm();flash();
  const img2=grab();photos.push(img2);updateCount();
  showBubble('前後2枚撮影しました',false);
  // Switch back
  await startCam(origDev);
}

/* ═══ GALLERY (slide-up) ═══ */
let gIdx=0,editing=false;
window.openGallery=function(idx){
  if(!photos.length)return;
  hap();
  gIdx=typeof idx==='number'?idx:photos.length-1;
  editing=false;document.getElementById('editor').classList.remove('show');
  resetSl();buildGal();
  requestAnimationFrame(()=>document.getElementById('gal').classList.add('show'));
};
window.closeGallery=function(){
  hap();editing=false;
  document.getElementById('editor').classList.remove('show');
  document.getElementById('gal').classList.remove('show');
};
function buildGal(){
  const s=document.getElementById('gal-slider');s.innerHTML='';
  photos.forEach(p=>{const d=document.createElement('div');d.className='gal-slide';const img=document.createElement('img');img.src=p;img.draggable=false;d.appendChild(img);s.appendChild(d);});
  s.style.width=(photos.length*100)+'vw';
  galPos(false);buildDots();galTitle();
}
function galPos(anim){
  const s=document.getElementById('gal-slider');
  s.style.transition=anim?'transform .35s cubic-bezier(.34,1.05,.64,1)':'none';
  s.style.transform='translateX(-'+(gIdx*100)+'vw)';
}
function buildDots(){
  const d=document.getElementById('gal-dots');d.innerHTML='';
  if(photos.length<=1){d.style.display='none';return;}
  d.style.display='flex';
  photos.forEach((_,i)=>{const dot=document.createElement('div');dot.className='gd'+(i===gIdx?' on':'');d.appendChild(dot);});
}
function galTitle(){document.getElementById('gal-title').textContent=(gIdx+1)+' / '+photos.length;}
function goSlide(i){gIdx=Math.max(0,Math.min(photos.length-1,i));galPos(true);buildDots();galTitle();resetSl();applyFilt();}

// Swipe
(()=>{
  const tr=document.getElementById('gal-track');let sx=0,dx=0,sw=false;
  tr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;sw=true;},{passive:true});
  tr.addEventListener('touchmove',e=>{if(!sw)return;dx=e.touches[0].clientX-sx;const s=document.getElementById('gal-slider');const base=gIdx*100;const off=(dx/window.innerWidth)*100;s.style.transition='none';s.style.transform='translateX(-'+(base-off)+'vw)';},{passive:true});
  tr.addEventListener('touchend',()=>{if(!sw)return;sw=false;if(Math.abs(dx)>50){if(dx<0&&gIdx<photos.length-1)goSlide(gIdx+1);else if(dx>0&&gIdx>0)goSlide(gIdx-1);else galPos(true);}else galPos(true);hap();},{passive:true});
})();

window.deletePhoto=()=>{if(!photos.length)return;hap.error();photos.splice(gIdx,1);updateCount();if(!photos.length){closeGallery();return;}if(gIdx>=photos.length)gIdx=photos.length-1;_dirty=false;buildGal();};

/* ═══ SAVE ALL PHOTOS ═══ */
window.saveAllPhotos=()=>{
  if(!photos.length){hap();return;}
  // If editing, commit first
  if(editing&&_dirty&&photos[gIdx]){
    const src=new Image();src.src=photos[gIdx];
    src.onload=()=>{
      const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
      const ctx=c.getContext('2d');ctx.filter=getFilt();ctx.drawImage(src,0,0);
      photos[gIdx]=c.toDataURL('image/jpeg',.97);
      _dirty=false;editing=false;
      document.getElementById('editor').classList.remove('show');resetSl();
      doSaveAll();
    };
  }else{doSaveAll();}
};
function doSaveAll(){
  hap.confirm();
  photos.forEach((p,i)=>setTimeout(()=>{
    const a=document.createElement('a');a.href=p;a.download='photo_'+Date.now()+'_'+(i+1)+'.jpg';a.click();
  },i*200));
};

/* ═══ DISCARD CONFIRM ═══ */
let _dirty=false;
function showDlg(id){document.getElementById(id).classList.add('show');}
function hideDlg(id,cb){document.getElementById(id).classList.remove('show');if(cb)setTimeout(cb,350);}

window.tryCloseGallery=()=>{
  if(editing&&_dirty){hap.error();showDlg('dc');}
  else{closeGallery();}
};
window.dcCancel=()=>{hap();hideDlg('dc');};
window.dcDiscard=()=>{
  hap.error();_dirty=false;editing=false;
  document.getElementById('editor').classList.remove('show');resetSl();applyFilt();
  hideDlg('dc',closeGallery);
};

/* ═══ EDITOR ═══ */
window.toggleEditor=()=>{hap();editing=!editing;_dirty=false;document.getElementById('editor').classList.toggle('show',editing);if(!editing)resetSl();applyFilt();};
function resetSl(){document.getElementById('sl-sat').value=100;document.getElementById('sl-bri').value=100;document.getElementById('sl-bp').value=100;}
function getFilt(){const s=document.getElementById('sl-sat').value/100,b=document.getElementById('sl-bri').value/100,p=document.getElementById('sl-bp').value/100;return'saturate('+s+') brightness('+b+') contrast('+p+')';}
function applyFilt(){const imgs=document.querySelectorAll('.gal-slide img');if(imgs[gIdx])imgs[gIdx].style.filter=editing?getFilt():'';}
['sl-sat','sl-bri','sl-bp'].forEach(id=>{document.getElementById(id).addEventListener('input',()=>{_dirty=true;applyFilt();});});

/* ═══ CLOSE / OVERFLOW CONFIRM ═══ */
let _cb=false;
window.beforeClose=function(){if(_cb||!photos.length)return true;_cb=true;document.getElementById('cd-txt').textContent=photos.length+'枚の写真があります';showDlg('cd');return false;};
window.cdSave=function(){
  hap.confirm();
  const n=photos.length;
  photos.forEach((p,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=p;a.download='photo_'+Date.now()+'_'+(i+1)+'.jpg';a.click();},i*120));
  setTimeout(()=>{
    photos=[];updateCount();hideDlg('cd');
    if(_cb){try{window.parent.closeIframeNow();}catch(e){goBack();}}
  },n*120+200);
};
window.cdSkip=function(){
  hap();
  if(_cb){_cb=false;photos=[];updateCount();hideDlg('cd');try{window.parent.closeIframeNow();}catch(e){goBack();}}
  else{photos=[];updateCount();hideDlg('cd');}
};

// Security note
document.getElementById('sec-note').textContent='写真は保存し忘れても復元できません\u{1F630}';

/* ═══ PINCH GESTURE → CAMERA SWITCH ═══ */
(()=>{
  const vf=document.getElementById('vf');
  let initDist=0,pinching=false,switched=false;
  function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
  // Sorted + skip triple(1)/dual-wide(2)/dual(3) for pinch
  function pinchList(){
    const skip=new Set([1,2,3]);
    return getSortedDevs().filter(d=>!skip.has(camPriority(d.label)));
  }
  function cycleCam(dir){
    if(_switching)return;
    const list=pinchList();
    if(list.length<2)return;
    let idx=list.findIndex(d=>d.deviceId===curDev);
    if(idx<0){
      // Current cam not in pinch list (e.g. triple) → jump to nearest
      const sorted=getSortedDevs();
      const si=sorted.findIndex(d=>d.deviceId===curDev);
      idx=dir>0?0:list.length-1;
      // Find closest in pinch list
      for(let i=0;i<list.length;i++){
        const pi=sorted.findIndex(d=>d.deviceId===list[i].deviceId);
        if(pi>=si){idx=dir>0?i:Math.max(0,i-1);break;}
      }
    }
    const next=idx+dir;
    if(next<0||next>=list.length)return;
    startCam(list[next].deviceId);
  }
  vf.addEventListener('touchstart',e=>{
    if(e.touches.length===2){pinching=true;switched=false;initDist=dist(e.touches);}
  },{passive:true});
  vf.addEventListener('touchmove',e=>{
    if(!pinching||e.touches.length!==2||_switching)return;
    const d=dist(e.touches);
    const ratio=d/initDist;
    const s=Math.max(.88,Math.min(1.2,ratio));
    cam.style.transition='none';
    cam.style.transform='scale('+s+')';
    if(!switched){
      if(ratio>1.15){switched=true;hap.confirm();cycleCam(1);}
      else if(ratio<0.85){switched=true;hap.confirm();cycleCam(-1);}
    }
  },{passive:true});
  vf.addEventListener('touchend',e=>{
    if(!pinching)return;
    if(e.touches.length<2){
      pinching=false;
      cam.style.transition='transform .5s cubic-bezier(.34,1.05,.64,1)';
      cam.style.transform='scale(1)';
    }
  },{passive:true});
})();

startCam();
applyLux();
</script>
