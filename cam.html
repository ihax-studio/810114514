<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>カメラ</title>
<script type="module">
import{haptic}from"https://esm.sh/ios-haptics";
const n=()=>{};window.H=haptic||{};
['error','success','warning','impact','selection','notification','confirm'].forEach(m=>{if(typeof window.H[m]!=='function')window.H[m]=n;});
window.hap=()=>{try{window.H();}catch(e){}};
window.hap.confirm=()=>{try{window.H.confirm();}catch(e){}};
window.hap.error=()=>{try{window.H.error();}catch(e){}};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}
body{background:#000;color:#fff;font-family:'SF Pro Display','SF Pro Text',system-ui,sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#vf{flex:1;position:relative;overflow:hidden;background:#111}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#ctrls{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+20px);background:#000;flex-shrink:0}
.cb{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s,transform .15s}
.cb:active{transform:scale(.88)}
.cb.dim{opacity:.3;pointer-events:none}
#sh{width:72px;height:72px;border-radius:50%;background:transparent;border:4px solid rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
#sh:active{transform:scale(.88)}
#sh .inn{width:58px;height:58px;border-radius:50%;background:#fff}
#top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px)+28px) 16px 8px;gap:10px}
.tb{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:none;color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .2s}
.tb.on{background:rgba(255,204,0,.7);color:#000}
/* Preview */
#pv{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#pv.show{display:flex}
#pvw{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
#pvi{max-width:100%;max-height:100%;transition:filter .3s,transform .2s}
#pvb{display:flex;align-items:center;justify-content:center;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+16px);background:rgba(0,0,0,.8);gap:12px}
#pvb button{background:none;border:none;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;padding:10px 20px;border-radius:55px}
#pvb .sv{background:rgba(0,122,255,.9);font-weight:600}
/* Save dialog */
#sd{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);align-items:center;justify-content:center;transition:background .3s;visibility:hidden;display:flex;pointer-events:none}
#sd.show{visibility:visible;background:rgba(0,0,0,.5);pointer-events:auto}
#sc{width:280px;background:rgba(245,245,247,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:16px;overflow:hidden;text-align:center;transform:scale(1.3);opacity:0;transition:transform .3s ease,opacity .3s ease}
#sd.show #sc{transform:scale(1);opacity:1}
/* Camera select - visibility based for animation */
#cs{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px)+20px);background:rgba(0,0,0,0);visibility:hidden;pointer-events:none;transition:background .5s ease}
#cs.show{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.5)}
#cl{width:280px;background:rgba(245,245,247,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:16px;overflow:hidden;text-align:center;transform:translateY(120px);opacity:0;transition:transform .5s cubic-bezier(.34,1.05,.64,1),opacity .5s ease}
#cs.show #cl{transform:translateY(0);opacity:1}
.co{padding:14px;font-size:16px;color:#007aff;border:none;background:none;width:100%;cursor:pointer;font-family:inherit;border-bottom:1px solid rgba(0,0,0,.1)}
.co:last-child{border:none}
.co.x{color:rgba(0,0,0,.4)}
/* Error overlay */
#err{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#err.show{display:flex}
</style>
</head>
<body>
<div id="vf">
  <video id="cam" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="top"><button class="tb" id="wb" onclick="toggleWB()">☀︎</button></div>
</div>
<div id="ctrls">
  <button class="cb" id="sp" onclick="splitCapture()">⬜⬛</button>
  <div id="sh" onclick="capture()"><div class="inn"></div></div>
  <button class="cb" id="sw" onclick="openCS()">↔︎</button>
</div>
<div id="pv">
  <div style="display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px)+8px) 16px 8px;background:rgba(0,0,0,.8);z-index:2">
    <button onclick="closePV()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;font-family:inherit;padding:8px 12px">← 戻る</button>
    <div style="flex:1"></div>
    <button class="tb" id="pvw2" onclick="togglePVF()">☀︎</button>
  </div>
  <div id="pvw"><img id="pvi"></div>
  <div id="pvb">
    <button onclick="closePV()">キャンセル</button>
    <button class="sv" onclick="savePV()">写真を保存</button>
  </div>
</div>
<div id="sd">
  <div id="sc">
    <div style="padding:22px 20px 10px">
      <div style="font-size:17px;font-weight:700;color:#000;margin-bottom:6px">まとめて保存</div>
      <div id="st" style="font-size:13px;color:rgba(0,0,0,.5);line-height:1.5"></div>
    </div>
    <div style="border-top:1px solid rgba(0,0,0,.1);display:flex">
      <button onclick="dS()" style="flex:1;padding:14px;font-size:16px;color:#007aff;background:none;border:none;border-right:1px solid rgba(0,0,0,.1);cursor:pointer;font-family:inherit">あとで</button>
      <button onclick="sAll()" style="flex:1;padding:14px;font-size:16px;color:#007aff;background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600">保存</button>
    </div>
  </div>
</div>
<div id="cs"><div id="cl"></div></div>
<div id="err">
  <div style="font-size:48px">📷</div>
  <div style="font-size:16px;text-align:center;padding:0 40px;opacity:.7">カメラへのアクセスが<br>拒否されました</div>
  <button onclick="goBack()" style="margin-top:12px;padding:12px 28px;border-radius:55px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;font-family:inherit">ホームに戻る</button>
</div>
<script>
const CK='cam_photos';
let photos=[];try{photos=JSON.parse(localStorage.getItem(CK)||'[]');}catch(e){}
let stream=null,curDev=null,devs=[],wbOn=false,pvFilt=false,pvIdx=-1,pvSc=1;

const cam=document.getElementById('cam');

async function startCam(devId){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    const c=devId?{video:{deviceId:{exact:devId}},audio:false}:{video:{facingMode:'environment',width:{ideal:1920}},audio:false};
    stream=await navigator.mediaDevices.getUserMedia(c);
    cam.srcObject=stream;
    curDev=stream.getVideoTracks()[0]?.getSettings()?.deviceId||null;
    devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    document.getElementById('sw').classList.toggle('dim',devs.length<2);
  }catch(e){
    console.log('Cam err:',e);
    // Permission denied → show error, go back
    document.getElementById('err').classList.add('show');
  }
}

function goBack(){
  // Tell parent iframe to go back
  if(window.parent&&window.parent.document.getElementById('iframe-back')){
    window.parent.document.getElementById('iframe-back').click();
  }
}

function flash(){
  const f=document.getElementById('flash');
  f.style.transition='none';f.style.opacity='.6';
  requestAnimationFrame(()=>{f.style.transition='opacity .3s';f.style.opacity='0';});
}

function grab(){
  const c=document.createElement('canvas');c.width=cam.videoWidth;c.height=cam.videoHeight;
  const ctx=c.getContext('2d');ctx.drawImage(cam,0,0);
  // Default slight lux
  ctx.globalCompositeOperation='overlay';ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(0,0,c.width,c.height);
  if(wbOn){ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(0,0,c.width,c.height);}
  return c.toDataURL('image/jpeg',.85);
}

window.capture=()=>{
  hap.confirm();flash();
  const d=grab();
  if(photos.length>=5)photos.shift();
  photos.push(d);
  try{localStorage.setItem(CK,JSON.stringify(photos));}catch(e){photos.shift();try{localStorage.setItem(CK,JSON.stringify(photos));}catch(e2){}}
  if(photos.length===3){
    document.getElementById('st').textContent=photos.length+'枚の写真を撮影しました。まとめて保存しますか？';
    document.getElementById('sd').classList.add('show');
  }
};

window.splitCapture=async()=>{
  hap.confirm();flash();
  const d1=grab();
  await new Promise(r=>setTimeout(r,500));
  flash();
  const d2=grab();
  const i1=new Image(),i2=new Image();i1.src=d1;i2.src=d2;
  await Promise.all([new Promise(r=>{i1.onload=r;}),new Promise(r=>{i2.onload=r;})]);
  const c=document.createElement('canvas');c.width=Math.max(i1.width,i2.width);c.height=i1.height+i2.height;
  const ctx=c.getContext('2d');ctx.drawImage(i1,0,0,c.width,c.height/2);ctx.drawImage(i2,0,c.height/2,c.width,c.height/2);
  const combined=c.toDataURL('image/jpeg',.85);
  if(photos.length>=5)photos.shift();
  photos.push(combined);
  try{localStorage.setItem(CK,JSON.stringify(photos));}catch(e){}
  showPV(photos.length-1);
};

window.toggleWB=()=>{hap();wbOn=!wbOn;document.getElementById('wb').classList.toggle('on',wbOn);cam.style.filter=wbOn?'contrast(1.22) brightness(1.12)':'contrast(1.06) brightness(1.03)';};

// Camera select - slide up/down
window.openCS=()=>{
  hap();if(devs.length<2)return;
  const cl=document.getElementById('cl');cl.innerHTML='';
  devs.forEach((d,i)=>{
    const b=document.createElement('button');b.className='co';
    b.textContent=d.label||'カメラ '+(i+1);
    b.onclick=()=>{hap.confirm();closeCS();startCam(d.deviceId);};
    cl.appendChild(b);
  });
  const x=document.createElement('button');x.className='co x';x.textContent='キャンセル';
  x.onclick=()=>{hap();closeCS();};
  cl.appendChild(x);
  document.getElementById('cs').classList.add('show');
};

function closeCS(){
  const cs=document.getElementById('cs');
  cs.classList.remove('show');
  // CSS transition handles slide-down (translateY back to 120px)
}
// Tap background to close
document.getElementById('cs').addEventListener('click',e=>{if(e.target.id==='cs')closeCS();});

// Preview
function showPV(idx){pvIdx=idx;pvFilt=false;pvSc=1;
  document.getElementById('pvi').src=photos[idx];
  document.getElementById('pvi').style.filter='';
  document.getElementById('pvi').style.transform='scale(1)';
  document.getElementById('pv').classList.add('show');
}
window.closePV=()=>{hap();document.getElementById('pv').classList.remove('show');};
window.savePV=()=>{hap.confirm();if(pvIdx<0||!photos[pvIdx])return;const a=document.createElement('a');a.href=photos[pvIdx];a.download='photo_'+Date.now()+'.jpg';a.click();};
window.togglePVF=()=>{hap();pvFilt=!pvFilt;document.getElementById('pvw2').classList.toggle('on',pvFilt);document.getElementById('pvi').style.filter=pvFilt?'contrast(1.22) brightness(1.12)':'contrast(1.06) brightness(1.03)';};

// Pinch zoom preview
let pd=null;const pi=document.getElementById('pvi');
pi.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:false});
pi.addEventListener('touchmove',e=>{if(e.touches.length===2&&pd){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pvSc=Math.max(1,Math.min(5,pvSc*(d/pd)));pd=d;pi.style.transform='scale('+pvSc+')';}},{passive:false});
pi.addEventListener('touchend',e=>{if(e.touches.length<2)pd=null;},{passive:true});
let tt=0;pi.addEventListener('click',()=>{const n=Date.now();if(n-tt<300){pvSc=1;pi.style.transform='scale(1)';hap();}tt=n;});

// Save dialog
window.dS=()=>{hap();document.getElementById('sd').classList.remove('show');};
window.sAll=()=>{hap.confirm();photos.forEach((p,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=p;a.download='photo_'+Date.now()+'_'+(i+1)+'.jpg';a.click();},i*200));document.getElementById('sd').classList.remove('show');};

startCam();
// Default slight lux boost
cam.style.filter='contrast(1.06) brightness(1.03)';
</script>
</body>
</html>
