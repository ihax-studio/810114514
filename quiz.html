  document.getElementById('qOk').textContent=Z.ok;
  document.getElementById('qNg').textContent=Z.ng;
  document.getElementById('qP').style.width=(Z.i/n*100)+'%';
  document.getElementById('qG').textContent='Q'+(Z.i+1)+'/'+n;
  document.getElementById('qS').innerHTML=q.q.replace(/`([^`]+)`/g,'<code>$1</code>');
  document.getElementById('qFb').classList.add('hid');
  var ch=document.getElementById('qCh');
  ch.innerHTML=q.ch.map(function(c,i){return '<button class="ch" data-i="'+i+'"><span class="cn">'+(i+1)+'</span><span>'+c+'</span></button>'}).join('');
  var btns=ch.querySelectorAll('.ch');
  for(var i=0;i<btns.length;i++){btns[i].addEventListener('click',function(){hC(this)})}
  var cd=document.getElementById('qD');
  cd.style.animation='none';void cd.offsetWidth;cd.style.animation='ci .3s ease both';
  document.getElementById('qM').scrollTop=0;
  stT();sT();
}

function hC(btn){
  if(Z.ans||btn.classList.contains('off'))return;
  Z.ans=true;stT();
  var q=Z.qs[Z.i];
  var idx=parseInt(btn.dataset.i,10);
  var ok=(idx===q.a);
  var all=document.querySelectorAll('#qCh .ch');
  for(var j=0;j<all.length;j++){all[j].classList.add('off');if(j===q.a)all[j].classList.add('ok')}
  if(!ok){btn.classList.add('ng');Z.ng++;Z.wr.push(Z.i);aF(Z.sub.id,q);hW()}
  else{Z.ok++;H.ok()}
  sFb(q,ok);
}

function sFb(q,ok){
  document.getElementById('qOk').textContent=Z.ok;
  document.getElementById('qNg').textContent=Z.ng;
  var fb=document.getElementById('qFb');fb.classList.remove('hid');
  var fa=document.getElementById('qFA');
  fa.textContent=(ok?'✓ 正解！':'✗ 不正解')+'　→ '+q.ch[q.a];
  fa.className='fa '+(ok?'gd':'bd');
  document.getElementById('qFE').textContent=q.exp||'';
  var oldNv=document.getElementById('qNv');if(oldNv)oldNv.remove();
  var nv=document.createElement('div');nv.id='qNv';nv.className='nv';
  var nx=document.createElement('button');nx.className='nb np';nx.textContent='次へ ▶';
  nx.addEventListener('click',function(){H();Z.i++;rQ()});
  nv.appendChild(nx);fb.appendChild(nv);
  setTimeout(function(){fb.scrollIntoView({behavior:'smooth',block:'end'})},50);
}

/* ===== Timer ===== */
function sT(){
  stT();_ts=Date.now();_timerDead=false;
  var bar=document.getElementById('qTi');
  if(bar){bar.style.width='100%';bar.className='qtb'}
  function tick(){
    if(Z.ans||_timerDead)return;
    var e=Date.now()-_ts;
    var p=Math.max(0,1-e/TM)*100;
    if(bar){bar.style.width=p+'%';bar.className=p<20?'qtb x':p<40?'qtb w':'qtb'}
    if(e>=TM){tUp();return}
    _ta=requestAnimationFrame(tick);
  }
  _ta=requestAnimationFrame(tick);
  _tiv=setInterval(function(){
    if(Z.ans||_timerDead){clearInterval(_tiv);_tiv=null;return}
    if(Date.now()-_ts>=TM){clearInterval(_tiv);_tiv=null;tUp()}
  },400);
}
function stT(){if(_ta){cancelAnimationFrame(_ta);_ta=null}if(_tiv){clearInterval(_tiv);_tiv=null}}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&!Z.ans&&_ts>0){
    var e=Date.now()-_ts;
    if(e>=TM){tUp()}
    else{var bar=document.getElementById('qTi');if(bar){var p=Math.max(0,1-e/TM)*100;bar.style.width=p+'%';bar.className=p<20?'qtb x':p<40?'qtb w':'qtb'}}
  }
});
function tUp(){
  if(Z.ans||_timerDead)return;
  _timerDead=true;Z.ans=true;stT();hW();
  var q=Z.qs[Z.i];Z.ng++;Z.wr.push(Z.i);aF(Z.sub.id,q);
  var all=document.querySelectorAll('#qCh .ch');
  for(var j=0;j<all.length;j++){all[j].classList.add('off');if(j===q.a)all[j].classList.add('ok')}
  var bar=document.getElementById('qTi');if(bar){bar.style.width='0%';bar.className='qtb x'}
  sFb(q,false);
}

/* ===== Done Screen ===== */
function sDone(){
  var t=Z.qs.length;
  var p=t?Math.round(Z.ok/t*100):0;
  var emoji=p>=90?'🔥':p>=70?'👍':p>=50?'💪':'📖';
  var msg=p>=90?'完璧！':p>=70?'いい感じ！':p>=50?'もう少し！':'復習しよう';
  var h='<div class="dn"><div class="dne">'+emoji+'</div><div class="dnt">'+msg+'</div><div class="dns">'+Z.ok+'/'+t+' 正解（'+p+'%）</div>';

    h+='<div>';

      var q=Z.qs[Z.wr[w]];

    }
    h+='</div>';
  }
  h+='<div class="nv" style="margin-top:16px"><button class="nb np" id="dnRetry">もう1回</button></div>';
  h+='<div class="nv"><button class="nb ns" id="dnBack">メニューに戻る</button></div></div>';
  document.getElementById('qM').innerHTML=h;
  var subId=Z.sub.id;
  document.getElementById('dnRetry').addEventListener('click',function(){H();sQ(subId)});
  document.getElementById('dnBack').addEventListener('click',function(){H();ss('M');bM()});
}

function shOv(){
  var ex=document.getElementById('shO');if(ex)ex.remove();
  var ov=document.createElement('div');ov.className='ov';ov.id='shO';
  ov.innerHTML='<div class="ob"><div style="font-size:28px;margin-bottom:6px">📤</div><div style="font-size:15px;font-weight:800;margin-bottom:4px;color:#1c1c2e">共有</div><div style="font-size:11px;color:var(--dim);margin-bottom:12px">QRコードで共有</div><canvas id="qrC" style="margin:0 auto 10px;display:block;border-radius:10px"></canvas><button class="obt op" id="shU">URLをコピー</button><button class="obt os" id="shX">閉じる</button></div>';
  document.body.appendChild(ov);
  try{if(typeof QRCode!=='undefined')QRCode.toCanvas(document.getElementById('qrC'),location.href,{width:160,margin:2,color:{dark:'#1c1c2e',light:'#ffffff'}})}catch(_){}
  document.getElementById('shU').addEventListener('click',function(){
    var btn=this;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.href).then(function(){btn.textContent='✓ コピー済み';H.ok()}).catch(function(){fbCopy(btn)});
    }else{fbCopy(btn)}
  });
  function fbCopy(btn){try{var ta=document.createElement('textarea');ta.value=location.href;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);btn.textContent='✓ コピー済み';H.ok()}catch(_){btn.textContent='コピー失敗'}}
  document.getElementById('shX').addEventListener('click',function(){H();clOv()});
  ov.addEventListener('click',function(e){if(e.target===ov){H();clOv()}});
}
function clOv(){var o=document.getElementById('shO');if(o){o.classList.add('out');setTimeout(function(){if(o.parentNode)o.parentNode.removeChild(o)},180)}}
