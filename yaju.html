<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英検準1級 完全攻略</title>
<script type="importmap">{"imports":{"ios-haptics":"https://esm.sh/ios-haptics"}}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f7f6f3;--card:#fff;--text:#1a1a1a;--sub:#888;--line:#ebebeb;
  --green:#27a06a;--yellow:#d97706;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;
  --shadow:0 2px 16px rgba(0,0,0,.07);--shadow-lg:0 8px 40px rgba(0,0,0,.13);
}
html,body{height:100%;height:100dvh;overflow:hidden;}
body{font-family:'DM Sans','Noto Sans JP',sans-serif;background:var(--bg);display:flex;flex-direction:column;}

/* NAV */
.nav-bar{display:flex;gap:0;background:var(–card);border-bottom:1px solid var(–line);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.nav-bar::-webkit-scrollbar{display:none;}
.nav-btn{flex-shrink:0;padding:11px 14px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(–sub);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.nav-btn.active{color:var(–blue);border-bottom-color:var(–blue);}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:8px;padding:8px 16px 6px;flex-shrink:0;}
.prog-bar{flex:1;height:4px;background:var(–line);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(–blue),var(–purple));border-radius:2px;transition:width .4s ease;}
.prog-txt{font-size:11px;font-weight:600;color:var(–sub);min-width:52px;text-align:right;}

/* STATS CHIPS */
.stats-row{display:flex;gap:6px;padding:0 16px 8px;flex-shrink:0;}
.chip{background:var(–card);border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;box-shadow:var(–shadow);}

/* CARD AREA */
.card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px;position:relative;overflow:hidden;min-height:0;}

/* TRANS OVERLAY */
.trans-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(247,246,243,.96);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
.trans-overlay.show{opacity:1;pointer-events:auto;}
.trans-result{text-align:center;font-size:clamp(20px,5.5vw,38px);font-weight:300;color:var(–text);line-height:1.5;letter-spacing:-.01em;}
.trans-sub{font-size:13px;color:var(–sub);margin-top:10px;}

/* FLASHCARD */
.fc-wrap{width:100%;max-width:440px;perspective:1200px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.fc{width:100%;min-height:320px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.fc.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:24px 22px 20px;display:flex;flex-direction:column;box-shadow:var(–shadow-lg);background:var(–card);}
.fc-back{transform:rotateY(180deg);}

/* front */
.fc-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto;}
.lv-badge{font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 9px;border-radius:20px;}
.lv1{background:#dcfce7;color:#166534;}.lv2{background:#fef9c3;color:#854d0e;}.lv3{background:#fce7f3;color:#9d174d;}.lv-idiom{background:#ede9fe;color:#5b21b6;}.lv-gram{background:#e0f2fe;color:#075985;}
.cat-badge{font-size:10px;color:var(–sub);font-weight:500;}
.fc-word{font-size:clamp(28px,7vw,44px);font-weight:600;color:var(–text);letter-spacing:-.02em;margin:16px 0 4px;line-height:1.1;}
.fc-pron{font-size:13px;color:var(–sub);font-weight:300;margin-bottom:6px;}
.pos-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;}
.pos-n{background:#eff6ff;color:#1d4ed8;}.pos-v{background:#f0fdf4;color:#166534;}.pos-adj{background:#fffbeb;color:#b45309;}.pos-adv{background:#fff1f2;color:#be123c;}.pos-other{background:#f5f3ff;color:#6d28d9;}
.fc-hint{font-size:11px;color:var(–sub);margin-top:auto;text-align:center;opacity:.4;padding-top:12px;}

/* back */
.fc-mean{font-size:20px;font-weight:700;color:var(–text);margin-bottom:6px;}
.fc-full{font-size:12px;color:#555;line-height:1.7;margin-bottom:10px;}
.fc-ex{background:#f5f5f2;border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.fc-ex-e{font-size:13px;color:var(–text);line-height:1.6;}
.fc-ex-j{font-size:11px;color:var(–sub);margin-top:3px;}
.fc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.tag{background:#f0f0ee;border-radius:7px;padding:2px 8px;font-size:10px;color:#555;}
.fc-idioms-list{font-size:11px;line-height:1.9;color:var(–sub);}
.fc-idiom-e{font-style:italic;color:#333;}

/* ACTIONS */
.actions{display:flex;gap:8px;padding:10px 16px 8px;flex-shrink:0;}
.act-btn{flex:1;padding:11px 4px;border:none;border-radius:14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.act-btn:active{transform:scale(.91);}
.act-btn.forgot{background:#fef2f2;color:var(–red);}
.act-btn.hard{background:#fffbeb;color:var(–yellow);}
.act-btn.good{background:#f0fdf4;color:var(–green);}
.act-btn span{font-size:18px;}

/* TRANS BAR */
.trans-bar{padding:8px 14px 24px;flex-shrink:0;}
.trans-inner{display:flex;align-items:flex-end;gap:8px;background:var(–card);border-radius:24px;padding:8px 8px 8px 14px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
#translate-input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:var(–text);resize:none;min-height:34px;max-height:28dvh;line-height:1.5;overflow-y:auto;}
#translate-input::placeholder{color:#bbb;}
.tbar-btn{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:none;background:#f0f0ee;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(–sub);transition:transform .15s,background .15s;}
.tbar-btn:active{transform:scale(.88);}
.tbar-btn.go{background:var(–blue);color:#fff;}

/* LIST VIEW (grammar/idioms tab) */
.list-scroll{flex:1;overflow-y:auto;padding:10px 16px 8px;display:none;min-height:0;}
.list-scroll.active{display:block;}
.list-item{background:var(–card);border-radius:16px;padding:14px 16px;margin-bottom:8px;box-shadow:var(–shadow);}
.list-word{font-size:16px;font-weight:700;color:var(–text);margin-bottom:3px;}
.list-mean{font-size:13px;color:var(–sub);margin-bottom:6px;}
.list-note{font-size:12px;color:#555;line-height:1.7;background:#f5f5f2;border-radius:10px;padding:8px 10px;margin-top:6px;}
.list-ex{font-size:12px;color:#666;font-style:italic;margin-top:5px;}
.section-head{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(–sub);padding:10px 0 6px;}

/* swap animations */
.fc-wrap.out{animation:cardOut .22s ease forwards;}
.fc-wrap.in{animation:cardIn .22s ease forwards;}
@keyframes cardOut{to{opacity:0;transform:scale(.93) translateY(18px);}}
@keyframes cardIn{from{opacity:0;transform:scale(.93) translateY(-18px);}to{opacity:1;transform:none;}}

/* complete screen */
.complete-card{width:100%;max-width:440px;background:var(–card);border-radius:24px;padding:36px 24px;text-align:center;box-shadow:var(–shadow-lg);}
</style>

</head>
<body>

<!-- NAV -->

<div class="nav-bar">
  <button class="nav-btn active" id="tab-flash" onclick="switchTab('flash')">🃏 単語カード</button>
  <button class="nav-btn" id="tab-idiom" onclick="switchTab('idiom')">💬 イディオム</button>
  <button class="nav-btn" id="tab-gram" onclick="switchTab('gram')">📐 文法・表現</button>
  <button class="nav-btn" id="tab-para" onclick="switchTab('para')">✍️ 言い換え</button>
</div>

<!-- PROGRESS -->

<div class="prog-row">
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-txt" id="prog-txt">0 / 0</div>
</div>

<!-- STATS -->

<div class="stats-row" id="stats-row">
  <div class="chip"><span style="color:var(--green)">✓</span><span id="s-good" style="color:var(--green)">0</span></div>
  <div class="chip"><span style="color:var(--yellow)">△</span><span id="s-hard" style="color:var(--yellow)">0</span></div>
  <div class="chip"><span style="color:var(--red)">✗</span><span id="s-forgot" style="color:var(--red)">0</span></div>
  <div class="chip" style="margin-left:auto;cursor:pointer" onclick="shuffleDeck()">🔀 シャッフル</div>
</div>

<!-- CARD AREA -->

<div class="card-area" id="card-area">
  <!-- trans overlay -->
  <div class="trans-overlay" id="trans-overlay" onclick="closeTrans()">
    <div>
      <div class="trans-result" id="trans-result"></div>
      <div class="trans-sub" id="trans-sub"></div>
    </div>
  </div>
  <!-- flashcard -->
  <div class="fc-wrap" id="fc-wrap">
    <div class="fc" id="fc" onclick="flipCard()">
      <div class="fc-face fc-front" id="fc-front">
        <div class="fc-meta">
          <span class="lv-badge lv1" id="fc-lv">Lv1</span>
          <span class="cat-badge" id="fc-cat"></span>
        </div>
        <div class="fc-word" id="fc-word">—</div>
        <div class="fc-pron" id="fc-pron"></div>
        <span class="pos-badge pos-v" id="fc-pos">動詞</span>
        <div class="fc-hint">タップして意味を確認 →</div>
      </div>
      <div class="fc-face fc-back" id="fc-back">
        <div class="fc-mean" id="fc-mean"></div>
        <div class="fc-full" id="fc-full"></div>
        <div class="fc-ex" id="fc-ex"></div>
        <div class="fc-tags" id="fc-tags"></div>
        <div class="fc-idioms-list" id="fc-idioms"></div>
      </div>
    </div>
  </div>
</div>

<!-- LIST VIEWS -->

<div class="list-scroll" id="list-idiom"></div>
<div class="list-scroll" id="list-gram"></div>
<div class="list-scroll" id="list-para"></div>

<!-- ACTION BUTTONS -->

<div class="actions" id="actions" style="display:none">
  <button class="act-btn forgot" onclick="rate('forgot')"><span>😰</span>忘れた</button>
  <button class="act-btn hard" onclick="rate('hard')"><span>🤔</span>難しい</button>
  <button class="act-btn good" onclick="rate('good')"><span>✨</span>覚えた！</button>
</div>

<!-- TRANSLATOR -->

<div class="trans-bar">
  <div class="trans-inner">
    <button class="tbar-btn" id="btn-search" title="Google検索">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <textarea id="translate-input" placeholder="翻訳 / Translate..." rows="1" spellcheck="true"></textarea>
    <button class="tbar-btn go" id="btn-go" title="翻訳">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script type="module">
import { haptic } from 'ios-haptics';

/* ═══════════════════════════════════════════
   DATA — 全単語・イディオム・文法・言い換え
═══════════════════════════════════════════ */
const VOCAB = [
  /* ── LV1 基礎動詞 ── */
  {w:"achieve",pos:"v",lv:"lv1",cat:"動詞",mean:"達成する・成し遂げる",pron:"/əˈtʃiːv/",full:"努力の結果として実現すること。achievement（名）・achievable（形）。",ex:{e:"She achieved her goal of becoming a doctor.",j:"彼女は医者になる目標を達成した。"},tags:["achievement (n)","achievable (adj)"],idioms:[{e:"achieve a goal",j:"目標を達成する"}]},
  {w:"affect",pos:"v",lv:"lv1",cat:"動詞",mean:"影響を与える",pron:"/əˈfekt/",full:"⚠️ effect（名詞）と混同注意！affect=動詞、effect=名詞。",ex:{e:"Climate change affects everyone on Earth.",j:"気候変動は地球上の全員に影響を与える。"},tags:["effect (n)","affection (n)","affected (adj)"],idioms:[{e:"adversely affect",j:"悪影響を与える"}]},
  {w:"allow",pos:"v",lv:"lv1",cat:"動詞",mean:"許可する・可能にする",pron:"/əˈlaʊ/",full:"「させてあげる」イメージ。allow A to do = Aが〜するのを許可する。",ex:{e:"The law allows people to vote at 18.",j:"法律は18歳での投票を認めている。"},tags:["allowance (n)"],idioms:[{e:"allow A to do",j:"Aが〜することを許可する"}]},
  {w:"apply",pos:"v",lv:"lv1",cat:"動詞",mean:"応募する・適用する",pron:"/əˈplaɪ/",full:"「当てはめる」感覚。apply for=応募、apply to=〜に適用される。",ex:{e:"I applied for this job last week.",j:"先週この仕事に応募した。"},tags:["application (n)","applicant (n)"],idioms:[{e:"apply for",j:"〜に応募する"},{e:"apply to",j:"〜に適用される"}]},
  {w:"reduce",pos:"v",lv:"lv1",cat:"動詞",mean:"減らす・低下させる",pron:"/rɪˈdjuːs/",full:"数量・強度などを小さくすること。reduction（名詞）。",ex:{e:"We need to reduce carbon emissions.",j:"炭素排出量を削減する必要がある。"},tags:["reduction (n)","reductive (adj)"],idioms:[{e:"reduce A to B",j:"AをBにまで減らす"}]},
  {w:"require",pos:"v",lv:"lv1",cat:"動詞",mean:"必要とする・要求する",pron:"/rɪˈkwaɪər/",full:"requirement（名詞）。require A to do = Aに〜することを求める。",ex:{e:"The job requires strong communication skills.",j:"その仕事は高いコミュニケーション能力を必要とする。"},tags:["requirement (n)","required (adj)"],idioms:[]},
  {w:"involve",pos:"v",lv:"lv1",cat:"動詞",mean:"含む・巻き込む・〜を伴う",pron:"/ɪnˈvɒlv/",full:"involve doing = 〜することを含む。involved（形）= 複雑な。",ex:{e:"The project involves a lot of research.",j:"そのプロジェクトは多くのリサーチを伴う。"},tags:["involvement (n)","involved (adj)"],idioms:[{e:"be involved in",j:"〜に関わっている"}]},
  /* ── LV2 中級動詞 ── */
  {w:"demonstrate",pos:"v",lv:"lv2",cat:"動詞",mean:"実演する・証明する・示す",pron:"/ˈdemənstreɪt/",full:"「見せて証明する」イメージ。demonstrate that = 〜ということを示す。",ex:{e:"The study demonstrates that sleep is vital.",j:"その研究は睡眠が不可欠であることを示す。"},tags:["demonstration (n)","demonstrator (n)"],idioms:[{e:"demonstrate that",j:"〜ということを証明する"}]},
  {w:"indicate",pos:"v",lv:"lv2",cat:"動詞",mean:"示す・指し示す・暗示する",pron:"/ˈɪndɪkeɪt/",full:"データや状況が「〜を示している」場合に使う。indication（名）。",ex:{e:"Studies indicate that sleep is vital for health.",j:"研究は睡眠が健康に不可欠であることを示している。"},tags:["indication (n)","indicator (n)"],idioms:[]},
  {w:"maintain",pos:"v",lv:"lv2",cat:"動詞",mean:"維持する・主張する",pron:"/meɪnˈteɪn/",full:"状態を保つことと、意見を「主張し続ける」両方の意味。",ex:{e:"We must maintain our environment for future generations.",j:"将来の世代のために環境を維持しなければならない。"},tags:["maintenance (n)"],idioms:[]},
  {w:"contribute",pos:"v",lv:"lv2",cat:"動詞",mean:"貢献する・一因となる・寄付する",pron:"/kənˈtrɪbjuːt/",full:"contribute to 〜 = 〜に貢献する・〜の原因になる。",ex:{e:"Exercise contributes to good health.",j:"運動は健康に貢献する。"},tags:["contribution (n)","contributor (n)"],idioms:[{e:"contribute to",j:"〜に貢献する・〜の一因になる"}]},
  {w:"obtain",pos:"v",lv:"lv2",cat:"動詞",mean:"入手する・得る",pron:"/əbˈteɪn/",full:"努力して手に入れること。getよりフォーマル。obtainable（形）。",ex:{e:"You can obtain a visa at the embassy.",j:"大使館でビザを取得できる。"},tags:["obtainable (adj)"],idioms:[]},
  {w:"propose",pos:"v",lv:"lv2",cat:"動詞",mean:"提案する・提唱する",pron:"/prəˈpoʊz/",full:"アイデアや計画を公式に提出すること。proposal（名）。",ex:{e:"She proposed a new marketing strategy.",j:"彼女は新しいマーケティング戦略を提案した。"},tags:["proposal (n)"],idioms:[]},
  {w:"decline",pos:"v",lv:"lv2",cat:"動詞",mean:"断る・減少する",pron:"/dɪˈklaɪn/",full:"2つの意味が頻出。「NO」と言うことと数・量が減ること。",ex:{e:"Sales declined sharply last year.",j:"昨年、売上が急激に減少した。"},tags:[],idioms:[]},
  {w:"distinguish",pos:"v",lv:"lv2",cat:"動詞",mean:"区別する・識別する",pron:"/dɪˈstɪŋɡwɪʃ/",full:"distinguish A from B = AとBを区別する。",ex:{e:"Can you distinguish these two colors?",j:"この2色を区別できますか？"},tags:["distinguished (adj)"],idioms:[{e:"distinguish A from B",j:"AとBを区別する"}]},
  {w:"expand",pos:"v",lv:"lv2",cat:"動詞",mean:"拡張する・広げる",pron:"/ɪkˈspænd/",full:"サイズ・範囲・規模を大きくすること。expand on = 〜について詳しく述べる。",ex:{e:"The company is expanding its business overseas.",j:"その会社は海外事業を拡大している。"},tags:["expansion (n)"],idioms:[{e:"expand on",j:"〜について詳しく述べる"}]},
  /* ── LV3 上級動詞 ── */
  {w:"acknowledge",pos:"v",lv:"lv3",cat:"動詞",mean:"認める・承認する・感謝する",pron:"/əkˈnɒlɪdʒ/",full:"事実・功績を公式に認めること。acknowledge that = 〜ということを認める。",ex:{e:"He acknowledged his mistake publicly.",j:"彼は公に自分の過ちを認めた。"},tags:["acknowledgment (n)"],idioms:[{e:"acknowledge that",j:"〜ということを認める"}]},
  {w:"anticipate",pos:"v",lv:"lv3",cat:"動詞",mean:"予想する・期待する・先回りする",pron:"/ænˈtɪsɪpeɪt/",full:"expectより「積極的に心構えをする」ニュアンスが強い。",ex:{e:"We anticipate a large crowd at the event.",j:"イベントには大勢の人が来ると予想している。"},tags:["anticipation (n)"],idioms:[]},
  {w:"facilitate",pos:"v",lv:"lv3",cat:"動詞",mean:"促進する・容易にする",pron:"/fəˈsɪlɪteɪt/",full:"何かがよりスムーズに進むようにすること。facility（施設）と同語根。",ex:{e:"Technology facilitates communication worldwide.",j:"技術は世界規模のコミュニケーションを促進する。"},tags:["facilitation (n)","facility (n)"],idioms:[]},
  {w:"perceive",pos:"v",lv:"lv3",cat:"動詞",mean:"知覚する・〜とみなす",pron:"/pəˈsiːv/",full:"perceive A as B = AをBとみなす。perception（名）。",ex:{e:"Time is perceived differently depending on mood.",j:"時間の感覚は気分によって異なる。"},tags:["perception (n)","perceived (adj)"],idioms:[{e:"perceive A as B",j:"AをBとみなす"}]},
  {w:"persist",pos:"v",lv:"lv3",cat:"動詞",mean:"持続する・こだわり続ける",pron:"/pəˈsɪst/",full:"困難があっても続けること。persist in = 〜に固執する。",ex:{e:"If you persist, you will succeed.",j:"粘り強く続ければ成功する。"},tags:["persistence (n)","persistent (adj)"],idioms:[{e:"persist in",j:"〜に固執する"}]},

  {orig:"solve / deal with",better:["address","tackle","cope with","resolve"],note:"問題に「取り組む・対処する」フォーマル表現。",ex:"We must address climate change urgently."},
  {orig:"bad / harmful",better:["detrimental","adverse","unfavorable","damaging"],note:"悪影響・有害な状態のフォーマル表現。",ex:"Excessive stress is detrimental to health."},
  {orig:"good / helpful",better:["beneficial","advantageous","effective","constructive"],note:"利点・有益であることのフォーマル表現。",ex:"Regular exercise is beneficial for the body."},
  {orig:"many / a lot of",better:["numerous","a wide range of","a variety of","a great number of"],note:"数が多いことのフォーマル表現。学術文で必須。",ex:"There are numerous advantages to this approach."},
  {orig:"But",better:["However","Nevertheless","On the other hand","Nonetheless"],note:"逆接の接続副詞。文頭で使う場合はコンマを付ける。",ex:"The plan is costly; however, it is effective."},
  {orig:"Because / So",better:["Due to the fact that","Therefore","Consequently","As a result"],note:"原因・結果を示す接続表現のフォーマル版。",ex:"Consequently, the project was cancelled."},
  {orig:"Also",better:["Furthermore","In addition","Moreover","Additionally"],note:"追加情報を加える接続副詞。段落の展開で必須。",ex:"Furthermore, the cost was significantly reduced."},
  {orig:"happen",better:["occur","take place","arise","emerge"],note:"出来事が「起こる」場合のフォーマル表現。",ex:"The accident occurred near the intersection."},
  {orig:"use",better:["utilize","employ","implement","apply"],note:"何かを「使う」フォーマル表現。文脈により使い分け。",ex:"The company utilizes renewable energy sources."},
  {orig:"change",better:["transform","alter","modify","shift"],note:"変化の程度により使い分ける。transformは大きな変化。",ex:"Technology has transformed the way we communicate."},
];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let currentTab = 'flash';
let deck = shuffle([...VOCAB]);
let idx = 0;
let flipped = false;
let stats = {good:0, hard:0, forgot:0};
let transTimer = null;

/* ═══════════════════════════════════════════
   FLASHCARD
═══════════════════════════════════════════ */
function render() {
  if (idx >= deck.length) { showComplete(); return; }
  const w = deck[idx];
  flipped = false;
  document.getElementById('fc').classList.remove('flipped');
  document.getElementById('actions').style.display = 'none';

  // front
  const lvMap = {lv1:'Lv1 基礎',lv2:'Lv2 中級',lv3:'Lv3 上級'};
  const lvEl = document.getElementById('fc-lv');
  lvEl.textContent = lvMap[w.lv] || w.lv;
  lvEl.className = 'lv-badge ' + w.lv;
  document.getElementById('fc-cat').textContent = w.cat || '';
  document.getElementById('fc-word').textContent = w.w;
  document.getElementById('fc-pron').textContent = w.pron || '';
  const posEl = document.getElementById('fc-pos');
  const posLabels = {n:'名詞',v:'動詞',adj:'形容詞',adv:'副詞'};
  posEl.textContent = posLabels[w.pos] || w.pos;
  posEl.className = 'pos-badge pos-' + (w.pos || 'other');

  // back
  document.getElementById('fc-mean').textContent = w.mean;
  document.getElementById('fc-full').textContent = w.full || '';
  document.getElementById('fc-ex').innerHTML = w.ex
    ? `<div class="fc-ex-e">${w.ex.e}</div><div class="fc-ex-j">${w.ex.j}</div>`
    : '';
  document.getElementById('fc-tags').innerHTML = (w.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('fc-idioms').innerHTML = (w.idioms||[]).map(i=>`<div class="fc-idiom-e">${i.e}</div><div style="color:var(--sub)">${i.j}</div>`).join('');

  // progress
  const pct = Math.round(idx / deck.length * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-txt').textContent = idx + ' / ' + deck.length;
}

window.flipCard = function() {
  flipped = !flipped;
  document.getElementById('fc').classList.toggle('flipped', flipped);
  haptic();
  document.getElementById('actions').style.display = flipped ? 'flex' : 'none';
};

window.rate = function(type) {
  haptic.confirm();
  stats[type]++;
  document.getElementById('s-good').textContent = stats.good;
  document.getElementById('s-hard').textContent = stats.hard;
  document.getElementById('s-forgot').textContent = stats.forgot;
  if (type === 'forgot') deck.push({...deck[idx]});
  else if (type === 'hard') deck.splice(Math.min(idx+4, deck.length), 0, {...deck[idx]});
  idx++;
  animNext();
};

function animNext() {
  const wrap = document.getElementById('fc-wrap');
  wrap.classList.add('out');
  setTimeout(() => {
    wrap.classList.remove('out');
    render();
    void wrap.offsetWidth;
    wrap.classList.add('in');
    setTimeout(() => wrap.classList.remove('in'), 260);
  }, 200);
}

function showComplete() {
  document.getElementById('actions').style.display = 'none';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-txt').textContent = deck.length + ' / ' + deck.length;
  document.getElementById('card-area').innerHTML = `
    <div class="trans-overlay" id="trans-overlay" onclick="closeTrans()" style="z-index:40;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(247,246,243,.96);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;">
      <div><div class="trans-result" id="trans-result"></div><div class="trans-sub" id="trans-sub"></div></div>
    </div>
    <div class="complete-card">
      <div style="font-size:54px;margin-bottom:12px">🎉</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:6px">デッキ完了！</div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:20px">覚えた:${stats.good}　難しい:${stats.hard}　忘れた:${stats.forgot}</div>
      <button onclick="window.restartDeck()" style="background:var(--blue);color:#fff;border:none;border-radius:12px;padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">🔀 もう一度</button>
    </div>`;
}

window.restartDeck = function() {
  deck = shuffle([...VOCAB]);
  idx = 0; stats = {good:0,hard:0,forgot:0};
  document.getElementById('s-good').textContent = 0;
  document.getElementById('s-hard').textContent = 0;
  document.getElementById('s-forgot').textContent = 0;
  // restore card area
  document.getElementById('card-area').innerHTML = `
    <div class="trans-overlay" id="trans-overlay" onclick="closeTrans()">
      <div><div class="trans-result" id="trans-result"></div><div class="trans-sub" id="trans-sub"></div></div>
    </div>
    <div class="fc-wrap" id="fc-wrap">
      <div class="fc" id="fc" onclick="flipCard()">
        <div class="fc-face fc-front" id="fc-front">
          <div class="fc-meta"><span class="lv-badge lv1" id="fc-lv"></span><span class="cat-badge" id="fc-cat"></span></div>
          <div class="fc-word" id="fc-word"></div>
          <div class="fc-pron" id="fc-pron"></div>
          <span class="pos-badge pos-v" id="fc-pos"></span>
          <div class="fc-hint">タップして意味を確認 →</div>
        </div>
        <div class="fc-face fc-back" id="fc-back">
          <div class="fc-mean" id="fc-mean"></div>
          <div class="fc-full" id="fc-full"></div>
          <div class="fc-ex" id="fc-ex"></div>
          <div class="fc-tags" id="fc-tags"></div>
          <div class="fc-idioms-list" id="fc-idioms"></div>
        </div>
      </div>
    </div>`;
  render();
  attachSwipe();
};

window.shuffleDeck = function() {
  haptic.confirm();
  deck = shuffle([...VOCAB]);
  idx = 0;
  render();
};

/* ═══════════════════════════════════════════
   LIST VIEWS
═══════════════════════════════════════════ */
function buildIdiomList() {
  const el = document.getElementById('list-idiom');
  el.innerHTML = '<div class="section-head">イディオム一覧 (' + IDIOMS.length + '個)</div>' +
    IDIOMS.map(d => `
      <div class="list-item">
        <div class="list-word">${d.w}</div>
        <div class="list-mean" style="color:var(--blue);font-weight:600">${d.mean}</div>
        <div class="list-note">${d.note}</div>
        <div class="list-ex">"${d.ex}"<br><span style="color:var(--sub)">${d.exj}</span></div>
      </div>`).join('');
}

function buildGramList() {
  const el = document.getElementById('list-gram');
  el.innerHTML = '<div class="section-head">重要文法 (' + GRAMMAR.length + '項目)</div>' +
    GRAMMAR.map(d => `
      <div class="list-item">
        <div class="list-word">${d.head}</div>
        <div class="list-note">${d.note}<br><span style="color:var(--yellow);font-size:11px">💡 ${d.tip}</span></div>
        <div class="list-ex">"${d.ex}"<br><span style="color:var(--sub)">${d.exj}</span></div>
      </div>`).join('');
}

function buildParaList() {
  const el = document.getElementById('list-para');
  el.innerHTML = '<div class="section-head">言い換え表現 (ライティング必須)</div>' +
    PARAPHRASE.map(d => `
      <div class="list-item">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="font-size:13px;color:var(--sub);background:#f0f0ee;padding:3px 10px;border-radius:20px">${d.orig}</div>
          <span style="color:var(--sub)">→</span>
          ${d.better.map(b=>`<div style="background:var(--blue);color:#fff;font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600">${b}</div>`).join('')}
        </div>
        <div class="list-note" style="margin-top:8px">${d.note}</div>
        <div class="list-ex">"${d.ex}"</div>
      </div>`).join('');
}

/* ═══════════════════════════════════════════
   TAB SWITCH
═══════════════════════════════════════════ */
window.switchTab = function(tab) {
  haptic();
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');

  const isFlash = tab === 'flash';
  document.getElementById('card-area').style.display = isFlash ? 'flex' : 'none';
  document.getElementById('stats-row').style.display = isFlash ? 'flex' : 'none';
  document.getElementById('actions').style.display = isFlash && flipped ? 'flex' : 'none';
  document.getElementById('prog-row') && (document.querySelector('.prog-row').style.display = isFlash ? 'flex' : 'none');

  ['idiom','gram','para'].forEach(t => {
    const el = document.getElementById('list-' + t);
    el.classList.toggle('active', t === tab);
  });
};

/* ═══════════════════════════════════════════
   TRANSLATOR
═══════════════════════════════════════════ */
const input = document.getElementById('translate-input');

const autoResize = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.28) + 'px';
};

input.addEventListener('input', e => {
  autoResize();
  const text = e.target.value.trim();
  clearTimeout(transTimer);
  if (!text) { closeTrans(); return; }
  transTimer = setTimeout(() => doTranslate(text), 480);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    haptic();
    const text = input.value.trim();
    if (text) doTranslate(text);
  }
});

input.addEventListener('focus', () => haptic());

async function doTranslate(text) {
  try {
    const isJa = /[ぁ-んァ-ヶー一-龠]/.test(text);
    const pair = isJa ? 'ja|en' : 'en|ja';
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${pair}`;
    const res = await fetch(url);
    const data = await res.json();
    const translated = data.responseData?.translatedText;
    if (translated && translated !== 'N/A') {
      showTrans(translated, isJa ? 'JA → EN' : 'EN → JA');
    }
  } catch (err) {
    console.error('Translation error:', err);
  }
}

function showTrans(text, label) {
  const ov = document.getElementById('trans-overlay');
  const res = document.getElementById('trans-result');
  const sub = document.getElementById('trans-sub');
  if (!ov || !res) return;
  res.textContent = text;
  if (sub) sub.textContent = label || '';
  ov.classList.add('show');
  haptic.confirm();
}

window.closeTrans = function() {
  const ov = document.getElementById('trans-overlay');
  if (ov) ov.classList.remove('show');
  haptic();
  input.value = '';
  autoResize();
};

document.getElementById('btn-search').addEventListener('click', () => {
  haptic.confirm();
  const q = input.value.trim() || 'Google';
  window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
});

document.getElementById('btn-go').addEventListener('click', () => {
  haptic();
  const text = input.value.trim();
  if (text) doTranslate(text);
});

/* ═══════════════════════════════════════════
   SWIPE GESTURE
═══════════════════════════════════════════ */
function attachSwipe() {
  const wrap = document.getElementById('fc-wrap');
  if (!wrap) return;
  let startX = 0, startY = 0;
  wrap.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, {passive:true});
  wrap.addEventListener('touchend', e => {
    if (!flipped) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 55) {
      dx < 0 ? window.rate('forgot') : window.rate('good');
    }
  }, {passive:true});
}

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
buildIdiomList();
buildGramList();
buildParaList();
render();
attachSwipe();
</script>
