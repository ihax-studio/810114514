<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Translator - Multi-line</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
        }

        /* 翻訳結果の表示アニメーション */
        #result-container {
            transition: transform 0.4s ease, opacity 0.4s ease;
            transform: translateY(10px) scale(0.98);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        #result-container.show {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .input-shadow {
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .scale-btn {
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .scale-btn:hover {
            transform: scale(1.05);
        }
        .scale-btn:active {
            transform: scale(0.95);
        }

        /* テキストエリアの動的な高さ変化をアニメーション化 */
        #translate-input {
            transition: height 0.3s ease, transform 0.2s ease;
            resize: none; /* 手動リサイズ無効 */
            min-height: 60px;
            max-height: 40vh; /* 画面の40%まで伸びる */
            line-height: 1.5;
        }

        #translate-input:focus {
            transform: scale(1.01);
        }

        /* コンテナを常に下部に固定し、中身が伸びると上に押し上がるように */
        .bottom-container {
            position: fixed;
            bottom: 3rem;
            width: 100%;
            display: flex;
            align-items: flex-end; /* 下揃えにすることで、伸びた時に上へ広がる */
            justify-content: center;
            z-index: 20;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <div id="tap-overlay" class="absolute inset-0 flex items-center justify-center p-8 z-0">
        <div id="result-container" class="text-center w-full max-w-2xl">
            <h1 id="translated-text" class="text-2xl md:text-4xl font-light text-gray-800 leading-tight break-words">
            </h1>
        </div>
    </div>

    <div class="bottom-container px-6 gap-4">
        
        <div id="btn-search" class="scale-btn text-gray-400 hover:text-gray-600 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>

        <div class="relative flex-1 max-w-md">
            <textarea id="translate-input" 
                placeholder="Text here..." 
                spellcheck="true"
                rows="1"
                class="w-full py-4 px-8 rounded-[30px] border-none bg-white input-shadow text-center text-lg outline-none focus:ring-2 focus:ring-gray-100 block overflow-y-auto"></textarea>
        </div>

        <div id="btn-ai" class="scale-btn text-gray-400 hover:text-gray-600 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8Z"/><path d="M12 12L16 10"/><path d="M12 12L8 14"/></svg>
        </div>
    </div>

    <script type="module">
        import { haptic } from 'https://esm.sh/ios-haptics';

        const input = document.getElementById('translate-input');
        const resultContainer = document.getElementById('result-container');
        const translatedDisplay = document.getElementById('translated-text');
        const overlay = document.getElementById('tap-overlay');

        const triggerBurst = () => {
            const delay = 22;
            const count = 30; // 負荷軽減のため少し調整
            for (let i = 0; i < count; i++) {
                setTimeout(() => haptic.error(), i * delay);
            }
        };

        // テキストエリアの高さを自動調整する関数
        const autoResize = () => {
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
        };

        let debounceTimer;
        input.addEventListener('input', (e) => {
            autoResize(); // 入力ごとに高さを調整（スライドアップ）

            const text = e.target.value.trim();
            clearTimeout(debounceTimer);
            
            if (!text) {
                hideResult();
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const isJapanese = /[ぁ-んァ-ヶー一-龠]/.test(text);
                    const langPair = isJapanese ? 'ja|en' : 'en|ja';
                    
                    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
                    const data = await res.json();
                    
                    showResult(data.responseData.translatedText);
                } catch (err) {
                    console.error("Translation error:", err);
                }
            }, 500);
        });

        // Enterキー（Return）でハプティクスを発動
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                // 日本語変換確定時のEnterと区別するためisComposingは使わない（またはお好みで）
                haptic.impact('medium');
            }
        });

        const showResult = (text) => {
            translatedDisplay.innerText = text;
            resultContainer.classList.add('show');
        };

        const hideResult = () => {
            resultContainer.classList.remove('show');
        };

        document.getElementById('btn-search').onclick = () => {
            triggerBurst();
            const query = input.value || "Google";
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
        };

        document.getElementById('btn-ai').onclick = () => {
            triggerBurst();
            window.open('https://gemini.google.com/', '_blank');
        };

        input.onclick = () => {
            triggerBurst();
        };

        overlay.onclick = (e) => {
            if (resultContainer.classList.contains('show')) {
                haptic.impact('light');
                hideResult();
                input.value = ''; 
                autoResize(); // 高さをリセット
            }
        };

        // 初期化
        autoResize();
    </script>
</body>
</html>
