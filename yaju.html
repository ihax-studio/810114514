<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英語究極">

<title>英語究極参考書</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f7f6f3;--card:#fff;--tx:#1a1a1a;--sub:#888;--ln:#e8e8e8;--g:#27a06a;--y:#d97706;--r:#dc2626;--b:#2563eb;--p:#7c3aed;--sh:0 2px 16px rgba(0,0,0,.07);--shl:0 8px 36px rgba(0,0,0,.12);--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
html,body{height:100dvh;overflow:hidden}
body{font-family:'DM Sans','Noto Sans JP',sans-serif;background:var(--bg);display:flex;flex-direction:column}
.nav{display:flex;background:var(--card);border-bottom:1px solid var(--ln);flex-shrink:0;overflow-x:auto;scrollbar-width:none;padding-top:var(--sat)}
.nav::-webkit-scrollbar{display:none}
.nb{flex-shrink:0;padding:10px 13px;border:none;background:none;font-family:inherit;font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.nb.on{color:var(--b);border-bottom-color:var(--b)}
.pr{display:flex;align-items:center;gap:8px;padding:7px 16px 5px;flex-shrink:0}
.prb{flex:1;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
.prf{height:100%;background:linear-gradient(90deg,var(--b),var(--p));border-radius:2px;transition:width .4s}
.prt{font-size:11px;font-weight:600;color:var(--sub);min-width:48px;text-align:right}
.sr{display:flex;gap:5px;padding:0 14px 6px;flex-shrink:0;align-items:center}
.ch{background:var(--card);border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;box-shadow:var(--sh);border:none;font-family:inherit;cursor:pointer;transition:transform .12s}
.ch:active{transform:scale(.9)}
.ch-bk{font-size:16px;padding:4px 10px;background:#f0f0ee;color:var(--sub)}
.ch-bk:disabled{opacity:.28;cursor:default;transform:none!important}
.ca{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 16px;position:relative;overflow:hidden;min-height:0}
.fw{width:100%;max-width:440px;perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none}
.fc{width:100%;min-height:300px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc.fl{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;box-shadow:var(--shl);background:var(--card)}
.fb{transform:rotateY(180deg)}
.fmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto}
.lv{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:20px}
.l1{background:#dcfce7;color:#166534}.l2{background:#fef9c3;color:#854d0e}.l3{background:#fce7f3;color:#9d174d}.lid{background:#ede9fe;color:#5b21b6}
.fcat{font-size:10px;color:var(--sub);font-weight:500}
.fword{font-size:clamp(26px,7vw,42px);font-weight:600;color:var(--tx);letter-spacing:-.02em;margin:14px 0 3px;line-height:1.1}
.fpron{font-size:12px;color:var(--sub);font-weight:300;margin-bottom:5px}
.fpos{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.pn{background:#eff6ff;color:#1d4ed8}.pv{background:#f0fdf4;color:#166534}.pa{background:#fffbeb;color:#b45309}.pd{background:#fff1f2;color:#be123c}.po{background:#f5f3ff;color:#6d28d9}
.fh{font-size:11px;color:var(--sub);margin-top:auto;text-align:center;opacity:.4;padding-top:10px}
.fmean{font-size:19px;font-weight:700;color:var(--tx);margin-bottom:4px}
.ffull{font-size:11.5px;color:#555;line-height:1.7;margin-bottom:8px}
.fex{background:#f5f5f2;border-radius:11px;padding:9px 11px;margin-bottom:8px;font-size:12px;line-height:1.6}
.fexe{color:var(--tx)}.fexj{color:var(--sub);margin-top:2px;font-size:11px}
.ftags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.ftag{background:#f0f0ee;border-radius:6px;padding:1px 7px;font-size:10px;color:#555}
.fidm{font-size:11px;line-height:1.8;color:var(--sub)}
.fide{font-style:italic;color:#333}
.fw.out{animation:co .2s ease forwards}.fw.in{animation:ci .2s ease forwards}
@keyframes co{to{opacity:0;transform:scale(.93) translateY(16px)}}
@keyframes ci{from{opacity:0;transform:scale(.93) translateY(-16px)}to{opacity:1;transform:none}}
.cc{width:100%;max-width:440px;background:var(--card);border-radius:22px;padding:32px 20px;text-align:center;box-shadow:var(--shl)}
.acts{display:flex;gap:8px;padding:8px 16px 6px;flex-shrink:0}
.ab{flex:1;padding:10px 4px;border:none;border-radius:13px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.ab:active{transform:scale(.91)}
.ab.af{background:#fef2f2;color:var(--r)}.ab.ah{background:#fffbeb;color:var(--y)}.ab.ag{background:#f0fdf4;color:var(--g)}
.ab span{font-size:17px}
.tb{padding:6px 14px calc(8px + var(--sab));flex-shrink:0}
.ti{display:flex;align-items:flex-end;gap:8px;background:var(--card);border-radius:22px;padding:7px 7px 7px 13px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
#ti{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:var(--tx);resize:none;min-height:32px;max-height:26dvh;line-height:1.5;overflow-y:auto}
#ti::placeholder{color:#bbb}
.tbb{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.tbb:active{transform:scale(.88)}
.tbs{background:#f0f0ee;color:var(--sub)}.tbg{background:var(--b);color:#fff}
.ls{flex:1;overflow-y:auto;padding:8px 16px;display:none;min-height:0;-webkit-overflow-scrolling:touch}
.ls.on{display:block}
.li{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:7px;box-shadow:var(--sh)}
.lw{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:2px}
.lm{font-size:12px;color:var(--b);font-weight:600;margin-bottom:4px}
.lnx{font-size:11.5px;color:#555;line-height:1.7;background:#f5f5f2;border-radius:9px;padding:7px 9px;margin-top:5px}
.le{font-size:11.5px;color:#666;font-style:italic;margin-top:4px;line-height:1.5}
.sh{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);padding:8px 0 4px}
/* Bottom Sheets */
.bsheet{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);border-radius:22px 22px 0 0;z-index:70;transform:translateY(105%);transition:transform .32s cubic-bezier(.4,0,.2,1);max-height:70dvh;display:flex;flex-direction:column;padding-bottom:var(--sab);box-shadow:0 -6px 40px rgba(0,0,0,.18);will-change:transform}
.bsheet.open{transform:translateY(0)}
.bs-hdl{width:40px;height:4px;background:#d0d0d0;border-radius:2px;margin:12px auto 4px;flex-shrink:0;touch-action:none;cursor:grab}
.bs-title{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.09em;text-transform:uppercase;text-align:center;padding:4px 0 8px;flex-shrink:0}
.bs-body{flex:1;overflow-y:auto;padding:4px 18px 14px;-webkit-overflow-scrolling:touch}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:65;opacity:0;pointer-events:none;transition:opacity .28s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scrim.on{opacity:1;pointer-events:auto}
.tloc{font-size:12.5px;color:var(--b);background:rgba(37,99,235,.07);border-radius:10px;padding:9px 12px;margin-bottom:10px;display:none;line-height:1.7}
.tres{font-size:clamp(18px,5vw,32px);font-weight:300;color:var(--tx);line-height:1.5;word-break:break-word}
.tsub{font-size:12px;color:var(--sub);margin-top:6px}
.hrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln)}
.hrow:last-child{border-bottom:none}
.hbdg{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.hg-b{background:#dcfce7;color:#166534}.hh-b{background:#fef9c3;color:#854d0e}.hf-b{background:#fee2e2;color:#991b1b}
.hw{font-size:13px;font-weight:700;color:var(--tx)}.hm{font-size:11px;color:var(--sub);margin-top:1px}
.exr{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}
.exr:last-child{border-bottom:none}
.exn{font-size:10px;font-weight:700;color:var(--sub);min-width:30px;padding-top:2px}
.exph{font-size:13px;font-weight:700;color:var(--b)}.exja{font-size:11px;color:var(--sub);margin-top:1px}
.exe{font-size:11px;color:#555;font-style:italic;margin-top:3px;line-height:1.5}
.ivwrap{overflow-x:auto;border-radius:12px;box-shadow:var(--sh);margin-bottom:8px}
.ivt{width:100%;border-collapse:collapse;font-size:11.5px;background:var(--card)}
.ivt th{background:var(--b);color:#fff;padding:7px 5px;text-align:center;font-weight:700;font-size:10px;white-space:nowrap}
.ivt td{padding:5px;border-bottom:1px solid var(--ln);text-align:center;vertical-align:middle;white-space:nowrap}
.ivt tr:nth-child(even) td{background:#f9f8f6}
.ivp{color:var(--r);font-weight:700}.ivpp{color:var(--b);font-weight:700}.ivb{font-weight:700;color:var(--tx)}
</style>
</head>

<script type="module">
/* ═══ HAPTIC — non-blocking, never delays render ═══ */
let _hRaw=null;
(function(){
  import('https://esm.sh/ios-haptics').then(m=>{_hRaw=m.haptic;}).catch(()=>{});
})();
function haptic(){try{_hRaw&&_hRaw();}catch(_){}}
haptic.confirm=function(){try{_hRaw&&_hRaw.confirm&&_hRaw.confirm();}catch(_){}};

const V=[
{w:"allege",p:"v",l:3,c:"2015動詞",m:"主張する・断言する",pr:"/əˈledʒ/",f:"that節をとる。allocate（割り当てる）と混同注意。",e:"He alleged that the company was guilty.",ej:"彼はその会社に罪があると主張した。",t:["allegation (n)"],id:[]},
{w:"allocate",p:"v",l:3,c:"2015動詞",m:"割り当てる・配分する",pr:"/ˈæləkeɪt/",f:"allocate A to B の形。allege（主張する）と混同注意。",e:"The government allocated funds to the project.",ej:"政府はそのプロジェクトに資金を割り当てた。",t:["allocation (n)"],id:[]},
{w:"apprehend",p:"v",l:3,c:"2015動詞",m:"逮捕する・理解する",pr:"/ˌæprɪˈhend/",f:"comprehend（理解する）と区別。警察文脈では逮捕。",e:"The police apprehended the suspect.",ej:"警察は容疑者を逮捕した。",t:["apprehension (n)"],id:[]},
{w:"ascertain",p:"v",l:3,c:"2015動詞",m:"確認する・確かめる",pr:"/ˌæsərˈteɪn/",f:"≒make sure。that節と共に使う。",e:"We need to ascertain the facts.",ej:"事実を確認する必要がある。",t:[],id:[]},
{w:"eradicate",p:"v",l:3,c:"2015動詞",m:"根絶する・撲滅する",pr:"/ɪˈrædɪkeɪt/",f:"病気・社会問題の文脈。",e:"Scientists aim to eradicate malaria.",ej:"科学者たちはマラリアの根絶を目指している。",t:["eradication (n)"],id:[]},

{w:"dominate",p:"v",l:3,c:"2015動詞",m:"支配する・優位を占める",pr:"/ˈdɒmɪneɪt/",f:"domesticate（飼いならす）と混同注意。",e:"One company dominates the market.",ej:"1つの会社が市場を支配している。",t:["dominance (n)","dominant (adj)"],id:[]},

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ═══ SHEET SYSTEM ═══ */
const scrim=document.getElementById('scrim');
let activeSheet=null;
function openSheet(sh){
  if(activeSheet&&activeSheet!==sh)_closeSheet(activeSheet);
  sh.classList.add('open');scrim.classList.add('on');activeSheet=sh;
}
function _closeSheet(sh){
  if(!sh)return;
  sh.classList.remove('open');sh.style.transform='';sh.style.transition='';
  scrim.classList.remove('on');activeSheet=null;
}
scrim.addEventListener('click',()=>{_closeSheet(activeSheet);haptic();});
function makeSwipeable(shId,hdlId){
  const sh=document.getElementById(shId),hdl=document.getElementById(hdlId);
  let sy=0,drag=false;
  const start=y=>{sy=y;drag=true;sh.style.transition='none';};
  const move=y=>{if(!drag)return;const d=y-sy;if(d>0)sh.style.transform=`translateY(${d}px)`;};
  const end=y=>{if(!drag)return;drag=false;sh.style.transition='';if(y-sy>60){_closeSheet(sh);haptic();}else sh.style.transform='';};
  hdl.addEventListener('touchstart',e=>start(e.touches[0].clientY),{passive:true});
  hdl.addEventListener('touchmove',e=>move(e.touches[0].clientY),{passive:true});
  hdl.addEventListener('touchend',e=>end(e.changedTouches[0].clientY),{passive:true});
  hdl.addEventListener('mousedown',e=>{sy=e.clientY;drag=true;sh.style.transition='none';});
  window.addEventListener('mousemove',e=>{move(e.clientY);});
  window.addEventListener('mouseup',e=>{end(e.clientY);});
}
makeSwipeable('tsheet','tsh-hdl');
makeSwipeable('hsheet','hsh-hdl');

/* ═══ LOCAL LOOKUP ═══ */
function localLookup(q){
  const ql=q.toLowerCase().trim();
  const vr=V.find(w=>w.w.toLowerCase()===ql);
  if(vr)return`📚 <strong>${vr.w}</strong> [${vr.p}] — ${vr.m}${vr.pr?` <span style="color:var(--sub)">${vr.pr}</span>`:''}`;
  const er=EX.find(e=>e.ph.toLowerCase()===ql||(ql.length>4&&e.ph.toLowerCase().includes(ql)));
  if(er)return`📝 <strong>${er.ph}</strong> — ${er.ja}`;
  const ir=IV.find(v=>v.b===ql||v.p===ql||v.pp===ql||v.p.split('/').some(x=>x.trim()===ql));
  if(ir)return`🔄 <strong>${ir.b}</strong> → ${ir.p} → ${ir.pp} ／ ${ir.m}`;
  const idr=ID.find(d=>d.w.toLowerCase().includes(ql)&&ql.length>4);
  if(idr)return`💬 <strong>${idr.w}</strong> — ${idr.m}`;
  if(typeof _p1LookupExt==='function'){const r=_p1LookupExt(q);if(r)return r;}
  return null;
}

  document.getElementById('sg').textContent=st.g;

  document.getElementById('sf').textContent=st.f;
}

/* ═══ ANSWER ═══ */
window.R=function(t){
  if(idx>=deck.length)return;
  haptic.confirm();
  prevState={deck:[...deck],idx,st:{...st},hist:[...hist]};
  const cur=deck[idx];
  hist.unshift({w:cur.w,m:cur.m,r:t});
  if(hist.length>80)hist.pop();
  st[t]++;updateStats();
  if(t==='f')deck.push({...deck[idx]});
  else if(t==='h')deck.splice(Math.min(idx+4,deck.length),0,{...deck[idx]});
  idx++;
  const fw=document.getElementById('fw');
  fw.classList.add('out');
  setTimeout(()=>{fw.classList.remove('out');render();void fw.offsetWidth;fw.classList.add('in');setTimeout(()=>fw.classList.remove('in'),240);},190);
};

/* ═══ BACK ═══ */
window.goBack=function(){
  if(!prevState)return;
  haptic.confirm();
  deck=prevState.deck;idx=prevState.idx;st=prevState.st;hist=prevState.hist;
  prevState=null;flipped=false;
  updateStats();render();
};

};

    exHtml+=`<div class="li" style="padding:8px 12px">`;
    exHtml+=items.map(d=>`<div class="exr"><div class="exn">${String(d.n).padStart(3,'0')}</div><div style="flex:1"><div class="exph">${d.ph}</div><div class="exja">${d.ja}</div>${d.e?`<div class="exe">${d.e} <span style="color:var(--sub)">${d.ej}</span></div>`:''}</div></div>`).join('');
    exHtml+='</div>';
  });
  document.getElementById('l-e').innerHTML=exHtml;

  // irregular verbs
  document.getElementById('l-v').innerHTML=`<div class="sh">不規則動詞の変化表 ${IV.length}語</div>
    <div class="ivwrap"><table class="ivt">
    <thead><tr><th>原形</th><th>過去形</th><th>過去分詞</th><th>意味</th><th>3単現</th><th>現在分詞</th></tr></thead>
    <tbody>${IV.map(v=>`<tr>
      <td class="ivb">${v.b}</td>
      <td class="ivp">${v.p}</td>
      <td class="ivpp">${v.pp}</td>
      <td>${v.m}</td>
      <td>${v.s}</td>
      <td>${v.g}</td>
    </tr>`).join('')}</tbody></table></div>
    <div style="font-size:10px;color:var(--sub);padding:4px 2px">※ burnの過去形・過去分詞はburned、forgetの過去分詞はforgot、getの過去分詞はgotとなることもあります。</div>`;

  // grammar
  document.getElementById('l-g').innerHTML='<div class="sh">重要文法 '+GR.length+'項目</div>'+
    GR.map(d=>`<div class="li"><div class="lw">${d.h}</div><div class="lnx">${d.n}<br><span style="color:var(--y);font-size:11px">💡 ${d.tip}</span></div><div class="le">"${d.e}"<br><span style="color:var(--sub)">${d.ej}</span></div></div>`).join('');

  // paraphrase
  document.getElementById('l-p').innerHTML='<div class="sh">言い換え表現 '+PA.length+'セット</div>'+
    PA.map(d=>`<div class="li"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:12px;background:#f0f0ee;padding:2px 9px;border-radius:20px;color:var(--sub)">${d.o}</span><span style="color:var(--sub)">→</span>${d.b.map(b=>`<span style="background:var(--b);color:#fff;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600">${b}</span>`).join('')}</div><div class="lnx" style="margin-top:6px">${d.n}</div><div class="le">"${d.e}"</div></div>`).join('');

  // reading
  document.getElementById('l-r').innerHTML='<div class="sh">長文読解 重要表現 '+RE.length+'個</div>'+
    RE.map(d=>`<div class="li"><div class="lw">${d.p}</div><div class="lm">${d.m}</div><div class="le">"${d.e}"</div><div style="font-size:10px;color:var(--sub);margin-top:3px">出典: ${d.s}</div></div>`).join('');

  // confused
  document.getElementById('l-c').innerHTML='<div class="sh">混同ペア '+CP.length+'組</div>'+
    CP.map(d=>`<div class="li"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px"><span style="background:#fef2f2;border:1px solid #fecaca;color:var(--r);padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700">${d.a}</span><span style="color:var(--sub);font-size:11px">vs</span><span style="background:#eff6ff;border:1px solid #bfdbfe;color:#2563eb;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700">${d.b}</span></div><div style="font-size:11px;color:#555">📌 ${d.n}</div></div>`).join('');

  // themes
  document.getElementById('l-a').innerHTML='<div class="sh">頻出アカデミックテーマ</div>'+
    TH.map(d=>`<div class="li"><div class="lw">${d.cat}</div>${d.items.map(i=>`<div style="font-size:12px;color:#555;padding:3px 0;border-bottom:1px solid var(--ln)">• ${i}</div>`).join('')}</div>`).join('');
}


/* ═══ PRE-1 PASS-TAN ═══ */
let p1mode='w'; // 'w'=words, 'p'=phrases
let p1deck=[],p1idx=0,p1flipped=false,p1st={g:0,h:0,f:0};
let p1hist=[],p1prev=null;

function p1Shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function p1Init(){
  p1deck=p1Shuf([...( p1mode==='w' ? P1W : P1P )]);
  p1idx=0;p1flipped=false;p1st={g:0,h:0,f:0};p1hist=[];p1prev=null;
  p1UpdateStats();p1Render();
}

function p1Toggle(){
  haptic();
  p1mode=(p1mode==='w'?'p':'w');
  document.getElementById('p1-mode-lbl').textContent=p1mode==='w'?'単語':'熟語';
  document.getElementById('p1-lv').textContent=p1mode==='w'?'準1級 単語':'準1級 熟語';
  document.getElementById('p1-cat').textContent=p1mode==='w'?'英単語':'イディオム・句動詞';
  p1Init();
}

window.p1Shuffle=function(){
  haptic.confirm();p1Init();
};

function p1Render(){
  if(p1idx>=p1deck.length){p1Done();return;}
  const w=p1deck[p1idx];
  p1flipped=false;
  document.getElementById('p1-fc').classList.remove('fl');
  document.getElementById('p1-acts').style.display='none';
  document.getElementById('p1-word').textContent=w.e;
  document.getElementById('p1-mean').textContent=w.j;
  document.getElementById('p1-extra').textContent='';
  const pct=Math.round(p1idx/p1deck.length*100);
  document.getElementById('p1-pf').style.width=pct+'%';
  document.getElementById('p1-pt').textContent=p1idx+'/'+p1deck.length;
  document.getElementById('p1-cbk').disabled=!p1prev;
}

window.p1Flip=function(){
  p1flipped=!p1flipped;
  document.getElementById('p1-fc').classList.toggle('fl',p1flipped);
  haptic();
  document.getElementById('p1-acts').style.display=p1flipped?'flex':'none';
};

function p1UpdateStats(){
  document.getElementById('p1-sg').textContent=p1st.g;
  document.getElementById('p1-sh').textContent=p1st.h;
  document.getElementById('p1-sf').textContent=p1st.f;
}

window.p1Ans=function(t){
  if(p1idx>=p1deck.length)return;
  haptic.confirm();
  p1prev={deck:[...p1deck],idx:p1idx,st:{...p1st},hist:[...p1hist]};
  const cur=p1deck[p1idx];
  p1hist.unshift({w:cur.e,m:cur.j,r:t});
  if(p1hist.length>80)p1hist.pop();
  p1st[t]++;p1UpdateStats();
  if(t==='f')p1deck.push({...p1deck[p1idx]});
  else if(t==='h')p1deck.splice(Math.min(p1idx+4,p1deck.length),0,{...p1deck[p1idx]});
  p1idx++;
  const fw=document.getElementById('p1-fw');
  fw.classList.add('out');
  setTimeout(()=>{fw.classList.remove('out');p1Render();void fw.offsetWidth;fw.classList.add('in');setTimeout(()=>fw.classList.remove('in'),240);},190);
};

window.p1Back=function(){
  if(!p1prev)return;
  haptic.confirm();
  p1deck=p1prev.deck;p1idx=p1prev.idx;p1st=p1prev.st;p1hist=p1prev.hist;
  p1prev=null;p1flipped=false;
  p1UpdateStats();p1Render();
};

window.p1ShowHist=function(filter){
  haptic();
  const labels={g:'✓ 正解',h:'△ むずい',f:'✗ 忘れた'};
  const filtered=p1hist.filter(h=>h.r===filter);
  document.getElementById('htit').textContent=labels[filter]+' — '+filtered.length+'件';
  document.getElementById('hlist').innerHTML=!filtered.length
    ?'<div style="text-align:center;color:var(--sub);font-size:12px;padding:20px 0">まだ記録がありません</div>'
    :filtered.map(h=>`<div class="hrow"><div class="hbdg ${h.r==='g'?'hg-b':h.r==='h'?'hh-b':'hf-b'}">${h.r==='g'?'✓':h.r==='h'?'△':'✗'}</div><div><div class="hw">${h.e||h.w}</div><div class="hm">${h.m}</div></div></div>`).join('');
  openSheet(document.getElementById('hsheet'));
};

function p1Done(){
  document.getElementById('p1-acts').style.display='none';
  document.getElementById('p1-pf').style.width='100%';
  document.getElementById('p1-fw').innerHTML=`
    <div class="cc">
      <div style="font-size:48px;margin-bottom:8px">🎉</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:4px">完了！</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:14px">✓${p1st.g} △${p1st.h} ✗${p1st.f}</div>
      <button onclick="p1Shuffle()" style="background:var(--b);color:#fff;border:none;border-radius:11px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🔀 もう一度</button>
    </div>`;
}

/* P1 swipe */
let p1sx=0;
document.getElementById('p1-fw').addEventListener('touchstart',e=>{p1sx=e.touches[0].clientX;},{passive:true});
document.getElementById('p1-fw').addEventListener('touchend',e=>{
  if(!p1flipped)return;
  const dx=e.changedTouches[0].clientX-p1sx;
  if(Math.abs(dx)>55){dx>0?p1Ans('g'):p1Ans('f');}
},{passive:true});

/* Local lookup extension for P1 — patched into existing localLookup */
const _p1LookupExt=(q)=>{
  const ql=q.toLowerCase().trim();
  const wr=P1W.find(w=>w.e.toLowerCase()===ql);
  if(wr)return`📗 <strong>${wr.e}</strong> — ${wr.j} <span style="font-size:10px;color:var(--sub)">[Pass単]</span>`;
  const pr=P1P.find(p=>p.e.toLowerCase()===ql||(ql.length>4&&p.e.toLowerCase().includes(ql)));
  if(pr)return`📗 <strong>${pr.e}</strong> — ${pr.j} <span style="font-size:10px;color:var(--sub)">[Pass単 熟語]</span>`;
  return null;
};

/* ═══ TRANSLATOR ═══ */
const inp=document.getElementById('ti');
const ar=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,window.innerHeight*.26)+'px';};
inp.addEventListener('input',ar);
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();haptic();const t=inp.value.trim();if(t)doTr(t);}
});
inp.addEventListener('focus',()=>haptic());
async function doTr(t){
  if(!t)return;
  const tsh=document.getElementById('tsheet');
  const tlEl=document.getElementById('tl'),trEl=document.getElementById('tr'),tsEl=document.getElementById('ts');
  const lc=localLookup(t);
  if(lc){tlEl.innerHTML=lc;tlEl.style.display='block';}else{tlEl.style.display='none';}
  trEl.textContent='…';tsEl.textContent='';
  openSheet(tsh);
  try{
    const j=/[ぁ-んァ-ヶー一-龠]/.test(t);
    const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${j?'ja|en':'en|ja'}`);
    const d=await res.json();
    const x=d.responseData?.translatedText;
    if(x&&x!=='N/A'&&!x.toLowerCase().includes('mymemory')){
      trEl.textContent=x;tsEl.textContent=j?'JA → EN':'EN → JA';haptic.confirm();
    }else{trEl.textContent=lc?'':'翻訳できませんでした';}
  }catch(err){trEl.textContent=lc?'':'オフラインです';}
}
document.getElementById('bsr').addEventListener('click',()=>{
  haptic.confirm();const q=inp.value.trim();
  if(q)window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}&hl=ja`,'_blank');
});
document.getElementById('bgo').addEventListener('click',()=>{haptic();const t=inp.value.trim();if(t)doTr(t);});

/* ═══ CARD SWIPE ═══ */
let sx=0;
document.getElementById('fw').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
document.getElementById('fw').addEventListener('touchend',e=>{
  if(!flipped)return;const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>55){dx>0?R('g'):R('f');}
},{passive:true});

/* ═══ INIT ═══ */
buildLists();
render();
</script></body></html>
