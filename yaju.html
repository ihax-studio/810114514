

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>やじゅルシ・リアルタイム東コンパス</title>
  <style>
        body {
      margin: 0;
      background: #00a4ff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .compass-container {
      width: 180px; height: 180px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      user-select: none;
    }

    .compass-arrow {
      width: 140px; height: 140px;
      position: absolute;
      top: 20px; left: 20px;
      display: flex; justify-content: center; align-items: center;
      transition: transform 0.5s cubic-bezier(.7,0,.3,1);
      z-index: 2;
    }
    .arrow-body, .arrow-diag {
      position: absolute;
      background: #fff;
      border-radius: 9999px;
      opacity: 1;
      transition: opacity 0.28s, width 0.4s cubic-bezier(.7,0,.3,1), transform 0.8s cubic-bezier(.7,0,.3,1);
    }
    .arrow-body {
      width: 336px; height: 7px;
      left: -80px; top: 71px;
      z-index: 2;
      transform: rotate(0deg);
    }
    .arrow-diag {
      width: 200px; height: 7px;
      left: 88px;
      background: #fff;
      z-index: 1;
    }
    .arrow-diag.left  { top:3px;  transform: rotate(45deg);}
    .arrow-diag.right { top: 140px;  transform: rotate(-45deg);}

.compass-circle {
  top: -80px;
      z-index: 3;
  position: absolute;
  width: 332px; height: 332px;
  pointer-events: auto;      /* ← タップ有効にするならauto */
  z-index: 3;
  transition: transform 0.2s ease;
}
.compass-circle.active {
  transform: scale(1.5);
}
.compass-circle circle {
  fill: none;
  stroke: #fff;
  stroke-width: 7;
  stroke-dasharray: 1018;     /* 2π×162 */
  stroke-dashoffset: 1018;
  opacity: 0;
  transition:
    stroke-dashoffset 0.92s cubic-bezier(.7,0,.3,1),
    opacity 0.22s 0.14s;
}


    /* 丸状態 */
    .circle-mode .arrow-body,
    .circle-mode .arrow-diag { opacity: 0; width: 0; }
    .circle-mode .compass-circle circle {
      stroke-dashoffset: 0;
      opacity: 1;
      transition:
        stroke-dashoffset 0.92s cubic-bezier(.7,0,.3,1),
        opacity 0.2s 0.14s;
    }
    /* 矢印状態 */
    .arrow-mode .compass-circle circle {
      stroke-dashoffset: 350;
      opacity: 0;
      transition:
        opacity 0.16s,
        stroke-dashoffset 0.0s;
    }
    /* フェードインアニメ */
    .fade {
      animation: fadein 0.24s;
    }
    @keyframes fadein {
      from { opacity: 0; transform: scale(0.6);}
      to   { opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>
  <div class="compass-container arrow-mode" id="cmp">
    <div class="compass-dial">
    </div>
    <div class="compass-arrow" id="yajurushi">
      <div class="arrow-body"></div>
      <div class="arrow-diag left"></div>
      <div class="arrow-diag right"></div>
<svg class="compass-circle" width="336" height="336" viewBox="0 0 336 336">
  <circle cx="168" cy="168" r="162"/>
</svg>
    </div>
  </div>
<script>
    const compassCircle = document.querySelector('.compass-circle');
compassCircle.addEventListener('pointerdown', () => {
  compassCircle.classList.add('active');
});
compassCircle.addEventListener('pointerup', () => {
  compassCircle.classList.remove('active');
});
compassCircle.addEventListener('pointerleave', () => {
  compassCircle.classList.remove('active');
});

  // --------------------------
  // 端末情報取得関数
  // --------------------------
  function getDeviceInfo() {
    const ua = navigator.userAgent;
    const isiPad = /iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isiPhone = /iPhone/.test(ua);
    const isMac = /Macintosh/.test(ua) && !isiPad;
    const isWindows = /Windows/.test(ua);
    let iPadOSver = 0;
    if (isiPad) {
      // iPadOS 13以降は UAにVersion/xx.x入る
      const ver = ua.match(/Version\/(\d+)\./);
      if (ver) iPadOSver = parseInt(ver[1], 10);
    }
    return { isiPad, isiPhone, isMac, isWindows, iPadOSver };
  }

  // --------------------------
  // グローバル変数
  // --------------------------
  const cmp = document.getElementById('cmp');
  const arrow = document.getElementById('yajurushi');
  let lastIsEast = false;
  let lastAngle = 0;
  let sensorAngle = 0; // 最新センサー値

  // --------------------------
  // 東方向判定
  // --------------------------
  function isEast(angle) {
    let deg = (angle + 360) % 360;
    return (deg >= 67.5 && deg <= 112.5);
  }

  // --------------------------
  // 矢印回転アニメ
  // --------------------------
  function updateCompass(from, to) {
    let delta = ((to - from + 540) % 360) - 180; // -180～180
    let final = from + delta;
    arrow.style.transform = `rotate(${final}deg)`;
    lastAngle = final % 360;
  }

  // --------------------------
  // 矢印⇔丸アニメ切替
  // --------------------------
function switchMode(east) {
  if (east === lastIsEast) return;
  lastIsEast = east;
  cmp.classList.remove('fade');
  void cmp.offsetWidth; // 強制リフロー
  if (east) {
    // ======= ここでアニメ付きで「円」モードに =======
    cmp.classList.remove('arrow-mode');
    cmp.classList.add('circle-mode', 'fade');
    // ↑このCSS切り替えで、
    //   矢印がスッ…と消え、
    //   円が線で書かれるアニメが発動
  } else {
    // ======= ここでまた「矢印」モードに =======
    cmp.classList.remove('circle-mode');
    cmp.classList.add('arrow-mode', 'fade');
    // ↑このCSS切り替えで
    //   円が消え、矢印が出る
  }
}


  // --------------------------
  // センサーイベントで角度だけ記録
  // --------------------------
  function handleOrientation(e) {
    let deg;
    if (e.webkitCompassHeading !== undefined) {
      deg = e.webkitCompassHeading;
    } else if (e.alpha !== undefined) {
      deg = 360 - e.alpha;
    } else {
      deg = 0;
    }
    sensorAngle = deg;
  }

  // --------------------------
  // 0.5秒ごとに回転アニメ＆切替
  // --------------------------
  function startIntervalRotate() {
    setInterval(() => {
      updateCompass(lastAngle, sensorAngle);
      switchMode(isEast(sensorAngle));
    }, 500);
  }

  // --------------------------
  // メイン分岐処理
  // --------------------------
  (function main() {
    const info = getDeviceInfo();

    // ---- iPadOS18以前 or Mac or Windows ----
    if (
      (info.isiPad && info.iPadOSver > 0 && info.iPadOSver <= 18) ||
      info.isMac || info.isWindows
    ) {
      // 最初から丸のみ表示・アニメはfadeで残す
      cmp.classList.remove('arrow-mode');
      cmp.classList.add('circle-mode', 'fade');
      // センサー登録しない。何も切り替えない
      return;
    }

    // ---- iPhone全部 or iPadOS26以降 ----
    if (
      info.isiPhone ||
      (info.isiPad && info.iPadOSver >= 26)
    ) {
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          // iOS13+はユーザー許可が必要
          document.body.addEventListener('click', async function askPerm() {
            try {
              const p = await DeviceOrientationEvent.requestPermission();
              if (p === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, true);
                document.body.removeEventListener('click', askPerm);
                startIntervalRotate();
              }
            } catch (e) {}
          });
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
          startIntervalRotate();
        }
      } else {
        // センサー自体未対応→丸固定
        cmp.classList.remove('arrow-mode');
        cmp.classList.add('circle-mode', 'fade');
      }
      return;
    }

    // ---- それ以外（Androidタブなど謎端末） ----
    cmp.classList.remove('arrow-mode');
    cmp.classList.add('circle-mode', 'fade');
  })();
  

</script>

</body>
</html>
