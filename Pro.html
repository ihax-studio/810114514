<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>スロットマシンスピナー</title>
<style>
:root{--item-height:130px;--wheel-radius:160px;--visible-items-side:2}
@media (prefers-reduced-motion: no-preference) {
  :root {
    scroll-behavior: smooth;
  }
}
/* macOS ProMotion 120Hz最適化 */
@supports (-webkit-backdrop-filter: blur(1px)) {
  * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
}
*{box-sizing:border-box;-webkit-backface-visibility:hidden;backface-visibility:hidden}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{
  background:#000;
  font-family:"SF Pro Display","SF Pro Text","SF Pro Icons","SF Pro Rounded","SF Compact","SF Compact Text","San Francisco",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  font-weight:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  height:100vh;margin:0;overflow:hidden;
  transition:transform .5s cubic-bezier(.2,1,.3,1),background 1s ease;
  -webkit-user-select:none;user-select:none;cursor:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transform:translate3d(0,0,0);
  will-change:transform,background;
  -webkit-transform-style:preserve-3d;
  transform-style:preserve-3d;
}
.gradient-bg{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity .5s ease-in-out;will-change:opacity;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
#win-background{position:fixed;inset:0;z-index:500;overflow:hidden;opacity:0;transition:opacity .55s cubic-bezier(.8,0,.2,1);pointer-events:none;will-change:opacity;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
#win-background span{position:absolute;user-select:none;animation:fadeIn .77s cubic-bezier(.8,0,.2,1) both;will-change:transform,opacity}
@keyframes fadeIn{from{opacity:0;transform:scale(.5) translate(-50%,-50%)}to{opacity:1;transform:scale(1) translate(-50%,-50%)}}

.picker-group{display:flex;align-items:center;position:relative;gap:35px;z-index:10;transition:transform .7s cubic-bezier(.8,0,.2,1),opacity .7s cubic-bezier(.8,0,.2,1);will-change:transform,opacity;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.picker-container{width:150px;height:calc((var(--visible-items-side)*2 + 1)*var(--item-height));position:relative;overflow:hidden;perspective:1000px;-webkit-perspective:1000px;transform:translate3d(0,0,0)}
@keyframes move-pale-gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.highlight-line-top,.highlight-line-bottom{position:absolute;left:0;width:100%;height:6px;border-radius:50px;z-index:12;overflow:hidden;background-color:rgba(148,148,148,.25)}
.highlight-line-top::before,.highlight-line-bottom::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ff007a,#ff8a00,#ffee00,#00e676,#00bcd4,#2979ff,#9d00ff,#ff007a);background-size:400% 400%;animation:move-pale-gradient 3s linear infinite}
.highlight-line-top{top:50%;transform:translateY(calc(var(--item-height)/-2))}
.highlight-line-bottom{top:50%;transform:translateY(calc(var(--item-height)/2))}
.picker-list{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;position:absolute;width:100%;height:100%;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translate3d(0,0,0)}
.picker-item{position:absolute;top:calc(50% - var(--item-height)/2);left:0;right:0;display:flex;justify-content:center;align-items:center;height:var(--item-height);font-size:60px;font-weight:500;color:#888;transition:color .55s cubic-bezier(.8,0,.2,1);backface-visibility:hidden;-webkit-backface-visibility:hidden;z-index:11;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform,color;transform:translate3d(0,0,0)}
.picker-item.selected{color:#fff}

/* 設定オーバーレイ */
#settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .77s cubic-bezier(.8,0,.2,1)}
#settings-overlay.visible{opacity:1;visibility:visible}
.settings-panel{background:rgba(30,30,30,.75);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:24px 32px;width:90%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.37);transform:translateY(40px) scale(.8);transition:transform .55s cubic-bezier(.2,1,.3,1);z-index:101;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#settings-overlay.visible .settings-panel{transform:translateY(0) scale(1)}
.settings-panel h2{margin:0 0 4px;font-size:28px;font-weight:700;color:#fff;text-align:center}
.settings-panel p{text-align:center;margin:0 0 24px;color:#aaa;font-size:16px}
.setting-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:#eee;font-size:16px}
.setting-item label{flex-shrink:0;margin-right:15px}
.slider-container{display:flex;align-items:center;width:50%}
input[type=range]{--value-percent:0%;-webkit-appearance:none;appearance:none;width:100%;height:6px;background:linear-gradient(to right,#e91e63,#ff9800 var(--value-percent),#444 var(--value-percent),#444 100%);border-radius:3px;outline:none;opacity:.7;transition:opacity .2s,background .4s cubic-bezier(.25,1,.5,1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;background:#e91e63;cursor:pointer;border-radius:50%;border:2px solid #fff}
input[type=range]::-moz-range-thumb{width:20px;height:20px;background:#e91e63;cursor:pointer;border-radius:50%;border:2px solid #fff}
#match-rate-value{margin-left:10px;min-width:40px;text-align:right;font-weight:500}
.switch{position:relative;display:inline-block;width:50px;height:28px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#444;transition:.4s}
.switch .slider:before{position:absolute;content:"";height:20px;width:20px;left:4px;bottom:4px;background:#fff;transition:.77s cubic-bezier(.8,0,.2,1)}
input:checked+.slider{background:#e91e63}
input:checked+.slider:before{transform:translateX(22px)}
.slider.round{border-radius:34px}
.slider.round:before{border-radius:50%}
.esc-note{text-align:center;color:#888;font-size:12px;margin-top:20px}

#force-indicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:auto;padding:0 35px;height:60px;background:rgba(255,255,255,.9);border-radius:30px;border:2px solid rgba(255,255,255,.95);z-index:200;display:flex;align-items:center;box-sizing:border-box;opacity:0;visibility:hidden;transition:all .4s cubic-bezier(.2,1,.3,1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#000;font-weight:600;font-size:24px;user-select:none;will-change:transform,opacity}
#force-indicator.visible{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
#spin-counter{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#000;padding:20px 40px;border-radius:50px;font-size:18px;font-weight:600;z-index:10001;opacity:0;visibility:hidden;transition:all .6s cubic-bezier(.8,0,.2,1);user-select:none;box-shadow:0 8px 32px rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);will-change:transform,opacity,filter;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
#spin-counter.visible{opacity:1;visibility:visible}
#spin-counter.slide-up{animation:slide-up-message 2s cubic-bezier(.2,1,.3,1) forwards}
@keyframes slide-up-message{
  0%{opacity:1;transform:translateX(-50%) translateY(0)}
  60%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) translateY(-200px);visibility:hidden}
}
.slots-hidden{transform:translateY(150px);opacity:0;pointer-events:none}
#pre-results-overlay{position:fixed;inset:0;z-index:5001;display:flex;justify-content:center;align-items:center;background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility .3s ease}
#pre-results-overlay.visible{opacity:1;visibility:visible}
.expanding-circle{width:50px;height:50px;background:#fff;border-radius:50%;transform:scale(1);opacity:1;will-change:transform,opacity}
#pre-results-overlay.visible .expanding-circle{animation:expand-and-fade 1s cubic-bezier(.25,1,.5,1) forwards}
@keyframes expand-and-fade{0%{transform:scale(1);opacity:1;background:#fff}100%{transform:scale(40);opacity:0;background:#000}}
#results-overlay{display:none}

/* === Special Spin 共通 === */
.special-spin-mode{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:radial-gradient(at 46% 54%,rgb(250,182,218) 0px,transparent 50%),radial-gradient(at 30% 94%,rgb(114,122,255) 0px,transparent 50%),radial-gradient(at 90% 5%,rgb(182,198,255) 0px,transparent 50%),radial-gradient(at 24% 60%,rgb(90,186,246) 0px,transparent 50%),radial-gradient(at 64% 7%,rgb(255,51,204) 0px,transparent 50%),radial-gradient(at 63% 5%,rgb(231,169,234) 0px,transparent 50%);background-size:400% 400%;animation:rotate-gradient 3s ease-in-out infinite;transition:background .5s ease-in-out}
@keyframes rotate-gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.final-spin-mode{background:radial-gradient(at 46% 54%,rgb(255,81,0) 0px,transparent 50%),radial-gradient(at 30% 94%,rgb(208,255,0) 0px,transparent 50%),radial-gradient(at 90% 5%,rgb(255,213,0) 0px,transparent 50%),radial-gradient(at 24% 60%,rgb(238,86,48) 0px,transparent 50%),radial-gradient(at 64% 7%,rgb(205,57,13) 0px,transparent 50%),radial-gradient(at 63% 5%,rgb(230,212,25) 0px,transparent 50%),#000;background-size:400% 400%;animation:rotate-gradient 3s ease-in-out infinite}
.special-spin-mode.win-state{background:radial-gradient(ellipse at center,#FFDF87 0%,#F3C34F 40%,#D49B2A 80%,#A56C0F 100%);background-size:300% 300%;animation:rotate-gradient 12s ease infinite}

/* 横向きレコード（高滑らか復元＋前面から入場） */
#side-record{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;pointer-events:none;transform:translate3d(0,0,0)}
#side-record.active{display:flex}
#side-record .wrap{position:relative;width:80vw;max-width:1100px;height:260px;perspective:1600px;-webkit-perspective:1600px;will-change:transform;transform:translate3d(0,0,0)}
#side-record .record{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translate3d(0,0,0)}
#side-record .cell{position:absolute;top:50%;left:50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;width:140px;height:140px;margin:-70px 0 0 -70px;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#side-record .face{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45));transform:translate3d(0,0,0);will-change:transform}
#side-record .face.back{transform:rotateY(180deg);filter:blur(5.5px) drop-shadow(0 10px 30px rgba(0,0,0,.35));opacity:.85}

/* クリック波紋 */
.click-ripple{position:fixed;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.7);transform:translate(-50%,-50%) scale(0);opacity:1;pointer-events:none;z-index:9999;animation:click-ripple-anim .6s cubic-bezier(.2,1,.3,1)}
@keyframes click-ripple-anim{0%{transform:translate(-50%,-50%) scale(0);opacity:.7}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}

/* Thanks */
#gradient-box{position:fixed;inset:0;background:linear-gradient(135deg,#FF00C8,#FF7A00,#FFF500,#00FF85,#00E0FF,#4D7CFF,#B000FF);clip-path:circle(0% at 50% 50%);transition:clip-path .8s cubic-bezier(.8,0,.2,1),opacity .5s ease;opacity:0;pointer-events:none;z-index:4500;will-change:clip-path,opacity}
#gradient-box.visible{opacity:1}
#gradient-box.animate{clip-path:circle(75% at 50% 50%)}
#thanks-overlay{position:fixed;inset:0;z-index:6000;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s ease}
#thanks-overlay.visible{opacity:1;visibility:visible}
#thanks-circle{width:220px;height:220px;border:3px solid rgba(255,255,255,.9);border-radius:9999px;box-shadow:0 0 24px rgba(255,255,255,.35),0 0 64px rgba(255,255,255,.15) inset;display:grid;place-items:center;animation:circle-pop .7s cubic-bezier(.2,1,.3,1) both;will-change:transform,opacity}
@keyframes circle-pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#thanks-arrow{font-weight:100;font-size:84px;line-height:1;color:#fff}
#thanks-text{font-size:42px;font-weight:330;color:#fff;letter-spacing:.02em;text-shadow:0 6px 22px rgba(0,0,0,.55)}
#thanks-sub{font-size:22px;font-weight:330;color:#cfcfcf}
#thanks-dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dot{position:absolute;border-radius:9999px;background:#fff;opacity:0;animation:dot-pop 1.6s ease forwards;will-change:transform,opacity}
@keyframes dot-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}10%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1)}}

/* 両面（スロット列） */
.picker-item .face{position:absolute;left:0;right:0;top:calc(50% - var(--item-height)/2);height:var(--item-height);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:500;color:#888;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.picker-item .face.back{transform:rotateX(180deg);filter:blur(5.5px);opacity:.85}
.picker-item.selected .face{color:#fff}

/* 最後の絵文字ポップ */
#last-emoji-pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5500;pointer-events:none;opacity:0;visibility:hidden}
#last-emoji-pop.visible{opacity:1;visibility:visible}
#last-emoji-pop .emoji{font-size:64px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.45))}
@keyframes emoji-pop-fade{0%{transform:scale(0.6);opacity:0}15%{transform:scale(1.0);opacity:1}60%{transform:scale(1.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
#last-emoji-pop.play .emoji{animation:emoji-pop-fade .95s cubic-bezier(.25,1,.5,1) both}

/* 停止時黒ドット（未使用） */
#stop-dots-overlay{position:fixed;inset:0;z-index:5501;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
#stop-dots-overlay.visible{opacity:1;visibility:visible}
.bdot{position:absolute;border-radius:9999px;background:#000;opacity:0;transform:translate(-50%,-50%) scale(.2)}
@keyframes bdot-burst{0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.2)}12%{opacity:.95}75%{opacity:.85}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1)}}

/* 白い点々 */
#gogo-dots-overlay{position:fixed;inset:0;z-index:5502;pointer-events:none;overflow:hidden}
.gdot{position:absolute;border-radius:9999px;background:#fff;opacity:1;animation:dot-pop-opaque 1.9s cubic-bezier(.25,1,.5,1) forwards;will-change:transform,opacity}

/* 初回案内メッセージ */
#initial-message{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#000;padding:20px 40px;border-radius:50px;font-size:18px;font-weight:600;z-index:10000;opacity:0;visibility:hidden;transition:all .6s cubic-bezier(.8,0,.2,1);cursor:pointer;user-select:none;box-shadow:0 8px 32px rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);will-change:transform,opacity,filter;transform:translate3d(-50%,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#initial-message.visible{opacity:1;visibility:visible;animation:expand-from-dot 1.2s cubic-bezier(.2,1,.3,1) forwards}
#initial-message.hidden{animation:shrink-fadeout .5s cubic-bezier(.8,0,.2,1) forwards}
@keyframes expand-from-dot{
  0%{transform:translate(-50%,0) scale(0);border-radius:50%;opacity:0;filter:blur(20px)}
  40%{opacity:1;filter:blur(8px)}
  100%{transform:translate(-50%,0) scale(1);border-radius:50px;opacity:1;filter:blur(0px)}
}
@keyframes shrink-fadeout{
  0%{transform:translate(-50%,0) scale(1);opacity:1;filter:blur(0px)}
  100%{transform:translate(-50%,0) scale(.8);opacity:0;filter:blur(4px);visibility:hidden}
}

/* 波紋エフェクト */
#initial-message::before,#initial-message::after{content:'';position:absolute;inset:-4px;border-radius:50px;border:2px solid rgba(255,255,255,.8);opacity:0;pointer-events:none}
#initial-message.visible::before{animation:ripple-wave 2s ease-out infinite}
#initial-message.visible::after{animation:ripple-wave 2s ease-out .6s infinite}
@keyframes ripple-wave{
  0%{transform:scale(1);opacity:.8}
  100%{transform:scale(1.4);opacity:0}
}

@keyframes dot-pop-opaque{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.05)}
}

/* 上に上がる白い粒（炎） */
#gogo-flames{position:fixed;inset:0;pointer-events:none;z-index:5503;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}
#gogo-flames.active{opacity:1;visibility:visible}
.flame{position:absolute;bottom:-20px;left:0;width:3px;height:3px;border-radius:9999px;background:#fff;opacity:.8;animation:rise var(--dur) linear var(--delay) forwards;box-shadow:0 0 10px rgba(255,255,255,.85),0 0 20px rgba(255,255,255,.55);will-change:transform,opacity}
@keyframes rise{
  0%{transform:translate(var(--sx),0) scale(.8)}
  100%{transform:translate(var(--ex),-120vh) scale(1.1)}
}

/* 最終結果 UI（ストップウォッチUIのみ。数字は出さない） */
#final-counter-overlay{position:fixed;inset:0;z-index:5600;background:#000;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s ease}
#final-counter-overlay.visible{opacity:1;visibility:visible}
.fc-wrap{display:grid;place-items:center}
.fc-ring{position:relative;width:240px;height:240px}
.fc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fc-ring .bg{fill:none;stroke-linecap:round;stroke-width:6;stroke:rgba(255,255,255,.10)}
.fc-ring .fg{fill:none;stroke-linecap:round;stroke-width:6;stroke:url(#fc-g);stroke-dasharray:calc(2 * 3.14159265 * 50);stroke-dashoffset:calc(2 * 3.14159265 * 50);filter:drop-shadow(0 0 4px rgba(255,255,255,.15));transition:stroke-dashoffset 1.45s cubic-bezier(.3,1,.3,1);will-change:stroke-dashoffset}
.fc-center{position:absolute;inset:0;display:grid;place-items:center;perspective:900px}
.fc-wheel{position:relative;width:100px;height:80px;display:grid;place-items:center;transform-style:preserve-3d;transition:transform 1.45s cubic-bezier(.3,1,.3,1);will-change:transform}
.fc-face{position:absolute;inset:0;display:grid;place-items:center;width:100px;height:80px;font-size:64px;font-weight:100;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.35),0 0 10px rgba(255,255,255,.35);backface-visibility:hidden}
</style>
</head>
<body>
<audio id="gogo_chance_audio" src="BGN.mp3" preload="auto"></audio>
<audio id="alt_bgn_audio" src="X.mp3" preload="auto"></audio>
<audio id="final_spin_audio" src="chibnaaa.mp3" preload="auto"></audio>
<audio id="fail_audio" src="cf.mp3" preload="auto"></audio>
<audio id="click_audio" src="click.mp3" preload="auto"></audio>
<audio id="return_audio" src="return.mp3" preload="auto"></audio>
<audio id="no_audio" src="no.mp3" preload="auto"></audio>

<div id="gradient-box"></div>

<!-- 横向きレコード（復元・前面から入場・背景フェード対応） -->
<div id="side-record" aria-hidden="true">
  <div class="wrap">
    <div class="record" id="record-root"></div>
  </div>
</div>

<div id="gradient-bg-1" class="gradient-bg"></div>
<div id="gradient-bg-2" class="gradient-bg"></div>

<div class="picker-group">
  <div class="picker-container"><div class="picker-list" id="picker-list-1"></div></div>
  <div class="picker-container"><div class="picker-list" id="picker-list-2"></div></div>
  <div class="picker-container"><div class="picker-list" id="picker-list-3"></div></div>
  <div class="picker-container" id="picker-container-4" style="display:none"><div class="picker-list" id="picker-list-4"></div></div>
  <div class="highlight-line-top"></div>
  <div class="highlight-line-bottom"></div>
</div>

<div id="pre-results-overlay"><div class="expanding-circle"></div></div>

<div id="final-counter-overlay" aria-hidden="true">
  <div class="fc-wrap">
    <div class="fc-ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="fc-g" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#ff3b30"/>
            <stop offset="35%"  stop-color="#ffcc00"/>
            <stop offset="70%"  stop-color="#4cd964"/>
            <stop offset="100%" stop-color="#34aadc"/>
            <animateTransform attributeName="gradientTransform" type="rotate" from="0 60 60" to="360 60 60" dur="5s" repeatCount="indefinite"/>
          </linearGradient>
        </defs>
        <circle class="bg" cx="60" cy="60" r="50"></circle>
        <circle class="fg" cx="60" cy="60" r="50"></circle>
      </svg>
      <div class="fc-center">
        <div class="fc-wheel" id="fc-wheel">
          <div class="fc-face" style="transform:rotateX(0deg) translateZ(55px);">1</div>
          <div class="fc-face" style="transform:rotateX(-72deg) translateZ(55px);">2</div>
          <div class="fc-face" style="transform:rotateX(-144deg) translateZ(55px);">3</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const symbols=['🍒','🔔','🍇','7️⃣','🍉','⭐','🥨','❤️‍🔥','🫧'];
  const ANGLE_PER_ITEM=360/symbols.length;

  const settingsOverlay=document.getElementById('settings-overlay');
  const matchRateSlider=document.getElementById('match-rate-slider');
  const matchRateValue=document.getElementById('match-rate-value');
  const absoluteValueToggle=document.getElementById('absolute-value-toggle');
  const highDifficultyToggle=document.getElementById('high-difficulty-toggle');
  const pickerContainer4=document.getElementById('picker-container-4');
  const pickerGroup=document.querySelector('.picker-group');
  const bg1=document.getElementById('gradient-bg-1');
  const bg2=document.getElementById('gradient-bg-2');
  const forceIndicator=document.getElementById('force-indicator');
  const spinCounter=document.getElementById('spin-counter');
  const preOverlay=document.getElementById('pre-results-overlay');
  const winBg=document.getElementById('win-background');
  const thanksOverlay=document.getElementById('thanks-overlay');
  const thanksDots=document.getElementById('thanks-dots');
  const gogoAudio=document.getElementById('gogo_chance_audio');
  const altBGNAudio=document.getElementById('alt_bgn_audio');
  const finalAudio=document.getElementById('final_spin_audio');
  const clickAudio=document.getElementById('click_audio');
  const returnAudio=document.getElementById('return_audio');
  const failAudio=document.getElementById('fail_audio');
  const noAudioEl=document.getElementById('no_audio');
  const stopDotsOverlay=document.getElementById('stop-dots-overlay');
  const gogoDots=document.getElementById('gogo-dots-overlay');
  const gogoFlames=document.getElementById('gogo-flames');
  const initialMessage=document.getElementById('initial-message');

  const finalCounterOverlay=document.getElementById('final-counter-overlay');
  const fcWheel=document.getElementById('fc-wheel');
  const fcRingFg=document.querySelector('#final-counter-overlay .fg');

  const sideRecord=document.getElementById('side-record');
  const recordRoot=document.getElementById('record-root');

  let blockBGN=false; gogoAudio.loop=false; altBGNAudio.loop=false;

  const MAX_CLICK_OVERLAPS=8;
  const clickPool=[];
  function playClickOnce() {
    try{
      const node = clickAudio.cloneNode();
      if (clickPool.length >= MAX_CLICK_OVERLAPS) {
        const old = clickPool.shift();
        try { old.pause(); } catch {}
      }
      clickPool.push(node);
      node.currentTime = 0;
      node.play().catch(()=>{});
    }catch{}
  }

  function stopAllAudioExcept(except){
    [gogoAudio,altBGNAudio,finalAudio,clickAudio,returnAudio,failAudio,noAudioEl].forEach(a=>{
      if(a && a!==except){
        try{ a.pause(); a.currentTime=0; a.volume=1; }catch{}
      }
    });
  }

  function fadeOutAudio(audio,durationMs=1500){
    return new Promise(resolve=>{
      if(!audio){ resolve(); return; }
      const steps=30, interval=durationMs/steps, start=audio.volume;
      let i=0;
      const tick=()=>{
        i++;
        audio.volume=start*(1-(i/steps));
        if(i>=steps){
          try{ audio.pause(); audio.currentTime=0; audio.volume=1; }catch{}
          resolve();
        }else{ setTimeout(tick,interval); }
      };
      tick();
    });
  }

  // ランダム BGN: BGN.mp3 または X.mp3 を選択（開始だけ、停止は時間で制御）
  function startRandomBGN(){
    if(blockBGN) return null;
    const pick = Math.random() < 0.5 ? gogoAudio : altBGNAudio;
    try{
      stopAllAudioExcept(pick);
      pick.currentTime=0; pick.loop=false; pick.volume=1;
      pick.play().catch(()=>{});
      return pick;
    }catch{ return null; }
  }

  let matchRate=0,isAbsoluteValueOn=false,isHighDifficulty=false,activeBg=bg1,inactiveBg=bg2,currentGradientIndex=-1,spinCycleCounter=0,spinHistory=[],spinPlan=[],gogoChanceSpinNumber=0,isSpinning=false;
  let lastSpinTime=0;

  const gradients=[
    'linear-gradient(135deg,#007bff,#00bcd4,#00e0ff)',
    'linear-gradient(135deg,#FFD700,#FFEA00,#FFC107)',
    'linear-gradient(135deg,#FF1493,#FF4500,#FF6347)',
    'linear-gradient(135deg,#7CFC00,#32CD32,#ADFF2F)',
    'linear-gradient(135deg,#ff6b6b,#f06595,#cc5de8)',
    'linear-gradient(135deg,#63e6be,#38d9a9,#20c997)',
    'linear-gradient(135deg,#74c0fc,#4dabf7,#339af0)',
    'linear-gradient(135deg,#da77f2,#be4bdb,#9c36b5)'
  ];
  const resultGradients={'7':gradients[1],'cherry':gradients[2],'watermelon':gradients[3]};
  
  function switchBackground(grad, duration=0){ 
    if(!grad) return;
    
    if(duration > 0) {
      // フェード付き切り替え（120Hz対応）
      inactiveBg.style.transition=`opacity ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;
      activeBg.style.transition=`opacity ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;
    } else {
      // 即座に切り替え
      inactiveBg.style.transition='';
      activeBg.style.transition='';
    }
    
    inactiveBg.style.background=grad; 
    
    // 複数のrequestAnimationFrameで確実にDOMを更新（120Hz対応）
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          inactiveBg.style.opacity='1'; 
          activeBg.style.opacity='0';
        });
      });
    });
    
    [activeBg,inactiveBg]=[inactiveBg,activeBg];
    
    if(duration > 0) {
      setTimeout(()=>{
        inactiveBg.style.transition='';
        activeBg.style.transition='';
      }, duration * 1000 + 16); // 1フレーム分追加
    }
  }
  
  function switchBackgroundSmooth(grad, duration=0.3){ 
    switchBackground(grad, duration);
  }
  
  function clearBackground(){ 
    activeBg.style.transition='opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
    inactiveBg.style.transition='opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        activeBg.style.opacity='0'; 
        inactiveBg.style.opacity='0';
      });
    });
    setTimeout(() => {
      activeBg.style.transition='';
      inactiveBg.style.transition='';
    }, 316); // 300ms + 1フレーム
  }

  /* “白い点々” スロットル */
  let lastDotsAt=0, dotsCooldownMs=900;
  function spawnDynamicDots(container, count=120, opts={}){
    const now=Date.now();
    if(now-lastDotsAt<dotsCooldownMs){ return; }
    lastDotsAt=now;

    const W=window.innerWidth,H=window.innerHeight;
    container.innerHTML='';
    const cx=W/2,cy=H/2;

    const radiusBase = opts.radiusBase ?? Math.hypot(W,H)*0.45;
    const radiusRand = opts.radiusRand ?? Math.hypot(W,H)*0.65;
    const sizeBoost  = opts.sizeBoost ?? 1.4;
    const durSec     = opts.durationSec ?? 2.1;
    const className  = opts.className  ?? 'gdot';

    const total = Math.max(count, Math.floor((W*H)/4000));

    for(let i=0;i<total;i++){
      const d=document.createElement('div');
      d.className= className;

      const sizePick=Math.random();
      const baseSmall=(Math.random()*3+2);
      const baseLarge=(Math.random()*6+4);
      const baseHuge =(Math.random()*10+8);
      const size = sizePick<.6 ? (baseSmall+sizeBoost)
                  : sizePick<.9 ? (baseLarge+sizeBoost)
                  : (baseHuge+sizeBoost*0.5);

      const sx=cx+(Math.random()*220-110);
      const sy=cy+(Math.random()*220-110);

      const angle=Math.random()*Math.PI*2;
      const dist=(radiusBase)+(Math.random()*(radiusRand));
      const tx=Math.cos(angle)*dist;
      const ty=Math.sin(angle)*dist;

      d.style.width=`${size}px`;
      d.style.height=`${size}px`;
      d.style.left=`${sx}px`;
      d.style.top =`${sy}px`;
      d.style.setProperty('--tx',`${tx}px`);
      d.style.setProperty('--ty',`${ty}px`);
      d.style.animationDelay=`${Math.random()*0.18}s`;
      d.style.animationDuration = durSec + 's';

      d.style.opacity='0';
      d.style.transition='opacity 0.18s ease';

      container.appendChild(d);
      requestAnimationFrame(()=>{ d.style.opacity='1'; });
    }

    setTimeout(()=>{ container.innerHTML=''; }, (durSec*1000)+800);
  }

  /* 炎 */
  function startGogoFlames(opts={}){
    const { fast=false } = opts;
    gogoFlames.innerHTML='';
    gogoFlames.classList.add('active');
    const W=window.innerWidth;
    const count=Math.max(120, Math.floor(W/5));
    const frag=document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const f=document.createElement('div');
      f.className='flame';
      const sx=(Math.random()*W*1.2 - W*0.1);
      const ex=sx + (Math.random()*120 - 60);
      const base = fast ? 2.0 : 3.2;
      const rand = fast ? 1.8 : 2.6;
      const dur=(base + Math.random()*rand) + 's';
      const delay=(Math.random()*1.0) + 's';
      f.style.setProperty('--sx', sx+'px');
      f.style.setProperty('--ex', ex+'px');
      f.style.setProperty('--dur', dur);
      f.style.setProperty('--delay', delay);
      frag.appendChild(f);
    }
    gogoFlames.appendChild(frag);
  }
  function stopGogoFlames(){ gogoFlames.classList.remove('active'); gogoFlames.innerHTML=''; }

  class Picker{
    constructor(listElement,range,initial){
      this.list=listElement; this.range=range; this.selectedIndex=0;
      this.populate(range);
      this.items=this.list.querySelectorAll('.picker-item');
      const idx=this.range.indexOf(initial);
      this.setToIndex(idx!==-1?idx:0,0);
    }
    populate(arr){
      const f=document.createDocumentFragment();
      const radius=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wheel-radius'));
      for(let i=0;i<arr.length;i++){
        const ch=arr[i];
        const it=document.createElement('div');
        it.className='picker-item';
        it.dataset.char=ch;

        const front=document.createElement('div'); front.className='face front'; front.textContent=ch;
        const back =document.createElement('div'); back.className ='face back';  back .textContent=ch;
        it.appendChild(front); it.appendChild(back);

        it.style.transform=`rotateX(${i*ANGLE_PER_ITEM}deg) translateZ(${radius}px) translateZ(0)`;
        f.appendChild(it);
      }
      this.list.appendChild(f);
    }
    setToIndex(index,duration=1){
      const rot=-index*ANGLE_PER_ITEM;
      this.list.style.transition=`transform ${duration}s cubic-bezier(.25,1,.5,1)`;
      this.list.style.transform=`rotateX(${rot}deg) translateZ(0)`;
      this.selectedIndex=index;
      setTimeout(()=>{ this.items.forEach((item,i)=>item.classList.toggle('selected',i===index)); },Math.max(0,duration*500));
    }
    async spin(duration,forced=null){
      let target;
      if(forced){
        const fi=this.range.indexOf(forced);
        target=fi!==-1?fi:Math.floor(Math.random()*this.range.length);
      }else if(isAbsoluteValueOn){
        const seven=this.range.indexOf('7️⃣');
        if(seven!==-1&&Math.random()<.8){ target=seven; }
        else{
          const other=this.range.filter(s=>s!=='7️⃣');
          const r=other[Math.floor(Math.random()*other.length)];
          target=this.range.indexOf(r);
        }
      }else{
        target=Math.floor(Math.random()*this.range.length);
      }
      const spinCycles=Math.max(8,Math.floor(duration*2)),
            currentRotation=-this.selectedIndex*ANGLE_PER_ITEM,
            finalRotation=-target*ANGLE_PER_ITEM,
            spinStart=currentRotation-360,
            finalSpin=finalRotation-(360*spinCycles);

      this.list.style.transition='transform .1s linear';
      this.list.style.transform=`rotateX(${spinStart}deg) translateZ(0)`;
      await new Promise(r=>setTimeout(r,100));

      const spinDur=duration||(4+Math.random());
      this.list.style.transition=`transform ${spinDur}s cubic-bezier(.2,.8,.2,1)`;
      this.list.style.transform=`rotateX(${finalSpin}deg) translateZ(0)`;
      this.selectedIndex=target;
      await new Promise(r=>setTimeout(r,spinDur*1000));

      this.list.style.transition='transform 0s';
      this.list.style.transform=`rotateX(${finalRotation}deg) translateZ(0)`;
      this.items.forEach((it,i)=>it.classList.toggle('selected',i===target));
      return this.range[target];
    }
  }
  function shuffle(a){let i=a.length,r;while(i){r=Math.floor(Math.random()*i--);[a[i],a[r]]=[a[r],a[i]]}return a}

  const picker1=new Picker(document.getElementById('picker-list-1'),shuffle([...symbols]),'🍒');
  const picker2=new Picker(document.getElementById('picker-list-2'),shuffle([...symbols]),'🔔');
  const picker3=new Picker(document.getElementById('picker-list-3'),shuffle([...symbols]),'🍇');
  const picker4=new Picker(document.getElementById('picker-list-4'),shuffle([...symbols]),'⭐');
  let pickers=[picker1,picker2,picker3];

  document.addEventListener('keydown',e=>{if(e.key==='Escape'){settingsOverlay.classList.remove('visible');}});

  matchRateSlider.style.setProperty('--value-percent',`${matchRateSlider.value}%`);
  let sliderAnim={current:parseInt(matchRateSlider.value,10),target:parseInt(matchRateSlider.value,10),id:null};
  matchRateValue.textContent=`${sliderAnim.current}%`;
  function animateSliderText(){
    const diff=sliderAnim.target-sliderAnim.current;
    if(Math.abs(diff)<.1){
      sliderAnim.current=sliderAnim.target;
      matchRateValue.textContent=`${Math.round(sliderAnim.current)}%`;
      cancelAnimationFrame(sliderAnim.id); sliderAnim.id=null; return;
    }
    sliderAnim.current+=diff*.12;
    matchRateValue.textContent=`${Math.round(sliderAnim.current)}%`;
    sliderAnim.id=requestAnimationFrame(animateSliderText);
  }
  matchRateSlider.addEventListener('input',e=>{
    const v=parseInt(e.target.value,10);
    matchRate=v;
    e.target.style.setProperty('--value-percent',`${v}%`);
    sliderAnim.target=v;
    if(!sliderAnim.id){ animateSliderText(); }
  });
  highDifficultyToggle.addEventListener('change',e=>{
    if(e.target.checked){ pickerContainer4.style.display='block'; pickers=[picker1,picker2,picker3,picker4]; }
    else{ pickerContainer4.style.display='none'; pickers=[picker1,picker2,picker3]; }
  });
  absoluteValueToggle.addEventListener('change',e=>{ isAbsoluteValueOn=e.target.checked; });

  const symbolPatterns={'🥨':['🥨'],'❤️‍🔥':['❤️‍🔥','🔥','🥵','🌶️'],'🫧':['🫧','💧','💦'],'🍒':['🍒'],'🔔':['🔔'],'🍇':['🍇'],'7️⃣':['7️⃣','💎','💰'],'🍉':['🍉'],'⭐':['⭐','✨','💫']};
  function layoutCircular(background,arr){
    background.innerHTML='';
    const rect=background.getBoundingClientRect();
    const f=document.createDocumentFragment();
    const numCols=4,numRows=6;
    const cellW=rect.width/numCols,cellH=rect.height/numRows;
    const emojiSize=Math.min(cellW,cellH)*.9;
    for(let r=0;r<numRows;r++){
      for(let c=0;c<numCols;c++){
        const s=document.createElement('span');
        const v=arr[Math.floor(Math.random()*arr.length)];
        s.textContent=v;
        const offsetX=(r%2!==0)?cellW/2:0;
        const x=(c*cellW)+(cellW/2)+offsetX;
        const y=(r*cellH)+(cellH/2);
        s.style.position='absolute';
        s.style.left=`${x}px`;
        s.style.top=`${y}px`;
        s.style.fontSize=`${emojiSize}px`;
        s.style.transform=`translate(-50%,-50%) rotate(${(Math.random()-.5)*15}deg)`;
        f.appendChild(s);
      }
    }
    background.appendChild(f);
  }


  function showFinalCounter(count){
    const c = Math.max(0, Math.min(5, Number(count)||0));
    const radius=50; const C=2*Math.PI*radius;
    fcRingFg.style.strokeDasharray=`${C} ${C}`; fcRingFg.style.strokeDashoffset=C;
    requestAnimationFrame(()=>{ fcRingFg.style.strokeDashoffset = C*(1-(c/5)); });
    const deg = -c*72;
    fcWheel.style.transition='none'; fcWheel.style.transform='rotateX(0deg)'; void fcWheel.offsetHeight;
    fcWheel.style.transition='transform 1.45s cubic-bezier(.3,1,.3,1)';
    fcWheel.style.transform=`rotateX(${deg}deg)`;
    finalCounterOverlay.classList.add('visible');
    return new Promise(resolve=>{ setTimeout(()=>{ finalCounterOverlay.classList.remove('visible'); resolve(); }, 2600); });
  }

  async function showThanksDialog(){
    try{
      stopAllAudioExcept(returnAudio);
      returnAudio.currentTime=0; returnAudio.volume=1; returnAudio.play().catch(()=>{});
    }catch{}
    thanksOverlay.classList.add('visible');
    spawnThanksDots(120);
    await new Promise(r=>setTimeout(r,2000)); // 2秒後にリロード
    location.reload();
  }
  function spawnThanksDots(n){
    const W=window.innerWidth,H=window.innerHeight;
    thanksDots.innerHTML='';
    for(let i=0;i<n;i++){
      const d=document.createElement('div');
      const size=Math.random()<.8?(Math.random()*3+2):(Math.random()*6+4);
      const cx=W/2,cy=H/2;
      const sx=cx+(Math.random()*160-80);
      const sy=cy+(Math.random()*160-80);
      const angle=Math.random()*Math.PI*2;
      const dist=120+Math.random()*280;
      const tx=Math.cos(angle)*dist;
      const ty=Math.sin(angle)*dist;
      d.className='dot';
      d.style.width=`${size}px`;
      d.style.height=`${size}px`;
      d.style.left=`${sx}px`;
      d.style.top =`${sy}px`;
      d.style.setProperty('--tx',`${tx}px`);
      d.style.setProperty('--ty',`${ty}px`);
      d.style.animationDelay=`${Math.random()*0.25}s`;
      thanksDots.appendChild(d);
    }
  }

  function resetForNewCycle(){
    const guaranteed=Math.floor(Math.random()*3)+1;
    const plan=new Array(5).fill(false);
    for(let i=0;i<guaranteed;i++){ plan[i]=true; }
    spinPlan=shuffle(plan);
    gogoChanceSpinNumber=Math.floor(Math.random()*4);
    spinHistory=[];
    spinCycleCounter=0;
  }

  // 横向きレコード（前面から入場・背景フェード・時間で停止制御）
  function buildSideRecord(emojis){
    recordRoot.innerHTML='';
    const n=emojis.length;
    const radius=420;
    for(let i=0;i<n;i++){
      const cell=document.createElement('div');
      cell.className='cell';
      const angle=(360/n)*i;
      cell.style.transform=`rotateY(${angle}deg) translateZ(${radius}px)`;
      const front=document.createElement('div'); front.className='face front'; front.textContent=emojis[i];
      const back=document.createElement('div'); back.className='face back'; back.textContent=emojis[i];
      cell.appendChild(front); cell.appendChild(back);
      recordRoot.appendChild(cell);
    }
  }

  async function startSideRecordSpin({isFinal=false}={}){
    // special-spin-modeを適用
    document.body.classList.add('special-spin-mode');
    if(isFinal) {
      // 最終スピンは金色のグラデーション
      document.body.classList.add('final-spin-mode');
    }
    
    // メッセージを表示（横向きレコードと同時に）
    if(isFinal){
      spinCounter.textContent = `ふれないでまってみて..`;
    } else {
      spinCounter.textContent = `ふれないでまってみて..GOGOチャンス❤️`;
    }
    spinCounter.classList.remove('slide-up');
    spinCounter.classList.add('visible');
    
    // 2秒後にスライドアップ開始
    setTimeout(() => {
      spinCounter.classList.add('slide-up');
      setTimeout(() => {
        spinCounter.classList.remove('visible', 'slide-up');
      }, 2000);
    }, 2000);
    
    // 背景フェード切替（開始）- 0.3秒のスムーズフェード
    const giStart = Math.floor(Math.random()*gradients.length);
    switchBackgroundSmooth(gradients[giStart], 0.3);

    sideRecord.classList.add('active');
    pickerGroup.classList.add('slots-hidden');

    const emojis=["🍒","7️⃣","😍","😉","🍀","💎","🍋","⭐️"];
    buildSideRecord(emojis);

    // 音声
    if(isFinal){
      // 最終スピンではfinalAudioは既にtriggerSpinで再生されている
      // 何もしない
    }else{
      // GOGOチャンスの音声（BGN.mp3 または X.mp3）
      stopAllAudioExcept(null);
      startRandomBGN();
    }

    // 総回転時間（GOGO=16秒、FINAL=18秒）
    const totalMs = isFinal ? 18000 : 16000;
    const accelTime = 600;
    const decelTime = 2400;
    const steadyTime = totalMs - accelTime - decelTime;
    
    let angleY = 0;
    let vel = 0;
    const initialVel = 0.3;
    const fastVel = 2.8;
    let animationFrameId = null;
    let lastFrameTime = performance.now();
    const startTime = lastFrameTime;

    function animateRing(now) {
      const elapsed = now - startTime;
      const deltaTime = Math.min(now - lastFrameTime, 50); // 最大50msに制限してスパイク防止
      lastFrameTime = now;
      
      const accelPoint = accelTime;
      const decelPoint = accelTime + steadyTime;
      const stopPoint = totalMs;

      if (elapsed >= stopPoint) {
        cancelAnimationFrame(animationFrameId);
        const step = 360 / emojis.length;
        const snapped = Math.round(angleY / step) * step;
        recordRoot.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
        recordRoot.style.transform = `rotateY(${snapped}deg) translate3d(0,0,0)`;
        setTimeout(async () => {
          spawnDynamicDots(gogoDots, Math.max(300, Math.floor((innerWidth*innerHeight)/4000)), {durationSec:2.0});
          const giEnd = (giStart + 1 + Math.floor(Math.random()*(gradients.length-1))) % gradients.length;
          switchBackgroundSmooth(gradients[giEnd], 0.3); // 終了時も0.3秒のスムーズフェード
          await new Promise(r=>setTimeout(r,900));
          sideRecord.classList.remove('active');
          pickerGroup.classList.remove('slots-hidden');
          
          // special-spin-modeをクリア
          document.body.classList.remove('special-spin-mode');
          document.body.classList.remove('final-spin-mode');
        }, 600);
        return;
      }

      if (elapsed < accelPoint) {
        let t = elapsed / accelTime;
        vel = initialVel + (fastVel - initialVel) * t;
      } else if (elapsed < decelPoint) {
        vel = fastVel;
      } else {
        let t = (elapsed - decelPoint) / (stopPoint - decelPoint);
        let easeFactor = (Math.cos(t * Math.PI) + 1) / 2;
        vel = fastVel * easeFactor;
      }

      recordRoot.style.transition = '';
      // フレームレート独立した滑らかな回転（120Hzでも60Hzでも同じ速度）
      const frameNormalizer = deltaTime / (1000 / 60); // 60fpsを基準
      angleY += vel * frameNormalizer;
      // サブピクセル精度で描画
      recordRoot.style.transform = `rotateY(${angleY.toFixed(3)}deg) translate3d(0,0,0)`;
      animationFrameId = requestAnimationFrame(animateRing);
    }
    
    animationFrameId = requestAnimationFrame(animateRing);
    
    await new Promise(r=>setTimeout(r, totalMs + 1500));
  }

  /* 通常スピン */
  async function processSpin(spinDuration){
    pickerGroup.classList.add('spinning');
    
    // 背景絵文字をフェードアウト
    winBg.style.transition = 'opacity 0.3s ease';
    winBg.style.opacity=0;
    setTimeout(() => {
      winBg.style.transition = '';
    }, 300);
    
    startGogoFlames({fast:true});

    let ri; do{ ri=Math.floor(Math.random()*gradients.length); } while(ri===currentGradientIndex&&gradients.length>1);
    currentGradientIndex=ri; switchBackground(gradients[currentGradientIndex], 0.3);

    const forceMatch=spinPlan[spinCycleCounter]||(Math.random()*100<matchRate);
    let forced=null; if(forceMatch){ forced=symbols[Math.floor(Math.random()*symbols.length)]; }

    const results=await Promise.all(pickers.map(p=>p.spin(spinDuration,forced)));
    pickerGroup.classList.remove('spinning');

    let resultGradient=null;
    if(results.includes('7️⃣')) resultGradient=resultGradients['7'];
    else if(results.includes('🍒')) resultGradient=resultGradients['cherry'];
    else if(results.includes('🍉')) resultGradient=resultGradients['watermelon'];
    if(resultGradient) switchBackground(resultGradient, 0.3); else clearBackground();

    const allSame=results.length>0&&results.every(s=>s===results[0]);
    if(allSame){
      const win=results[0];
      const arr=symbolPatterns[win]||[win];
      layoutCircular(winBg,arr);
      
      // 背景絵文字をフェードイン
      winBg.style.transition = 'opacity 0.4s ease';
      winBg.style.opacity=.3;
      setTimeout(() => {
        winBg.style.transition = '';
      }, 400);
      
      spinHistory.push(win);
    }else{
      spinHistory.push(null);
    }

    spawnDynamicDots(gogoDots, Math.max(260, Math.floor((window.innerWidth*window.innerHeight)/4200)), { durationSec: 1.9 });
    stopGogoFlames();

    if(results.includes('7️⃣')){ triggerRecordSpin(1600); }
    spinCycleCounter++;
  }

  async function showResultsAnimation(){
    blockBGN=true; try{ gogoAudio.pause(); altBGNAudio.pause(); gogoAudio.currentTime=0; altBGNAudio.currentTime=0; }catch{}
    settingsOverlay.classList.remove('visible');
    clearBackground();
    pickerGroup.classList.add('slots-hidden');
    stopGogoFlames();

    await new Promise(r=>setTimeout(r,120));
    preOverlay.classList.add('visible');
    await new Promise(r=>setTimeout(r,1000));
    preOverlay.classList.remove('visible');

    const matches=Array.isArray(spinHistory)?spinHistory.filter(x=>x!==null):[];
    const count=(Number(matches.length)||0);
    
    // 7が1回でも揃ったかチェック
    const hasSeven = matches.some(symbol => symbol === '7️⃣');
    
    // 最終結果に応じた背景色を設定
    if(count >= 4 || hasSeven){
      // 4~5回揃った or 7が1回でも揃った → 金色グラデーション
      document.body.style.background = 'radial-gradient(ellipse at center, #FFDF87 0%, #F3C34F 40%, #D49B2A 80%, #A56C0F 100%)';
    } else if(count >= 2 && count <= 3){
      // 2~3回揃った → パープル色
      document.body.style.background = 'radial-gradient(ellipse at center, #E6A8E6 0%, #B266B2 40%, #8B4789 80%, #5E2C5E 100%)';
    } else {
      // 1回か0回 → 青色のまま（元の色を維持）
      document.body.style.background = '#000';
    }

    if(count>0){
      const unique=[...new Set(matches)];
      const all=unique.flatMap(s=>symbolPatterns[s]||[s]);
      layoutCircular(winBg,all); winBg.style.opacity=.25;
    } else { winBg.style.opacity=0; }

    await showFinalCounter(count);

    const gradientBox=document.getElementById('gradient-box');
    gradientBox.classList.add('visible'); await new Promise(r=>setTimeout(r,50));
    gradientBox.classList.add('animate'); await new Promise(r=>setTimeout(r,800));
    gradientBox.classList.remove('animate'); await new Promise(r=>setTimeout(r,80));
    await showThanksDialog(); // ← ここでreturn.mp3完了→3秒後にリロード（showThanksDialog内で実施）
  }

  function triggerSpinGuard(){ return (Date.now()-lastSpinTime<1000 || isSpinning); }

  // スピンカウンター表示を更新（初回メッセージが表示されている時のみ）
  function updateSpinCounter(){
    // 初回メッセージが表示されている場合のみカウンターを表示
    if(initialMessage && initialMessage.classList.contains('visible')){
      const remaining = 5 - spinCycleCounter;
      if(remaining > 0 && remaining <= 5){
        spinCounter.textContent = `トラックパッドを押し込もう・残り${remaining}回!`;
        spinCounter.classList.add('visible');
        setTimeout(() => {
          spinCounter.classList.remove('visible');
        }, 2000);
      }
    }
  }

  // 回転終了後にメッセージを表示（通常スピンのみ）
  function showAfterSpinMessage(){
    // GOGOチャンスや最終スピンの次は表示しない
    if(spinCycleCounter === gogoChanceSpinNumber + 1 || spinCycleCounter === 5){
      return;
    }
    
    const remaining = 5 - spinCycleCounter;
    
    // 通常時（1~3回終了後）
    if(remaining > 0 && remaining <= 4){
      spinCounter.textContent = `残り${remaining}回、もう一回押し込んでみて`;
      spinCounter.classList.remove('slide-up');
      spinCounter.classList.add('visible');
      setTimeout(() => {
        spinCounter.classList.remove('visible');
      }, 2500);
    }
  }

  async function triggerSpin(){
    if(triggerSpinGuard()) return;
    lastSpinTime=Date.now(); isSpinning=true;

    // スピンカウンター表示
    updateSpinCounter();

    if(spinCycleCounter===gogoChanceSpinNumber){
      // GOGOチャンス開始（一時停止なし）
      await startSideRecordSpin({isFinal:false}); // 16秒（GOGOチャンス）
      spinCycleCounter++;
    }else if(spinCycleCounter===4){
      // 5回目の最終スピン（金色の横向きレコード回転）
      blockBGN=true;
      try{ gogoAudio.pause(); altBGNAudio.pause(); returnAudio.pause(); gogoAudio.currentTime=0; altBGNAudio.currentTime=0; returnAudio.currentTime=0; }catch{}
      
      // MacBook air.mp3（finalAudio）を再生
      stopAllAudioExcept(finalAudio);
      try{ finalAudio.currentTime=0; finalAudio.play().catch(()=>{}); }catch{}
      
      // 金色の横向きレコード回転を実行
      await startSideRecordSpin({isFinal:true}); // 18秒（最終スピン）
      
      spinCycleCounter++;
    }else{
      const randomDuration=4+Math.random();
      await processSpin(randomDuration);
    }

    if(spinCycleCounter>=5){
      setTimeout(async()=>{
        await showResultsAnimation();
        isSpinning=false; lastSpinTime=0;
      },500);
    }else{
      setTimeout(()=>{ 
        isSpinning=false; 
        lastSpinTime=0;
        // 回転終了後にメッセージを表示
        showAfterSpinMessage();
      },500);
    }
  }

  /* 入力 */
  let pressActive=false;
  let hasPlayedClickThisPress=false;

  document.body.addEventListener('mousedown',e=>{
    pressActive=true; hasPlayedClickThisPress=false;
    
    // 初回メッセージを非表示
    if(initialMessage && initialMessage.classList.contains('visible')){
      initialMessage.classList.remove('visible');
      initialMessage.classList.add('hidden');
    }
    
    if(isSpinning||settingsOverlay.classList.contains('visible')||e.target.closest('.settings-panel')) return;
    forceIndicator.classList.add('visible'); document.body.style.transform='scale(.95)';
  });

  document.addEventListener('mouseup',()=>{
    pressActive=false; hasPlayedClickThisPress=false;
    forceIndicator.classList.remove('visible'); document.body.style.transform='scale(1)';
  });

  document.body.addEventListener('webkitmouseforcechanged',e=>{
    if(e.webkitForce>=2.0 && pressActive && !hasPlayedClickThisPress && !isSpinning){
      hasPlayedClickThisPress=true; playClickOnce();
      
      // 背景絵文字をフェードアウト
      if(winBg.style.opacity !== '0') {
        winBg.style.transition = 'opacity 0.4s ease';
        winBg.style.opacity = '0';
        setTimeout(() => {
          winBg.style.transition = '';
          winBg.innerHTML = ''; // クリーンアップ
        }, 400);
      }
      
      // 背景グラデーションを0.5秒で確実にフェード切り替え
      let ri; 
      do{ ri=Math.floor(Math.random()*gradients.length); } 
      while(ri===currentGradientIndex&&gradients.length>1);
      currentGradientIndex=ri; 
      
      // switchBackground関数を使って確実にフェード
      switchBackground(gradients[currentGradientIndex], 0.5);
      
      const ripple=document.createElement('div'); ripple.className='click-ripple';
      ripple.style.left=`${e.clientX}px`; ripple.style.top=`${e.clientY}px`;
      document.body.appendChild(ripple); setTimeout(()=>ripple.remove(),600);
      document.body.style.transform='scale(.9)'; forceIndicator.classList.remove('visible');
      triggerSpin();
    }else if(e.webkitForce>0){ if(isSpinning) return; document.body.style.transform='scale(.95)'; forceIndicator.classList.add('visible'); }
  });

  let swipeStartY=null;
  document.addEventListener('wheel',e=>{ if(isSpinning) return; if(e.deltaY<-12){ triggerSpin(); } },{passive:true});
  document.addEventListener('touchstart',e=>{ if(e.touches&&e.touches.length>0){ swipeStartY=e.touches[0].clientY; } },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(isSpinning) return;
    if(swipeStartY!==null&&e.touches&&e.touches.length>0){
      const dy=e.touches[0].clientY-swipeStartY;
      if(dy<-60){ swipeStartY=null; triggerSpin(); }
    }
  },{passive:true});
  document.addEventListener('touchend',()=>{ swipeStartY=null; },{passive:true});

  function triggerRecordSpin(delay=0){
    if(blockBGN) return;
    setTimeout(()=>{ if(blockBGN) return; startRandomBGN(); }, delay);
  }

  // 初回メッセージのクリック処理
  if(initialMessage){
    // ページロード時にアニメーション表示
    setTimeout(()=>{
      initialMessage.classList.add('visible');
    },300);
    
    initialMessage.addEventListener('click',()=>{
      initialMessage.classList.remove('visible');
      initialMessage.classList.add('hidden');
    });
  }

  function firstBG(){ bg1.style.opacity='0'; bg2.style.opacity='0'; }
  firstBG();
  resetForNewCycle();
});
</script>
