<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Apple 新宿 アニメーション</title>
    <style>
        :root {
            --title-appear-delay: 0.5s;
            --bubble-appear-delay: 0.8s;
            /* 色の変数を定義 */
            --blue-color: #007aff;
            --white-color: #ffffff;
            --dark-text-color: #1d1d1f;
        }

        html {
            overscroll-behavior-x: contain;
        }

        body {
            font-weight: 600;
            margin: 0;
            font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            transform: scale(0.8);
            opacity: 0;
            animation: pageZoomIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        img {
            pointer-events: none;
        }
        
        .interactive-image {
            pointer-events: auto;
            cursor: pointer;
        }

        .animation-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            /* 比率を16:23に変更 */
            aspect-ratio: 16 / 23;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .hero-embed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.2);
            animation: zoomOut 1.2s ease-out forwards;
            z-index: 1;
        }
        
        .main-title {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            transform: translateY(80px);
            animation: slideUpFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: var(--title-appear-delay);
        }

        .main-title h1 {
            transform: translateY(60px);
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            margin: 0;
        }

        .bubbles-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .bubble {
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: var(--bubble-appear-delay);
            flex: 1;
            box-sizing: border-box;
            min-width: 280px;
            /* 傾きによる変化を滑らかにするためのtransition */
            transition: background-color 0.2s linear, color 0.2s linear, border-radius 0.2s linear;
        }
        
        .bubble-left {
            background-color: var(--white-color);
            color: var(--dark-text-color);
        }
        .bubble-left img {
            width: 70px;
            margin-bottom: 15px;
        }
        
        /* 時刻表示用のスタイル */
        #time-display-container {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            padding: 20px 0;
        }

        .bubble-right {
            background-color: var(--blue-color);
            color: var(--white-color);
            animation-delay: calc(var(--bubble-appear-delay) + 0.15s);
            cursor: pointer;
        }
        .bubble-right .profile-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .bubble-right p {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            pointer-events: none; /* テキストをタップしても親divのイベントが発火 */
        }
        
        #secret-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }
        #secret-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #secret-overlay img {
            max-width: 90%;
            max-height: 90%;
            pointer-events: none;
        }
        
        @keyframes pageZoomIn {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .apply-tap-animation {
            animation: tap-pop 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        @keyframes tap-pop {
            50% { transform: scale(1.1); }
        }

        @keyframes zoomOut {
            from { transform: scale(1.2); }
            to { transform: scale(1); }
        }

        @keyframes slideUpFadeIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }
            .animation-container {
                aspect-ratio: 16 / 23;
                margin-bottom: 30px;
            }
            .main-title h1 {
                font-size: 2.5rem;
            }
            .bubbles-container {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }
            .bubble {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>

<div class="animation-container">
    <iframe src="SL.html" class="hero-embed" title="Embedded background content"></iframe>
    <div class="main-title">
        <h1>スロット</h1>
    </div>
</div>

<div class="bubbles-container">
    <div class="bubble bubble-left">
        <img id="interactive-image-1" src="aaaaa.png" alt="アナログ時計のアイコン" class="interactive-image">
        <div id="initial-content-left">
            <h2>お馴染みのデザイン</h2>
            <p style="color: #0084ff;">やりますねぇ!!</p>
        </div>
        <div id="time-display-container"></div>
    </div>

    <div class="bubble bubble-right" id="secret-trigger-div">
        <img src="AppIcon.png" alt="プロフィールアイコン" class="profile-icon">
        <p style="font-size:1.5rem;">いや、見ろよ見ろよ!!</p>
        <p>見とけよ見とけよ〜!!</p>
    </div>
</div>
<hr style="height: 2px; color: black;">
<h3>他にも様々な魅力を体験シよう</h3>

<div id="secret-overlay">
    <img src="ClickAfter.png" alt="Secret Image">
</div>
<audio id="mac-sound" src="mac.wav" loop></audio>


<script type="module">
  import { haptic } from "https://esm.sh/ios-haptics";
  
  document.addEventListener('DOMContentLoaded', () => {

    const allDivs = document.querySelectorAll('div');
    const bubbleLeft = document.querySelector('.bubble-left');
    const bubbleRight = document.querySelector('.bubble-right');
    const interactiveImage1 = document.getElementById('interactive-image-1');
    const initialContentLeft = document.getElementById('initial-content-left');
    const timeDisplayContainer = document.getElementById('time-display-container');
    const secretTriggerDiv = document.getElementById('secret-trigger-div');
    const secretOverlay = document.getElementById('secret-overlay');
    const macSound = document.getElementById('mac-sound');

    const playHapticPattern = () => {
      haptic.error();
      const baseDelay = 1000;
      const rapidDelay = 50;
      for (let i = 0; i < 6; i++) {
        setTimeout(() => haptic.error(), baseDelay + i * rapidDelay);
      }
    };
    
    document.addEventListener('contextmenu', event => event.preventDefault());

    allDivs.forEach(div => {
      div.addEventListener('click', (event) => {
        playHapticPattern();
        div.classList.add('apply-tap-animation');
        setTimeout(() => {
          div.classList.remove('apply-tap-animation');
        }, 300);
      });
    });
    
    // アナログ時計画像クリックで時刻表示
    interactiveImage1.addEventListener('click', (event) => {
        event.stopPropagation(); // 親divのイベント発火を防ぐ
        
        const now = new Date();
        const hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        // 初期コンテンツを隠し、時刻を表示
        initialContentLeft.style.display = 'none';
        timeDisplayContainer.textContent = `${hours}:${minutes}`;
    });

    // 青いボックス全体クリックで隠し機能作動
    secretTriggerDiv.addEventListener('click', (event) => {
        // ここではstopPropagationは不要
        secretOverlay.classList.add('visible');
        if(macSound.paused) {
            macSound.play();
        }
    });

    secretOverlay.addEventListener('click', () => {
        playHapticPattern();
    });
    
    // --- デバイス傾き検知機能 ---
    let animationFrameId = null;

    const handleOrientation = (event) => {
        // gamma: -90(左) to 90(右)
        const gamma = event.gamma;
        
        if (gamma === null) return;

        // 描画処理が重複しないようにする
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
        }

        animationFrameId = requestAnimationFrame(() => {
            // 傾きの進行度を計算 (0:垂直 -> 1:水平)
            const progress = Math.min(Math.abs(gamma) / 90, 1);

            // 1. 色の補間 (RGB)
            // 白(255,255,255) <-> 青(0,122,255)
            // テキスト: 黒(29,29,31) <-> 白(255,255,255)
            const whiteToBlue_R = 255 - 255 * progress;
            const whiteToBlue_G = 255 - (255 - 122) * progress;
            const whiteToBlue_B = 255;
            
            const blueToWhite_R = 0 + 255 * progress;
            const blueToWhite_G = 122 + (255 - 122) * progress;
            const blueToWhite_B = 255;

            const darkToWhite_R = 29 + (255 - 29) * progress;
            const darkToWhite_G = 29 + (255 - 29) * progress;
            const darkToWhite_B = 31 + (255 - 31) * progress;

            const whiteToDark_R = 255 - (255 - 29) * progress;
            const whiteToDark_G = 255 - (255 - 29) * progress;
            const whiteToDark_B = 255 - (255 - 31) * progress;

            // 2. 角丸(border-radius)の補間 (24px -> 8px)
            const newBorderRadius = 24 - 16 * progress;

            // 3. スタイルを適用
            bubbleLeft.style.backgroundColor = `rgb(${whiteToBlue_R}, ${whiteToBlue_G}, ${whiteToBlue_B})`;
            bubbleLeft.style.color = `rgb(${darkToWhite_R}, ${darkToWhite_G}, ${darkToWhite_B})`;
            
            bubbleRight.style.backgroundColor = `rgb(${blueToWhite_R}, ${blueToWhite_G}, ${blueToWhite_B})`;
            bubbleRight.style.color = `rgb(${whiteToDark_R}, ${whiteToDark_G}, ${whiteToDark_B})`;

            bubbleLeft.style.borderRadius = `${newBorderRadius}px`;
            bubbleRight.style.borderRadius = `${newBorderRadius}px`;
        });
    };
    
    // ジャイロスコープへのアクセス許可を試みる（iOS 13+で必要）
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // ユーザーインタラクション（最初のタップなど）をトリガーにするのが理想的
        // ここではシンプルにページ読み込み時に試みる
        DeviceOrientationEvent.requestPermission()
            .then(permissionState => {
                if (permissionState === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            })
            .catch(console.error);
    } else {
        // requestPermissionがない、またはAndroidデバイスの場合
        window.addEventListener('deviceorientation', handleOrientation);
    }
  });
</script>

</body>
</html>
