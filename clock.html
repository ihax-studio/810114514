<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Apple 新宿 アニメーション</title>
    <style>
        :root {
            --title-appear-delay: 0.5s;
            --bubble-appear-delay: 0.8s;
            --blue-color: #007aff;
            --white-color: #ffffff;
            --dark-text-color: #1d1d1f;
        }

        html {
            overscroll-behavior-x: contain;
        }

        body {
            font-weight: 600;
            margin: 0;
            font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            transform: scale(0.8);
            opacity: 0;
            animation: pageZoomIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        img {
            pointer-events: none;
        }

        .animation-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            /* PCでは16:10 */
            aspect-ratio: 16 / 10;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .hero-embed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.2);
            animation: zoomOut 1.2s ease-out forwards;
            z-index: 1;
        }
        
        .main-title {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            transform: translateY(80px);
            animation: slideUpFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: var(--title-appear-delay);
        }

        .main-title h1 {
            transform: translateY(60px);
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            margin: 0;
        }

        .bubbles-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            perspective: 1000px;
        }

        .bubble {
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(0);
            animation: slideUpFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: var(--bubble-appear-delay);
            flex: 1;
            box-sizing: border-box;
            min-width: 280px;
            /* ダークモードの回転と傾きを滑らかにする */
            transition: background-color 0.2s linear, color 0.2s linear, border-radius 0.2s linear, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: default;
        }
        
        #time-trigger-div, #secret-trigger-div {
            cursor: pointer;
        }

        .bubble-left {
            background-color: var(--white-color);
            color: var(--dark-text-color);
        }
        .bubble-left img {
            width: 70px;
            margin-bottom: 15px;
        }
        
        .bubble-right {
            background-color: var(--blue-color);
            color: var(--white-color);
            animation-delay: calc(var(--bubble-appear-delay) + 0.15s);
        }
        .bubble-right .profile-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .bubble-right p {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            pointer-events: none;
        }
        
        #secret-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            transform: scale(0.8);
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #secret-overlay.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        #secret-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        #time-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 50000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            cursor: pointer;
        }
        #time-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #time-display {
            font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 100;
            font-size: 8rem;
            color: white;
            text-shadow: 0 2px 15px rgba(0,0,0,0.5);
        }
        
        @keyframes pageZoomIn {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .apply-tap-animation {
            animation: tap-pop 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        @keyframes tap-pop {
            50% { transform: scale(1.05); }
        }

        @keyframes zoomOut {
            from { transform: scale(1.2); }
            to { transform: scale(1); }
        }

        @keyframes slideUpFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* スマホ向け（狭画面）のスタイル */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .animation-container {
                /* スマホでは16:23 */
                aspect-ratio: 16 / 23;
                margin-bottom: 30px;
            }
            .main-title h1 { font-size: 2.5rem; }
            .bubbles-container { flex-direction: column; gap: 20px; align-items: center; }
            .bubble { width: 100%; max-width: 400px; }
            #time-display { font-size: 5rem; }
        }
    </style>
</head>
<body>

<div class="animation-container">
    <iframe src="SL.html" class="hero-embed" title="Embedded background content"></iframe>
    <div class="main-title">
        <h1>スロット</h1>
    </div>
</div>

<div class="bubbles-container">
    <div class="bubble bubble-left" id="time-trigger-div">
        <img src="aaaaa.png" alt="アナログ時計のアイコン">
        <h2>お馴染みのデザイン</h2>
        <p style="color: #0084ff;">やりますねぇ!!</p>
    </div>

    <div class="bubble bubble-right" id="secret-trigger-div">
        <img src="AppIcon.png" alt="プロフィールアイコン" class="profile-icon">
        <p style="font-size:1.5rem;">いや、見ろよ見ろよ!!</p>
        <p>見とけよ見とけよ〜!!</p>
    </div>
</div>
<hr style="height: 2px; color: black;">
<h3>他にも様々な魅力を体験シよう</h3>

<div id="secret-overlay">
    <img src="ClickAfter.png" alt="Secret Image">
</div>
<div id="time-overlay">
    <div id="time-display"></div>
</div>

<audio id="mac-sound" src="mac.wav" loop></audio>

<script type="module">
  import { haptic } from "https://esm.sh/ios-haptics";
  
  document.addEventListener('DOMContentLoaded', () => {

    const allDivs = document.querySelectorAll('div:not(#secret-overlay):not(#time-overlay):not(#time-display)');
    const bubbleLeft = document.querySelector('.bubble-left');
    const bubbleRight = document.querySelector('.bubble-right');
    const timeTriggerDiv = document.getElementById('time-trigger-div');
    const secretTriggerDiv = document.getElementById('secret-trigger-div');
    const secretOverlay = document.getElementById('secret-overlay');
    const timeOverlay = document.getElementById('time-overlay');
    const timeDisplay = document.getElementById('time-display');
    const macSound = document.getElementById('mac-sound');
    
    const playHapticPattern = () => {
      haptic.error();
      const baseDelay = 1000;
      const rapidDelay = 50;
      for (let i = 0; i < 6; i++) {
        setTimeout(() => haptic.error(), baseDelay + i * rapidDelay);
      }
    };
    
    document.addEventListener('contextmenu', event => event.preventDefault());

    allDivs.forEach(div => {
      div.addEventListener('click', () => {
        playHapticPattern();
        if (!div.classList.contains('apply-tap-animation')) {
            div.classList.add('apply-tap-animation');
            setTimeout(() => {
                div.classList.remove('apply-tap-animation');
            }, 300);
        }
      });
    });
    
    timeTriggerDiv.addEventListener('click', (event) => {
        event.stopPropagation();
        const now = new Date();
        const hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        timeDisplay.textContent = `${hours}:${minutes}`;
        timeOverlay.classList.add('visible');
    });

    timeOverlay.addEventListener('click', () => {
        timeOverlay.classList.remove('visible');
    });

    secretTriggerDiv.addEventListener('click', (event) => {
        event.stopPropagation();
        secretOverlay.classList.add('visible');
        if(macSound.paused) {
            macSound.play().catch(e => console.error("Audio play failed:", e));
        }
    });

    // --- ダークモード検知 & 傾き機能 ---
    const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    let isDarkMode = darkModeMediaQuery.matches;
    let animationFrameId = null;

    const handleDarkModeChange = (matches) => {
        isDarkMode = matches;
        // JSで直接transformを制御
        if (isDarkMode) {
            bubbleLeft.style.transform = 'rotate(180deg)';
            bubbleRight.style.transform = 'rotate(180deg)';
        } else {
            bubbleLeft.style.transform = '';
            bubbleRight.style.transform = '';
        }
    };

    darkModeMediaQuery.addEventListener('change', e => handleDarkModeChange(e.matches));
    handleDarkModeChange(isDarkMode); // 初期状態をセット

    const handleOrientation = (event) => {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        animationFrameId = requestAnimationFrame(() => {
            // 色と角丸の変更 (常時)
            const gammaProgress = Math.min(Math.abs(event.gamma) / 90, 1);
            const whiteToBlue_R = 255 - 255 * gammaProgress, whiteToBlue_G = 255 - 133 * gammaProgress;
            const blueToWhite_R = 255 * gammaProgress, blueToWhite_G = 122 + 133 * gammaProgress;
            const darkToWhite = 29 + 226 * gammaProgress;
            const whiteToDark = 255 - 226 * gammaProgress;
            const newBorderRadius = 24 - 16 * gammaProgress;

            bubbleLeft.style.backgroundColor = `rgb(${whiteToBlue_R}, ${whiteToBlue_G}, 255)`;
            bubbleLeft.style.color = `rgb(${darkToWhite}, ${darkToWhite}, ${darkToWhite + 2})`;
            bubbleRight.style.backgroundColor = `rgb(${blueToWhite_R}, ${blueToWhite_G}, 255)`;
            bubbleRight.style.color = `rgb(${whiteToDark}, ${whiteToDark}, ${whiteToDark})`;
            bubbleLeft.style.borderRadius = `${newBorderRadius}px`;
            bubbleRight.style.borderRadius = `${newBorderRadius}px`;

            // 要素の3D傾き (ダークモードのみ)
            if (isDarkMode) {
                const rotateX = (event.beta || 0) * -0.2;
                const rotateY = (event.gamma || 0) * 0.2;
                // 180度回転に加えて傾きを適用
                const transformStyle = `rotate(180deg) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                bubbleLeft.style.transform = transformStyle;
                bubbleRight.style.transform = transformStyle;
            }
        });
    };

    // ページ読み込み時に傾き検知を開始
    if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            document.body.addEventListener('click', function requestPermission() {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                }).catch(console.error);
                document.body.removeEventListener('click', requestPermission);
            }, { once: true }); // イベントリスナーを一度だけ実行
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }
    }
  });
</script>

</body>
</html>
