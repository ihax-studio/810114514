<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Apple 新宿 アニメーション</title>
    <style>
        /* 基本設定 */
        :root {
            --title-appear-delay: 0.5s;  /* ページ拡大後にタイトル表示 */
            --bubble-appear-delay: 0.8s; /* ページ拡大後にバブル表示 */
        }

        /* ページ操作のロックと読み込みアニメーション */
        html {
            overscroll-behavior-x: contain; /* 左右スワイプでのナビゲーションを無効化 */
        }

        body {
            font-weight: 600;
            margin: 0;
            font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', -apple-system, BlinkMacSystem-Font, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            /* ページ操作をロック */
            user-select: none; /* テキスト選択を無効化 */
            -webkit-user-select: none;
            -webkit-touch-callout: none; /* iOSでの長押しメニューを無効化 */
            /* 新しいページ読み込みアニメーション */
            transform: scale(0.8);
            opacity: 0;
            animation: pageZoomIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* 画像のポインターイベントを無効化して保存を防ぐ */
        img {
            pointer-events: none;
        }
        
        /* インタラクション用の画像は有効化 */
        .interactive-image {
            pointer-events: auto;
            cursor: pointer;
        }

        /* 背景アニメーション用のコンテナ */
        .animation-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            aspect-ratio: 16 / 8;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .hero-embed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.2);
            animation: zoomOut 1.2s ease-out forwards;
            z-index: 1;
        }
        
        .main-title {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            transform: translateY(80px);
            animation: slideUpFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: var(--title-appear-delay);
        }

        .main-title h1 {
            transform: translateY(60px);
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            margin: 0;
        }

        .bubbles-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .bubble {
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: var(--bubble-appear-delay);
            flex: 1;
            box-sizing: border-box;
            min-width: 280px;
        }
        
        .bubble-left {
            background-color: #ffffff;
            color: #1d1d1f;
        }
        .bubble-left img {
            width: 70px;
            margin-bottom: 15px;
        }
        .bubble-left h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        .bubble-left p {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
            margin: 0;
        }
        .bubble-left p.red-text {
             font-weight: 600;
             color: #0084ff;
        }

        .bubble-right {
            background-color: #007aff;
            color: white;
            animation-delay: calc(var(--bubble-appear-delay) + 0.15s);
        }
        .bubble-right .profile-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .bubble-right p {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
        }
        .bubble-right .small-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            filter: invert(41%) sepia(83%) saturate(3015%) hue-rotate(338deg) brightness(100%) contrast(105%);
        }

        /* --- 隠し機能用オーバーレイ --- */
        #secret-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none; /* 通常時は非表示 */
            transition: opacity 0.3s ease-in-out;
        }
        #secret-overlay.visible {
            opacity: 1;
            pointer-events: auto; /* 表示されたら操作可能に */
        }
        #secret-overlay img {
            max-width: 90%;
            max-height: 90%;
            pointer-events: none;
        }
        
        /* --- アニメーションの定義 --- */
        @keyframes pageZoomIn {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        /* タップ時の拡大アニメーション用クラス */
        .apply-tap-animation {
            animation: tap-pop 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .apply-image-tap-animation {
             animation: tap-pop-image 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        @keyframes tap-pop {
            50% { transform: scale(1.1); }
        }
        @keyframes tap-pop-image {
            50% { transform: scale(1.2); }
        }

        @keyframes zoomOut {
            from { transform: scale(1.2); }
            to { transform: scale(1); }
        }

        @keyframes slideUpFadeIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* スマートフォン向けの調整 */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }
            .animation-container {
                aspect-ratio: 16 / 10;
                margin-bottom: 30px;
            }
            .main-title h1 {
                font-size: 2.5rem;
            }
            .bubbles-container {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }
            .bubble {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>

<div class="animation-container">
    <iframe src="SL.html" class="hero-embed" title="Embedded background content"></iframe>
    <div class="main-title">
        <h1>スロット</h1>
    </div>
</div>

<div class="bubbles-container">
    <div class="bubble bubble-left">
        <img id="interactive-image-1" src="aaaaa.png" alt="アナログ時計のアイコン" class="interactive-image">
        <h2>お馴染みのデザイン</h2>
        <p class="red-text">やりますねぇ!!</p>
    </div>

    <div class="bubble bubble-right">
        <img id="secret-trigger-image" src="AppIcon.png" alt="プロフィールアイコン" class="profile-icon interactive-image">
        <p style="font-size:1.5rem;">いや、見ろよ見ろよ!!</p>
        <p>
            見とけよ見とけよ〜!!
        </p>
    </div>
</div>
<hr style="height: 2px; color: black;">
<h3>他にも様々な魅力を体験シよう</h3>

<div id="secret-overlay">
    <img src="ClickAfter.png" alt="Secret Image">
</div>
<audio id="mac-sound" src="mac.wav" loop></audio>


<script type="module">
  import { haptic } from "https://esm.sh/ios-haptics";
  
  // DOMが読み込まれたら実行
  document.addEventListener('DOMContentLoaded', () => {

    // --- 要素を取得 ---
    const allDivs = document.querySelectorAll('div');
    const interactiveImage1 = document.getElementById('interactive-image-1');
    const secretTriggerImage = document.getElementById('secret-trigger-image');
    const secretOverlay = document.getElementById('secret-overlay');
    const macSound = document.getElementById('mac-sound');

    // --- 触覚フィードバック（Haptic）のパターン定義 ---
    const playHapticPattern = () => {
      haptic.error(); // 1回再生
      const baseDelay = 1000;
      const rapidDelay = 50;
      for (let i = 0; i < 6; i++) {
        setTimeout(() => haptic.error(), baseDelay + i * rapidDelay);
      }
    };
    
    // --- ページ操作のロック ---
    document.addEventListener('contextmenu', event => event.preventDefault());

    // --- イベントリスナーを設定 ---

    // 1. 全てのDIV要素へのイベント
    allDivs.forEach(div => {
      div.addEventListener('click', (event) => {
        // Hapticを再生
        playHapticPattern();

        // アニメーションクラスを付与
        div.classList.add('apply-tap-animation');
        
        // アニメーション完了後にクラスを削除
        setTimeout(() => {
          div.classList.remove('apply-tap-animation');
        }, 300);
      });
    });
    
    // 2. 左の画像へのイベント
    interactiveImage1.addEventListener('click', (event) => {
        event.stopPropagation(); // 親divのイベント発火を防ぐ
        interactiveImage1.classList.add('apply-image-tap-animation');
        setTimeout(() => {
            interactiveImage1.classList.remove('apply-image-tap-animation');
        }, 400);
    });

    // 3. 右の画像（隠し機能トリガー）へのイベント
    secretTriggerImage.addEventListener('click', (event) => {
        event.stopPropagation(); // 親divのイベント発火を防ぐ
        secretOverlay.classList.add('visible');
        if(macSound.paused) {
            macSound.play();
        }
    });

    // 4. オーバーレイ表示中のイベント
    secretOverlay.addEventListener('click', () => {
        // オーバーレイ表示中もHapticは有効
        playHapticPattern();
    });
  });
</script>

</body>
</html>
