<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="熟語GM2">
<title>熟語 形副名前置詞</title>
<link rel="manifest" href="manifest-eikenx2.json">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#f0f4ff">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{overscroll-behavior:none;width:100%;height:100%;overflow:hidden}
body{overscroll-behavior:none;width:100%;height:100dvh;overflow:hidden;
font-family:"SF Pro Display","SF Pro Text",-apple-system,"Noto Sans JP",sans-serif;
background:linear-gradient(150deg,#eef2f8 0%,#f0edfc 50%,#edf7f2 100%);
color:#1c1c1e;display:flex;flex-direction:column}
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}

/* ══ START SCREEN ══ */
.start-screen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(150deg,#eef2f8 0%,#f0edfc 50%,#edf7f2 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 40px) 24px calc(var(--sab) + 40px);
  animation:startIn .6s ease both;
}
.start-screen.out{animation:startOut .5s cubic-bezier(.77,0,.18,1) both;pointer-events:none}
@keyframes startIn{from{opacity:0}to{opacity:1}}
@keyframes startOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.1)}}
.start-icon{font-size:72px;margin-bottom:20px;animation:startBounce 2s ease infinite}
@keyframes startBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.start-title{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.start-sub{font-size:14px;color:#8e8e93;margin-bottom:36px;text-align:center;line-height:1.5}
.start-btn{
  width:180px;height:180px;border-radius:50%;
  background:linear-gradient(135deg,#007aff,#5856d6);
  border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(0,122,255,.35),0 2px 8px rgba(0,0,0,.1);
  transition:transform .15s ease;color:#fff;
}
.start-btn:active{transform:scale(.93)}
.start-btn-icon{font-size:48px;margin-bottom:6px}
.start-btn-text{font-size:20px;font-weight:700}
.start-resume{
  margin-top:20px;font-size:15px;color:#007aff;font-weight:600;
  background:rgba(0,122,255,.08);border:none;cursor:pointer;padding:10px 24px;
  border-radius:12px;transition:background .2s;
}
.start-resume:active{background:rgba(0,122,255,.16)}

/* ══ HEADER ══ */
.hdr{
  display:flex;align-items:center;gap:8px;
  padding:calc(var(--sat) + 14px) 16px 12px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-bottom:1px solid rgba(0,0,0,.05);
  position:relative;z-index:10;
}
.hdr-back{font-size:28px;background:none;border:none;color:#007aff;cursor:pointer;padding:0 4px;line-height:1;font-weight:300}
.hdr-title{font-size:17px;font-weight:700;flex:1;letter-spacing:-.02em}
.hdr-btn{font-size:18px;background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:8px;transition:background .2s;min-width:34px;text-align:center}
.hdr-btn:active{background:rgba(0,0,0,.06)}
.hdr-count{font-size:13px;color:#007aff;font-weight:600;cursor:pointer;padding:4px 10px;border-radius:8px;background:rgba(0,122,255,.08);transition:background .2s}
.hdr-count:active{background:rgba(0,122,255,.16)}

/* ══ MAIN BODY ══ */
.main{
  flex:1;overflow-y:auto;padding:20px 16px 20px;
  -webkit-overflow-scrolling:touch;
}
@media(min-width:768px){.main{max-width:680px;margin:0 auto;width:100%}}

/* ══ CARD ══ */
.card{
  background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:22px;border:1px solid rgba(255,255,255,.92);
  box-shadow:0 6px 24px rgba(0,0,0,.07),0 1px 4px rgba(0,0,0,.04);
  padding:28px 22px;
  animation:cardIn .45s cubic-bezier(.77,0,.18,1) both;
}
@keyframes cardIn{from{opacity:0;transform:scale(.9) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.q-tag{
  display:inline-block;font-size:11px;font-weight:600;color:#5856d6;
  background:rgba(88,86,214,.1);padding:3px 10px;border-radius:8px;margin-bottom:14px;
}
.q-text{
  font-size:19px;font-weight:600;line-height:1.65;color:#1c1c1e;
  margin-bottom:22px;word-break:break-word;
}
.q-text .blank{
  display:inline-block;min-width:100px;border-bottom:2.5px solid #007aff;
  text-align:center;color:#007aff;font-weight:700;
  transition:color .3s,border-color .3s;
}
.q-text .blank.revealed{color:#34c759;border-color:#34c759}

/* ══ CHOICES ══ */
.choices{display:flex;flex-direction:column;gap:10px}
.ch{
  display:flex;align-items:center;gap:12px;
  padding:15px 16px;border-radius:16px;
  background:rgba(255,255,255,.92);border:1.5px solid rgba(0,0,0,.07);
  font-size:16px;font-weight:500;cursor:pointer;
  transition:transform .12s ease,background .2s,border-color .2s;
}
.ch:active{transform:scale(.97)}
.ch-num{
  width:30px;height:30px;border-radius:9px;
  background:rgba(0,122,255,.1);color:#007aff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
  transition:background .2s,color .2s;
}
.ch.correct{background:rgba(52,199,89,.14)!important;border-color:rgba(52,199,89,.5)!important;animation:chPop .5s cubic-bezier(.34,1.56,.64,1) both}
.ch.correct .ch-num{background:rgba(52,199,89,.25);color:#1a7a35}
.ch.wrong{background:rgba(255,59,48,.1)!important;border-color:rgba(255,59,48,.4)!important;animation:chShake .45s ease both}
.ch.wrong .ch-num{background:rgba(255,59,48,.2);color:#c0001a}
.ch.disabled{pointer-events:none;opacity:.5}
.ch{flex-wrap:wrap}
.ch-en{font-weight:600}
.ch-ja{display:block;width:100%;margin-left:42px;margin-top:3px;font-size:12px;color:#8e8e93;font-weight:500}
/* ══ REARRANGE ══ */
.rr-placed,.rr-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:12px;border-radius:14px;margin-bottom:10px}
.rr-placed{background:rgba(0,122,255,.06);border:2px dashed rgba(0,122,255,.35)}
.rr-pool{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06)}
.rr-empty{font-size:13px;color:#8e8e93;align-self:center}
.rr-chip{display:inline-flex;align-items:center;padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid rgba(0,0,0,.08);font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,background .2s,border-color .2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rr-chip:active{transform:scale(.94)}
.rr-chip.placed{background:rgba(0,122,255,.1);color:#007aff;border-color:rgba(0,122,255,.35)}
.rr-chip.rr-disabled{pointer-events:none;opacity:.7}
.rr-chip.rr-correct{background:rgba(52,199,89,.18)!important;color:#1a7a35!important;border-color:rgba(52,199,89,.5)!important}
.rr-chip.rr-wrong{background:rgba(255,59,48,.12)!important;color:#c0001a!important;border-color:rgba(255,59,48,.45)!important}
.rr-submit{width:100%;margin-top:6px;padding:14px;border-radius:14px;background:#007aff;color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .2s}
.rr-submit:active{transform:scale(.96)}
.rr-submit:disabled{opacity:.4;pointer-events:none}
@keyframes chPop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes chShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ══ FEEDBACK ══ */
.fb{
  margin-top:20px;padding-top:18px;border-top:1px solid rgba(0,0,0,.06);
  animation:fbIn .35s ease both;
}
@keyframes fbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fb-sentence{font-size:16px;font-weight:600;color:#1c1c1e;line-height:1.55;margin-bottom:8px}
.fb-jp{font-size:14px;color:#8e8e93;line-height:1.55;margin-bottom:8px;cursor:pointer;transition:background .2s;padding:4px 8px;border-radius:8px;margin:-4px -8px;margin-bottom:4px}
.fb-jp:active{background:rgba(0,0,0,.04)}
.fb-tip{font-size:13px;color:#5856d6;font-weight:500;line-height:1.45;padding:8px 12px;background:rgba(88,86,214,.06);border-radius:10px;cursor:pointer;transition:background .2s}
.fb-tip:active{background:rgba(88,86,214,.12)}
/* ══ SEARCH OVERLAY ══ */
.search-overlay{
  position:fixed;inset:0;z-index:8000;
  background:rgba(0,0,0,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  animation:pauseIn .25s ease both;
}
.search-overlay.out{animation:pauseOut .2s ease both;pointer-events:none}
.search-box{
  background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px;padding:28px 24px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
  min-width:280px;max-width:340px;width:85%;
  animation:pauseBoxIn .3s cubic-bezier(.34,1.56,.64,1) both;
}
.search-title{font-size:18px;font-weight:700;margin-bottom:16px}
.search-input{
  width:100%;padding:14px 16px;border-radius:14px;
  border:2px solid rgba(0,122,255,.3);background:rgba(255,255,255,.9);
  font-size:20px;font-weight:600;text-align:center;
  outline:none;-webkit-appearance:none;
  transition:border-color .2s;
}
.search-input:focus{border-color:#007aff}
.search-hint{font-size:12px;color:#8e8e93;margin-top:10px;line-height:1.4}
.search-go{
  width:100%;margin-top:14px;padding:13px;border-radius:14px;
  background:#007aff;color:#fff;border:none;font-size:16px;font-weight:700;
  cursor:pointer;transition:transform .12s;
}
.search-go:active{transform:scale(.96)}
.search-cancel{
  width:100%;margin-top:8px;padding:10px;border-radius:12px;
  background:transparent;color:#8e8e93;border:none;font-size:14px;font-weight:600;
  cursor:pointer;
}

.nav-btns{display:flex;gap:10px;margin-top:18px;animation:fbIn .3s ease both}
.nav-btn{
  flex:1;padding:15px;border-radius:14px;
  border:none;font-size:16px;font-weight:700;
  cursor:pointer;transition:transform .12s;
}
.nav-btn:active{transform:scale(.96)}
.nav-next{background:#007aff;color:#fff}
.nav-back{background:rgba(0,0,0,.06);color:#1c1c1e}

/* ══ FOOTER ══ */
.ftr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px calc(var(--sab) + 14px);
  background:rgba(255,255,255,.72);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(0,0,0,.05);
}
.score{display:flex;gap:18px;font-size:15px;font-weight:700}
.sc-g{color:#34c759}.sc-g::before{content:"✓ ";font-weight:800}
.sc-f{color:#ff3b30}.sc-f::before{content:"✗ ";font-weight:800}
.audio-btn{
  font-size:22px;background:rgba(0,122,255,.1);
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,background .2s;
}
.audio-btn:active{transform:scale(.88);background:rgba(0,122,255,.2)}
.speed-btn{
  font-size:13px;font-weight:700;background:rgba(0,0,0,.06);color:#1c1c1e;
  padding:6px 12px;border-radius:10px;border:none;cursor:pointer;
  transition:transform .12s,background .2s;
}
.speed-btn:active{transform:scale(.92)}
.speed-btn.fast{background:rgba(88,86,214,.15);color:#5856d6}
.audio-btn.playing{animation:audioPulse .6s ease infinite alternate}
@keyframes audioPulse{from{transform:scale(1)}to{transform:scale(1.08)}}

/* ══ PROGRESS BAR ══ */
/* ══ QUESTION TIMER ══ */
.qtimer-wrap{height:4px;background:rgba(0,0,0,.06);margin:0 -22px;margin-bottom:16px;border-radius:2px;overflow:hidden}
.qtimer-bar{height:100%;background:linear-gradient(90deg,#34c759,#007aff);border-radius:2px;transition:width .1s linear}
.qtimer-bar.warn{background:linear-gradient(90deg,#ff9500,#ff3b30)}
.qtimer-bar.danger{background:#ff3b30;animation:timerPulse .5s ease infinite alternate}
@keyframes timerPulse{from{opacity:1}to{opacity:.5}}

.prog-wrap{height:3px;background:rgba(0,0,0,.05);margin:0 -22px;margin-top:-28px;margin-bottom:20px}
.prog-bar{height:100%;background:linear-gradient(90deg,#007aff,#5856d6);border-radius:0 2px 2px 0;transition:width .4s cubic-bezier(.77,0,.18,1)}

/* ══ COMPLETE SCREEN ══ */
.done{text-align:center;padding:60px 20px}
.done-emoji{font-size:56px;margin-bottom:16px;animation:doneEmoji .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes doneEmoji{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.done-title{font-size:24px;font-weight:800;margin-bottom:10px;letter-spacing:-.03em}
.done-sub{font-size:15px;color:#8e8e93;margin-bottom:28px;line-height:1.5}
.done-btn{
  padding:14px 36px;border-radius:16px;background:#007aff;color:#fff;
  border:none;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s;
}
.done-btn:active{transform:scale(.95)}

/* ══ PAUSE OVERLAY ══ */
.pause-overlay{
  position:fixed;inset:0;z-index:8888;
  background:rgba(0,0,0,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:pauseIn .3s ease both;
}
.pause-overlay.out{animation:pauseOut .25s ease both;pointer-events:none}
@keyframes pauseIn{from{opacity:0}to{opacity:1}}
@keyframes pauseOut{from{opacity:1}to{opacity:0}}
.pause-box{
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:24px;padding:36px 32px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.2);
  animation:pauseBoxIn .35s cubic-bezier(.34,1.56,.64,1) both;
  min-width:260px;
}
@keyframes pauseBoxIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.pause-icon{font-size:48px;margin-bottom:12px}
.pause-title{font-size:22px;font-weight:800;margin-bottom:6px}
.pause-sub{font-size:14px;color:#8e8e93;margin-bottom:24px;line-height:1.4}
.pause-resume{
  width:100%;padding:14px;border-radius:14px;background:#007aff;color:#fff;
  border:none;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;
  transition:transform .12s;
}
.pause-resume:active{transform:scale(.96)}
.pause-home{
  width:100%;padding:12px;border-radius:14px;background:rgba(0,0,0,.05);color:#1c1c1e;
  border:none;font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .12s;
}
.pause-home:active{transform:scale(.96)}

/* ══ QUESTION LIST OVERLAY ══ */
.qlist-overlay{
  position:fixed;inset:0;z-index:7777;
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;
  animation:qlistIn .3s ease both;
}
.qlist-overlay.out{animation:qlistOut .25s ease both;pointer-events:none}
@keyframes qlistIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes qlistOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(30px)}}
.qlist-hdr{
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat) + 14px) 16px 12px;
  border-bottom:1px solid rgba(0,0,0,.06);
}
.qlist-close{font-size:16px;color:#007aff;background:none;border:none;cursor:pointer;font-weight:600;padding:4px 8px}
.qlist-title{font-size:17px;font-weight:700;flex:1}
.qlist-body{
  flex:1;overflow-y:auto;padding:8px 12px calc(var(--sab) + 16px);
  -webkit-overflow-scrolling:touch;
}
.qlist-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:12px;cursor:pointer;
  transition:background .15s;
  border-bottom:1px solid rgba(0,0,0,.04);
}
.qlist-item:active{background:rgba(0,122,255,.08)}
.qlist-item.current{background:rgba(0,122,255,.1)}
.qlist-num{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
  background:rgba(0,0,0,.04);color:#8e8e93;
}
.qlist-item.current .qlist-num{background:rgba(0,122,255,.15);color:#007aff}
.qlist-q{font-size:14px;color:#1c1c1e;flex:1;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
</style>
</head>
<body>

<!-- START SCREEN -->
<div class="start-screen" id="start-screen">
  <div class="start-icon">📘</div>
  <div class="start-title">熟語 形副名前置詞</div>
  <div class="start-sub">149問 · 熟語マスター · 音声付き<br>第25-26章 形容詞/副詞/名詞/前置詞の熟語</div>
  <button class="start-btn" id="start-btn" onclick="startQuiz()">
    <div class="start-btn-icon">▶</div>
    <div class="start-btn-text">START</div>
  </button>
  <div class="start-resume" id="start-resume" style="display:none"></div>
</div>

<!-- QUIZ UI (hidden until start) -->
<div class="hdr" id="quiz-hdr" style="display:none">
  <button class="hdr-back" onclick="pauseQuiz()">‹</button>
  <div class="hdr-title">熟語 形副名前置詞</div>
  <button class="hdr-btn" id="btn-pause" onclick="pauseQuiz()" title="一時停止">⏸</button>
  <button class="hdr-btn" id="btn-shuffle" onclick="toggleShuffle()" title="シャッフル">🔀</button>
  <button class="hdr-btn" id="btn-search" onclick="openSearch()" title="問題検索">🔍</button>
  <div class="hdr-count" id="hdr-count" onclick="openQList()">1 / 149</div>
</div>

<div class="main" id="main" style="display:none">
  <div class="card" id="card">
    <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="qtimer-wrap"><div class="qtimer-bar" id="qtimer-bar" style="width:100%"></div></div>
    <div class="q-tag" id="q-tag"></div>
    <div class="q-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb" style="display:none">
      <div class="fb-sentence" id="fb-sentence" onclick="speakEnSentence()" style="cursor:pointer"></div>
      <div class="fb-jp" id="fb-jp" onclick="speakJp(this.textContent)"></div>
      <div class="fb-tip" id="fb-tip" onclick="speakJp(this.innerText)"></div>
    </div>
  </div>
</div>

<div class="ftr" id="quiz-ftr" style="display:none">
  <div class="score">
    <span class="sc-g" id="sc-g" onclick="openCorrectList()" style="cursor:pointer">0</span>
    <span class="sc-f" id="sc-f" onclick="openWrongList()" style="cursor:pointer">0</span>
  </div>
  <button class="speed-btn" id="speed-btn" onclick="toggleSpeed()">1x</button>
  <button class="audio-btn" id="audio-btn" onclick="playAudio()">🔊</button>
</div>

<script>
// ═══ HAPTIC ═══
let _h=null;
(()=>{
  // Try parent's haptic first (when inside iframe)
  try{if(window.parent&&window.parent.haptic){_h={__parent:true};}}catch(_){}
  if(!_h)import('https://esm.sh/ios-haptics').then(m=>{_h=m.haptic;}).catch(()=>{});
})();
const haptic=()=>{try{if(_h&&_h.__parent){window.parent.haptic();}else if(_h){_h();}}catch(_){}};
haptic.confirm=()=>{try{if(_h&&_h.__parent){window.parent.haptic.confirm();}else if(_h&&_h.confirm){_h.confirm();}}catch(_){}};

// ═══ AUDIO CONTEXT UNLOCK (iOS) ═══
let _audioUnlocked=false;
function unlockAudio(){
  if(_audioUnlocked)return Promise.resolve();
  return new Promise(r=>{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const buf=ctx.createBuffer(1,1,22050);
    const src=ctx.createBufferSource();
    src.buffer=buf;src.connect(ctx.destination);src.start(0);
    src.onended=()=>{ctx.close();_audioUnlocked=true;r();};
    setTimeout(()=>{_audioUnlocked=true;r();},100);
  });
}

let S={idx:0,correct:0,wrong:0,answered:false,shuffled:false,order:null,started:false,wrongs:[],corrects:[],speed:1};

// 混同注意ペアの意味対比
const KONFUSE={
"give in":"屈する・譲る","give up":"あきらめる","give away":"譲り渡す・ばらす",
"take on":"引き受ける","take up":"始める・占める","take off":"離陸する・脱ぐ","take in":"理解する・だます","take into consideration":"考慮に入れる",
"carry on":"続ける","carry out":"実行する",
"make out":"理解する・判読する","make up":"作り上げる・化粧する","make up for":"埋め合わせる","make do":"間に合わせる","make up one's mind":"決心する",
"come up with":"思いつく","come across":"偶然出会う","come about":"起こる",
"turn out":"判明する","turn up":"現れる","turn down":"断る・下げる",
"hold back":"抑える","hold on":"待つ・しがみつく","hold out":"持ちこたえる",
"put off":"延期する","put out":"消す","put up with":"我慢する",
"look up to":"尊敬する","look down on":"見下す",
"run out":"なくなる","run into":"偶然会う・衝突する","run short":"不足する",
"keep up with":"遅れずについていく","catch up with":"追いつく","catch up on":"遅れを取り戻す",
};
function getKonfuseText(st){
  if(!st||!st.includes('混同'))return'';
  // Extract phrases from st like "take on / take in と混同注意"
  const m=st.match(/(.+?)と混同/);
  if(!m)return'';
  const phrases=m[1].split(/\s*[/／]\s*/).map(s=>s.trim()).filter(Boolean);
  const lines=[];
  phrases.forEach(p=>{
    const pl=p.toLowerCase();
    if(KONFUSE[pl])lines.push(p+' = '+KONFUSE[pl]);
  });
  return lines.join('\n');
}

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({idx:S.idx,correct:S.correct,wrong:S.wrong,shuffled:S.shuffled,order:S.order,wrongs:S.wrongs,corrects:S.corrects,speed:S.speed}));}catch(_){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);if(s){const d=JSON.parse(s);S.idx=d.idx||0;S.correct=d.correct||0;S.wrong=d.wrong||0;S.shuffled=!!d.shuffled;S.order=d.order||null;S.wrongs=d.wrongs||[];S.corrects=d.corrects||[];S.speed=d.speed||1;}}catch(_){}}

function getOrder(){
  if(S.shuffled&&S.order&&S.order.length===EK2Q.length)return S.order;
  return Array.from({length:EK2Q.length},(_,i)=>i);
}
function getQ(){return EK2Q[getOrder()[S.idx]];}

// ═══ QUESTION TIMER ═══
let _qtStart=0;
let _qtAnim=null;
function startQTimer(){
  stopQTimer();
  _qtStart=Date.now();
  const bar=document.getElementById('qtimer-bar');
  bar.style.width='100%';bar.className='qtimer-bar';
  function tick(){
    if(S.answered||_paused){return;}
    const elapsed=Date.now()-_qtStart;
    const pct=Math.max(0,1-elapsed/Q_TIME)*100;
    bar.style.width=pct+'%';
    if(pct<20){bar.className='qtimer-bar danger';}
    else if(pct<40){bar.className='qtimer-bar warn';}
    if(elapsed>=Q_TIME){timeUp();return;}
    _qtAnim=requestAnimationFrame(tick);
  }
  _qtAnim=requestAnimationFrame(tick);
}
function stopQTimer(){
  if(_qtAnim){cancelAnimationFrame(_qtAnim);_qtAnim=null;}
}
function timeUp(){
  if(S.answered)return;
  S.answered=true;
  _choiceReadAbort=true;
  window.speechSynthesis.cancel();
  stopQTimer();
  playSnd('timeup');
  hapticWrong();
  const q=getQ();
  S.wrong++;
  if(!S.wrongs.includes(q.id))S.wrongs.push(q.id);
  syncForgot(q);
  document.querySelectorAll('#choices .ch').forEach(b=>{
    b.classList.add('disabled');
    if(parseInt(b.dataset.i,10)===q.a)b.classList.add('correct');
  });
  document.getElementById('sc-g').textContent=S.correct;
  document.getElementById('sc-f').textContent=S.wrong;
  const blank=document.getElementById('blank');
  if(blank){blank.textContent=q.at;blank.classList.add('revealed');}
  const fb=document.getElementById('fb');
  fb.style.display='block';
  document.getElementById('fb-sentence').textContent=q.cs;
  document.getElementById('fb-jp').textContent=q.jt;
  const tip=document.getElementById('fb-tip');
  if(q.st){
    const kf=getKonfuseText(q.st);
    tip.innerHTML=q.st+(kf?'<br><span style="display:block;margin-top:6px;white-space:pre-line;font-size:13px;line-height:1.6">'+kf+'</span>':'');
    tip.style.display='block';
    if(q.st.includes('混同')){tip.style.background='rgba(255,59,48,.08)';tip.style.color='#ff3b30';}
    else{tip.style.background='';tip.style.color='';}
  }else{tip.style.display='none';}
  speakJp(q.jt); playAudio();
  save();
  showNextBtn();
}

function doSearch(){
  const input=document.getElementById('search-input');
  if(!input)return;
  const id=parseInt(input.value,10);
  if(isNaN(id))return;
  const order=getOrder();
  const idx=order.findIndex(oi=>EK2Q[oi].id===id);

    S.idx=idx;save();
    closeSearch();
    render();
  }else{
    input.style.borderColor='#ff3b30';
    input.placeholder='見つかりません';
    input.value='';
  }
}
function closeSearch(){
  const ov=document.getElementById('search-overlay');
  if(ov){ov.classList.add('out');setTimeout(()=>ov.remove(),200);}

}

// ═══ REARRANGE (並べ替え) ═══
let _rearrangeState=null;
function renderRearrange(q,chEl){
  const words=(q.words||[]).slice();
  _rearrangeState={pool:words.slice(),placed:[],correct:q.answer_phrase||q.at};
  chEl.innerHTML=
    '<div class="rr-placed" id="rr-placed"></div>'+
    '<div class="rr-pool" id="rr-pool"></div>'+
    '<button class="rr-submit" id="rr-submit" onclick="submitRearrange()" disabled>並べ替え完了</button>';
  renderRearrangeChips();
}
function renderRearrangeChips(){
  const placed=document.getElementById('rr-placed');
  const pool=document.getElementById('rr-pool');
  if(!placed||!pool||!_rearrangeState)return;
  placed.innerHTML=_rearrangeState.placed.map((w,i)=>'<span class="rr-chip placed" onclick="rrUnplace('+i+')">'+w+'</span>').join('')||'<span class="rr-empty">↓語をタップ</span>';
  pool.innerHTML=_rearrangeState.pool.map((w,i)=>'<span class="rr-chip" onclick="rrPlace('+i+')">'+w+'</span>').join('');
  document.getElementById('rr-submit').disabled=_rearrangeState.pool.length>0;
}
function rrPlace(i){
  if(S.answered||!_rearrangeState)return;
  haptic();
  const w=_rearrangeState.pool.splice(i,1)[0];
  _rearrangeState.placed.push(w);
  renderRearrangeChips();
}
function rrUnplace(i){
  if(S.answered||!_rearrangeState)return;
  haptic();
  const w=_rearrangeState.placed.splice(i,1)[0];
  _rearrangeState.pool.push(w);
  renderRearrangeChips();
}
function submitRearrange(){
  if(S.answered||!_rearrangeState)return;
  const q=getQ();
  S.answered=true;stopQTimer();
  const user=_rearrangeState.placed.join(' ').trim().toLowerCase();
  const correct=(_rearrangeState.correct||'').trim().toLowerCase();
  const ok=user===correct;
  document.getElementById('rr-submit').disabled=true;
  document.querySelectorAll('.rr-chip').forEach(c=>c.classList.add('rr-disabled'));
  if(ok){
    S.correct++;if(!S.corrects.includes(q.id))S.corrects.push(q.id);
    playSnd('correct');haptic.confirm();
    document.querySelectorAll('#rr-placed .rr-chip').forEach(c=>c.classList.add('rr-correct'));
  }else{
    S.wrong++;if(!S.wrongs.includes(q.id))S.wrongs.push(q.id);
    syncForgot(q);
    playSnd('wrong');hapticWrong();
    document.querySelectorAll('#rr-placed .rr-chip').forEach(c=>c.classList.add('rr-wrong'));
  }
  _rearrangeState=null;
  showFeedback(q);
}

// ═══ AUDIO + CHOICES READOUT ═══
let _choiceReadAbort=false;
function playAudioThenReadChoices(q){
  _choiceReadAbort=true;
  if(S.idx>=EK2Q.length)return;
  if(_audio){_audio.pause();}
  window.speechSynthesis.cancel();
  _audio=new Audio(q.af);
  _audio.playbackRate=S.speed;
  const btn=document.getElementById('audio-btn');
  btn.classList.add('playing');
  const after=()=>{
    btn.classList.remove('playing');
    _choiceReadAbort=false;
    setTimeout(()=>readChoicesSequentially(q,0),250);
  };
  _audio.onended=after;
  _audio.onerror=after;
  _audio.play().catch(after);
}
function readChoicesSequentially(q,idx){
  if(S.answered||_paused||_choiceReadAbort)return;
  if(q.type==='rearrange')return;
  if(!q.ch||idx>=q.ch.length)return;
  window.speechSynthesis.cancel();
  const label=(idx+1)+'. '+q.ch[idx];
  const u=new SpeechSynthesisUtterance(label);
  u.lang='en-US';u.rate=S.speed;
  const v=_getAlexVoice();if(v)u.voice=v;
  u.onend=()=>readChoicesSequentially(q,idx+1);
  u.onerror=()=>readChoicesSequentially(q,idx+1);
  window.speechSynthesis.speak(u);
}

// ═══ MULTI-SELECT (Xつ選べ) ═══
let _multiState=null; // {need:3, wrongAnswers:[indices], selected:[]}
function isMulti(q){
  const m=q.q.match(/(\d)つ選べ/);
  return m?parseInt(m[1],10):0;
}
function getMultiCorrects(q){
  // For multi-select: all non-empty choices except the "wrong" one are correct
  // The single answer field marks the odd-one-out approach won't work universally
  // So: all choices with content are candidates; answer field = the first correct one
  // For Q1107 specifically: choices 2,3,4 are correct (index 1,2,3), choice 1 is wrong
  // General rule: non-empty choices that are valid uses
  // Since data only has 1 answer, we treat answer as "one of the correct ones"
  // and all other non-empty choices except 1 wrong one are also correct
  const need=isMulti(q);
  const nonEmpty=q.ch.map((_,i)=>i+1).filter(i=>q.ch[i-1]!=='');
  // wrong ones = total non-empty - need
  // answer is definitely correct, the remaining (nonEmpty.length - need) are wrong
  const corrects=[q.a];
  // We need to figure out which are correct. For now, assume the first (nonEmpty.length-need)
  // that are NOT the answer are wrong, rest are correct
  const others=nonEmpty.filter(i=>i!==q.a);
  const wrongCount=nonEmpty.length-need;
  const wrongs=others.slice(0,wrongCount);
  const moreCorrects=others.filter(i=>!wrongs.includes(i));
  return{corrects:[q.a,...moreCorrects],wrongs};
}

// ═══ CHOICE HANDLER ═══
function handleChoice(btn){
  if(S.answered||_paused)return;
  const q=getQ();
  const chosen=parseInt(btn.dataset.i,10);
  const multiNeed=isMulti(q);

  // ── Multi-select mode ──
  if(multiNeed>0){
    if(!_multiState)_multiState={need:multiNeed,selected:[],info:getMultiCorrects(q),missed:false};
    if(_multiState.selected.includes(chosen))return;
    _multiState.selected.push(chosen);
    const isRight=_multiState.info.corrects.includes(chosen);
    if(!isRight){
      // Wrong pick → mark wrong, keep going
      btn.classList.add('wrong');btn.classList.add('disabled');
      playSnd('wrong');
      hapticWrong();
      _multiState.missed=true;
    }else{
      // Correct pick
      btn.classList.add('correct');btn.classList.add('disabled');
      playSnd('correct');
      haptic.confirm();
    }
    // Check if all correct ones have been found
    const foundCorrects=_multiState.selected.filter(s=>_multiState.info.corrects.includes(s)).length;
    if(foundCorrects>=multiNeed){
      S.answered=true;stopQTimer();
      document.querySelectorAll('#choices .ch').forEach(b=>b.classList.add('disabled'));
      if(_multiState.missed){
        S.wrong++;if(!S.wrongs.includes(q.id))S.wrongs.push(q.id);
        syncForgot(q);
      }else{
        S.correct++;if(!S.corrects.includes(q.id))S.corrects.push(q.id);
      }
      _multiState=null;
      showFeedback(q);
    }
    return;
  }

  // ── Normal single-select ──
  S.answered=true;
  stopQTimer();
  const ok=chosen===q.a;
  document.querySelectorAll('#choices .ch').forEach(b=>{
    b.classList.add('disabled');
    if(parseInt(b.dataset.i,10)===q.a)b.classList.add('correct');
  });
  if(!ok){
    btn.classList.add('wrong');
    S.wrong++;
    if(!S.wrongs.includes(q.id))S.wrongs.push(q.id);
    syncForgot(q);
    playSnd('wrong');
    hapticWrong();
  }else{
    S.correct++;
    if(!S.corrects.includes(q.id))S.corrects.push(q.id);
    playSnd('correct');
    haptic.confirm();
  }
  showFeedback(q);
}

function showFeedback(q){
  _choiceReadAbort=true;
  window.speechSynthesis.cancel();
  document.getElementById('sc-g').textContent=S.correct;
  document.getElementById('sc-f').textContent=S.wrong;
  const blank=document.getElementById('blank');
  if(blank){blank.textContent=q.at;blank.classList.add('revealed');}
  const fb=document.getElementById('fb');
  fb.style.display='block';
  document.getElementById('fb-sentence').textContent=q.cs;
  document.getElementById('fb-jp').textContent=q.jt;
  const tip=document.getElementById('fb-tip');
  if(q.st){
    const kf=getKonfuseText(q.st);
    tip.innerHTML=q.st+(kf?'<br><span style="display:block;margin-top:6px;white-space:pre-line;font-size:13px;line-height:1.6">'+kf+'</span>':'');
    tip.style.display='block';
    if(q.st.includes('混同')){tip.style.background='rgba(255,59,48,.08)';tip.style.color='#ff3b30';}
    else{tip.style.background='';tip.style.color='';}
  }else{tip.style.display='none';}
  playFeedbackChain(q);
  save();
  showNextBtn();
}

// ═══ FEEDBACK AUDIO CHAIN: EN mp3 → JP TTS → EN TTS (sequential, no overlap) ═══
let _fbChainAbort=false;
function playFeedbackChain(q){
  _fbChainAbort=true;
  setTimeout(()=>{
    _fbChainAbort=false;
    // Step 1: Play English MP3
    if(_audio){_audio.pause();}
    window.speechSynthesis.cancel();
    _audio=new Audio(q.af);
    const fbSpeed=S.speed>=1.3?S.speed+0.1:1.3;
    _audio.playbackRate=fbSpeed;
    const btn=document.getElementById('audio-btn');
    btn.classList.add('playing');
    _audio.onerror=()=>{btn.classList.remove('playing');fbStep2(q);};
    _audio.onended=()=>{btn.classList.remove('playing');fbStep2(q);};
    _audio.play().catch(()=>{btn.classList.remove('playing');fbStep2(q);});
  },50);
}
function fbStep2(q){
  // Step 2: Japanese TTS
  if(_fbChainAbort)return;
  if(!q.jt){fbStep3(q);return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(q.jt);
  u.lang='ja-JP';u.rate=1.1;
  u.onend=()=>fbStep3(q);
  u.onerror=()=>fbStep3(q);
  window.speechSynthesis.speak(u);
}
function fbStep3(q){
  // Step 3: English sentence TTS
  if(_fbChainAbort)return;
  const text=q.cs||q.q;
  if(!text)return;
  window.speechSynthesis.cancel();
  const fbSpeed=S.speed>=1.3?S.speed+0.1:1.3;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=fbSpeed;
  const v=_getAlexVoice();if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}

function advance(){
  if(!S.answered)return;
  haptic();
  if(_advTimer){clearTimeout(_advTimer);_advTimer=null;}
  S.idx++;save();render();
}
function goBack(){
  if(S.idx<=0)return;
  stopQTimer();
  if(_advTimer){clearTimeout(_advTimer);_advTimer=null;}
  S.idx--;save();render();
}

// Click delegation
document.addEventListener('click',e=>{
  const btn=e.target.closest('.ch');
  if(btn&&!btn.classList.contains('disabled'))handleChoice(btn);
});
// Keyboard 1-4 to select choice, Enter/→ for next, ← for back
document.addEventListener('keydown',e=>{
  if(document.getElementById('search-overlay'))return; // search open, don't interfere
  if(_paused||!S.started)return;
  const k=e.key;
  // Double Enter → open search
  if(k==='Enter'){
    const now=Date.now();
    if(now-_lastEnterTime<400){openSearch();_lastEnterTime=0;return;}
    _lastEnterTime=now;
  }
  if(!S.answered&&(k==='1'||k==='2'||k==='3'||k==='4')){
    const btn=document.querySelector('#choices .ch[data-i="'+k+'"]');
    if(btn&&!btn.classList.contains('disabled'))handleChoice(btn);
  }
  if(S.answered&&(k==='Enter'||k==='ArrowRight'))advance();
  if(S.answered&&k==='ArrowLeft')goBack();
});
// Next button
function showNextBtn(){
  const fb=document.getElementById('fb');
  if(!fb)return;
  const old=document.getElementById('nav-btns');
  if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='nav-btns';wrap.className='nav-btns';
  if(S.idx>0){
    const back=document.createElement('button');
    back.className='nav-btn nav-back';
    back.textContent='◀ 前の問題';
    back.onclick=()=>{goBack();};
    wrap.appendChild(back);
  }
  const next=document.createElement('button');
  next.className='nav-btn nav-next';
  next.textContent='次の問題 ▶';
  next.onclick=()=>{advance();};
  wrap.appendChild(next);
  fb.appendChild(wrap);
}

// ═══ AUDIO PLAYBACK ═══
function playAudio(){
  if(S.idx>=EK2Q.length)return;
  const q=getQ();
  if(_audio){_audio.pause();}
  _audio=new Audio(q.af);
  _audio.playbackRate=S.speed;
  const btn=document.getElementById('audio-btn');
  btn.classList.add('playing');
  _audio.onended=()=>btn.classList.remove('playing');
  _audio.onerror=()=>btn.classList.remove('playing');
  _audio.play().catch(()=>btn.classList.remove('playing'));
}

function toggleSpeed(){
  const prev=S.speed;
  if(S.speed===1)S.speed=1.2;
  else if(S.speed===1.2)S.speed=1.3;
  else S.speed=1;
  save();
  const btn=document.getElementById('speed-btn');
  btn.textContent=S.speed===1?'1x':S.speed+'x';
  btn.classList.toggle('fast',S.speed!==1);
  if(_audio)_audio.playbackRate=S.speed;
  playSnd(S.speed>prev?'speedup':'speeddown');
}

// ═══ SCREEN READER ═══
function speakJp(text){
  if(!text)return;
  if(_audio){_audio.pause();}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=1.1;
  window.speechSynthesis.speak(u);
}
let _cachedAlexVoice=null;
window.speechSynthesis.onvoiceschanged=()=>{_cachedAlexVoice=null;};
window.speechSynthesis.getVoices();
function _getAlexVoice(){
  if(_cachedAlexVoice)return _cachedAlexVoice;
  const voices=window.speechSynthesis.getVoices();
  _cachedAlexVoice=voices.find(v=>v.name==='Alex')||voices.find(v=>v.lang.startsWith('en')&&v.localService)||null;
  return _cachedAlexVoice;
}
function speakEn(text){
  if(!text)return;
  if(_audio){_audio.pause();}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=S.speed;
  const v=_getAlexVoice();if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}
function speakEnSentence(){
  if(S.idx>=EK2Q.length)return;
  const q=getQ();
  speakEn(q.cs||q.q);
}

// ═══ DONE ═══
function showDone(){
  document.getElementById('hdr-count').textContent=EK2Q.length+' / '+EK2Q.length;
  document.getElementById('prog-bar').style.width='100%';
  playSnd('correct');
  haptic.confirm();
  document.getElementById('main').innerHTML=
    '<div class="done"><div class="done-emoji">🎉</div>'+
    '<div class="done-title">全問完了！</div>'+
    '<div class="done-sub">正解 '+S.correct+' / 不正解 '+S.wrong+'<br>正答率 '+Math.round(S.correct/(S.correct+S.wrong)*100)+'%</div>'+
    '<button class="done-btn" onclick="resetAll()">もう一度</button></div>';
}
function resetAll(){
  S.idx=0;S.correct=0;S.wrong=0;S.wrongs=[];S.corrects=[];save();
  document.getElementById('main').innerHTML=
    '<div class="card" id="card"><div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>'+
    '<div class="qtimer-wrap"><div class="qtimer-bar" id="qtimer-bar" style="width:100%"></div></div>'+
    '<div class="q-tag" id="q-tag"></div><div class="q-text" id="q-text"></div>'+
    '<div class="choices" id="choices"></div>'+
    '<div class="fb" id="fb" style="display:none"><div class="fb-sentence" id="fb-sentence" onclick="speakEnSentence()" style="cursor:pointer"></div><div class="fb-jp" id="fb-jp" onclick="speakJp(this.textContent)"></div><div class="fb-tip" id="fb-tip" onclick="speakJp(this.innerText)"></div></div></div>';
  render();
}

// ═══ INIT ═══
document.getElementById('btn-shuffle').style.opacity=S.shuffled?'1':'.4';
const _spBtn=document.getElementById('speed-btn');
_spBtn.textContent=S.speed===1?'1x':S.speed+'x';
_spBtn.classList.toggle('fast',S.speed!==1);
if(S.idx>=EK2Q.length)S.idx=0;

</script>
