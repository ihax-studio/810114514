<style>:root {
    --trans-open: 1s cubic-bezier(.6,0,.2,1);
    --trans-close: .8s cubic-bezier(.6,0,.2,1);
    --card-w-pc: 95vw;
    --card-h-pc: 74vh;
    --card-w-mb: 94vw;
    --card-h-mb: 86vh;
    --card-w-mb-horiz: 98vw;
    --card-h-mb-horiz: 70vw;
    --card-max-w: 880px;
    --card-max-h: 950px;
    --style-panel-w: 72vw;
    --style-panel-maxw: 1000px;
    --style-panel-minw: 400px;
}

html,body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg,#ff4e00,#ea38ff,#5ca7ff);
    font-family: "SF Pro Display",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow: hidden;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}

.island-row {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 13px;
    z-index: 101;
    transition: transform 0.5s cubic-bezier(0.45,1.5,0.65,1),opacity 0.3s ease;
}

.island-row.slideup {
    transform: translate(-50%,-90px);
    opacity: 0;
}

.file-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 9px #0002;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.2em;
    border: none;
    outline: none;
    transition: filter 0.2s,opacity 0.25s;
    opacity: 1;
}

.file-btn:active {
    filter: brightness(0.95);
}

.file-btn.hide {
    opacity: 0;
    pointer-events: none;
}

.center-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 110px;
    height: 36px;
    background: #ffffffe6;
    color: #333;
    border-radius: 28px;
    font-size: 1.13rem;
    font-weight: 500;
    box-shadow: 0 2px 18px #0002,0 1px 1.5px #ffd13370;
    cursor: pointer;
    transition: opacity 0.22s cubic-bezier(0.4,2,0.5,1),filter 0.18s cubic-bezier(0.4,2,0.5,1),width 0.28s;
    opacity: 1;
    filter: blur(0);
    border: none;
    outline: none;
    gap: 0;
}

.center-btn.hide {
    opacity: 0;
    pointer-events: none;
    filter: blur(2px);
}

.swipe-outer {
    width: 90vw;
    height: 75px;
    max-width: 550px;
    z-index:10;
    margin: 66px auto 0 auto;
    position: relative;
    overflow: hidden;
    border-radius: 100px;
    background: #00000082;
    box-shadow: inset 1px -1px 11px rgb(0 0 0 / 33%),inset 1px -1px 55px rgb(0 0 0 / 38%),1px -1px 1px #e9e9e9,-1px 1px 1px #d6d6d6e8,0 2px 25px #000b;
    transform: scale(0.8);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.4,2,0.5,1),opacity 0.33s cubic-bezier(0.4,2,0.5,1);
    pointer-events: none;
}

.swipe-outer.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}

.swipe-list {
    display: flex;
    gap: 15px;
    border-radius: 50px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    cursor: grab;
    overflow-x: scroll;
    scroll-behavior: smooth;
    background: transparent;
}

.swipe-list::-webkit-scrollbar {
    display: none;
}

.swipe-item {
    font-size: 18px;
    color: #ffffff;
    opacity: 0.8;
    font-weight: 300;
    text-align: center;
    min-width: 55px;
    line-height: 1px;
    pointer-events: auto;
    letter-spacing: 1.7px;
    position: relative;
    transition: transform 0.7s cubic-bezier(0.5,1.7,0.5,1),color 0.4s ease-out,opacity 0.4s ease-out;
    transform: translateY(-12px) scale(1);
}

.swipe-item.selected {
    color: #ffc63e;
    opacity: 1;
    font-weight: 330;
    transform: translateY(-14px) scale(1.1);
}

.gray-bar {
    position: absolute;
    bottom: -42px;
    left: 50%;
    width: 3px;
    height: 23px;
    border-radius: 2px;
    background: #cbcbcb;
    transform: translateX(-50%);
    transition: opacity 0.2s ease;
    opacity: 1;
}

.swipe-item.selected .gray-bar {
    opacity: 0;
}

.center-bar {
    pointer-events: none;
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    z-index: 10;
    width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.center-bar-dot {
    position: absolute;
    top: 38px;
    left: -2.5px;
    width: 4px;
    height: 13px;
    border-radius: 2.5px;
    background: #ffcd00;
    box-shadow: 0 2px 15px #ffd13377;
    z-index: 20;
    transition: transform 0.5s cubic-bezier(0.4,2,0.5,1);
}

.tap-hint {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffffff;
    font-size: 13px;
    pointer-events: none;
    user-select: none;
}

input[type="file"] {
    display: none;
}

.vertical-space {
    height: 6.2vh;
    flex-shrink: 0;
}

.bottom-space {
    height: 10vh;
    flex-shrink: 0;
}

.center-row {
    flex: 1 0 0;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
}

.card-container {
    width: var(--card-w-pc);
    height: 70vh;
    max-width: var(--card-max-w);
    max-height: 950px;
    min-width: 260px;
    min-height: 280px;
    position: relative;
    transform-style: preserve-3d;
    display: flex;
    justify-content: center;
    align-items: center;
    background: none;
    z-index: 2;
    box-shadow: 0 3px 24px 6px #0002;
    border-radius: 28px;
    margin-top:-33px;
    transition: width var(--trans-close),height var(--trans-close),max-width var(--trans-close),max-height var(--trans-close),transform 1.1s cubic-bezier(.3,0,.2,1),all .88s cubic-bezier(.3,0,.2,1);
    perspective: 1500px;
}

.card-container.rotated {
    transform: rotateY(180deg);
    transition: transform 1s cubic-bezier(.77,0,.18,1);
}

.card-container.style-open {
    transform: translateY(-25vh)!important;
    z-index: 1000;
    transition: transform var(--trans-open);
}

.card-container.landscape {
    width: var(--card-w-mb-horiz)!important;
    height: var(--card-h-mb-horiz)!important;
    transition: width var(--trans-open),height var(--trans-open),max-width var(--trans-open),max-height var(--trans-open),transform 1s cubic-bezier(.5,0,.2,1);
}

@media(max-width: 600px) {
    .card-container {
        width:var(--card-w-mb);
        height: 77vh;
        min-height: 66vw;
        max-width: 100vw;
        max-height: 98vh;
        border-radius: 20px;
        margin-bottom:120px;
    }
    
.dynamic-island.expanded {
    max-width: 308px;
     max-height: 210px;
    border-radius:50px !important;

}
}

@media(min-width: 1500px) {
    .card-container {
        min-width:1460px;
        min-height: 550px;
    }
}

@media(min-width: 1800px) {
    .card-container {
        min-width:1820px;
    }
}

.card {
    width: 100%;
    height: 100%;
    position: absolute;
    border-radius: 24px;
    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);
    background: rgba(255,255,255,0.29);
    backface-visibility: hidden;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    box-shadow: inset -1px -5px 53px rgb(182 161 255/39%),0 12px 48px rgb(0 0 0/10%),0 1px 88px rgb(255 0 243/36%),inset 0 2px 55px rgb(255 255 255/32%),0 0 23px #00000036,inset 0 0 23px #00000026;
    transition: transform 1s cubic-bezier(.5,0,.2,1);
}

.card-front,.card-back {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 5px;
    box-sizing: border-box;
    height: 100%;
    min-height: 0;
}

.card-back {
    transform: rotateY(180deg);
    background: rgb(255 255 255/0%);
}

#editor,#plainInput {
    width: 100%;
    height: 100%;
    flex: 1;
    overflow: hidden;
    box-sizing: border-box;
    font-size: 1em;
    resize: none;
}

#plainInput {
    font-family: "SF Mono","Menlo","Consolas","monospace",sans-serif;
    padding: 15px;
    border: 1px solid #ddd;
    background: #fcfcfc8c;
    color: #222;
    border-radius: 20px;
    box-shadow: 0 0 0 1.5px #ebe5ff;
    transition: box-shadow .25s;
}

#plainInput:focus {
    box-shadow: 0 0 0 2.5px #7b56ff48;
}

iframe#preview {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent!important;
    border-radius: 20px;
    box-shadow: 0 2px 16px 0 #4e4e8e2e;
    transition: margin .7s cubic-bezier(.57,0,.2,1),box-shadow .7s cubic-bezier(.57,0,.2,1);
    margin-bottom: 0;
    z-index: 1;
}

.btn-group,.btn-group * {
    will-change: transform;
}

.btn-group {
    position: absolute;
    bottom: -62px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    transition: bottom .5s,transform .5s;
    display: flex;
    align-items: center;
    width: 90vw;
    max-width: 900px;
    min-width: 260px;
    justify-content: space-between;
}

.card-container.rotated .btn-group {
    transform: translateX(-12vh);
}

.edit-gear-combo {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,.2);
    border-radius: 30px;
    gap: 0;
    box-shadow: inset 1px -1px 11px rgba(255,255,255,.12),inset 1px -1px 55px rgba(255,255,255,.11),1px -1px 1px rgba(255,255,255,.62),-1px 1px 1px rgba(255,255,255,.62),0 2px 18px #00000015;
    padding-left: 4px;
    padding-right: 4px;
    margin-bottom:-11px;
    height: 55px;
    transition: transform .55s cubic-bezier(.6,0,.2,1);
}

.edit-gear-combo:hover {
    transform: scale(1.05);
}

.edit-gear-combo .glass-btn {
    margin: 0 2px;
    border-radius: 26px;
    padding: 10px 14px;
    font-size: 1rem;
    background: none;
    box-shadow: none;
}

.btn-group button,.glass-btn {
    background: rgba(255,255,255,.3);
    border: none;
    border-radius: 55px;
    padding: 19px 4.5px;
    box-shadow: 0 4px 40px 6px rgba(0,15,50,.14),0 1.5px 12px #88b8ff20;
    color: #09304a;
    font-weight: 600;
    font-size: .8rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0 8px;
    cursor: pointer;
    transition: box-shadow .5s,background .5s,color .5s,transform .33s cubic-bezier(.77,0,.18,1);
}

.btn-group button img,.glass-btn img {
    margin-right: 1px;
    vertical-align: middle;
    width: 28px;
    height: 28px;
    transition: transform .2s cubic-bezier(.77,0,.18,1);
}

.btn-group button img:hover,.glass-btn img:hover {
    width: 30px;
    height: 30px;
}

.btn-group button:hover,.btn-group button:focus-visible,.glass-btn:hover,.glass-btn:focus-visible {
    background: rgba(255,255,255,.13);
    box-shadow: inset 1px -1px 1px rgba(207,215,255,.38),inset 1px -1px 5px rgba(255,255,255,.32),1px -1px 1px rgba(246,207,255,.55),0 0 25px #22222233,inset 0 0 25px #00000020;
    color: #fff;
    transform: scale(1.22);
}

#visionSaveBtn {
    display: none;
}

.card-container.rotated #visionSaveBtn {
    display: inline-flex;
}

.style-editor-panel {
    position: fixed;
    right: 0;
    left: 0;
    bottom: -100vh;
    margin: auto;
    width: var(--style-panel-w);
    max-width: 100vh;
    min-width: var(--style-panel-minw);
    height: 60vh;
    background: rgba(255,255,255,.82);
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
    box-shadow: 0 -8px 30px rgba(0,0,0,.25);
    transition: bottom .8s cubic-bezier(.6,0,.2,1),box-shadow .55s cubic-bezier(.5,0,.2,1);
    overflow: hidden;
    z-index: 2000;
    display: flex;
    flex-direction: column;
}

.style-editor-panel.active {
    bottom: 0;
    transition: bottom 1s cubic-bezier(.6,0,.2,1),box-shadow .55s cubic-bezier(.5,0,.2,1);
}

#styleEditor {
    flex: 1;
    width: 100%;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    overflow: hidden;
}

.style-close-btn {
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(8px);
    position: absolute;
    bottom: 16px;
    left: 50%;
    box-shadow: inset 0 1px 3px rgba(255,255,255,.8),inset -1px 1px 8px rgba(254,34,255,.35),inset -1px -1px 3px rgba(255,255,255,.8),inset 0 2px 4px rgba(253,0,255,.13),inset 3px 2px 3px rgba(255,73,58,.25),inset -1px -3px 3px rgba(86,193,255,.67);
    border: solid 1px #fff;
    text-shadow: 0 0 12px #fff;
    padding: 10px 21px;
    border-radius: 50%;
    transform: translateX(-50%);
    background: none;
    font-size: 30px;
    font-weight: 1;
    cursor: pointer;
    z-index: 2100;
    font-family: "SF Pro Display","SF Pro Text","SF Pro Icons","SF Pro Rounded","SF Compact","SF Compact Text","San Francisco",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding-bottom: 14px;
}

.dynamic-island {
    background: #e8e8e800;
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    left: 50%;
    top: 80vh;
    transform: translate(-50%,0);
    width: 57px;
    height: 48px;
    border-radius: 50px;
    transition: width 0.66s cubic-bezier(.67,.04,.29,1.33),height 0.88s cubic-bezier(.67,.04,.29,1.33),border-radius 0.7s cubic-bezier(.67,.04,.29,1.33),box-shadow 0.32s,background 0.5s ease,transform 0.8s cubic-bezier(.6,-0.2,.2,1.3), opacity .5s;
    cursor: pointer;
    overflow: visible;
    z-index: 1;
}

.dynamic-island.expanded {
        z-index: 5001; 
        backdrop-filter: blur(3px);
    box-shadow: inset 1px -10px 11px rgb(255 255 255 / 12%),inset 1px -1px 55px rgb(255 255 255 / 11%),1px -2px 2px rgb(255 255 255 / 62%),-1px 2px 1px rgb(255 255 255 / 62%),0 2px 18px #00000015;
        background: #e8e8e873;
    width: 320px;
    height: 220px;
    border-radius: 55px;
    transform: translate(-50%,-50%) scale(1.23);
}

.dynamic-island.slider-active {
    width: 310px;
            z-index: 5001; 
    height: 64px;
    border-radius: 36px;
    background: transparent;
    box-shadow: none;
    transform-origin: 50% 50%;
    transform: translateX(-50%) scale(1);
    transition: width 0.5s cubic-bezier(.62,0,.4,1),height 0.5s cubic-bezier(.62,0,.4,1),border-radius 0.5s cubic-bezier(.62,0,.4,1),background 0.5s,transform 0.8s;
}

.island-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    grid-template-rows: repeat(2,1fr);
    width: 310px;
    height: 212px;
    opacity: 0;
    pointer-events: none;
    z-index: 3;
    position: absolute;
    left: 51%;
    top: 52%;
    transform: translate(-50%,-50%);
    transition: opacity 0.31s;
}

.dynamic-island.expanded .island-grid {
    opacity: 1;
    pointer-events: auto;
    transition-delay: 0.23s;
}

.dynamic-island.slider-active .island-grid {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
}

.island-btn {
    background: #ffffff33;
    width: 94px;
    height: 94px;
    border-radius: 50%;
        box-shadow: inset 1px -10px 11px rgb(255 255 255 / 12%),inset 1px -1px 55px rgb(255 255 255 / 11%),1px -2px 2px rgb(255 255 255 / 62%),-1px 2px 1px rgb(255 255 255 / 62%),0 2px 18px #00000015;
    border: none;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.33s ease;
    cursor: pointer;
    user-select: none;
    outline: none;
    font-family: "SF Pro Display","SF Pro Text","SF Pro Icons","SF Pro Rounded","SF Compact","SF Compact Text","San Francisco",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

.island-btn:active {
    transform: scale(1.15);
    background: #ffffff33;
    box-shadow: inset 2px 5px 2px rgb(110 213 255 / 13%),inset -1px -5px 3px rgb(247 127 255 / 35%),0 1px 88px rgb(255 139 250 / 55%),inset 0 2px 5px rgb(14 197 255 / 57%);
}

.slider-wrapper {
    position: absolute;
    width: 310px;
    height: 64px;
    z-index: 2;
    transform: scale(1);
    will-change: transform;
    transition: opacity 0.5s cubic-bezier(.62,0,.4,1);
    opacity: 0;
    pointer-events: none;
}

.dynamic-island.slider-active .slider-wrapper {
    opacity: 1;
    pointer-events: auto;
    transition-delay: 0.5s;
}

.slider-track {
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    box-shadow: inset 1px -1px 11px rgb(255 255 255 / 12%),inset 1px -1px 55px rgb(255 255 255 / 11%),1px -1px 1px rgb(243 243 243 / 62%),-1px 1px 1px rgb(225 225 225 / 62%),0 2px 18px #0000000d;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 64px;
    background: rgb(60 60 60 / 0%);
    border-radius: 36px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: visible;
}

.slider-inner-track {
    position: absolute;
    top: 0;
    left: -5px;
    height: 64px;
    border-radius: 36px;
    z-index: 1;
    transform: scale(0.9);
    transition: width 0.13s;
    pointer-events: none;
}

.slider-label {
    position: absolute;
    left: 88px;
    top: 0;
    height: 64px;
    line-height: 64px;
    color: #fff;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 1px;
    z-index: 2;
    opacity: 0.83;
    transition: opacity 0.2s;
    user-select: none;
    pointer-events: none;
    text-shadow: 0 2px 10px #000b;
}

.slider-knob {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 56px;
    height: 56px;
    background: #ffffff8c;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 33px;
    font-weight: bold;
    z-index: 10;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border: none;
    outline: none;
    box-shadow: 1px -1px 1px rgb(255 255 255 / 62%),-1px 1px 1px rgb(255 255 255 / 62%),0 2px 18px #00000015;
    will-change: box-shadow,left,background;
    cursor: pointer;
    user-select: none;
    transition: background 0.5s cubic-bezier(.62,0,.4,1),box-shadow 0.5s cubic-bezier(.62,0,.4,1),left 0.5s cubic-bezier(.62,0,.4,1);
}

.slider-knob:active {
    background: #ebebeb5c;
    box-shadow: 1px 1px 1px rgb(255 255 255 / 62%),-1px -1px 1px rgb(255 255 255 / 62%);
}

.slider-arrow-polyline {
    transition: stroke 0.3s cubic-bezier(.62,0,.4,1),stroke-width 0.3s cubic-bezier(.62,0,.4,1),filter 0.3s cubic-bezier(.62,0,.4,1);
}

.slider-knob.active .slider-arrow-polyline {
    stroke: #1552be;
    stroke-width: 3.2;
    filter: drop-shadow(0 0 7px #2579F7);
}

.slider-knob:not(.active) .slider-arrow-polyline {
    stroke: #2579F7;
    stroke-width: 2.6;
    filter: none;
}



.btn-img {
    width: 70%;
    height: 70%;
    object-fit: contain;
    pointer-events: none;
}



.dynamic-island:not(.expanded):not(.slider-active) .gear-label {
    opacity: 1;
}

.dynamic-island.slider-active .gear-label {
    opacity: 0;
    pointer-events: none;
}





/* === フルスクリーン＆UI最前面化のための追加スタイル === */
:root {
    --card-w-pc: 100vw;
    --card-h-pc: 100vh;
    --card-max-w: 100vw;
    --card-max-h: 100vh;
    --card-w-mb: 100vw;
    --card-h-mb: 100vh;
    --card-w-mb-horiz: 100vw;
    --card-h-mb-horiz: 100vh;
}

html, body {
    overflow: hidden; /* 画面スクロールを防ぐ */
}

/* カードコンテナを画面いっぱいに */
.card-container {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    border-radius: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    max-height: none !important;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
}

.card {
    border-radius: 0 !important;
    border: none !important;
}

iframe#preview, #editor, #plainInput {
    border-radius: 0 !important;
}

/* Dockボタン類をカードの外（最前面）に配置し直すための調整 */
.btn-group {
    position: fixed !important;
    bottom: 40px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    z-index: 1500;
}

.btn-group.rotated #visionSaveBtn {
    display: inline-flex;
}

.island-row { z-index: 1500; }
.dynamic-island { z-index: 2000; }
.dynamic-island.expanded { z-index: 5001; }
#blackOverlay { z-index: 1800; }
.style-editor-panel { z-index: 3000; }

/* === 新規：検索ウィンドウのスタイル === */
.search-overlay {
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
    z-index: 6000; transition: top 0.4s cubic-bezier(0.4, 2, 0.5, 1);
    background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    padding: 12px 20px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex; gap: 10px; align-items: center; border: 1px solid rgba(255,255,255,0.5);
}
.search-overlay.active { top: 80px; }
.search-overlay input {
    border: none; background: rgba(0,0,0,0.05); padding: 10px 18px; border-radius: 20px;
    outline: none; font-size: 16px; width: 200px; font-family: inherit;
}
.search-overlay input:focus { background: rgba(0,0,0,0.1); }
.search-overlay #searchNextBtn {
    border: none; background: #007aff; color: #fff; padding: 10px 18px;
    border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 15px;
    transition: transform 0.2s, background 0.2s;
}
.search-overlay #searchNextBtn:active { transform: scale(0.95); background: #005bb5; }
.search-overlay #searchCloseBtn {
    border: none; background: #ff3b30; color: #fff; border-radius: 50%; width: 34px; height: 34px;
    padding: 0; display:flex; align-items:center; justify-content:center; font-size: 18px; cursor: pointer;
    transition: transform 0.2s; font-weight: bold;
}
.search-overlay #searchCloseBtn:active { transform: scale(0.9); }

<script type="module">
let haptic={fire:()=>{},confirm:()=>{},error:()=>{},ultraBurst:()=>{},staggered:()=>{},evenBurst:()=>{},toggle:()=>{}};
(async()=>{
  const isApple=/(iPhone|iPad|iPod|Macintosh|Apple)/.test(navigator.userAgent)||navigator.userAgent.includes('Vision');
  if(isApple){
    try{
      const mod=await import('https://esm.sh/ios-haptics');
      haptic.fire=()=>mod.haptic(); haptic.confirm=()=>mod.haptic.confirm(); haptic.error=()=>mod.haptic.error();
      haptic.ultraBurst=()=>{for(let i=0;i<5;i++)setTimeout(()=>mod.haptic.error(),i*30)};
      haptic.staggered=()=>{mod.haptic.error();for(let i=0;i<6;i++)setTimeout(()=>mod.haptic.error(),1000+i*40)};
      haptic.evenBurst=()=>{for(let i=0;i<5;i++)setTimeout(()=>mod.haptic.error(),i*200)};
      haptic.toggle=()=>mod.haptic.confirm();
    }catch(e){}
  }
})();

// visionOS検出
(function(){
  const ua=navigator.userAgent;
  const isVisionOS=ua.toLowerCase().includes("vision")||/visionos/i.test(ua);
  if(isVisionOS) document.body.classList.add("visionos");

let swipeOuter=document.getElementById("swipeOuter"),swipeList=document.getElementById("swipe-list"),centerBtn=document.getElementById("centerBtn"),fileBtn=document.getElementById("fileBtn"),fileInput=document.getElementById("fileInput"),islandRow=document.getElementById("islandRow"),centerBarDot=document.getElementById("center-bar-dot"),visionSaveBtn=document.getElementById("visionSaveBtn"),cardContainer=document.getElementById("cardContainer"),btnGroup=document.getElementById("btnGroup");
let swipeItems=Array.from(swipeList.querySelectorAll(".swipe-item"));
let lastExt='html',isDragging=false,dragStartX=0,dragScroll=0,snapTimer=null,ticking=false,knownExt=['html','css','tsx','js','json','py','swift','plist','xml','txt','text','php'],keyMap={h:'html',c:'css',j:'js',o:'json',p:'py',l:'plist',m:'html',s:'swift',x:'xml',t:'txt'};

function getClosestIndex(){let c=swipeOuter.getBoundingClientRect().left+swipeOuter.offsetWidth/2,idx=0,d=1e9;swipeItems.forEach((item,i)=>{let r=item.getBoundingClientRect(),ic=r.left+r.width/2,dis=Math.abs(c-ic);if(dis<d){idx=i;d=dis;}});return idx;}
function updateSwipeSelected(){let i=getClosestIndex();swipeItems.forEach((item,j)=>{item.classList.toggle('selected',j===i);});moveCenterBar(i);}
function scrollToSwipe(idx,behavior='smooth'){let item=swipeItems[idx];if(!item)return;let c=swipeOuter.offsetWidth/2,s=item.offsetLeft+(item.offsetWidth/2)-c;swipeList.scrollTo({left:s,behavior});}
function moveCenterBar(idx){let item=swipeItems[idx];if(!item)return;let ir=item.getBoundingClientRect(),or=swipeOuter.getBoundingClientRect(),off=(ir.left+ir.width/2)-(or.left+or.width/2);centerBarDot.style.transform=`translateX(${off}px)`;}
function debounceSnap(){clearTimeout(snapTimer);snapTimer=setTimeout(()=>{let i=getClosestIndex();scrollToSwipe(i);},150);}
function setupSwipePadding(){if(swipeItems.length===0)return;let f=swipeItems[0],l=swipeItems[swipeItems.length-1],w=swipeOuter.offsetWidth,pl=(w-f.offsetWidth)/2,pr=(w-l.offsetWidth)/2;swipeList.style.padding=`38px ${pr}px 50px ${pl}px`;}
function handleSwipeDragStart(e){isDragging=true;swipeList.style.cursor='grabbing';swipeList.style.scrollBehavior='auto';dragStartX=(e.touches?e.touches[0].pageX:e.pageX)-swipeList.offsetLeft;dragScroll=swipeList.scrollLeft;clearTimeout(snapTimer);}
function handleSwipeDragMove(e){if(!isDragging)return;e.preventDefault();let x=(e.touches?e.touches[0].pageX:e.pageX)-swipeList.offsetLeft,walk=x-dragStartX;swipeList.scrollLeft=dragScroll-walk;}
function handleSwipeDragEnd(){if(!isDragging)return;isDragging=false;swipeList.style.cursor='grab';swipeList.style.scrollBehavior='smooth';debounceSnap();}
function handleSwipeScroll(){if(!ticking){window.requestAnimationFrame(()=>{updateSwipeSelected();ticking=false;});ticking=true;}if(!isDragging){debounceSnap();}}
function showSwipeSelector(){centerBtn.classList.add('hide');fileBtn.classList.add('hide');setTimeout(()=>{islandRow.classList.add('slideup');setTimeout(()=>{swipeOuter.classList.add('active');setTimeout(()=>{setupSwipePadding();let ci=swipeItems.findIndex(i=>i.textContent.toLowerCase().includes(lastExt));scrollToSwipe(ci>-1?ci:0,'auto');setTimeout(updateSwipeSelected,120);},25);},290);},170);}
function closeSwipeSetExt(ext){swipeOuter.classList.remove('active');setTimeout(()=>{islandRow.classList.remove('slideup');lastExt=ext.toLowerCase();centerBtn.textContent=ext;fileBtn.classList.remove('hide');centerBtn.classList.remove('hide');setMonacoLanguage(ext.toLowerCase());},340);}
function setMonacoLanguage(ext){if(!window.editorInstance)return;let l={html:'html',css:'css',js:'javascript',json:'json',py:'python',swift:'swift',plist:'xml',xml:'xml',tsx:'typescript',txt:'plaintext',text:'plaintext',php:'php'}[ext]||'plaintext';let val=window.editorInstance.getValue();monaco.editor.setModelLanguage(window.editorInstance.getModel(),l);if(val)window.editorInstance.setValue(val);}

swipeList.addEventListener('mousedown',handleSwipeDragStart);swipeList.addEventListener('mousemove',handleSwipeDragMove);document.addEventListener('mouseup',handleSwipeDragEnd);swipeList.addEventListener('mouseleave',handleSwipeDragEnd);swipeList.addEventListener('touchstart',handleSwipeDragStart,{passive:true});swipeList.addEventListener('touchmove',handleSwipeDragMove,{passive:false});swipeList.addEventListener('touchend',handleSwipeDragEnd);swipeList.addEventListener('scroll',handleSwipeScroll);window.addEventListener('resize',()=>{setupSwipePadding();let i=getClosestIndex();scrollToSwipe(i,'auto');moveCenterBar(i);});
centerBtn.addEventListener('click',showSwipeSelector);
fileBtn.addEventListener('click',()=>{fileInput.value='';fileInput.click();});
fileInput.addEventListener('change',function(){if(!this.files||!this.files[0])return;let n=this.files[0].name,m=n.match(/\.([^.]+)$/),ext=m?m[1].toLowerCase():'';if(knownExt.includes(ext)){lastExt=ext;centerBtn.textContent=ext;setMonacoLanguage(ext);}else{centerBtn.textContent='File';}});
window.addEventListener('DOMContentLoaded',()=>{swipeOuter.classList.remove('active');setupSwipePadding();centerBtn.textContent=lastExt;});
swipeList.addEventListener('click',function(e){let item=e.target.closest('.swipe-item');let idx=-1;if(item)idx=swipeItems.indexOf(item);if(idx<0)idx=getClosestIndex();let ext=swipeItems[idx].textContent.replace(/[\(\)\.]/g,'').replace(/[^a-zA-Z]/g,'').toLowerCase();if(ext==='ch')ext='c';closeSwipeSetExt(ext);haptic.confirm();setMonacoLanguage(ext);});
swipeOuter.addEventListener('click',function(e){if(e.target===swipeOuter){let idx=getClosestIndex(),ext=swipeItems[idx].textContent.replace(/[\(\)\.]/g,'').replace(/[^a-zA-Z]/g,'').toLowerCase();if(ext==='ch')ext='c';closeSwipeSetExt(ext);haptic.confirm();setMonacoLanguage(ext);}});
document.addEventListener('keydown',function(e){if(!swipeOuter.classList.contains('active'))return;if(e.key==='Enter'||e.key==='Return'){let idx=getClosestIndex();let ext=swipeItems[idx].textContent.replace(/[\(\)\.]/g,'').replace(/[^a-zA-Z]/g,'').toLowerCase();if(ext==='ch')ext='c';closeSwipeSetExt(ext);haptic.confirm();setMonacoLanguage(ext);}});

let editorInstance,styleEditorInstance;
let isRotated=false,plainInputMode=false,isSelectMode=false;
let htmlContent="<html>\n<head></head>\n<body>\n  <h1 style=\"color:blue;\">Hello</h1>\n</body>\n</html>";
let cssContent="body { font-family: sans-serif; padding: 20px; }";

const preview=document.getElementById("preview"),stylePanel=document.getElementById("stylePanel"),plainInput=document.getElementById("plainInput"),closeStyleBtn=document.getElementById("closeStyleBtn"),visionEditBtn=document.getElementById("visionEditBtn"),visionGearBtn=document.getElementById("visionGearBtn"),visionShareBtn=document.getElementById("visionShareBtn"),editIcon=document.getElementById("editIcon");
const gearIcon=document.getElementById("gearIcon"),selectModeIcon=document.getElementById("selectModeIcon");

require.config({paths:{'vs':'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'}});
require(["vs/editor/editor.main"],()=>{
  editorInstance=monaco.editor.create(document.getElementById("editor"),{value:htmlContent,language:"html",theme:"vs-dark",automaticLayout:true,minimap:{enabled:false},scrollbar:{vertical:'hidden',horizontal:'hidden'}});
  styleEditorInstance=monaco.editor.create(document.getElementById("styleEditor"),{value:cssContent,language:"css",theme:"vs-light",automaticLayout:true,minimap:{enabled:false},scrollbar:{vertical:'hidden',horizontal:'hidden'}});
  editorInstance.onDidChangeModelContent(updatePreview);
  styleEditorInstance.onDidChangeModelContent(updatePreview);
  plainInput.value=htmlContent;
  plainInput.addEventListener("input",()=>{htmlContent=plainInput.value;editorInstance.setValue(htmlContent);updatePreview()});
  updatePreview();
  window.editorInstance=editorInstance;
});

function getPreviewContent(){
  const val=plainInputMode?plainInput.value:editorInstance?editorInstance.getValue():htmlContent;
  const styleBlock="<style>\n"+(styleEditorInstance?styleEditorInstance.getValue():"")+"\n</style>";
  let content = val.replace(/<\/head>/,styleBlock+"\n</head>").replace(/<body([^>]*)>/,'<body$1 style="background:none!important;">');
  
  if(isSelectMode && !isRotated) {
    const injectScript = `
    <script>
      document.addEventListener('click', function(e) {
        e.preventDefault(); e.stopPropagation();
        const clone = e.target.cloneNode(false);
        const outer = clone.outerHTML;
        const startTag = outer.substring(0, outer.indexOf('>') + 1);
        window.parent.postMessage({type: 'elementSelected', searchStr: startTag}, '*');
      }, true);
      const style = document.createElement('style');
      style.innerHTML = '*:hover { outline: 2px solid #ffcd00 !important; cursor: pointer !important; transition: outline 0.1s; }';
      document.head.appendChild(style);
    <\/script>
    `;
    content = content.replace(/<\/body>/, injectScript + "\n</body>");
  }
  return content;
}
function updatePreview(){preview.srcdoc=getPreviewContent()}

function setRotationState(rotated){
  isRotated=rotated;
  cardContainer.classList.toggle("rotated",isRotated);
  btnGroup.classList.toggle("rotated",isRotated); // Dockの表示制御用
  
  if(isRotated){
    editIcon.src="check.png"; editIcon.alt="完了";
    visionSaveBtn.style.display="inline-flex";
    gearIcon.style.display="inline";
    selectModeIcon.style.display="none";
  }else{
    editIcon.src="edit.png"; editIcon.alt="編集";
    visionSaveBtn.style.display="none";
    gearIcon.style.display="none";
    selectModeIcon.style.display="inline-block";
    isSelectMode=false;
    selectModeIcon.style.color="#09304a";
  }
  updatePreview();
}

visionEditBtn.addEventListener("click",()=>{haptic.fire();setRotationState(!isRotated)});

visionGearBtn.addEventListener("click",()=>{
  haptic.confirm();
  if(isRotated){
    const island=document.getElementById("island");
    island.style.display="";
    setTimeout(()=>{island.classList.add("expanded");},10);
    document.getElementById("blackOverlay").classList.add("active");
  } else {
    isSelectMode = !isSelectMode;
    selectModeIcon.style.color = isSelectMode ? "#ff4e00" : "#09304a";
    updatePreview();
  }
});

// 要素選択時の動作
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'elementSelected') {
    const searchStr = event.data.searchStr;
    isSelectMode = false; selectModeIcon.style.color = "#09304a";
    setRotationState(true);
    setTimeout(() => {
      if(!plainInputMode && editorInstance) {
        const model = editorInstance.getModel();
        const matches = model.findMatches(searchStr, false, false, false, null, true);
        if (matches && matches.length > 0) {
          const match = matches[0];
          editorInstance.revealLineInCenter(match.range.startLineNumber);
          editorInstance.setPosition({ lineNumber: match.range.startLineNumber, column: match.range.startColumn });
          editorInstance.focus();
        }
      }
    }, 800);
  }
});

// ドラッグ＆ドロップ対応
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    const file = e.dataTransfer.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      htmlContent = ev.target.result;
      if (plainInputMode) { plainInput.value = htmlContent; plainInput.dispatchEvent(new Event("input")); } 
      else { editorInstance.setValue(htmlContent); }
      const ext = file.name.split('.').pop().toLowerCase();
      if(knownExt.includes(ext)) closeSwipeSetExt(ext);
      updatePreview();
    };
    reader.readAsText(file, "utf-8");
  }
});

visionShareBtn.addEventListener("click",async()=>{
  haptic.confirm();
  let code=editorInstance?editorInstance.getValue():"";
  if(!!navigator.share){
    try{ await navigator.share({title:"Vision UIカード",text:code,url:location.href}); }catch{}
  }else{
    let ta=document.createElement("textarea");ta.value=code;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");document.body.removeChild(ta);
    alert("コードをコピーしました。");
  }
});

function showSwipeSelectorForSave(){
  showSwipeSelector();
  function onSelectExtForSave(ext){
    if(!ext) return;
    let filename=prompt("保存するファイル名", "untitled");
    if(!filename) return;
    const code=editorInstance?editorInstance.getValue():"";
    let type="text/plain";
    if(ext==="html")type="text/html"; else if(ext==="css")type="text/css"; else if(ext==="js")type="text/javascript"; else if(ext==="json")type="application/json"; else if(ext==="xml")type="application/xml"; else if(ext==="py")type="text/x-python"; else if(ext==="swift")type="text/swift"; else if(ext==="plist")type="application/xml"; else if(ext==="tsx")type="text/typescript-jsx"; else if(ext==="php")type="application/x-httpd-php";
    const a=document.createElement("a");
    const blob=new Blob([code],{type});
    a.href=URL.createObjectURL(blob);
    a.download=filename+"."+ext;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    closeSwipeSetExt(ext);
  }
  const handler=function(e){
    let item=e.target.closest('.swipe-item');let idx=-1;
    if(item)idx=swipeItems.indexOf(item);
    if(idx<0)idx=getClosestIndex();
    let ext=swipeItems[idx].textContent.replace(/[\(\)\.]/g,'').replace(/[^a-zA-Z]/g,'').toLowerCase();
    if(ext==='ch')ext='c';
    e.preventDefault();
    swipeList.removeEventListener('click',handler);
    document.removeEventListener('keydown',keyHandler);
    onSelectExtForSave(ext);
  };
  const keyHandler=function(e){
    if(e.key==='Enter'||e.key==='Return'){
      let idx=getClosestIndex();
      let ext=swipeItems[idx].textContent.replace(/[\(\)\.]/g,'').replace(/[^a-zA-Z]/g,'').toLowerCase();
      if(ext==='ch')ext='c';
      swipeList.removeEventListener('click',handler);
      document.removeEventListener('keydown',keyHandler);
      onSelectExtForSave(ext);
    }
  }
  swipeList.addEventListener('click',handler);
  document.addEventListener('keydown',keyHandler);
}
visionSaveBtn.addEventListener("click",()=>{haptic.ultraBurst();showSwipeSelectorForSave()});

const diIsland=document.getElementById("island"), diOverlay=document.getElementById("blackOverlay");
const diBackBtn=document.getElementById("diBackBtn"), diCBtn=document.getElementById("diCBtn"), diBBtn=document.getElementById("diBBtn"), diEBtn=document.getElementById("diEBtn"), diFBtn=document.getElementById("diFBtn"), diSearchBtn=document.getElementById("diSearchBtn");

      document.getElementById("editor").style.display = "block";
      plainInput.style.display = "none";
      if(editorInstance) editorInstance.setValue(plainInput.value);
    }
    updatePreview();
  },350);
});

// === 検索関連の機能 ===
const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchNextBtn = document.getElementById("searchNextBtn");
const searchCloseBtn = document.getElementById("searchCloseBtn");
let searchIndex = 0;
let lastSearchStr = "";

diSearchBtn.addEventListener("click", e => {
  haptic.ultraBurst(); e.stopPropagation(); closeIsland();
  setTimeout(() => { searchOverlay.classList.add("active"); searchInput.focus(); }, 350);
});

searchCloseBtn.addEventListener("click", () => searchOverlay.classList.remove("active"));

function performSearch() {
  const str = searchInput.value;
  if(!str) return;
  if(str !== lastSearchStr) { searchIndex = 0; lastSearchStr = str; }
  
  if(!isRotated) setRotationState(true);
  
  setTimeout(() => {
    if(!plainInputMode && editorInstance) {
      const model = editorInstance.getModel();
      const matches = model.findMatches(str, false, false, false, null, true);
      if(matches && matches.length > 0) {
        const match = matches[searchIndex % matches.length];
        editorInstance.revealLineInCenter(match.range.startLineNumber);
        editorInstance.setSelection(match.range);
        editorInstance.focus();
        searchIndex++;
      } else {
        alert("見つかりませんでした");
      }
    } else if(plainInputMode) {
      const text = plainInput.value;
      const idx = text.indexOf(str, searchIndex);
      if(idx !== -1) {
        plainInput.focus();
        plainInput.setSelectionRange(idx, idx + str.length);
        searchIndex = idx + str.length;
      } else {
        searchIndex = 0;
        alert("見つかりませんでした");
      }
    }
  }, isRotated ? 50 : 800);
}

searchNextBtn.addEventListener("click", performSearch);
searchInput.addEventListener("keydown", e => { if(e.key === 'Enter') performSearch(); });

closeStyleBtn.addEventListener("click",()=>{stylePanel.classList.remove("active");cardContainer.classList.remove("style-open");});

let expanded=false;
diIsland.addEventListener("click",()=>{expanded=!expanded; diIsland.classList.toggle("expanded",expanded);});

</script>
</body>
