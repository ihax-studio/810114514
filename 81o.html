
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vision UI Card Editor with Dock</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <style>
    :root {
      --rubikcube-mac-ease: cubic-bezier(.5, 0, .2, 1);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #ff4e00, #ea38ff, #5ca7ff);
      font-family: sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
      height: 100vh;
    }
    .vertical-space {
      height: 10vh;
      flex-shrink: 0;
      pointer-events: none;
      user-select: none;
    }
    .bottom-space {
      height: 15vh;
      flex-shrink: 0;
      pointer-events: none;
      user-select: none;
    }
    .center-row {
      flex: 1 0 0;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }
    .card-container {
      width: 92vw;
      max-width: 900px;
      height: 65vh;
      min-height: 320px;
      max-height: 850px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(.77,0,.18,1);
      display: flex;
      justify-content: center;
      align-items: center;
      background: none;
      z-index: 2;
    }
    .card {
      width: 100%;
      height: 100%;
      position: absolute;
      border-radius: 24px;
      backdrop-filter: blur(20px);
      background: rgb(255 255 255 / 29%);
      backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .card-front, .card-back {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5px;
      box-sizing: border-box;
      height: 100%;
      min-height: 0;
    }
    .card-back {
      transform: rotateY(180deg);
      background: rgb(255 255 255);
      justify-content: flex-end;
      align-items: stretch;
    }
    .rotated {
      transform: rotateY(180deg);
    }
    #editor, #plainInput {
      width: 100%;
      height: 100%;
      min-height: 0;
      flex: 1;
      box-sizing: border-box;
      font-size: 1em;
    }
    #plainInput {
      font-family: "SF Mono", "Menlo", "Consolas", "monospace", sans-serif;
      padding: 15px;
      border: 1px solid #bbb;
      background: #fff;
      color: #222;
      resize: none;
      outline: none;
      border-radius: 12px;
      transition: box-shadow 0.25s;
    }
    #plainInput:focus {
      box-shadow: 0 0 0 2px #7b56ff44;
    }
    iframe#preview {
      width: 100%;
      height: 100%;
      border: none;
      background: none !important;
      background-color: transparent !important;
      border-radius: 20px;
    }
    .btn-group {
      position: absolute;
      bottom: -60px;
      left: 50%;
      display: flex;
      gap: 12px;
      transform: translateX(-50%);
      z-index: 2;
    }
    button {
      padding: 12px 24px;
      font-size: 1em;
      border-radius: 30px;
      border: none;
      background: rgb(255 255 255 / 22%);
      color: white;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.45);
    }
    .style-editor-panel {
      position: fixed;
      right: 0;
      bottom: -100vh;
      width: 50vw;
      height: 66vh;
      background: rgb(255 255 255 / 22%);
      backdrop-filter: blur(12px);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.3);
      transition: bottom 0.7s var(--rubikcube-mac-ease),box-shadow 0.55s var(--rubikcube-mac-ease);
      overflow: hidden;
      z-index: 999;
      display: flex;
      flex-direction: column;
    }
    .style-editor-panel.active {
      bottom: 0;
    }
    #styleEditor {
      flex: 1;
    }
    .close-style {
      border: none;
      background: #aba5ff;
      color: white;
      font-size: 20px;
      border:solid 1px white;
      font-weight:1;
      padding: 10px 17px;
      border-radius: 50%;
      align-self: center;
      margin: 10px 0;
      cursor: pointer;
    }
    .close-style:hover {
      background: rgba(0,0,0,0.6);
    }
    #dock-overlay {
      width: 100%;
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s;
      opacity: 1;
    }
    .dock {
      background-color: #222c;
      box-shadow: 1px 1px 8px rgb(0 0 0 / 30%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      gap: 6px;
      margin-bottom: 10px;
      pointer-events: auto;
      transition: background 0.3s;
      backdrop-filter: blur(15px);
      min-width: 220px;
    }
    .dock button {
      box-shadow: 1px 1px 11px rgb(0 0 0 / 2%);
      background-color: #000000c9;
      color: #ffffff;
      padding: 11px 22px;
      margin: 3px;
      border: none;
      cursor: pointer;
      border-radius: 36px;
      box-shadow: inset 5px 3px 11px rgb(255 255 255 / 1%);
      transition: all 0.3s;
      flex: 1;
      font-size: 1em;
      pointer-events: auto;
    }
    .dock button:hover {
      background-color: #363636c9;
      transform:scale(1.05);
    }
    #settingsOverlay {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 60px;
      background-color: #e2e2e2e3;
      padding: 17px 14px 14px 14px;
      border-radius: 25px;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.16);
      width: 240px;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.22s ease;
      pointer-events: auto;
      z-index: 100;
      transform: translateX(-50%) translateY(30px);
    }
    #settingsOverlay.show {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0px);
    }
    .settings-content {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .settings-content button {
      margin-bottom: 12px;
      flex: 1;
      padding: 11px 0;
      font-size: 1em;
      background: #4933b1;
      color: #fff;
      border-radius: 18px;
      border: none;
    }
    .settings-content button:hover {
      background: #6e57e6;
    }
    #selectInput {
      width: 100%;
      font-size: 1em;
      border-radius: 10px;
      border: 1px solid #aaa;
      padding: 8px 10px;
      margin-bottom: 10px;
      box-sizing: border-box;
      outline: none;
      display: none;
    }
    .switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 0 0;
      width: 100%;
      justify-content: space-between;
    }
    .label-text {
      color: #222;
      font-size: 16px;
      white-space: nowrap;
      font-weight: 500;
    }
    .toggle-switch {
      display: inline-block;
      width: 50px;
      height: 28px;
      background: #bbb;
      border-radius: 16px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      vertical-align: middle;
    }
    .toggle-switch input {
      display: none;
    }
    .toggle-slider {
      position: absolute;
      top: 2.5px;
      left: 3px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.23s, background 0.3s;
    }
    .toggle-switch input:checked + .toggle-slider {
      left: 24px;
      background: #6fff8a;
    }
    .toggle-switch input:checked ~ .toggle-switch {
      background: #6fff8a;
    }
    @media (max-width: 600px) {
      .card-container {
        height: 65vw;
        min-height: 220px;
        max-height: 80vw;
      }
      .style-editor-panel {
        width: 99vw;
        border-radius: 16px 16px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="vertical-space"></div>
  <div class="center-row">
    <div class="card-container" id="cardContainer">
      <div class="card card-front">
        <iframe id="preview" title="Preview"></iframe>
      </div>
      <div class="card card-back">
        <div id="editor"></div>
        <textarea id="plainInput" style="display:none;" placeholder="HTMLを入力"></textarea>
        <div id="dock-overlay">
          <div class="dock">
            <button id="saveBtn">保存</button>
            <button id="loadBtn">読み込み</button>
            <button id="settingsBtn">編集</button>
          </div>
          <div id="settingsOverlay">
            <div class="settings-content" id="settingsContent">
              <button id="copyBtn">コピー</button>
              <button id="pasteBtn">ペースト</button>
              <button id="selectBtn">選択</button>
              <input type="text" id="selectInput" readonly>
              <button id="undoBtn" style="background:#e74c3c;">取り消す</button>
              <div class="switch-row">
                <span class="label-text">選択</span>
                <label class="toggle-switch">
                  <input type="checkbox" id="togglePlain">
                  <span class="toggle-slider"></span>
                </label>
              </div>
              <button id="doneBtn" style="margin-top:8px; background:#aaa4ff;">完了</button>
            </div>
          </div>
        </div>
      </div>
      <div class="btn-group">
        <button id="rotateBtn">回転</button>
        <button id="styleBtn">スタイル</button>
      </div>
    </div>
  </div>
  <div class="bottom-space"></div>
  <div class="style-editor-panel" id="stylePanel">
    <div id="styleEditor"></div>
    <button class="close-style" id="closeStyle">✖</button>
  </div>
  <input type="file" id="fileInput" accept=".html,.txt,.htm" style="display:none;">
  <script>
    let editorInstance;
    let styleEditorInstance;
    let isRotated = false;
    let htmlContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>タブに表示されるタイトル</title>
  <link rel="stylesheet" href="スタイル.css">
</head>
<body>
  <h1>Hello World</h1>
</body>
</html>`;
    let cssContent = `body { font-family: sans-serif; }`;

    let plainInputMode = false;
    let undoStack = [];
    const rotateBtn = document.getElementById("rotateBtn");
    const styleBtn = document.getElementById("styleBtn");
    const container = document.getElementById("cardContainer");
    const preview = document.getElementById("preview");
    const stylePanel = document.getElementById("stylePanel");
    const closeStyle = document.getElementById("closeStyle");

    // Dock関連
    const dockOverlay = document.getElementById("dock-overlay");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const copyBtn = document.getElementById("copyBtn");
    const pasteBtn = document.getElementById("pasteBtn");
    const selectBtn = document.getElementById("selectBtn");
    const selectInput = document.getElementById("selectInput");
    const doneBtn = document.getElementById("doneBtn");
    const loadBtn = document.getElementById("loadBtn");
    const fileInput = document.getElementById("fileInput");
    const plainInput = document.getElementById("plainInput");
    const togglePlain = document.getElementById("togglePlain");
    const undoBtn = document.getElementById("undoBtn");

    let lastClipboard = '';

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    require(["vs/editor/editor.main"], function () {
      editorInstance = monaco.editor.create(document.getElementById("editor"), {
        value: htmlContent,
        language: "html",
        theme: "vs",
        automaticLayout: true
      });
      styleEditorInstance = monaco.editor.create(document.getElementById("styleEditor"), {
        value: cssContent,
        language: "css",
        theme: "vs-light",
        automaticLayout: true
      });
      editorInstance.onDidChangeModelContent(() => {
        if (!plainInputMode) updatePreview();
      });
      plainInput.value = htmlContent;
      plainInput.addEventListener("input", () => {
        if (plainInputMode) {
          htmlContent = plainInput.value;
          editorInstance.setValue(htmlContent); // 同期
          updatePreview();
        }
      });
      updatePreview();
    });

    rotateBtn.addEventListener("click", () => {
      isRotated = !isRotated;
      container.classList.toggle("rotated", isRotated);
      rotateBtn.textContent = isRotated ? "×" : "回転";
      dockOverlay.style.opacity = isRotated ? "1" : "0";
      dockOverlay.style.pointerEvents = isRotated ? "auto" : "none";
      // 切替時に現在の内容でpreview
      if (!isRotated) updatePreview();
    });

    styleBtn.addEventListener("click", () => {
      stylePanel.classList.add("active");
    });
    closeStyle.addEventListener("click", () => {
      stylePanel.classList.remove("active");
    });

    function updatePreview() {
      const val = plainInputMode ? plainInput.value : (editorInstance?.getValue() ?? htmlContent);
      const styleBlock = `<style>\n${styleEditorInstance?.getValue() || ''}\n</style>`;
      const content = val.replace(/<\/head>/, `${styleBlock}\n</head>`)
        .replace(/<body([^>]*)>/, `<body$1 style="background:none !important;">`);
      preview.srcdoc = content;
    }

    // Dock 設定オーバーレイの表示/非表示
    settingsBtn.addEventListener('click', (e) => {
      if (settingsOverlay.classList.contains('show')) {
        settingsOverlay.classList.remove('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      } else {
        settingsOverlay.classList.add('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      }
      e.stopPropagation();
    });

    document.addEventListener('click', (e) => {
      if (
        settingsOverlay.classList.contains('show') &&
        !settingsOverlay.contains(e.target) &&
        e.target !== settingsBtn &&
        isRotated
      ) {
        settingsOverlay.classList.remove('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      }
    });

    // コピー
    copyBtn.addEventListener('click', async () => {
      let text = "";
      if (plainInputMode) {
        text = plainInput.value;
      } else if (editorInstance) {
        text = editorInstance.getModel().getValueInRange(editorInstance.getSelection());
        if (!text) text = editorInstance.getValue();
      }
      try {
        await navigator.clipboard.writeText(text);
        lastClipboard = text;
        copyBtn.textContent = "コピー済！";
        setTimeout(() => copyBtn.textContent = "コピー", 800);
      } catch {
        copyBtn.textContent = "失敗";
        setTimeout(() => copyBtn.textContent = "コピー", 800);
      }
    });

    // ペースト
    pasteBtn.addEventListener('click', async () => {
      let text = "";
      try {
        text = await navigator.clipboard.readText();
      } catch {
        text = lastClipboard;
      }
      if (plainInputMode) {
        const pos = plainInput.selectionStart;
        plainInput.value = plainInput.value.slice(0, pos) + text + plainInput.value.slice(pos);
        plainInput.dispatchEvent(new Event('input'));
      } else if (editorInstance && text) {
        const pos = editorInstance.getPosition();
        editorInstance.executeEdits("", [{
          range: new monaco.Range(pos.lineNumber, pos.column, pos.lineNumber, pos.column),
          text: text,
          forceMoveMarkers: true
        }]);
        updatePreview();
      }
      pasteBtn.textContent = "ペースト済";
      setTimeout(() => pasteBtn.textContent = "ペースト", 800);
    });

    // 選択
    selectBtn.addEventListener('click', () => {
      let text = "";
      if (plainInputMode) {
        text = plainInput.value.substring(plainInput.selectionStart, plainInput.selectionEnd) || plainInput.value;
      } else if (editorInstance) {
        text = editorInstance.getModel().getValueInRange(editorInstance.getSelection());
        if (!text) text = editorInstance.getValue();
      }
      selectInput.value = text;
      selectInput.style.display = "";
      selectInput.readOnly = false;
      selectInput.focus();
      selectInput.select();
      selectBtn.style.display = "none";
      setTimeout(() => {
        selectInput.setSelectionRange(0, text.length);
      }, 100);
    });

    selectInput.addEventListener('blur', () => {
      selectInput.style.display = "none";
      selectBtn.style.display = "";
    });

    doneBtn.addEventListener('click', () => {
      selectInput.style.display = "none";
      selectBtn.style.display = "";
      settingsOverlay.classList.remove('show');
    });

    // 読み込みボタン: ファイルダイアログから読み込み
    loadBtn.addEventListener("click", () => {
      fileInput.value = ""; // reset for re-upload
      fileInput.click();
    });
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = evt => {
          undoStack.push(plainInputMode ? plainInput.value : editorInstance.getValue());
          htmlContent = evt.target.result;
          if (plainInputMode) {
            plainInput.value = htmlContent;
            plainInput.dispatchEvent(new Event('input'));
          } else {
            editorInstance.setValue(htmlContent);
          }
          updatePreview();
        };
        reader.readAsText(file, "utf-8");
      }
    });

    // 取り消す（undo）ボタン
    undoBtn.addEventListener("click", () => {
      if (undoStack.length > 0) {
        const last = undoStack.pop();
        if (plainInputMode) {
          plainInput.value = last;
          plainInput.dispatchEvent(new Event('input'));
        } else {
          editorInstance.setValue(last);
        }
        updatePreview();
      }
    });

    // トグル：オンでプレーンinput, オフでMonaco
    togglePlain.addEventListener("change", () => {
      plainInputMode = togglePlain.checked;
      if (plainInputMode) {
        plainInput.value = editorInstance.getValue();
        plainInput.style.display = "";
        document.getElementById("editor").style.display = "none";
      } else {
        editorInstance.setValue(plainInput.value);
        plainInput.style.display = "none";
        document.getElementById("editor").style.display = "";
      }
      updatePreview();
    });

    // Monaco側でCtrl+Z等はMonaco自身のundoになるが、取り消すボタンはスタック管理
    // Dock裏でのEscキー押下で閉じる
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && settingsOverlay.classList.contains('show')) {
        settingsOverlay.classList.remove('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      }
    });

    // モバイルでキーボードが出て画面がズレても高さ維持（body: flexで中央固定）
    window.addEventListener("resize", () => {
      // ここでカード高さや配置を再調整する場合はflexレイアウトで十分
    });
  </script>
</body>
</html>
