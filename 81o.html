<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vision UI Card Editor with Dock</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <style>
    :root {
      --trans-open: 1s cubic-bezier(.6,0,.2,1);
      --trans-close: 0.8s cubic-bezier(.6,0,.2,1);
      --card-w-pc: 95vw;
      --card-h-pc: 74vh;
      --card-w-mb: 94vw;
      --card-h-mb: 86vh;
      --card-w-mb-horiz: 98vw;
      --card-h-mb-horiz: 65vw;
      --card-max-w: 880px;
      --card-max-h: 950px;
    }
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #ff4e00, #ea38ff, #5ca7ff);
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      overflow: hidden; box-sizing: border-box;
    }
    body {
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
      justify-content: flex-start;
    }
    .vertical-space { height: 6.2vh; flex-shrink: 0; }
    .bottom-space { height: 10vh; flex-shrink: 0; }
    .center-row {
      flex: 1 0 0;
      width: 100vw;
      display: flex; justify-content: center; align-items: center;
      min-height: 0;
    }
    .card-container {
      width: var(--card-w-pc);
      height: var(--card-h-pc);
      max-width: var(--card-max-w);
      max-height: var(--card-max-h);
      min-width: 260px;
      min-height: 280px;
      position: relative;
      transform-style: preserve-3d;
      display: flex; justify-content: center; align-items: center;
      background: none;
      z-index: 2;
      box-shadow: 0 3px 24px 6px #0002;
      border-radius: 28px;
      transition:
        width var(--trans-close), height var(--trans-close),
        max-width var(--trans-close), max-height var(--trans-close);
    }
    /* モバイル縦長 */
    @media (max-width: 600px) {
      .card-container {
        width: var(--card-w-mb);
        height: var(--card-h-mb);
        min-height: 66vw;
        max-width: 100vw;
        max-height: 98vh;
        border-radius: 18px;
        transition:
          width var(--trans-close), height var(--trans-close),
          max-width var(--trans-close), max-height var(--trans-close);
      }
      body { background-attachment: fixed; }
    }
    /* 横長状態（モバイルのみ、.landscapeクラス付与時） */
    .card-container.landscape {
      width: var(--card-w-mb-horiz) !important;
      height: var(--card-h-mb-horiz) !important;
      min-height: 160px !important;
      max-width: 100vw !important;
      max-height: 100vw !important;
      transition:
        width var(--trans-open), height var(--trans-open),
        max-width var(--trans-open), max-height var(--trans-open);
    }
    .card {
      width: 100%; height: 100%; position: absolute;
      border-radius: 24px; backdrop-filter: blur(18px);
      background: rgb(255 255 255 / 29%);
      backface-visibility: hidden; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
      box-shadow: 0 4px 36px 0 #2222;
    }
    .card-front, .card-back {
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 5px; box-sizing: border-box;
      height: 100%; min-height: 0;
    }
    .card-back { transform: rotateY(180deg); background: rgb(255 255 255 / 97%); }
    .rotated { transform: rotateY(180deg); }
    #editor, #plainInput {
      width: 100%; height: 100%; min-height: 0;
      flex: 1; box-sizing: border-box; font-size: 1em; resize: none;
    }
    #plainInput {
      font-family: "SF Mono", "Menlo", "Consolas", "monospace", sans-serif;
      padding: 15px; border: 1px solid #ddd; background: #fcfcfc;
      color: #222; border-radius: 12px;
      transition: box-shadow 0.25s;
      box-shadow: 0 0 0 1.5px #ebe5ff;
    }
    #plainInput:focus { box-shadow: 0 0 0 2.5px #7b56ff48; }
    iframe#preview {
      width: 100%; height: 100%; border: none;
      background: none !important;
      background-color: transparent !important;
      border-radius: 20px;
      box-shadow: 0 2px 16px 0 #4e4e8e2e;
    }
    .btn-group {
      position: absolute;
      bottom: -62px;
      left: 50%;
      display: flex;
      gap: 14px;
      transform: translateX(-50%);
      z-index: 2;
    }
    button {
      padding: 13px 26px;
      font-size: 1.05em;
      border-radius: 31px;
      border: none;
      background: rgb(255 255 255 / 25%);
      color: #343434;
      font-weight: 600;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: background 0.3s, color 0.25s;
      outline: none;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.48);
      color: #6d47fd;
    }
    .style-editor-panel {
      position: fixed;
      right: 0;
      left: 0;
      margin: auto;
      bottom: -100vh;
      width: 62vw;
      max-width: 600px;
      min-width: 260px;
      height: 69vh;
      background: rgb(250 250 255 / 98%);
      backdrop-filter: blur(12px);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
      transition: bottom 0.8s cubic-bezier(.6,0,.2,1), box-shadow 0.55s cubic-bezier(.5,0,.2,1);
      overflow: hidden;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-end;
    }
    .style-editor-panel.active {
      bottom: 0;
      transition: bottom 1s cubic-bezier(.6,0,.2,1), box-shadow 0.55s cubic-bezier(.5,0,.2,1);
    }
    #styleEditor {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    .close-style {
      border: none;
      background: #aba5ff;
      color: white;
      font-size: 20px;
      border:solid 1px white;
      font-weight:1;
      padding: 10px 17px;
      border-radius: 50%;
      align-self: center;
      margin: 13px 0 13px 0;
      cursor: pointer;
    }
    .close-style:hover {
      background: rgba(0,0,0,0.7);
    }
    #dock-overlay {
      width: 100%;
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s;
      opacity: 1;
    }
    .dock {
      background-color: #f8f8fcf2;
      box-shadow: 0 2px 18px 0 #181f3260;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 7px 16px 7px 12px;
      border-radius: 38px;
      gap: 6px;
      margin-bottom: 10px;
      pointer-events: auto;
      transition: background 0.3s;
      backdrop-filter: blur(18px);
      min-width: 220px;
      border: 1px solid #ebe6fa;
    }
    .dock button {
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 1px 10px #0001, 0 1px 0 #fff1 inset;
      padding: 11px 22px;
      margin: 3px;
      border: none;
      border-radius: 36px;
      transition: all 0.3s;
      flex: 1;
      font-size: 1em;
      pointer-events: auto;
    }
    .dock button:hover {
      background-color: #7f56f9;
      color: #fff;
      transform: scale(1.05);
    }
    #settingsOverlay {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 62px;
      background: #fffdfaee;
      padding: 17px 14px 14px 14px;
      border-radius: 25px;
      box-shadow: 0 0 18px 2px #4933b130;
      width: 260px;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.22s ease;
      pointer-events: auto;
      z-index: 100;
      transform: translateX(-50%) translateY(30px);
      border: 1px solid #eae6f7;
    }
    #settingsOverlay.show {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0px);
    }
    .settings-content {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .settings-content button {
      margin-bottom: 13px;
      flex: 1;
      padding: 11px 0;
      font-size: 1em;
      background: #6366f1;
      color: #fff;
      border-radius: 17px;
      border: none;
      font-weight: 600;
    }
    .settings-content button#undoBtn {
      background: #e74c3c;
    }
    .settings-content button:hover {
      background: #7f56f9;
    }
    #selectInput {
      width: 100%;
      font-size: 1em;
      border-radius: 10px;
      border: 1px solid #aaa;
      padding: 8px 10px;
      margin-bottom: 10px;
      box-sizing: border-box;
      outline: none;
      display: none;
    }
    .switch-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0 0 0;
      width: 100%;
      justify-content: space-between;
    }
    .label-text {
      color: #343a40;
      font-size: 16px;
      white-space: nowrap;
      font-weight: 600;
    }
    /* --- iOS16風スイッチ --- */
    .ios-toggle {
      position: relative;
      width: 50px;
      height: 31px;
      display: inline-block;
    }
    .ios-toggle input { display: none; }
    .ios-slider {
      position: absolute;
      cursor: pointer;
      background: #d6d7df;
      border-radius: 16px;
      top: 0; left: 0; right: 0; bottom: 0;
      transition: background 0.23s;
    }
    .ios-slider:before {
      content: "";
      position: absolute;
      left: 2.5px;
      top: 2.5px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 7px #cac9dc85, 0 1.5px 0.5px #eee inset;
      transition: 0.23s cubic-bezier(.4,0,.2,1);
    }
    .ios-toggle input:checked + .ios-slider {
      background: #5fdb74;
    }
    .ios-toggle input:checked + .ios-slider:before {
      transform: translateX(19px);
      background: #fff;
      box-shadow: 0 2px 8px #56ce7285, 0 1.5px 0.5px #c4fad6 inset;
    }
  </style>
</head>
<body>
  <div class="vertical-space"></div>
  <div class="center-row">
    <div class="card-container" id="cardContainer">
      <div class="card card-front">
        <iframe id="preview" title="Preview"></iframe>
      </div>
      <div class="card card-back">
        <div id="editor"></div>
        <textarea id="plainInput" style="display:none;" placeholder="HTMLを入力"></textarea>
        <div id="dock-overlay">
          <div class="dock">
            <button id="saveBtn">保存</button>
            <button id="loadBtn">読み込み</button>
            <button id="settingsBtn">編集</button>
          </div>
          <div id="settingsOverlay">
            <div class="settings-content" id="settingsContent">
              <button id="copyBtn">コピー</button>
              <button id="pasteBtn">ペースト</button>
              <button id="selectBtn">選択</button>
              <input type="text" id="selectInput" readonly>
              <button id="undoBtn">取り消す</button>
              <div class="switch-row">
                <span class="label-text">選択</span>
                <label class="ios-toggle">
                  <input type="checkbox" id="togglePlain">
                  <span class="ios-slider"></span>
                </label>
              </div>
              <button id="doneBtn" style="margin-top:8px; background:#aaa4ff;">完了</button>
            </div>
          </div>
        </div>
      </div>
      <div class="btn-group">
        <button id="rotateBtn">回転</button>
        <button id="styleBtn">スタイル</button>
      </div>
    </div>
  </div>
  <div class="bottom-space"></div>
  <div class="style-editor-panel" id="stylePanel">
    <div id="styleEditor"></div>
    <button class="close-style" id="closeStyle">✖</button>
  </div>
  <input type="file" id="fileInput" accept=".html,.txt,.htm" style="display:none;">
  <script>
    let editorInstance;
    let styleEditorInstance;
    let isRotated = false;
    let htmlContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>タブに表示されるタイトル</title>
  <link rel="stylesheet" href="スタイル.css">
</head>
<body>
  <h1>Hello World</h1>
</body>
</html>`;
    let cssContent = `body { font-family: sans-serif; }`;

    let plainInputMode = false;
    let undoStack = [];
    const rotateBtn = document.getElementById("rotateBtn");
    const styleBtn = document.getElementById("styleBtn");
    const container = document.getElementById("cardContainer");
    const preview = document.getElementById("preview");
    const stylePanel = document.getElementById("stylePanel");
    const closeStyle = document.getElementById("closeStyle");
    // Dock関連
    const dockOverlay = document.getElementById("dock-overlay");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const copyBtn = document.getElementById("copyBtn");
    const pasteBtn = document.getElementById("pasteBtn");
    const selectBtn = document.getElementById("selectBtn");
    const selectInput = document.getElementById("selectInput");
    const doneBtn = document.getElementById("doneBtn");
    const loadBtn = document.getElementById("loadBtn");
    const fileInput = document.getElementById("fileInput");
    const plainInput = document.getElementById("plainInput");
    const togglePlain = document.getElementById("togglePlain");
    const undoBtn = document.getElementById("undoBtn");

    let lastClipboard = '';

    // Monaco Editorのセットアップ
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    require(["vs/editor/editor.main"], function () {
      editorInstance = monaco.editor.create(document.getElementById("editor"), {
        value: htmlContent,
        language: "html",
        theme: "vs",
        automaticLayout: true,
        minimap: { enabled: false },
        scrollbar: { vertical: 'hidden', horizontal: 'hidden' }
      });
      styleEditorInstance = monaco.editor.create(document.getElementById("styleEditor"), {
        value: cssContent,
        language: "css",
        theme: "vs-light",
        automaticLayout: true,
        minimap: { enabled: false },
        scrollbar: { vertical: 'hidden', horizontal: 'hidden' }
      });
      styleEditorInstance.onDidChangeModelContent(updatePreview);
      editorInstance.onDidChangeModelContent(() => {
        if (!plainInputMode) updatePreview();
      });
      plainInput.value = htmlContent;
      plainInput.addEventListener("input", () => {
        if (plainInputMode) {
          htmlContent = plainInput.value;
          editorInstance.setValue(htmlContent); // 同期
          updatePreview();
        }
      });
      updatePreview();
    });

    rotateBtn.addEventListener("click", () => {
      isRotated = !isRotated;
      container.classList.toggle("rotated", isRotated);
      rotateBtn.textContent = isRotated ? "×" : "回転";
      dockOverlay.style.opacity = isRotated ? "1" : "0";
      dockOverlay.style.pointerEvents = isRotated ? "auto" : "none";
      if (!isRotated) updatePreview();
    });

    styleBtn.addEventListener("click", () => {
      stylePanel.classList.add("active");
      // スマホ＆プレビュー時のみ横長へ
      if (window.innerWidth <= 600 && !plainInputMode && !container.classList.contains("rotated")) {
        container.classList.add("landscape");
        container.style.transitionDuration = "1s";
      }
    });
    closeStyle.addEventListener("click", () => {
      stylePanel.classList.remove("active");
      // スマホ＆プレビュー時のみ縦長へ戻す
      if (window.innerWidth <= 600 && !plainInputMode && !container.classList.contains("rotated")) {
        container.style.transitionDuration = "0.8s";
        container.classList.remove("landscape");
      }
    });

    function updatePreview() {
      const val = plainInputMode ? plainInput.value : (editorInstance?.getValue() ?? htmlContent);
      const styleBlock = `<style>\n${styleEditorInstance?.getValue() || ''}\n</style>`;
      const content = val.replace(/<\/head>/, `${styleBlock}\n</head>`)
        .replace(/<body([^>]*)>/, `<body$1 style="background:none !important;">`);
      preview.srcdoc = content;
    }

    // Dock設定オーバーレイ
    settingsBtn.addEventListener('click', (e) => {
      if (settingsOverlay.classList.contains('show')) {
        settingsOverlay.classList.remove('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      } else {
        settingsOverlay.classList.add('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      }
      e.stopPropagation();
    });

    document.addEventListener('click', (e) => {
      if (
        settingsOverlay.classList.contains('show') &&
        !settingsOverlay.contains(e.target) &&
        e.target !== settingsBtn &&
        isRotated
      ) {
        settingsOverlay.classList.remove('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      }
    });

    copyBtn.addEventListener('click', async () => {
      let text = "";
      if (plainInputMode) {
        text = plainInput.value;
      } else if (editorInstance) {
        text = editorInstance.getModel().getValueInRange(editorInstance.getSelection());
        if (!text) text = editorInstance.getValue();
      }
      try {
        await navigator.clipboard.writeText(text);
        lastClipboard = text;
        copyBtn.textContent = "コピー済！";
        setTimeout(() => copyBtn.textContent = "コピー", 800);
      } catch {
        copyBtn.textContent = "失敗";
        setTimeout(() => copyBtn.textContent = "コピー", 800);
      }
    });

    pasteBtn.addEventListener('click', async () => {
      let text = "";
      try {
        text = await navigator.clipboard.readText();
      } catch {
        text = lastClipboard;
      }
      if (plainInputMode) {
        const pos = plainInput.selectionStart;
        plainInput.value = plainInput.value.slice(0, pos) + text + plainInput.value.slice(pos);
        plainInput.dispatchEvent(new Event('input'));
      } else if (editorInstance && text) {
        const pos = editorInstance.getPosition();
        editorInstance.executeEdits("", [{
          range: new monaco.Range(pos.lineNumber, pos.column, pos.lineNumber, pos.column),
          text: text,
          forceMoveMarkers: true
        }]);
        updatePreview();
      }
      pasteBtn.textContent = "ペースト済";
      setTimeout(() => pasteBtn.textContent = "ペースト", 800);
    });

    selectBtn.addEventListener('click', () => {
      let text = "";
      if (plainInputMode) {
        text = plainInput.value.substring(plainInput.selectionStart, plainInput.selectionEnd) || plainInput.value;
      } else if (editorInstance) {
        text = editorInstance.getModel().getValueInRange(editorInstance.getSelection());
        if (!text) text = editorInstance.getValue();
      }
      selectInput.value = text;
      selectInput.style.display = "";
      selectInput.readOnly = false;
      selectInput.focus();
      selectInput.select();
      selectBtn.style.display = "none";
      setTimeout(() => {
        selectInput.setSelectionRange(0, text.length);
      }, 100);
    });

    selectInput.addEventListener('blur', () => {
      selectInput.style.display = "none";
      selectBtn.style.display = "";
    });

    doneBtn.addEventListener('click', () => {
      selectInput.style.display = "none";
      selectBtn.style.display = "";
      settingsOverlay.classList.remove('show');
    });

    loadBtn.addEventListener("click", () => {
      fileInput.value = "";
      fileInput.click();
    });
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = evt => {
          undoStack.push(plainInputMode ? plainInput.value : editorInstance.getValue());
          htmlContent = evt.target.result;
          if (plainInputMode) {
            plainInput.value = htmlContent;
            plainInput.dispatchEvent(new Event('input'));
          } else {
            editorInstance.setValue(htmlContent);
          }
          updatePreview();
        };
        reader.readAsText(file, "utf-8");
      }
    });

    undoBtn.addEventListener("click", () => {
      if (undoStack.length > 0) {
        const last = undoStack.pop();
        if (plainInputMode) {
          plainInput.value = last;
          plainInput.dispatchEvent(new Event('input'));
        } else {
          editorInstance.setValue(last);
        }
        updatePreview();
      }
    });

    togglePlain.addEventListener("change", () => {
      plainInputMode = togglePlain.checked;
      if (plainInputMode) {
        plainInput.value = editorInstance.getValue();
        plainInput.style.display = "";
        document.getElementById("editor").style.display = "none";
        plainInput.focus();
        // スタイルパネル開いてたら横長変形も解除
        if (window.innerWidth <= 600) {
          container.classList.remove("landscape");
        }
      } else {
        editorInstance.setValue(plainInput.value);
        plainInput.style.display = "none";
        document.getElementById("editor").style.display = "";
        editorInstance.focus();
      }
      updatePreview();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && settingsOverlay.classList.contains('show')) {
        settingsOverlay.classList.remove('show');
        selectInput.style.display = "none";
        selectBtn.style.display = "";
      }
    });
  </script>
</body>
</html>
