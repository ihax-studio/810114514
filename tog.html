<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>haptic test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f7;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-user-select:none;user-select:none}
.ig-cell{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ig-icon{width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);box-shadow:1.1px 1px 0 rgba(255,255,255,.85),-1px -.8px 0 rgba(255,255,255,.6),0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform .9s}
.ig-label{font-size:10px;font-weight:600;color:#333}
#log{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);color:#0f0;font:11px/1.4 monospace;padding:6px 8px;max-height:30vh;overflow-y:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div id="grid"></div>
<div id="log"></div>

<script type="module">
/* ═══ HAPTIC — 810114514と完全同一 ═══ */
let _h=null;
(()=>{import('https://esm.sh/ios-haptics').then(m=>{_h=m.haptic;log('_h loaded ✓ keys='+Object.keys(_h).join(','));}).catch(e=>{log('load FAIL: '+e);});})();
const _hapticOrig=()=>{try{_h&&_h();}catch(_){}};
const _hapticConfirmOrig=()=>{try{_h&&_h.confirm&&_h.confirm();}catch(_){}};
const haptic=()=>{_hapticOrig();log('haptic()');};
haptic.confirm=()=>{_hapticConfirmOrig();log('haptic.confirm()');};
haptic.error=()=>{try{_h&&_h.error&&_h.error();}catch(_){}log('haptic.error()');};

/* ═══ LOG ═══ */
const logEl=document.getElementById('log');
function log(m){const t=new Date().toLocaleTimeString('ja-JP',{hour12:false});const l=`[${t}] ${m}`;console.log(l);logEl.textContent+=l+'\n';logEl.scrollTop=logEl.scrollHeight;}

/* ═══ ICONS — 810114514と同じ構造 ═══ */
const icons=[
  {icon:'📚',name:'英語'},
  {icon:'🧮',name:'数学'},
  {icon:'⚗️',name:'化学'},
  {icon:'⚙️',name:'設定'},
  {icon:'🎵',name:'音楽'},
  {icon:'📷',name:'カメラ'},
  {icon:'🕐',name:'時計'},
  {icon:'📝',name:'メモ'},
];

const grid=document.getElementById('grid');
grid.style.cssText='display:flex;flex-wrap:wrap;gap:20px;justify-content:center';

icons.forEach(d=>{
  const cell=document.createElement('div');
  cell.className='ig-cell';
  cell.innerHTML=`<div class="ig-icon">${d.icon}</div><div class="ig-label">${d.name}</div>`;

  const ib=cell.querySelector('.ig-icon');

  // 810114514と完全同一: touchstart → scale down
  ib.addEventListener('touchstart',function(){
    this.style.transform='scale(0.85)';
    log('touchstart → scale(0.85)');
  },{passive:true});

  // 810114514と完全同一: touchend → scale reset
  ib.addEventListener('touchend',function(){
    this.style.transform='';
    log('touchend → reset');
  },{passive:true});

  // 810114514と完全同一: click → haptic() + open animation
  cell.addEventListener('click',()=>{
    haptic();
    const thisIcon=cell.querySelector('.ig-icon');
    thisIcon.style.transition='transform .8s cubic-bezier(.77,0,.18,1), opacity .8s cubic-bezier(.77,0,.18,1)';
    thisIcon.style.transform='scale(5)';
    thisIcon.style.opacity='0';
    const allCells=grid.querySelectorAll('.ig-cell');
    allCells.forEach(c2=>{
      if(c2===cell)return;
      c2.style.transition='transform .8s cubic-bezier(.77,0,.18,1), opacity .8s cubic-bezier(.77,0,.18,1)';
      c2.style.transform='scale(0.8)';
      c2.style.opacity='0.3';
    });
    setTimeout(()=>{
      allCells.forEach(c2=>{c2.style.transition='';c2.style.transform='';c2.style.opacity='';});
    },450);
  });

  grid.appendChild(cell);
});

log('ready');
</script>
</body>
</html>
