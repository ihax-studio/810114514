<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>haptic icon test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{overscroll-behavior:none;position:fixed;inset:0;touch-action:pan-y}
body{overscroll-behavior:none;position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --b:#007aff;--g:#34c759;--y:#ff9500;--r:#ff3b30;--p:#5856d6;
  --tx:#1c1c1e;--sub:#8e8e93;--ln:rgba(0,0,0,.08);
  --gls:rgba(255,255,255,.66);
  --gls2:rgba(255,255,255,.81);
  --gls3:rgba(255,255,255,.85);
  --bdr:rgba(255,255,255,.85);
  --blr:blur(28px) saturate(180%);
  --sh:0 4px 20px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.07);
  --shl:0 12px 40px rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.08);
}
html,body{
  height:100dvh;overflow:hidden;
  background:linear-gradient(150deg,#eef2f8 0%,#f8f2fc 50%,#edf7f2 100%);
  font-family:"SF Pro Display","SF Pro Text",-apple-system,"Noto Sans JP",sans-serif;color:var(--tx);
  overscroll-behavior:none;
  -webkit-overflow-scrolling:auto;
}

/* ═══ ICON WOBBLE ═══ — 810114514そのまま */
@keyframes gridReveal{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
#icon-grid.wobbling .ig-cell{animation:iconWobble .15s ease-in-out infinite alternate}
#icon-grid.wobbling .ig-cell:nth-child(odd){animation-delay:.07s}
@keyframes iconWobble{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
</style>
</head>
<body>

<div class="hm-scroll" style="width:100%;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--sat)"></div>

<script type="module">
/* ═══ BLOCK iOS EDGE SWIPE (safe, no scroll impact) ═══ */
document.addEventListener('touchstart',function(e){
  const x=e.touches[0].pageX;
  if(x<15||x>window.innerWidth-15)e.preventDefault();
},{passive:false,capture:true});

/* ═══ BLOCK CONTEXT MENU ON MAC (except inputs/textareas) ═══ */
document.addEventListener('contextmenu',function(e){
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||e.target.isContentEditable)return;
  e.preventDefault();
});

/* ═══ DEVICE DETECTION ═══ */
const _isIPad=navigator.userAgent.includes('iPad')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const _isMac=navigator.platform.startsWith('Mac')&&navigator.maxTouchPoints===0;
const _isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(_isIPad);
const _isWideScreen=_isIPad||_isMac||window.innerWidth>=768;
const GRID_COLS=_isWideScreen?6:4;

/* ═══ HAPTIC ═══ */
let _h=null;
(()=>{import('https://esm.sh/ios-haptics').then(m=>{_h=m.haptic;}).catch(()=>{});})();
const _hapticOrig  = ()=>{try{_h&&_h();}catch(_){}};
const _hapticConfirmOrig= ()=>{try{_h&&_h.confirm&&_h.confirm();}catch(_){}};
const haptic  = ()=>{
  if(localStorage.getItem('inglish_haptic')==='0')return;
  _hapticOrig();
  if(localStorage.getItem('inglish_haptic_strong')==='1'){for(let i=0;i<5;i++)setTimeout(()=>{try{_h&&_h.error&&_h.error();}catch(_){}},i*30);}
};
haptic.confirm= ()=>{
  if(localStorage.getItem('inglish_haptic')==='0')return;
  _hapticConfirmOrig();
  if(localStorage.getItem('inglish_haptic_strong')==='1'){for(let i=0;i<5;i++)setTimeout(()=>{try{_h&&_h.error&&_h.error();}catch(_){}},i*30);}
};
haptic.error  = ()=>{try{_h&&_h.error&&_h.error();}catch(_){}};

/* ═══ ICON LONG-PRESS WOBBLE + DRAG REORDER ═══ */
const ICON_ORDER_KEY='inglish_icon_order';
let wobbleMode=false;

function getIconOrder(){
  try{return JSON.parse(localStorage.getItem(ICON_ORDER_KEY));}catch(e){return null;}
}
function saveIconOrder(order){
  localStorage.setItem(ICON_ORDER_KEY,JSON.stringify(order));
}

function enableWobble(grid){
  if(wobbleMode)return;
  wobbleMode=true;
  haptic.confirm();
  grid.classList.add('wobbling');
  const stopWobble=()=>{
    wobbleMode=false;
    grid.classList.remove('wobbling');
    document.removeEventListener('click',stopWobble);
  };
  setTimeout(()=>document.addEventListener('click',stopWobble),100);
}

// Long press detection on icon grid
document.addEventListener('touchstart',e=>{
  const cell=e.target.closest('.ig-cell');
  if(!cell)return;
  const grid=cell.closest('#icon-grid');
  if(!grid)return;
  let timer=setTimeout(()=>{
    enableWobble(grid);
    startDrag(cell,grid,e.touches[0]);
  },500);
  const cancel=()=>{clearTimeout(timer);cell.removeEventListener('touchend',cancel);cell.removeEventListener('touchmove',moveCheck);};
  const moveCheck=(ev)=>{
    const dx=Math.abs(ev.touches[0].clientX-e.touches[0].clientX);
    const dy=Math.abs(ev.touches[0].clientY-e.touches[0].clientY);
    if(dx>8||dy>8)cancel();
  };
  cell.addEventListener('touchend',cancel,{once:true});
  cell.addEventListener('touchmove',moveCheck,{passive:true});
},{passive:true});

function startDrag(cell,grid,touch){
  if(!wobbleMode)return;
  const cells=[...grid.querySelectorAll('.ig-cell')];
  const idx=cells.indexOf(cell);
  const rect=cell.getBoundingClientRect();
  const ox=touch.clientX-rect.left,oy=touch.clientY-rect.top;
  cell.style.zIndex='100';cell.style.position='relative';
  
  const onMove=(ev)=>{
    const t=ev.touches[0];
    cell.style.transform=`translate(${t.clientX-rect.left-ox}px,${t.clientY-rect.top-oy}px) scale(1.1)`;
    cells.forEach((c,i)=>{
      if(c===cell)return;
      const r=c.getBoundingClientRect();
      if(t.clientX>r.left&&t.clientX<r.right&&t.clientY>r.top&&t.clientY<r.bottom){
        if(i<idx)grid.insertBefore(cell,c);
        else grid.insertBefore(cell,c.nextSibling);
        haptic();
      }
    });
  };
  const onEnd=()=>{
    cell.style.transform='';cell.style.zIndex='';cell.style.position='';
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onEnd);
    const newCells=[...grid.querySelectorAll('.ig-cell')];
    const order=newCells.map(c=>c.dataset.name||'');
    saveIconOrder(order);
  };
  document.addEventListener('touchmove',onMove,{passive:true});
  document.addEventListener('touchend',onEnd,{once:true});
}

/* ═══ ICON MODE INIT ═══ */
function showIconGrid(){
  const scroll=document.querySelector('.hm-scroll');
  let oldGrid=document.getElementById('icon-grid');
  if(oldGrid)oldGrid.remove();
  
  const bigMode=localStorage.getItem('inglish_bigicon')==='1';
  const iconSize=bigMode?66:56;
  const fontSize=bigMode?28:24;
  const gap=bigMode?'22px 6px':'24px 8px';
  
  const grid=document.createElement('div');
  grid.id='icon-grid';
  const iconPadH=_isWideScreen?'20px':'10px';
  grid.style.cssText='display:grid;grid-template-columns:repeat('+GRID_COLS+',1fr);gap:'+gap+';padding:24px '+iconPadH+' 16px;justify-items:center;animation:gridReveal .5s ease both;';
  
  const allIcons=[
    {icon:'📚',name:'英語',onclick:''},
    {icon:'⚗️',name:'化学',onclick:''},
    {icon:'🧮',name:'数学',onclick:''},
    {icon:'\u2699\uFE0F',name:'\u8A2D\u5B9A',onclick:'__openSettings__'},
    {icon:'\uD83E\uDDEE',name:'\u6570\u5B66',onclick:'__iframe_math__'},
    {icon:'\uD83E\uDD96',name:'Neosaurs',onclick:'__iframe_neo__'},
    {icon:'\uD83D\uDCDD',name:'\u30E1\u30E2',onclick:'__openMemo__'},
    {icon:'\uD83D\uDCF7',name:'\u30AB\u30E1\u30E9',onclick:'__iframe_cam__'},
  ];
  
  const savedOrder=getIconOrder();
  if(savedOrder&&savedOrder.length===allIcons.length){
    const ordered=[];
    savedOrder.forEach(nm=>{
      const found=allIcons.find(ic=>ic.name===nm);
      if(found)ordered.push(found);
    });
    if(ordered.length===allIcons.length)allIcons.splice(0,allIcons.length,...ordered);
  }
  
  allIcons.forEach((d,idx)=>{
    const cell=document.createElement('div');
    cell.className='ig-cell';
    cell.dataset.icon=d.icon;
    cell.dataset.name=d.name;
    cell.style.cssText='display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-user-select:none';
    const short=d.name.length>5?d.name.slice(0,4)+'\u2026':d.name;
    const labelHtml=bigMode?'':'<div style="font-size:8px;font-weight:600;color:var(--tx);text-align:center;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+short+'</div>';
    cell.innerHTML='<div class="ig-icon" style="width:'+iconSize+'px;height:'+iconSize+'px;border-radius:14px;background:rgba(255,255,255,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);box-shadow:1.1px 1px 0 rgba(255,255,255,.85),-1px -.8px 0 rgba(255,255,255,.6),0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:'+fontSize+'px;transition:transform .9s">'+d.icon+'</div>'+labelHtml;
    cell.addEventListener('click',()=>{
      if(wobbleMode)return;
      haptic();
      const allCells=grid.querySelectorAll('.ig-cell');
      const thisIcon=cell.querySelector('.ig-icon');
      thisIcon.style.transition='transform .8s cubic-bezier(.77,0,.18,1), opacity .8s cubic-bezier(.77,0,.18,1)';
      thisIcon.style.transform='scale(5)';thisIcon.style.opacity='0';
      allCells.forEach(c2=>{if(c2===cell)return;c2.style.transition='transform .8s cubic-bezier(.77,0,.18,1), opacity .8s cubic-bezier(.77,0,.18,1)';c2.style.transform='scale(0.8)';c2.style.opacity='0.3';});
      setTimeout(()=>{
        allCells.forEach(c2=>{c2.style.transition='';c2.style.transform='';c2.style.opacity='';});
      },450);
    });
    const ib=cell.querySelector('.ig-icon');
    ib.addEventListener('touchstart',function(){if(!wobbleMode)this.style.transform='scale(0.85)';},{passive:true});
    ib.addEventListener('touchend',function(){if(!wobbleMode)this.style.transform='';},{passive:true});
    grid.appendChild(cell);
  });
  scroll.prepend(grid);
}

showIconGrid();
</script>
</body>
</html>
