<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三角関数マスター</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--bg:#fff;--card:#f8f8fa;--border:#e5e5ea;--text:#1c1c1e;--dim:#8e8e93;--blue:#007aff;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--purple:#af52de;--teal:#5ac8fa;--pink:#ff2d55}
body{font-family:-apple-system,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;
background:var(--bg);color:var(--text);padding:0 0 40px;line-height:1.7;-webkit-font-smoothing:antialiased}
.mono{font-family:'SF Mono','Menlo',monospace}

/* Sticky nav */
.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:.5px solid var(–border);padding:10px 16px 0}
.nav h1{font-size:18px;font-weight:800;letter-spacing:-.5px}
.nav-tabs{display:flex;gap:0;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nt{padding:7px 14px;font-size:12px;font-weight:600;color:var(–dim);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;transition:.2s}
.nt.on{color:var(–blue);border-color:var(–blue)}

.pg{display:none;padding:16px;max-width:620px;margin:0 auto}
.pg.show{display:block}

/* Cards */
.cd{background:var(–card);border-radius:14px;padding:16px;margin-bottom:14px}
.cd h2{font-size:16px;font-weight:800;margin-bottom:10px}
.cd h3{font-size:13px;font-weight:700;color:var(–blue);margin:14px 0 6px;border-left:3px solid var(–blue);padding-left:8px}
.cd p{font-size:13px;margin:5px 0}
.fb{background:#fff;border:1px solid var(–border);border-radius:10px;padding:12px;margin:8px 0;
text-align:center;font-family:‘SF Mono’,monospace;font-size:14px;font-weight:600;line-height:2}
.fb .y{color:var(–orange)}.fb .p{color:var(–pink)}.fb .g{color:var(–green)}.fb .b{color:var(–blue)}.fb .r{color:var(–red)}
.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12px}
.tip::before{content:’💡 ’}
.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12px;color:#991b1b}
.warn::before{content:’⚠️ ’}
.note{font-size:11px;color:var(–dim);background:#f0f1f5;border-radius:8px;padding:6px 10px;margin:6px 0}
.note b{color:var(–blue)}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:11px;font-family:‘SF Mono’,monospace;margin:8px 0}
.tbl th,.tbl td{padding:5px 3px;text-align:center;border:1px solid var(–border)}
.tbl th{background:#f0f1f5;font-weight:700;font-size:10px}
.tbl tr.hl{background:#eff6ff}

/* Unit circle SVG */
.uc{max-width:300px;margin:8px auto}
.uc-vals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.uv{background:#fff;border:1px solid var(–border);border-radius:10px;padding:10px 4px;text-align:center}
.uv .l{font-size:9px;color:var(–dim);font-weight:600}.uv .n{font-size:16px;font-weight:800;font-family:‘SF Mono’,monospace;margin-top:2px}

/* Puzzle */
.pz-bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;justify-content:center}
.chip{padding:7px 12px;background:#fff;border:1.5px solid var(–border);border-radius:10px;
font-family:‘SF Mono’,monospace;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip:active{transform:scale(.96)}
.chip.sel{border-color:var(–blue);background:#eff6ff;color:var(–blue)}
.chip.used{opacity:.25;pointer-events:none}
.slot{min-height:34px;border:2px dashed var(–border);border-radius:8px;display:flex;align-items:center;
justify-content:center;font-family:‘SF Mono’,monospace;font-size:12px;font-weight:600;transition:.2s;padding:4px}
.slot.hi{border-color:var(–blue);background:#eff6ff}
.slot.ok{border-style:solid;border-color:var(–green);background:#f0fdf4;color:var(–green)}
.slot.ng-flash{border-color:var(–red);background:#fef2f2}

/* Quiz */
.qc{background:var(–card);border:1.5px solid var(–border);border-radius:14px;padding:16px;margin-bottom:10px;transition:.3s}
.qc.is-ok{border-color:var(–green);background:#f0fdf4}.qc.is-ng{border-color:var(–red);background:#fef2f2}
.qctx{font-size:11px;color:var(–dim);margin-bottom:5px}
.qstem{font-family:‘SF Mono’,monospace;font-size:15px;font-weight:700;line-height:1.8;margin:6px 0 12px;text-align:center}
.qstem .bl{color:var(–blue);border-bottom:2px dashed var(–blue);padding:0 4px}
.qstem .gf{color:var(–green)}.qstem .rf{color:var(–red);text-decoration:line-through}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.op{font-family:‘SF Mono’,monospace;font-size:11px;font-weight:600;padding:12px 6px;text-align:center;
background:#fff;border:1.5px solid var(–border);border-radius:10px;cursor:pointer;transition:.15s;line-height:1.3}
.op:active{transform:scale(.97)}
.op.ok{background:#dcfce7;border-color:var(–green);color:#166534}
.op.ng{background:#fef2f2;border-color:var(–red);color:#991b1b}
.op.dead{pointer-events:none;opacity:.3}
.expl{margin-top:10px;padding:10px 12px;background:#eff6ff;border-radius:10px;font-size:12px;line-height:1.8}
.expl b{color:var(–orange)}

.btn{display:block;width:100%;padding:14px;font-family:-apple-system,sans-serif;font-size:14px;font-weight:700;
border:none;border-radius:12px;cursor:pointer;text-align:center;margin-top:10px}
.btn:active{opacity:.8}
.btn-a{background:var(–blue);color:#fff}.btn-b{background:var(–card);border:1.5px solid var(–border);color:var(–text)}

.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.s{background:#fff;border:1px solid var(–border);border-radius:10px;padding:8px;text-align:center}
.s .n{font-size:18px;font-weight:900;font-family:‘SF Mono’,monospace}
.s .n.gg{color:var(–green)}.s .n.rr{color:var(–red)}.s .n.bb{color:var(–blue)}
.s .l{font-size:8px;color:var(–dim)}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;margin-right:4px}
.badge.b1{background:var(–blue)}.badge.b2{background:var(–orange)}.badge.b3{background:var(–purple)}.badge.b4{background:var(–pink)}.badge.b5{background:var(–green)}
.res{background:var(–card);border-radius:14px;padding:24px;text-align:center;margin:14px 0}
.res .em{font-size:44px}.res .msg{font-size:18px;font-weight:800}.res .det{font-size:12px;color:var(–dim);margin-top:4px}
.qi{background:var(–card);border:1px solid var(–border);border-radius:12px;padding:12px;margin:6px 0;cursor:pointer;display:flex;align-items:center;gap:10px}
.qi:active{background:#eff6ff}
.qi .t{font-size:13px;font-weight:700}.qi .d{font-size:9px;color:var(–dim)}

/* Canvas viz */
.memo-toggle{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:11px;font-weight:600;
border-radius:20px;border:1.5px solid var(–border);background:#fff;color:var(–dim);cursor:pointer;margin:8px 0}
.memo-toggle.on{border-color:var(–blue);color:var(–blue);background:#eff6ff}
.memo-toggle::before{content:‘✏️’}
.memo-wrap{margin:8px 0;border-radius:12px;overflow:hidden;border:1.5px solid var(–border);position:relative;display:none}
.memo-wrap.show{display:block}
.memo-canvas{display:block;width:100%;height:160px;background:#fff;touch-action:none;cursor:crosshair}
.memo-bar{display:flex;gap:6px;padding:6px 10px;background:var(–card);border-top:1px solid var(–border);align-items:center}
.memo-bar .mc{width:24px;height:24px;border-radius:50%;border:2px solid var(–border);cursor:pointer}
.memo-bar .mc.on{border-color:var(–blue);box-shadow:0 0 0 2px #007aff44}
.memo-bar .mclear{font-size:11px;font-weight:600;color:var(–red);cursor:pointer;margin-left:auto;padding:4px 10px;border-radius:8px;border:1px solid #fecaca;background:#fef2f2}
.memo-bar .mw{display:flex;align-items:center;gap:3px;margin-left:8px}
.memo-bar .mw input{width:60px;height:18px;-webkit-appearance:none;background:transparent}
.memo-bar .mw input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(–border)}
.memo-bar .mw input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(–blue);margin-top:-6px}
.memo-pressure{font-size:9px;color:var(–dim);padding:2px 6px}

/* Canvas viz */
.vbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.vbar select{background:var(–card);border:1px solid var(–border);border-radius:8px;padding:5px 8px;font:13px -apple-system;color:var(–text)}
.vbar input[type=range]{height:20px;-webkit-appearance:none;background:transparent;flex:1;max-width:140px}
.vbar input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(–border)}
.vbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(–blue);margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pill{padding:5px 12px;font-size:11px;font-weight:600;border-radius:20px;border:1.5px solid var(–border);background:none;color:var(–dim);cursor:pointer}
.pill.on{background:#eff6ff;border-color:var(–blue);color:var(–blue)}
canvas.viz{display:block;width:100%;border-radius:12px;background:var(–card);border:1px solid var(–border)}
</style>

</head>
<body>
<div class="nav">
<h1>三角関数マスター</h1>
<div class="nav-tabs" id="ntabs"></div>
</div>
<div id="p0" class="pg"></div>
<div id="p1" class="pg"></div>
<div id="p2" class="pg"></div>
<div id="p3" class="pg"></div>
<div id="p4" class="pg"></div>

<script type="module">
let _h=null;
try{const m=await import('https://cdn.jsdelivr.net/npm/ios-haptics/+esm');_h=m.haptic||m.default||null}catch(e){}
const H={tap(){if(_h)try{_h()}catch(e){}},ok(){if(_h)try{_h('success')}catch(e){}},ng(){if(_h)try{_h('error')}catch(e){}},med(){if(_h)try{_h('medium')}catch(e){}}};
const PI=Math.PI,TAU=2*PI;
const fmt=v=>{if(!isFinite(v))return'—';return+(v.toFixed(3))+''};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

// ===== TABS =====
const TABS=[{id:'input',label:'📖 INPUT'},{id:'pz',label:'🧩 パズル'},{id:'quiz',label:'📝 OUTPUT'},{id:'viz',label:'📊 ビジュアル'}];
let cur='input';
function renderNav(){
document.getElementById('ntabs').innerHTML=TABS.map(t=>`<div class="nt${t.id===cur?' on':''}" data-t="${t.id}">${t.label}</div>`).join('');
document.querySelectorAll('.nt').forEach(n=>{n.onclick=()=>{H.tap();cur=n.dataset.t;renderNav();showPg();if(cur==='viz')setTimeout(drawAllViz,50)}});
}
function showPg(){TABS.forEach((t,i)=>document.getElementById('p'+i).classList.toggle('show',t.id===cur))}

// ===== SPECIAL ANGLES =====
const SA=[{d:0,r:'0',s:'0',c:'1',t:'0'},{d:30,r:'π/6',s:'1/2',c:'√3/2',t:'1/√3'},{d:45,r:'π/4',s:'√2/2',c:'√2/2',t:'1'},{d:60,r:'π/3',s:'√3/2',c:'1/2',t:'√3'},{d:90,r:'π/2',s:'1',c:'0',t:'—'},{d:120,r:'2π/3',s:'√3/2',c:'-1/2',t:'-√3'},{d:135,r:'3π/4',s:'√2/2',c:'-√2/2',t:'-1'},{d:150,r:'5π/6',s:'1/2',c:'-√3/2',t:'-1/√3'},{d:180,r:'π',s:'0',c:'-1',t:'0'},{d:210,r:'7π/6',s:'-1/2',c:'-√3/2',t:'1/√3'},{d:225,r:'5π/4',s:'-√2/2',c:'-√2/2',t:'1'},{d:240,r:'4π/3',s:'-√3/2',c:'-1/2',t:'√3'},{d:270,r:'3π/2',s:'-1',c:'0',t:'—'},{d:300,r:'5π/3',s:'-√3/2',c:'1/2',t:'-√3'},{d:315,r:'7π/4',s:'-√2/2',c:'√2/2',t:'-1'},{d:330,r:'11π/6',s:'-1/2',c:'√3/2',t:'-1/√3'}];
let ucI=0;

// ===== P0: INPUT =====
function renderInput(){
const a=SA[ucI],cx=140,cy=140,R=115;
let dots='';SA.forEach((d,i)=>{const rad=d.d*PI/180,x=cx+R*Math.cos(rad),y=cy-R*Math.sin(rad),on=i===ucI;
if(on)dots+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${'#007aff'}" stroke-width="2" stroke-dasharray="4,3"/><line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${cy}" stroke="${'#ff2d55'}" stroke-width="1.5" opacity=".6"/><line x1="${cx}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${'#34c759'}" stroke-width="1.5" opacity=".6"/>`;
dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?7:4}" fill="${on?'#007aff':'#c7c7cc'}" stroke="${on?'#fff':'none'}" stroke-width="${on?2:0}" data-i="${i}" style="cursor:pointer"/>`;});

document.getElementById('p0').innerHTML=`
<div class="cd"><h2>🔵 単位円（タップで切替）</h2>
<p style="font-size:11px;color:var(--dim)"><span style="color:var(--green)">■cos(横)</span> <span style="color:var(--pink)">■sin(縦)</span></p>
<div class="uc"><svg viewBox="0 0 280 280" style="width:100%">
<line x1="0" y1="${cy}" x2="280" y2="${cy}" stroke="#e5e5ea"/><line x1="${cx}" y1="0" x2="${cx}" y2="280" stroke="#e5e5ea"/>
<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>${dots}</svg></div>
<div style="text-align:center;margin-bottom:8px"><span style="font-size:20px;font-weight:900" class="mono">${a.d}° = ${a.r}</span></div>
<div class="uc-vals">
<div class="uv"><div class="l">sinθ</div><div class="n" style="color:var(--pink)">${a.s}</div></div>
<div class="uv"><div class="l">cosθ</div><div class="n" style="color:var(--green)">${a.c}</div></div>
<div class="uv"><div class="l">tanθ</div><div class="n" style="color:var(--orange)">${a.t}</div></div></div>
<table class="tbl"><tr><th>θ</th><th>rad</th><th style="color:var(--pink)">sin</th><th style="color:var(--green)">cos</th><th style="color:var(--orange)">tan</th></tr>
${SA.map(d=>`<tr${d.d===a.d?' class="hl"':''}><td>${d.d}°</td><td>${d.r}</td><td style="color:var(--pink)">${d.s}</td><td style="color:var(--green)">${d.c}</td><td style="color:var(--orange)">${d.t}</td></tr>`).join('')}</table>
<div class="tip">sinは <b>0→1/2→√2/2→√3/2→1</b> で上がって戻る。cosは逆順。</div></div>

<div class="cd"><h2>⭐ 加法定理（丸暗記！）</h2>
<div class="fb">sin(α+β) = <span class="y">sinαcosβ</span> + <span class="p">cosαsinβ</span><br>sin(α−β) = <span class="y">sinαcosβ</span> − <span class="p">cosαsinβ</span></div>
<div class="tip">sinは「<b>別種の積の和</b>」。符号は元と<b>同じ</b></div>
<div class="fb">cos(α+β) = <span class="g">cosαcosβ</span> − <span class="p">sinαsinβ</span><br>cos(α−β) = <span class="g">cosαcosβ</span> + <span class="p">sinαsinβ</span></div>
<div class="warn">cosは「<b>同種の積の差</b>」。符号は元と<b>逆</b>！</div>
<div class="fb">tan(α+β) = <span class="y">(tanα+tanβ)</span>/<span class="b">(1−tanαtanβ)</span><br>tan(α−β) = <span class="y">(tanα−tanβ)</span>/<span class="b">(1+tanαtanβ)</span></div>
<div class="tip">分子は素直。分母は「1 ∓ 積」（<b>符号逆</b>）</div></div>

<div class="cd"><h2>🔥 2倍角の公式（α=β=θで導出）</h2>
<div class="fb"><span class="y">sin2θ = 2sinθcosθ</span></div>
<div class="fb"><span class="g">cos2θ = cos²θ − sin²θ</span>　←基本<br><span class="g">= 2cos²θ − 1</span>　←cos統一<br><span class="g">= 1 − 2sin²θ</span>　←sin統一</div>
<div class="fb"><span class="b">tan2θ = 2tanθ/(1−tan²θ)</span></div>
<div class="note">全部 加法定理にα=β=θ代入するだけ。<b>暗記不要で導ける</b></div></div>

<div class="cd"><h2>✨ 三角関数の合成</h2>
<div class="fb"><span class="y">a</span>sinθ + <span class="p">b</span>cosθ = <span class="g">r</span>·sin(θ+α)<br>r = √(a²+b²)　cosα = a/r　sinα = b/r</div>
<div class="tip">最大値 = r、最小値 = −r</div></div>

<div class="cd"><h2>📐 半角の公式（次数下げ）</h2>
<div class="fb">sin²θ = <span class="p">(1−cos2θ)/2</span><br>cos²θ = <span class="g">(1+cos2θ)/2</span><br>sinθcosθ = <span class="y">sin2θ/2</span></div></div>`;

document.getElementById('p0').querySelectorAll('circle[data-i]').forEach(c=>{c.onclick=()=>{H.tap();ucI=+c.dataset.i;renderInput()}});
}

// ===== P1: PUZZLES (table + formula match) =====
const TP_A=[0,30,45,60,90];
let tp=null,fm=null;
function initTP(){const ans={},vals=[];TP_A.forEach(d=>{const a=SA.find(x=>x.d===d);['sin','cos','tan'].forEach(f=>{const k=d+'-'+f;const v=f==='sin'?a.s:f==='cos'?a.c:a.t;ans[k]=v;vals.push(v)})});const u=shuffle([...new Set(vals)]);tp={ans,slots:{},chips:u.map((v,i)=>({id:i,val:v,used:false})),sel:null,score:0,wrong:0,total:15}}
const FM_I=[{l:'sin(α+β)',r:'sinαcosβ+cosαsinβ'},{l:'sin(α−β)',r:'sinαcosβ−cosαsinβ'},{l:'cos(α+β)',r:'cosαcosβ−sinαsinβ'},{l:'cos(α−β)',r:'cosαcosβ+sinαsinβ'},{l:'tan(α+β)',r:'(tanα+tanβ)/(1−tanαtanβ)'},{l:'tan(α−β)',r:'(tanα−tanβ)/(1+tanαtanβ)'},{l:'sin2θ',r:'2sinθcosθ'},{l:'cos2θ①',r:'cos²θ−sin²θ'},{l:'cos2θ②',r:'2cos²θ−1'},{l:'cos2θ③',r:'1−2sin²θ'},{l:'tan2θ',r:'2tanθ/(1−tan²θ)'},{l:'合成r',r:'√(a²+b²)'}];
function initFM(){const rp=shuffle(FM_I.map(x=>x.r));fm={rp:rp.map((v,i)=>({id:i,val:v,used:false})),matched:{},sel:null,score:0,wrong:0}}

function renderPZ(){
if(!tp)initTP();if(!fm)initFM();
const el=document.getElementById('p1'),fl=Object.keys(tp.slots).length;
let rows='';TP_A.forEach(d=>{let cells=`<td style="font-weight:700">${d}°</td>`;['sin','cos','tan'].forEach(f=>{const k=d+'-'+f;
cells+=tp.slots[k]?`<td class="mono" style="color:var(--green);font-weight:700">${tp.slots[k]}</td>`:`<td><div class="slot${tp.sel!==null?' hi':''}" data-k="${k}" style="min-height:30px;margin:1px;font-size:11px;border-radius:6px;cursor:pointer">?</div></td>`});rows+=`<tr>${cells}</tr>`});

const fl2=Object.keys(fm.matched).length;
let frows=FM_I.map((it,i)=>`<div style="display:flex;gap:5px;align-items:center;margin:4px 0">
<div style="flex:0 0 36%;text-align:right;font-family:'SF Mono',monospace;font-size:12px;font-weight:600">${it.l}</div>
<div style="color:var(--dim);font-weight:900">=</div>
<div style="flex:1">${fm.matched[i]!==undefined?`<div class="slot ok" style="font-size:10px">${fm.matched[i]}</div>`:`<div class="slot${fm.sel!==null?' hi':''}" data-fi="${i}" style="font-size:10px;cursor:pointer">?</div>`}</div></div>`).join('');

el.innerHTML=`
<div class="cd"><h2>🧩 特殊角テーブルパズル</h2>
<p style="font-size:11px;color:var(--dim)">①値を選択 → ②表の?をタップ</p>
<div class="sts"><div class="s"><div class="n bb">${fl}/${tp.total}</div><div class="l">配置</div></div><div class="s"><div class="n gg">${tp.score}</div><div class="l">正解</div></div><div class="s"><div class="n rr">${tp.wrong}</div><div class="l">ミス</div></div></div>

let memoColor='#1c1c1e',memoWidth=2,memoOpen=false,memoData=null;
function setupMemo(){
const tog=document.getElementById('memoTog');
const wrap=document.getElementById('memoWrap');
const cv=document.getElementById('memoCv');
if(!tog||!cv)return;

// Restore state
if(memoOpen){wrap.classList.add('show');tog.classList.add('on')}

tog.onclick=()=>{H.tap();memoOpen=!memoOpen;wrap.classList.toggle('show');tog.classList.toggle('on');
if(memoOpen)initMemoCanvas()};

if(memoOpen)initMemoCanvas();
}

function initMemoCanvas(){
const cv=document.getElementById('memoCv');if(!cv)return;
const dpr=devicePixelRatio||1;
const rect=cv.getBoundingClientRect();
cv.width=rect.width*dpr;cv.height=rect.height*dpr;
const x=cv.getContext('2d');x.scale(dpr,dpr);
x.fillStyle='#fff';x.fillRect(0,0,rect.width,rect.height);
// Restore saved drawing
if(memoData){try{const img=new Image();img.onload=()=>{x.drawImage(img,0,0,rect.width,rect.height)};img.src=memoData}catch(e){}}
// Grid dots
x.fillStyle='#e5e5ea';
for(let gx=20;gx<rect.width;gx+=20)for(let gy=20;gy<rect.height;gy+=20){x.beginPath();x.arc(gx,gy,.5,0,TAU);x.fill()}

let drawing=false,lastX=0,lastY=0;
function getPos(e){const r=cv.getBoundingClientRect();
const touch=e.touches?e.touches[0]:e;
return{x:touch.clientX-r.left,y:touch.clientY-r.top,p:e.pressure||.5}}

function startDraw(e){e.preventDefault();drawing=true;const pos=getPos(e);lastX=pos.x;lastY=pos.y}
function moveDraw(e){if(!drawing)return;e.preventDefault();const pos=getPos(e);
const x=cv.getContext('2d');const dpr=devicePixelRatio||1;
const w=memoWidth*(e.pointerType==='pen'?pos.p*2.5:1);
x.save();x.setTransform(dpr,0,0,dpr,0,0);
x.strokeStyle=memoColor;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';
x.beginPath();x.moveTo(lastX,lastY);x.lineTo(pos.x,pos.y);x.stroke();
x.restore();lastX=pos.x;lastY=pos.y}
function endDraw(){if(drawing){drawing=false;try{memoData=cv.toDataURL()}catch(e){}}}

cv.addEventListener('pointerdown',startDraw);
cv.addEventListener('pointermove',moveDraw);
cv.addEventListener('pointerup',endDraw);
cv.addEventListener('pointerleave',endDraw);

// Color buttons
document.querySelectorAll('.memo-bar .mc').forEach(c=>{c.onclick=()=>{H.tap();memoColor=c.dataset.c;
document.querySelectorAll('.memo-bar .mc').forEach(b=>b.classList.remove('on'));c.classList.add('on')}});
// Width slider
const ws=document.getElementById('memoW');if(ws)ws.oninput=e=>{memoWidth=+e.target.value};
// Clear
const cl=document.getElementById('memoClear');if(cl)cl.onclick=()=>{H.tap();memoData=null;initMemoCanvas()};
}

<div class="cd"><h2>∂ 微分ビジュアライザ</h2>
<div class="vbar"><select id="vf">${FUNCS.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('')}</select>
<button class="pill${vz.showD?' on':''}" id="vtD">f'(x)表示</button>
<span style="font-size:10px;color:var(--dim)">x=</span><input type="range" id="vpt" min="0" max="1" step=".01" value=".5"></div>
<canvas class="viz" id="cvD" style="height:220px"></canvas>
<div id="dvV" style="font:600 12px 'SF Mono',monospace;color:var(--dim);padding:6px 0"></div></div>

<div class="cd"><h2>∞ パラメトリック曲線</h2>
<div class="vbar"><select id="vc">${CURVES.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('')}</select>
<span style="font-size:10px;color:var(--dim)">t=</span><input type="range" id="vctp" min="0" max="1" step=".005" value=".5"></div>
<canvas class="viz" id="cvC" style="height:220px"></canvas></div>`;

document.getElementById('vf').onchange=e=>{H.tap();vz.fi=+e.target.value;drawAllViz()};
document.getElementById('vtD').onclick=()=>{H.tap();vz.showD=!vz.showD;document.getElementById('vtD').classList.toggle('on');drawAllViz()};
document.getElementById('vpt').oninput=e=>{vz.pt=+e.target.value;drawAllViz()};
document.getElementById('vc').onchange=e=>{H.tap();vz.ci=+e.target.value;drawAllViz()};
document.getElementById('vctp').oninput=e=>{vz.ctp=+e.target.value;drawAllViz()};
// Drag on deriv canvas
let drag=false;
const cvD=document.getElementById('cvD');
cvD.addEventListener('pointerdown',()=>{drag=true});
window.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const r=cvD.getBoundingClientRect();const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));vz.pt=t;document.getElementById('vpt').value=t;drawAllViz()});
window.addEventListener('pointerup',()=>{drag=false});
}

function drawAllViz(){
drawDeriv();drawCurve();
}

function drawDeriv(){
const cv=document.getElementById('cvD');if(!cv)return;
const dpr=devicePixelRatio||1,rect=cv.getBoundingClientRect(),W=rect.width,Hh=rect.height;
cv.width=W*dpr;cv.height=Hh*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
x.fillStyle='#f8f8fa';x.fillRect(0,0,W,Hh);
const fn=FUNCS[vz.fi],pad=28,gw=W-pad*2,gh=Hh-pad*2;
const mx=v=>pad+(v-fn.x0)/(fn.x1-fn.x0)*gw;
const my=v=>pad+gh-(v-fn.y0)/(fn.y1-fn.y0)*gh;
// Grid
x.strokeStyle='#e5e5ea';x.lineWidth=.5;
for(let v=Math.ceil(fn.y0);v<=fn.y1;v++){const y=my(v);x.beginPath();x.moveTo(pad,y);x.lineTo(pad+gw,y);x.stroke()}
for(let v=Math.ceil(fn.x0);v<=fn.x1;v++){const xx=mx(v);x.beginPath();x.moveTo(xx,pad);x.lineTo(xx,pad+gh);x.stroke()}
x.strokeStyle='#c7c7cc';x.lineWidth=1;const y0=my(0),x0=mx(0);
if(y0>=pad&&y0<=pad+gh){x.beginPath();x.moveTo(pad,y0);x.lineTo(pad+gw,y0);x.stroke()}
if(x0>=pad&&x0<=pad+gw){x.beginPath();x.moveTo(x0,pad);x.lineTo(x0,pad+gh);x.stroke()}
// f(x)
const steps=400,dx=(fn.x1-fn.x0)/steps;let pX=null,pY=null;x.lineWidth=2.5;x.lineCap='round';
for(let i=0;i<=steps;i++){const a=fn.x0+i*dx;let v;try{v=fn.f(a)}catch(e){pX=null;continue}if(!isFinite(v)){pX=null;continue}
const sx=mx(a),sy=my(v);if(sy<pad-5||sy>pad+gh+5){pX=null;continue}
if(pX!==null){x.strokeStyle=lerpC('#ff2d55','#ff6b8a',i/steps);x.beginPath();x.moveTo(pX,pY);x.lineTo(sx,sy);x.stroke()}pX=sx;pY=sy}
// f'(x)
if(vz.showD){pX=null;for(let i=0;i<=steps;i++){const a=fn.x0+i*dx;let v;try{v=fn.df(a)}catch(e){pX=null;continue}if(!isFinite(v)){pX=null;continue}
const sx=mx(a),sy=my(v);if(sy<pad-5||sy>pad+gh+5){pX=null;continue}
if(pX!==null){x.strokeStyle=lerpC('#5ac8fa','#32ade6',i/steps);x.beginPath();x.moveTo(pX,pY);x.lineTo(sx,sy);x.stroke()}pX=sx;pY=sy}}
// Point + tangent
const pt=fn.x0+(fn.x1-fn.x0)*vz.pt,fv=fn.f(pt),dv=fn.df(pt);
if(isFinite(fv)&&isFinite(dv)){const tanFn=a=>fv+dv*(a-pt);x.strokeStyle='#ff950055';x.lineWidth=1.5;x.setLineDash([5,4]);
x.beginPath();x.moveTo(mx(fn.x0),my(tanFn(fn.x0)));x.lineTo(mx(fn.x1),my(tanFn(fn.x1)));x.stroke();x.setLineDash([]);
const sx=mx(pt),sy=my(fv);x.fillStyle='#1c1c1e';x.beginPath();x.arc(sx,sy,5,0,TAU);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(sx,sy,2.5,0,TAU);x.fill()}
x.font='bold 11px -apple-system';x.fillStyle='#ff2d55';x.fillText('f(x)='+fn.name,pad+4,pad+13);
if(vz.showD){x.fillStyle='#5ac8fa';x.fillText("f'(x)",pad+4,pad+27)}
const dvV=document.getElementById('dvV');if(dvV)dvV.innerHTML=`<span style="color:#ff2d55">f(${fmt(pt)})=${fmt(fv)}</span>　<span style="color:#5ac8fa">f'(${fmt(pt)})=${fmt(dv)}</span>　<span style="color:#ff9500">傾き=${fmt(dv)}</span>`;
}

function drawCurve(){
const cv=document.getElementById('cvC');if(!cv)return;
const dpr=devicePixelRatio||1,rect=cv.getBoundingClientRect(),W=rect.width,Hh=rect.height;
cv.width=W*dpr;cv.height=Hh*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
x.fillStyle='#f8f8fa';x.fillRect(0,0,W,Hh);
const cr=CURVES[vz.ci],pad=28,gw=W-pad*2,gh=Hh-pad*2;
const x0=cr.xc-cr.xr,x1=cr.xc+cr.xr,y0=cr.yc-cr.yr,y1=cr.yc+cr.yr;
const mx=v=>pad+(v-x0)/(x1-x0)*gw;
const my=v=>pad+gh-(v-y0)/(y1-y0)*gh;
x.strokeStyle='#e5e5ea';x.lineWidth=.5;const ax=mx(0),ay=my(0);
if(ax>=pad&&ax<=pad+gw){x.beginPath();x.moveTo(ax,pad);x.lineTo(ax,pad+gh);x.stroke()}
if(ay>=pad&&ay<=pad+gh){x.beginPath();x.moveTo(pad,ay);x.lineTo(pad+gw,ay);x.stroke()}
const steps=800,dt=(cr.t1-cr.t0)/steps;let pX=null,pY=null;x.lineWidth=2.5;x.lineCap='round';
for(let i=0;i<=steps;i++){const t=cr.t0+i*dt,vx=cr.fx(t),vy=cr.fy(t);if(!isFinite(vx)||!isFinite(vy)){pX=null;continue}
const sx=mx(vx),sy=my(vy);if(pX!==null){x.strokeStyle=lerpC('#af52de','#da7cff',i/steps);x.beginPath();x.moveTo(pX,pY);x.lineTo(sx,sy);x.stroke()}pX=sx;pY=sy}
const tV=cr.t0+(cr.t1-cr.t0)*vz.ctp,ptx=cr.fx(tV),pty=cr.fy(tV);
if(isFinite(ptx)&&isFinite(pty)){const sx=mx(ptx),sy=my(pty);x.fillStyle='#1c1c1e';x.beginPath();x.arc(sx,sy,5,0,TAU);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(sx,sy,2.5,0,TAU);x.fill()}
x.font='11px -apple-system';x.fillStyle='#af52de';x.fillText(`${cr.name}  t=${fmt(tV)}  (${fmt(ptx)}, ${fmt(pty)})`,pad+4,pad+13);
}

// ===== INIT =====
renderNav();renderInput();initTP();initFM();renderPZ();renderQMenu();buildViz();showPage();
setTimeout(drawAllViz,100);
</script>

</body>
</html>
