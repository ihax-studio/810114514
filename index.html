<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neosaurs - ローカル版</title>
    <style>
        /* css2ファイルの内容 */
        @font-face {
            font-family: 'Orbitron';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(https://fonts.gstatic.com/s/orbitron/v35/yMJRMIlzdpvBhQQL_Qq7dy1biN15.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Orbitron';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url(https://fonts.gstatic.com/s/orbitron/v35/yMJRMIlzdpvBhQQL_Qq7dy1biN15.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* スタイルシートの主要部分 */
        .no-scroll{overflow:hidden;height:100vh;height:100dvh}
        html{height:100%;height:100vh;height:100dvh;height:100lvh;height:-webkit-fill-available;width:100%;width:100vw;width:100dvw;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;overscroll-behavior:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);padding:0}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro',sans-serif;overflow:hidden;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 100%);color:#fff;transform:scale(0.8);opacity:0;transition:transform 1s cubic-bezier(0.22,1,0.36,1),opacity 1s ease;overscroll-behavior:none;touch-action:manipulation;height:100%;height:100vh;height:100dvh;height:100lvh;height:-webkit-fill-available;min-height:100vh;min-height:100dvh;min-height:100lvh;min-height:-webkit-fill-available;width:100%;width:100vw;width:100dvw;position:fixed;top:0;left:0;right:0;bottom:0;padding:0;margin:0;border:none;outline:none;box-shadow:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
        body.loaded{transform:scale(1);opacity:1}
        .sf-font{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro',sans-serif}
        canvas{display:block;width:100vw !important;width:100dvw !important;height:100vh !important;height:100dvh !important;height:100lvh !important;max-width:none !important;max-height:none !important;touch-action:none;position:fixed;top:0;left:0;right:0;bottom:0}
        input, textarea { -webkit-user-select: text !important; user-select: text !important; }

        .menu{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;padding:2rem;padding-top:calc(env(safe-area-inset-top,0px) + 2rem);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
        .glow-text{font-size:4rem;font-weight:900;color:#00ff88;text-shadow:0 0 40px rgba(0,255,136,0.5),0 0 80px rgba(0,204,255,0.3);margin-bottom:0.5rem;opacity:1}
        .subtitle{font-size:1.5rem;color:rgba(255,255,255,0.7);margin-bottom:2rem;letter-spacing:0.3em;opacity:1}
        .platform-badge{padding:0.5rem 1.5rem;background:rgba(0,255,136,0.2);border-radius:30px;border:1px solid rgba(0,255,136,0.4);font-size:0.9rem;margin-bottom:2rem;text-transform:uppercase;letter-spacing:0.1em;opacity:1;transition:height 0.3s ease,padding 0.3s ease,max-height 0.3s ease;text-align:center;max-width:90vw;word-break:break-word}
        .liquid-button{padding:1rem 3rem;font-size:1.2rem;font-weight:700;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.2);border-radius:50px;color:#fff;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);margin:0.5rem;text-transform:uppercase;letter-spacing:0.1em;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;width:auto;max-width:90vw;flex-shrink:0}
        .liquid-button::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,0.2);transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s}
        .liquid-button:hover::before{width:300px;height:300px}
        .liquid-button:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(0,255,136,0.3);border-color:rgba(0,255,136,0.6);transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease}
        .liquid-button:active{transform:translateY(0) scale(0.95)}
        .liquid-button.primary{background:linear-gradient(135deg,rgba(0,255,136,0.3),rgba(0,204,255,0.3));border-color:rgba(0,255,136,0.5)}

        /* Rainbowモード */
        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }
        body.rainbow-bg {
            background: linear-gradient(135deg,
                #ff006640, #ff880040, #ffff0040, #00ff0040,
                #0088ff40, #4400ff40, #ff00ff40, #ff006640) !important;
            background-size: 400% 400% !important;
            animation: rainbowShift 8s ease infinite !important;
        }
        body.rainbow-bg .menu {
            background: rgba(0,0,0,0.3) !important;
        }

        .debug-info{
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #00ff88;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10000;
            max-width: 300px;
            line-height: 1.5;
        }
        .debug-status{
            margin: 5px 0;
        }
        .status-ok{
            color: #00ff88;
        }
        .status-warn{
            color: #ffaa00;
        }
        .status-error{
            color: #ff4444;
        }
    </style>
</head>
<body class="loaded">
    <div class="menu">
        <div class="glow-text">Neosaurs</div>
        <div class="subtitle">GAME</div>
        <div class="platform-badge">ローカルテスト版</div>
        
        <button class="liquid-button primary" id="welcomeStartButton">🎮 スタート</button>
        <button class="liquid-button" id="welcomeEditorButton">✏️ エディタ</button>
        <button class="liquid-button" id="welcomeSettingsButton">⚙️ 設定</button>
        
        <div style="margin-top: 2rem; font-size: 0.9rem; color: rgba(255,255,255,0.5);">
            <p>デバッグ情報:</p>
            <div id="debug-container"></div>
        </div>
    </div>

    <div id="debug-panel" class="debug-info">
        <div style="font-weight: bold; margin-bottom: 8px;">🔧 ローカル版</div>
        <div class="debug-status status-ok">✓ HTMLロード完了</div>
        <div class="debug-status status-ok">✓ CSSロード完了</div>
        <div id="three-status" class="debug-status status-warn">⏳ Three.jsロード中...</div>
        <div style="margin-top: 8px; font-size: 10px; opacity: 0.7;">
            <div id="memory-info">メモリ: 測定中...</div>
            <div id="fps-info">FPS: --</div>
        </div>
    </div>

    <script>
        // デバッグログシステム
        const debugLog = {
            addStatus: function(elementId, message, status = 'ok') {
                const el = document.getElementById(elementId);
                if (el) {
                    const statusClass = status === 'ok' ? 'status-ok' : status === 'error' ? 'status-error' : 'status-warn';
                    el.innerHTML = `<span class="${statusClass}">
                        ${status === 'ok' ? '✓' : status === 'error' ? '✗' : '⏳'} ${message}
                    </span>`;
                }
            },
            init: function() {
                console.log('[Neosaurs Local] スタート');
                this.addStatus('three-status', 'Three.jsなし（スタブモード）', 'warn');
            }
        };

        debugLog.init();

        // ボタンイベント
        document.getElementById('welcomeStartButton')?.addEventListener('click', function() {
            alert('🎮 ゲームモード\n\nローカル版ではまだ実装されていません。');
        });

        document.getElementById('welcomeEditorButton')?.addEventListener('click', function() {
            alert('✏️ エディタモード\n\nローカル版ではまだ実装されていません。');
        });

        document.getElementById('welcomeSettingsButton')?.addEventListener('click', function() {
            alert('⚙️ 設定\n\nローカル版ではまだ実装されていません。');
        });

        // FPS監視
        let frameCount = 0;
        let lastTime = performance.now();
        function updateFPS() {
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                const fps = frameCount;
                document.getElementById('fps-info').textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = now;
            }
            requestAnimationFrame(updateFPS);
        }
        requestAnimationFrame(updateFPS);

        // メモリ情報（対応ブラウザのみ）
        if (performance.memory) {
            setInterval(function() {
                const used = Math.round(performance.memory.usedJSHeapSize / 1048576);
                const limit = Math.round(performance.memory.jsHeapSizeLimit / 1048576);
                document.getElementById('memory-info').textContent = `メモリ: ${used}MB/${limit}MB`;
            }, 1000);
        }

        // ローカル環境確認
        console.log('=== Neosaurs Local Debug ===');
        console.log('Protocol:', window.location.protocol);
        console.log('URL:', window.location.href);
        console.log('Environment:', window.location.protocol === 'file:' ? 'File System' : 'HTTP Server');
        
        if (window.location.protocol === 'file:') {
            console.warn('⚠️ File:// プロトコルで実行中です。いくつかのAPIが制限される可能性があります。');
            debugLog.addStatus('three-status', 'File://プロトコル - 一部機能制限', 'warn');
        }
    </script>
</body>
</html>
