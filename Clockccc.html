<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時計アプリ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            color: white;
            font-family: 'Arial', sans-serif;
            flex-direction: column;
            overflow: hidden;
        }
        #analog-clock {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background-color: transparent;
            border: 5px solid white;
            margin-bottom: 20px;
        }
        #analog-clock .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            transition: all 0.5s ease-in-out;
        }
        #analog-clock .hour {
            width: 4px;
            height: 30%;
            background-color: white;
            transform-origin: 50% 100%;
        }
        #analog-clock .minute {
            width: 3px;
            height: 40%;
            background-color: white;
            transform-origin: 50% 100%;
        }
        #analog-clock .second {
            width: 2px;
            height: 45%;
            background-color: red;
            transform-origin: 50% 100%;
        }

        #digital-clock {
            font-size: 3rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="analog-clock">
        <div class="hand hour" id="hour-hand"></div>
        <div class="hand minute" id="minute-hand"></div>
        <div class="hand second" id="second-hand"></div>
    </div>
    <div id="digital-clock"></div>

    <script>
        function updateClock() {
            const now = new Date();
            const japanTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));

            // アナログ時計
            const hours = japanTime.getHours() % 12; // 12時間制
            const minutes = japanTime.getMinutes();
            const seconds = japanTime.getSeconds();

            const hourDeg = (hours * 30) + (minutes / 2); // 時針の角度
            const minuteDeg = minutes * 6; // 分針の角度
            const secondDeg = seconds * 6; // 秒針の角度

            document.getElementById('hour-hand').style.transform = `rotate(${hourDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `rotate(${minuteDeg}deg)`;
            document.getElementById('second-hand').style.transform = `rotate(${secondDeg}deg)`;

            // デジタル時計
            const timeString = japanTime.toLocaleTimeString('ja-JP', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            });
            document.getElementById('digital-clock').textContent = timeString;
        }

        setInterval(updateClock, 1000); // 1秒ごとに更新

        // 初回の呼び出し
        updateClock();
    </script>
</body>
</html>
