<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>iScribe</title>
<script type="module">
import { haptic } from "https://esm.sh/ios-haptics";
const noop = () => {};
window.haptic = haptic || {};
['error','success','warning','impact','selection','notification','confirm'].forEach(m => {
    if (typeof window.haptic[m] !== 'function') window.haptic[m] = noop;
});
</script>
<link rel="stylesheet" href="cards.css">
</head>
<body>
<div id="bg-layer"></div>
<div id="thanks-dots"></div>
<div class="memo-list" id="memo-list"></div>
<div class="bottom-nav">
    <div class="static-left">
        <button class="action-btn" id="file-toggle" style="font-size:26px;">📁</button>
    </div>
    <div class="content-layers">
        <div class="file-actions-layer" id="file-layer">
            <button class="file-btn-item" id="load-btn">↑</button>
            <button class="file-btn-item" id="save-btn">↓</button>
        </div>
        <div class="nav-wrapper" id="nav-wrapper">
            <div class="input-stack" id="input-stack">
                <textarea id="memo-input" placeholder="いまどうしてる？" rows="1"></textarea>
                <div id="file-name-display"></div>
            </div>
            <button class="action-btn" id="comp-btn" style="font-size:22px;">📎</button>
            <button id="add-btn" style="background:var(--twitter-blue);color:white;border:none;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;">→</button>
        </div>
    </div>
</div>
<div id="action-overlay">
    <div class="action-card">
        <p style="margin:0 0 5px 0;font-weight:bold;font-size:14px;color:#888;">メニュー</p>
        <button class="menu-btn lock" id="trigger-lock">🔒 ロック</button>
        <button class="menu-btn delete" id="trigger-delete">🗑 削除</button>
        <button class="menu-btn cancel" id="cancel-action">キャンセル</button>
    </div>
</div>
<div id="lock-confirm-overlay">
    <div class="lock-confirm-content">
        <div style="font-size:60px;margin-bottom:40px">🔒</div>
        <div class="lock-confirm-title">Face ID/Optic ID でロックされます...</div>
        <div class="lock-confirm-desc">Touch ID/Face ID/Optic IDが設定されていない場合<br>メモはロックされ、表示できなくなります</div>
        <div style="width:100%">
            <button class="slide-up-btn primary" id="lock-confirm-btn">続ける</button>
            <button class="slide-up-btn secondary" id="lock-cancel-btn">キャンセル</button>
        </div>
    </div>
</div>
<input type="file" id="load-file-input" accept=".json,.png" style="display:none;">
<input type="file" id="iframe-file-input" accept=".html,.mp3,.wav" style="display:none;">
<script>
const CACHE_KEY='memo-pro-v6-data';
let memos=[];let currentBgData=null;let iframeFile=null;let selectedMemoId=null;
const fileToggle=document.getElementById('file-toggle');
const navWrapper=document.getElementById('nav-wrapper');
const memoInput=document.getElementById('memo-input');
const addBtn=document.getElementById('add-btn');
const compBtn=document.getElementById('comp-btn');
const inputStack=document.getElementById('input-stack');
const fileNameDisplay=document.getElementById('file-name-display');
const bottomNav=document.querySelector('.bottom-nav');
const bgLayer=document.getElementById('bg-layer');
const hapticConfirm=()=>window.haptic.confirm();
const hapticSelect=()=>window.haptic.selection();
const hapticError=()=>window.haptic.error();
fileToggle.onclick=()=>{
    const o=!navWrapper.classList.contains('file-mode');
    navWrapper.classList.toggle('file-mode');
    document.getElementById('file-layer').classList.toggle('visible');
    fileToggle.style.opacity=0;
    setTimeout(()=>{fileToggle.innerText=o?'📂':'📁';fileToggle.style.opacity=1;},250);
    hapticSelect();
};
function setBackground(d){currentBgData=d;bgLayer.style.backgroundImage=`url("${d}")`;bgLayer.classList.remove('active');setTimeout(()=>bgLayer.classList.add('active'),50);}
addBtn.onclick=()=>{
    const text=memoInput.value.trim();
    if(text===''&&!iframeFile){hapticError();bottomNav.classList.add('shake-error');setTimeout(()=>bottomNav.classList.remove('shake-error'),500);return;}
    hapticConfirm();
    const m={id:Date.now().toString(),text,createdAt:new Date().toISOString(),liked:false,locked:false,htmlContent:null,audioSrc:null,fileType:null};
    if(iframeFile){
        const r=new FileReader();const isA=iframeFile.type.startsWith('audio/');m.fileType=iframeFile.type;
        r.onload=e=>{if(isA)m.audioSrc=e.target.result;else m.htmlContent=e.target.result;memos.unshift(m);finishPost();};
        if(isA)r.readAsDataURL(iframeFile);else r.readAsText(iframeFile);
    }else{memos.unshift(m);finishPost();}
};
function finishPost(){memoInput.value='';iframeFile=null;compBtn.innerText='📎';inputStack.classList.remove('attaching');memoInput.style.height='40px';saveData();renderMemos();}
function renderMemos(){
    const list=document.getElementById('memo-list');list.innerHTML='';
    memos.forEach(memo=>{
        const el=document.createElement('div');
        el.className=`memo-item ${memo.locked?'locked':''}`;
        let fc='';
        if(!memo.locked){
            if(memo.htmlContent)fc=`<iframe class="memo-iframe" srcdoc="${memo.htmlContent.replace(/"/g,'&quot;')}"></iframe>`;
            else if(memo.audioSrc)fc=`<audio controls src="${memo.audioSrc}" style="width:100%;margin-top:8px;"></audio>`;
        }
        el.innerHTML=`<div class="memo-content"><p style="margin:0;font-size:15px;white-space:pre-wrap;">${memo.locked?'Locked Content':memo.text}</p>${fc}</div><div class="memo-actions"><button class="action-btn like-btn">${memo.liked?'❤️':'🤍'}</button></div>${memo.locked?`<div class="lock-overlay-display" onclick="unlockMemo('${memo.id}',this)"><div style="font-size:40px">🔒</div></div>`:''}`;
        let timer;
        const start=()=>{if(memo.locked)return;timer=setTimeout(()=>{window.haptic.impact();showActionMenu(memo.id);},400);};
        el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchend',()=>clearTimeout(timer));
        el.querySelector('.like-btn').onclick=e=>{e.stopPropagation();memo.liked=!memo.liked;saveData();renderMemos();hapticSelect();};
        list.appendChild(el);
        setTimeout(()=>{el.style.opacity='1';el.style.transform='translateY(0) scale(1)';},10);
    });
}
function showActionMenu(id){selectedMemoId=id;const o=document.getElementById('action-overlay');o.style.display='flex';setTimeout(()=>o.classList.add('visible'),10);}
function hideActionMenu(){const o=document.getElementById('action-overlay');o.classList.remove('visible');setTimeout(()=>{o.style.display='none';},300);}
document.getElementById('cancel-action').onclick=()=>{hapticConfirm();hideActionMenu();};
document.getElementById('trigger-delete').onclick=()=>{hapticConfirm();memos=memos.filter(m=>m.id!==selectedMemoId);saveData();renderMemos();hideActionMenu();};
const lockOv=document.getElementById('lock-confirm-overlay');
document.getElementById('trigger-lock').onclick=()=>{hapticConfirm();hideActionMenu();lockOv.style.display='flex';setTimeout(()=>lockOv.classList.add('visible'),10);};
document.getElementById('lock-cancel-btn').onclick=()=>{hapticConfirm();lockOv.classList.remove('visible');setTimeout(()=>{lockOv.style.display='none';},300);};
document.getElementById('lock-confirm-btn').onclick=()=>{hapticConfirm();const m=memos.find(m=>m.id===selectedMemoId);if(m){m.locked=true;saveData();renderMemos();}document.getElementById('lock-cancel-btn').click();};
window.unlockMemo=async(id,el)=>{
    hapticSelect();
    try{
        const c=new Uint8Array(32);crypto.getRandomValues(c);
        const u=new Uint8Array(16);crypto.getRandomValues(u);
        await navigator.credentials.create({publicKey:{challenge:c,rp:{name:'Memo Pro'},user:{id:u,name:'user@memo.pro',displayName:'User'},pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
        window.haptic.success();
        el.style.transition='opacity 0.5s';el.style.opacity='0';
        setTimeout(()=>{const m=memos.find(m=>m.id===id);if(m){m.locked=false;saveData();renderMemos();}},500);
    }catch(e){hapticError();const p=el.parentElement;p.classList.add('shake-error');setTimeout(()=>p.classList.remove('shake-error'),500);}
};
function saveData(){localStorage.setItem(CACHE_KEY,JSON.stringify(memos));}
function loadData(){const d=localStorage.getItem(CACHE_KEY);if(d){memos=JSON.parse(d);renderMemos();}}
document.getElementById('save-btn').onclick=()=>{hapticError();const d={version:2.1,background:currentBgData,memos};const b=new Blob([JSON.stringify(d)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`memo_${Date.now()}.json`;a.click();fileToggle.click();};
document.getElementById('load-btn').onclick=()=>{hapticError();document.getElementById('load-file-input').click();};
document.getElementById('load-file-input').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.name.endsWith('.json')){const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);memos=p.memos||p;if(p.background)setBackground(p.background);saveData();renderMemos();fileToggle.click();}catch(err){alert('Invalid');}};r.readAsText(f);}else if(f.type==='image/png'){const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=150/img.height;c.width=img.width*s;c.height=150;c.getContext('2d').drawImage(img,0,0,c.width,150);setBackground(c.toDataURL('image/png'));};img.src=ev.target.result;};r.readAsDataURL(f);fileToggle.click();}e.target.value='';};
compBtn.onclick=()=>{hapticError();if(iframeFile){iframeFile=null;compBtn.innerText='📎';inputStack.classList.remove('attaching');}else{document.getElementById('iframe-file-input').click();}};
document.getElementById('iframe-file-input').onchange=e=>{if(e.target.files[0]){const f=e.target.files[0];iframeFile=f;compBtn.innerText='🖇️';fileNameDisplay.innerText=`📄 ${f.name}`;inputStack.classList.add('attaching');hapticSelect();}};
memoInput.oninput=()=>{memoInput.style.height='40px';memoInput.style.height=Math.min(memoInput.scrollHeight,120)+'px';};
loadData();
</script>
</body>
</html>
