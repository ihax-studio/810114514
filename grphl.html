<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trigonometric Graphs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0a0a10;
    overflow-x: hidden;
    min-height: 100dvh;
    touch-action: manipulation;
    font-family: 'Courier New', monospace;
  }
  .title {
    text-align: center;
    padding: 14px 0 2px;
    font-size: 18px;
    letter-spacing: 5px;
    color: #d080d0;
    font-family: 'Times New Roman', serif;
    font-style: italic;
  }
  canvas { display: block; width: 100%; }
  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid #333;
    background: rgba(255,255,255,0.04);
    color: #aaa;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .ctrl-btn.active { border-color: #777; color: #fff; background: rgba(255,255,255,0.08); }
  .ctrl-btn:active { transform: scale(0.95); }
  .speed-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 2px 16px 8px;
  }
  .speed-btn {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 14px;
    border: 1px solid #252525;
    background: transparent;
    color: #555;
    cursor: pointer;
    transition: all 0.2s;
  }
  .speed-btn.active { border-color: #555; color: #bbb; }
  .speed-btn:active { transform: scale(0.95); }
  .angle-info {
    text-align: center;
    font-size: 13px;
    color: #666;
    padding: 0 0 8px;
    font-family: 'Courier New', monospace;
  }
  .angle-info span { color: #bbb; }
</style>
</head>
<body>

<div class="title">Trigonometric Graphs</div>
<div class="angle-info">θ = <span id="degVal">0°</span> = <span id="radVal">0</span> rad</div>

<div class="controls">
  <button class="ctrl-btn active" id="playBtn">▶ Play</button>
  <button class="ctrl-btn" id="resetBtn">↺ Reset</button>
</div>
<div class="speed-row">
  <button class="speed-btn" data-speed="0.3">0.3×</button>
  <button class="speed-btn active" data-speed="0.7">0.7×</button>
  <button class="speed-btn" data-speed="1.2">1.2×</button>
  <button class="speed-btn" data-speed="2.5">2.5×</button>
</div>

<canvas id="c"></canvas>

<script type="module">
import { haptic } from 'https://esm.sh/ios-haptics'

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 2;
const PI = Math.PI, TAU = PI * 2;

let angle = 0, playing = true, speed = 0.7, dragging = false, lastTime = 0;

const SIN = { main: '#4aeabc', dim: 'rgba(74,234,188,0.18)' };
const COS = { main: '#8b7aff', dim: 'rgba(139,122,255,0.18)' };
const TAN = { main: '#ff6e9c', dim: 'rgba(255,110,156,0.18)' };
const AXIS_C = '#2a2a3c';
const GRID_C = '#161620';

let W, rowH;

function resize() {
  W = Math.min(window.innerWidth, 560);
  rowH = W * 0.54;
  canvas.style.width = W + 'px';
  canvas.style.height = (rowH * 3) + 'px';
  canvas.width = W * dpr;
  canvas.height = rowH * 3 * dpr;
}

function s(v) { return v * dpr; } // scale helper

function drawRow(idx, label, fn, col) {
  ctx.save();
  ctx.translate(0, idx * rowH * s(1));
  const rW = s(W), rH = s(rowH);

  // Layout
  const cx = rW * 0.185, cy = rH * 0.52;
  const R = Math.min(rW * 0.155, rH * 0.36);
  const gL = rW * 0.40, gR = rW - s(10), gW = gR - gL;
  const gCY = cy, gAmp = R * 0.88;
  const isTan = label === 'tan';
  const tanScale = isTan ? 0.45 : 1;

  // --- Background grid ---
  ctx.strokeStyle = GRID_C;
  ctx.lineWidth = s(1);
  for (let i = 0; i <= 4; i++) {
    const x = gL + (i / 4) * gW;
    ctx.beginPath(); ctx.moveTo(x, gCY - gAmp * 1.4); ctx.lineTo(x, gCY + gAmp * 1.4); ctx.stroke();
  }
  for (let v = -1; v <= 1; v++) {
    const y = gCY - v * gAmp;
    ctx.beginPath(); ctx.moveTo(gL, y); ctx.lineTo(gR, y); ctx.stroke();
  }

  // --- Axes ---
  ctx.strokeStyle = AXIS_C;
  ctx.lineWidth = s(1.2);
  ctx.beginPath(); ctx.moveTo(gL, gCY); ctx.lineTo(gR, gCY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(gL, gCY - gAmp * 1.4); ctx.lineTo(gL, gCY + gAmp * 1.4); ctx.stroke();
  // Circle axes
  ctx.beginPath(); ctx.moveTo(cx - R * 1.25, cy); ctx.lineTo(cx + R * 1.25, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - R * 1.25); ctx.lineTo(cx, cy + R * 1.25); ctx.stroke();

  // --- Axis labels ---
  ctx.font = `${s(9)}px Courier New`;
  ctx.fillStyle = '#444';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('0', gL, gCY + gAmp * 1.4 + s(3));
  ctx.fillText('π', gL + gW * 0.5, gCY + gAmp * 1.4 + s(3));
  ctx.fillText('2π', gR, gCY + gAmp * 1.4 + s(3));
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('1', gL - s(5), gCY - gAmp);
  ctx.fillText('-1', gL - s(5), gCY + gAmp);
  if (isTan) {
    ctx.fillText('2', gL - s(5), gCY - gAmp * 2 * tanScale);
    ctx.fillText('-2', gL - s(5), gCY + gAmp * 2 * tanScale);
  }

  // --- Label ---
  ctx.font = `bold ${s(15)}px Courier New`;
  ctx.fillStyle = col.main;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(label + 'θ', s(8), s(8));

  // --- Unit circle ---
  ctx.strokeStyle = col.main;
  ctx.lineWidth = s(1.6);
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;

  // --- Current angle ---
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const pX = cx + R * cosA, pY = cy - R * sinA;

  // Angle arc
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = s(1);
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.2, 0, -angle, angle > 0);
  ctx.stroke();

  // Radius (dashed)
  ctx.strokeStyle = '#555';
  ctx.lineWidth = s(1);
  ctx.setLineDash([s(3), s(3)]);
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(pX, pY); ctx.stroke();
  ctx.setLineDash([]);

  // Function-specific line on circle
  ctx.strokeStyle = col.main;
  ctx.lineWidth = s(2.5);
  ctx.shadowColor = col.main;
  ctx.shadowBlur = s(6);
  if (label === 'sin') {
    ctx.beginPath(); ctx.moveTo(pX, cy); ctx.lineTo(pX, pY); ctx.stroke();
  } else if (label === 'cos') {
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(pX, cy); ctx.stroke();
  } else if (label === 'tan' && Math.abs(cosA) > 0.03) {
    const tanV = sinA / cosA;
    const tY = cy - R * Math.max(-3.5, Math.min(3.5, tanV));
    ctx.beginPath(); ctx.moveTo(cx + R, cy); ctx.lineTo(cx + R, tY); ctx.stroke();
    // Dashed extended
    ctx.shadowBlur = 0;
    ctx.strokeStyle = col.dim;
    ctx.lineWidth = s(1);
    ctx.setLineDash([s(3), s(3)]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R, tY); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.shadowBlur = 0;

  // --- Point on circle ---
  ctx.beginPath(); ctx.arc(pX, pY, s(5), 0, TAU);
  ctx.fillStyle = col.main;
  ctx.shadowColor = col.main; ctx.shadowBlur = s(12);
  ctx.fill(); ctx.shadowBlur = 0;

  // --- Graph: faint full curve ---
  const steps = 500;
  ctx.strokeStyle = col.dim;
  ctx.lineWidth = s(1.5);
  ctx.beginPath();
  let first = true;
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    let v = fn(a);
    if (isTan && Math.abs(v) > 4) { first = true; continue; }
    const x = gL + (i / steps) * gW;
    const y = gCY - Math.max(-3.5, Math.min(3.5, v)) * gAmp * tanScale;
    if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // --- Graph: bright curve up to angle ---
  const norm = ((angle % TAU) + TAU) % TAU;
  const activeSteps = Math.ceil((norm / TAU) * steps);
  ctx.strokeStyle = col.main;
  ctx.lineWidth = s(2.8);
  ctx.shadowColor = col.main; ctx.shadowBlur = s(5);
  ctx.beginPath();
  first = true;
  for (let i = 0; i <= activeSteps; i++) {
    const a = (i / steps) * TAU;
    let v = fn(a);
    if (isTan && Math.abs(v) > 4) { first = true; continue; }
    const x = gL + (i / steps) * gW;
    const y = gCY - Math.max(-3.5, Math.min(3.5, v)) * gAmp * tanScale;
    if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // --- Dashed connection: circle point → graph point ---
  const curV = fn(angle);
  const gX = gL + (norm / TAU) * gW;
  const clampedV = Math.max(-3.5, Math.min(3.5, curV));
  const gY = gCY - clampedV * gAmp * tanScale;

  if (!isTan || Math.abs(curV) < 4) {
    ctx.strokeStyle = col.main;
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = s(1);
    ctx.setLineDash([s(4), s(4)]);
    ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(gX, gY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // Graph point
    ctx.beginPath(); ctx.arc(gX, gY, s(4.5), 0, TAU);
    ctx.fillStyle = col.main;
    ctx.shadowColor = col.main; ctx.shadowBlur = s(10);
    ctx.fill(); ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function updateAngleInfo() {
  const norm = ((angle % TAU) + TAU) % TAU;
  const deg = (norm * 180 / PI);
  document.getElementById('degVal').textContent = deg.toFixed(1) + '°';

  const frac = norm / PI;
  const nice = [
    [0,'0'],[1/6,'π/6'],[1/4,'π/4'],[1/3,'π/3'],[1/2,'π/2'],
    [2/3,'2π/3'],[3/4,'3π/4'],[5/6,'5π/6'],[1,'π'],
    [7/6,'7π/6'],[5/4,'5π/4'],[4/3,'4π/3'],[3/2,'3π/2'],
    [5/3,'5π/3'],[7/4,'7π/4'],[11/6,'11π/6'],[2,'2π']
  ];
  let radStr = norm.toFixed(2);
  for (const [k, v] of nice) {
    if (Math.abs(frac - k) < 0.015) { radStr = v; break; }
  }
  document.getElementById('radVal').textContent = radStr;
}

function frame(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.1);
  lastTime = ts;
  if (playing && !dragging) angle += speed * dt;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawRow(0, 'sin', Math.sin, SIN);
  drawRow(1, 'cos', Math.cos, COS);
  drawRow(2, 'tan', Math.tan, TAN);

  // Separators
  ctx.strokeStyle = '#1a1a28';
  ctx.lineWidth = s(1);
  for (let i = 1; i < 3; i++) {
    const y = i * rowH * dpr;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s(W), y); ctx.stroke();
  }

  updateAngleInfo();
  requestAnimationFrame(frame);
}

// --- Touch/Mouse ---
function angleFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const ex = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const ey = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const row = Math.floor(ey / rowH);
  if (row < 0 || row > 2) return null;
  const ry = ey - row * rowH;

  // Check circle area
  const cx = W * 0.185, cy = rowH * 0.52;
  const R = Math.min(W * 0.155, rowH * 0.36);
  const dx = ex - cx, dy = -(ry - cy);
  if (Math.sqrt(dx*dx + dy*dy) < R * 2.5) {
    let a = Math.atan2(dy, dx);
    if (a < 0) a += TAU;
    return a;
  }

  // Check graph area
  const gL = W * 0.40, gR = W - 10;
  if (ex >= gL - 20 && ex <= gR + 10) {
    return Math.max(0, Math.min(TAU, ((ex - gL) / (gR - gL)) * TAU));
  }
  return null;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const a = angleFromEvent(e);
  if (a !== null) { dragging = true; angle = a; try{haptic()}catch(e){} }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (!dragging) return;
  e.preventDefault();
  const a = angleFromEvent(e);
  if (a !== null) angle = a;
}, { passive: false });

window.addEventListener('touchend', () => { if(dragging){dragging=false;try{haptic()}catch(e){}} });

canvas.addEventListener('mousedown', e => {
  const a = angleFromEvent(e);
  if (a !== null) { dragging = true; angle = a; }
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  const a = angleFromEvent(e);
  if (a !== null) angle = a;
});
window.addEventListener('mouseup', () => { dragging = false; });

// Controls
const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '▶ Play' : '❚❚ Pause';
  playBtn.classList.toggle('active', playing);
  try{haptic()}catch(e){}
});

document.getElementById('resetBtn').addEventListener('click', () => {
  angle = 0; try{haptic()}catch(e){}
});

document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    speed = parseFloat(btn.dataset.speed);
    try{haptic()}catch(e){}
  });
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>

</body>
</html>
