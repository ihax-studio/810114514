<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Visualizer</title>
<style>
    :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --primary: #0a84ff;
        --text: #ffffff;
        --text-dim: #8e8e93;
        --border: #333333;
    }
    body {
        margin: 0; padding: 0;
        background-color: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden; touch-action: none; /* スクロール防止 */
    }
    #canvas-container {
        position: absolute; top: 0; left: 0; right: 0; bottom: 140px;
    }
    canvas {
        width: 100%; height: 100%; display: block;
    }
    /* コントロールパネル */
    #controls {
        position: absolute; bottom: 70px; left: 0; right: 0; height: 70px;
        background-color: var(--surface); border-top: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 0 15px; overflow-x: auto; white-space: nowrap;
    }
    select, input[type="range"], button {
        background: #2c2c2e; color: var(--text); border: none;
        padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none;
    }
    input[type="range"] { padding: 0; width: 120px; }
    .control-label { font-size: 14px; color: var(--text-dim); margin-right: 5px; }
    
    /* タブバー */
    #tabbar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
        background-color: var(--surface); border-top: 1px solid var(--border);
        display: flex; justify-content: space-around; align-items: center;
        padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        color: var(--text-dim); font-size: 11px; padding: 10px 0; cursor: pointer;
    }
    .tab.active { color: var(--primary); }
    .tab-icon { font-size: 24px; margin-bottom: 4px; }
    
    /* 情報表示用オーバーレイ */
    #info-overlay {
        position: absolute; top: 20px; left: 20px; pointer-events: none;
        background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        font-family: monospace; font-size: 14px;
    }
</style>
</head>
<body>

<div id="canvas-container">
    <canvas id="mathCanvas"></canvas>
    <div id="info-overlay"></div>
</div>

<div id="controls">
    </div>

<nav id="tabbar">
    <div class="tab active" data-tab="trig"><div class="tab-icon">∿</div>三角関数</div>
    <div class="tab" data-tab="diff"><div class="tab-icon">∂</div>微分</div>
    <div class="tab" data-tab="int"><div class="tab-icon">∫</div>積分</div>
    <div class="tab" data-tab="complex"><div class="tab-icon">ℂ</div>複素数</div>
    <div class="tab" data-tab="curve"><div class="tab-icon">∞</div>曲線</div>
</nav>

<script type="module">
    try {
        import { haptic } from 'ios-haptics';
        window.triggerHaptic = haptic;
    } catch (e) {
        // モジュールが解決できない環境向けのフォールバック
        window.triggerHaptic = () => {
            if(navigator.vibrate) navigator.vibrate(10);
        };
    }
</script>

<script>
    // --- 初期設定とHapticラッパー ---
    const haptic = () => {
        if (typeof window.triggerHaptic === 'function') window.triggerHaptic();
    };

    const canvas = document.getElementById('mathCanvas');
    const ctx = canvas.getContext('2d');
    const controls = document.getElementById('controls');
    const info = document.getElementById('info-overlay');
    
    let width, height, cx, cy, scale;
    function resize() {
        width = canvas.clientWidth; height = canvas.clientHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        cx = width / 2; cy = height / 2; scale = Math.min(width, height) / 8; // グラフの縮尺
        draw();
    }
    window.addEventListener('resize', resize);

    // --- 状態管理 ---
    const state = {
        tab: 'trig',
        trig: { type: 'sin', angle: Math.PI / 4 },
        diff: { fn: 'sin', x: 1 },
        int: { fn: 'sin', a: -2, b: 2, n: 20 },
        complex: { z: { x: 1.5, y: 1.5 }, n: 3 },
        curve: { type: 'cycloid', t: Math.PI }
    };

    // --- 数学関数定義 ---
    const funcs = {
        'sin': { f: Math.sin, df: Math.cos, name: 'sin(x)', defA: -3, defB: 3 },
        'cos': { f: Math.cos, df: x => -Math.sin(x), name: 'cos(x)', defA: -3, defB: 3 },
        'tan': { f: Math.tan, df: x => 1 / (Math.cos(x)**2), name: 'tan(x)', defA: -1, defB: 1 },
        'x2':  { f: x => x*x, df: x => 2*x, name: 'x²', defA: -2, defB: 2 },
        'x3':  { f: x => x*x*x, df: x => 3*x*x, name: 'x³', defA: -1.5, defB: 1.5 },
        'ex':  { f: Math.exp, df: Math.exp, name: 'eˣ', defA: -2, defB: 2 },
        'ln':  { f: x => Math.log(x), df: x => 1/x, name: 'ln(x)', defA: 0.5, defB: 3 }
    };

    const curves = {
        'cycloid':   (t) => ({ x: t - Math.sin(t), y: 1 - Math.cos(t) }),
        'astroid':   (t) => ({ x: 2 * Math.pow(Math.cos(t), 3), y: 2 * Math.pow(Math.sin(t), 3) }),
        'cardioid':  (t) => ({ x: 2 * (1 - Math.cos(t)) * Math.cos(t), y: 2 * (1 - Math.cos(t)) * Math.sin(t) }),
        'lissajous': (t) => ({ x: 3 * Math.sin(3 * t + Math.PI / 2), y: 3 * Math.sin(2 * t) }),
        'rose':      (t) => ({ x: 3 * Math.cos(4 * t) * Math.cos(t), y: 3 * Math.cos(4 * t) * Math.sin(t) })
    };

    // --- 座標変換 ---
    const sx = (x) => cx + x * scale;
    const sy = (y) => cy - y * scale;
    const mx = (sx) => (sx - cx) / scale;
    const my = (sy) => -(sy - cy) / scale;

    // --- 描画ロジック ---
    function drawGrid() {
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, cy); ctx.lineTo(width, cy);
        ctx.moveTo(cx, 0); ctx.lineTo(cx, height);
        ctx.stroke();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        drawGrid();
        info.innerHTML = '';

        if (state.tab === 'trig') drawTrig();
        if (state.tab === 'diff') drawDiff();
        if (state.tab === 'int')  drawInt();
        if (state.tab === 'complex') drawComplex();
        if (state.tab === 'curve') drawCurve();
    }

    function drawTrig() {
        // 左に単位円、右にグラフ
        const shiftX = -2; // 単位円の中心を左にずらす
        const r = 2; // 表示上の半径
        const a = state.trig.angle;
        
        // 単位円
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx(shiftX), sy(0), r * scale, 0, Math.PI * 2); ctx.stroke();
        
        // 動径
        const px = shiftX + r * Math.cos(a);
        const py = r * Math.sin(a);
        ctx.beginPath(); ctx.moveTo(sx(shiftX), sy(0)); ctx.lineTo(sx(px), sy(py));
        ctx.strokeStyle = 'var(--primary)'; ctx.stroke();
        
        // グラフ描画
        ctx.beginPath();
        for (let x = 0; x <= Math.PI * 2; x += 0.05) {
            let y = 0;
            if (state.trig.type === 'sin') y = Math.sin(x);
            if (state.trig.type === 'cos') y = Math.cos(x);
            if (state.trig.type === 'tan') y = Math.tan(x);
            
            const gX = 0.5 + x; // グラフの開始X位置
            if (Math.abs(y) > 5) { ctx.stroke(); ctx.beginPath(); continue; } // tanの漸近線対策
            
            if (x === 0) ctx.moveTo(sx(gX), sy(y * r));
            else ctx.lineTo(sx(gX), sy(y * r));
        }
        ctx.strokeStyle = '#ff9f0a'; ctx.stroke();

        // グラフ上の現在点
        let curY = state.trig.type === 'sin' ? Math.sin(a) : (state.trig.type === 'cos' ? Math.cos(a) : Math.tan(a));
        ctx.fillStyle = '#ff9f0a';
        ctx.beginPath(); ctx.arc(sx(0.5 + a), sy(curY * r), 5, 0, Math.PI * 2); ctx.fill();

        info.innerHTML = `θ = ${(a / Math.PI).toFixed(2)}π<br>${state.trig.type}(θ) = ${curY.toFixed(2)}`;
    }

    function drawDiff() {
        const fn = funcs[state.diff.fn];
        const x0 = state.diff.x;
        const y0 = fn.f(x0);
        const m = fn.df(x0);

        // f(x)
        ctx.beginPath();
        for(let x = -5; x <= 5; x += 0.05) {
            let y = fn.f(x);
            if(x === -5) ctx.moveTo(sx(x), sy(y));
            else ctx.lineTo(sx(x), sy(y));
        }
        ctx.strokeStyle = '#0a84ff'; ctx.lineWidth = 2; ctx.stroke();

        // f'(x)
        ctx.beginPath();
        for(let x = -5; x <= 5; x += 0.05) {
            let y = fn.df(x);
            if(x === -5) ctx.moveTo(sx(x), sy(y));
            else ctx.lineTo(sx(x), sy(y));
        }
        ctx.strokeStyle = '#ff453a'; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);

        // 接線
        ctx.beginPath();
        ctx.moveTo(sx(-5), sy(m * (-5 - x0) + y0));
        ctx.lineTo(sx(5), sy(m * (5 - x0) + y0));
        ctx.strokeStyle = '#32d74b'; ctx.lineWidth = 2; ctx.stroke();

        // 接点
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx(x0), sy(y0), 6, 0, Math.PI * 2); ctx.fill();
        
        info.innerHTML = `f(x) = ${fn.name}<br>x = ${x0.toFixed(2)}<br>f(x) = ${y0.toFixed(2)}<br>f'(x) = ${m.toFixed(2)}`;
    }

    function drawInt() {
        const fn = funcs[state.int.fn];
        let { a, b, n } = state.int;
        if (a > b) { let tmp = a; a = b; b = tmp; }

        // f(x)
        ctx.beginPath();
        for(let x = -5; x <= 5; x += 0.05) {
            if (state.int.fn === 'ln' && x <= 0) continue;
            let y = fn.f(x);
            if(x === -5) ctx.moveTo(sx(x), sy(y));
            else ctx.lineTo(sx(x), sy(y));
        }
        ctx.strokeStyle = '#0a84ff'; ctx.lineWidth = 2; ctx.stroke();

        // リーマン和（面積塗りつぶし）
        const dx = (b - a) / n;
        ctx.fillStyle = 'rgba(10, 132, 255, 0.3)';
        ctx.strokeStyle = 'rgba(10, 132, 255, 0.8)'; ctx.lineWidth = 1;
        
        let area = 0;
        for(let i = 0; i < n; i++) {
            let x = a + i * dx;
            let y = fn.f(x);
            area += y * dx;
            
            let rectX = sx(x);
            let rectY = sy(Math.max(0, y));
            let rectW = dx * scale;
            let rectH = Math.abs(y) * scale;
            
            if(y < 0) rectY = sy(0);
            
            ctx.fillRect(rectX, rectY, rectW, rectH);
            ctx.strokeRect(rectX, rectY, rectW, rectH);
        }

        // 境界線a, b
        ctx.strokeStyle = '#ff9f0a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx(a), 0); ctx.lineTo(sx(a), height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx(b), 0); ctx.lineTo(sx(b), height); ctx.stroke();

        info.innerHTML = `∫ f(x)dx [${a.toFixed(1)} -> ${b.toFixed(1)}]<br>n = ${n}<br>Area ≈ ${area.toFixed(3)}`;
    }

    function drawComplex() {
        const { x, y } = state.complex.z;
        const n = state.complex.n;
        const r = Math.sqrt(x*x + y*y);
        const theta = Math.atan2(y, x);

        // Z
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx(x), sy(y), 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(sx(x), sy(y)); ctx.stroke();

        // ド・モアブル z^k
        ctx.strokeStyle = '#ff9f0a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        
        for(let k = 1; k <= n; k++) {
            let zk_r = Math.pow(r, k);
            let zk_t = theta * k;
            let zx = zk_r * Math.cos(zk_t);
            let zy = zk_r * Math.sin(zk_t);
            
            ctx.lineTo(sx(zx), sy(zy));
            ctx.fillStyle = '#ff9f0a';
            ctx.beginPath(); ctx.arc(sx(zx), sy(zy), 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(sx(zx), sy(zy)); ctx.stroke();
        }

        info.innerHTML = `z = ${x.toFixed(2)} + ${y.toFixed(2)}i<br>|z| = ${r.toFixed(2)}<br>arg = ${(theta/Math.PI).toFixed(2)}π<br>n = ${n}`;
    }

    function drawCurve() {
        const maxT = 4 * Math.PI;
        const fn = curves[state.curve.type];
        
        // 全体の軌跡を薄く描画
        ctx.beginPath();
        for(let t = 0; t <= maxT; t += 0.05) {
            let p = fn(t);
            if(t === 0) ctx.moveTo(sx(p.x), sy(p.y));
            else ctx.lineTo(sx(p.x), sy(p.y));
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 2; ctx.stroke();

        // tまでの軌跡を太く描画
        ctx.beginPath();
        for(let t = 0; t <= state.curve.t; t += 0.05) {
            let p = fn(t);
            if(t === 0) ctx.moveTo(sx(p.x), sy(p.y));
            else ctx.lineTo(sx(p.x), sy(p.y));
        }
        ctx.strokeStyle = '#bf5af2'; ctx.lineWidth = 3; ctx.stroke();

        // 現在点
        const curP = fn(state.curve.t);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx(curP.x), sy(curP.y), 6, 0, Math.PI*2); ctx.fill();

        info.innerHTML = `Curve: ${state.curve.type}<br>t = ${(state.curve.t / Math.PI).toFixed(2)}π`;
    }

    // --- UI コントロール構築 ---
    function buildControls() {
        controls.innerHTML = '';
        if (state.tab === 'trig') {
            controls.innerHTML = `
                <select id="trigType">
                    <option value="sin" ${state.trig.type==='sin'?'selected':''}>sin(θ)</option>
                    <option value="cos" ${state.trig.type==='cos'?'selected':''}>cos(θ)</option>
                    <option value="tan" ${state.trig.type==='tan'?'selected':''}>tan(θ)</option>
                </select>
                <span class="control-label">※ドラッグで角度変更</span>
            `;
            document.getElementById('trigType').addEventListener('change', (e) => { haptic(); state.trig.type = e.target.value; draw(); });
        }
        else if (state.tab === 'diff') {
            let opts = Object.keys(funcs).map(k => `<option value="${k}" ${state.diff.fn===k?'selected':''}>${funcs[k].name}</option>`).join('');
            controls.innerHTML = `<select id="diffFn">${opts}</select><span class="control-label">※ドラッグで接線移動</span>`;
            document.getElementById('diffFn').addEventListener('change', (e) => { haptic(); state.diff.fn = e.target.value; draw(); });
        }
        else if (state.tab === 'int') {
            let opts = Object.keys(funcs).map(k => `<option value="${k}" ${state.int.fn===k?'selected':''}>${funcs[k].name}</option>`).join('');
            controls.innerHTML = `
                <select id="intFn">${opts}</select>
                <span class="control-label">n=</span>
                <input type="range" id="intN" min="1" max="100" value="${state.int.n}">
                <span class="control-label">※a, bの線をドラッグ</span>
            `;
            document.getElementById('intFn').addEventListener('change', (e) => { 
                haptic(); 
                state.int.fn = e.target.value;
                // 関数切り替え時にa/bリセット
                state.int.a = funcs[state.int.fn].defA;
                state.int.b = funcs[state.int.fn].defB;
                draw(); 
            });
            document.getElementById('intN').addEventListener('input', (e) => { haptic(); state.int.n = parseInt(e.target.value); draw(); });
        }
        else if (state.tab === 'complex') {
            controls.innerHTML = `
                <span class="control-label">n=</span>
                <input type="range" id="compN" min="1" max="10" value="${state.complex.n}">
                <span class="control-label">※zをドラッグ</span>
            `;
            document.getElementById('compN').addEventListener('input', (e) => { haptic(); state.complex.n = parseInt(e.target.value); draw(); });
        }
        else if (state.tab === 'curve') {
            controls.innerHTML = `
                <select id="curveType">
                    <option value="cycloid" ${state.curve.type==='cycloid'?'selected':''}>サイクロイド</option>
                    <option value="astroid" ${state.curve.type==='astroid'?'selected':''}>アステロイド</option>
                    <option value="cardioid" ${state.curve.type==='cardioid'?'selected':''}>カージオイド</option>
                    <option value="lissajous" ${state.curve.type==='lissajous'?'selected':''}>リサージュ</option>
                    <option value="rose" ${state.curve.type==='rose'?'selected':''}>バラ曲線</option>
                </select>
                <span class="control-label">t=</span>
                <input type="range" id="curveT" min="0" max="${4*Math.PI}" step="0.1" value="${state.curve.t}">
            `;
            document.getElementById('curveType').addEventListener('change', (e) => { haptic(); state.curve.type = e.target.value; draw(); });
            document.getElementById('curveT').addEventListener('input', (e) => { haptic(); state.curve.t = parseFloat(e.target.value); draw(); });
        }
    }

    // --- タブ切り替え ---
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            haptic();
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            state.tab = tab.dataset.tab;
            buildControls();
            draw();
        });
    });

    // --- インタラクション (ドラッグ) ---
    let isDragging = false;
    let dragTarget = null; // 'angle', 'x', 'a', 'b', 'z'

    function getPos(e) {
        if(e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }

    function handleStart(e) {
        const { x, y } = getPos(e);
        const mathX = mx(x);
        const mathY = my(y);
        isDragging = true;
        haptic(); // タップ/ドラッグ開始時にHaptic

        if (state.tab === 'trig') dragTarget = 'angle';
        else if (state.tab === 'diff') dragTarget = 'x';
        else if (state.tab === 'int') {
            if (Math.abs(mathX - state.int.a) < Math.abs(mathX - state.int.b)) dragTarget = 'a';
            else dragTarget = 'b';
        }
        else if (state.tab === 'complex') dragTarget = 'z';
        handleMove(e);
    }

    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault(); // スクロール防止
        const { x, y } = getPos(e);
        const mathX = mx(x);
        const mathY = my(y);

        if (state.tab === 'trig' && dragTarget === 'angle') {
            const shiftX = -2;
            state.trig.angle = Math.atan2(mathY, mathX - shiftX);
            if(state.trig.angle < 0) state.trig.angle += Math.PI * 2;
        }
        else if (state.tab === 'diff' && dragTarget === 'x') state.diff.x = mathX;
        else if (state.tab === 'int') {
            if (dragTarget === 'a') state.int.a = mathX;
            if (dragTarget === 'b') state.int.b = mathX;
        }
        else if (state.tab === 'complex' && dragTarget === 'z') {
            state.complex.z.x = mathX;
            state.complex.z.y = mathY;
        }
        draw();
    }

    function handleEnd() { isDragging = false; dragTarget = null; }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    // --- 初期化 ---
    setTimeout(() => {
        resize();
        buildControls();
    }, 100);

</script>
</body>
</html>
